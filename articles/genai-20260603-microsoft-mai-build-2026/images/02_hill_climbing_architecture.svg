<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <!-- Background -->
  <rect width="880" height="480" rx="16" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="440" y="38" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">The "Hill-Climbing Machine" — How MAI-Thinking-1 Was Built</text>
  <text x="440" y="60" text-anchor="middle" fill="#64748b" font-size="12">Three pillars driving Microsoft's frontier model strategy</text>
  
  <!-- Pillar 1: Capabilities Learned, Not Inherited -->
  <rect x="30" y="80" width="260" height="200" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="108" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">1. Learned, Not Inherited</text>
  <line x1="50" y1="120" x2="270" y2="120" stroke="#334155" stroke-width="1"/>
  <text x="50" y="142" fill="#cbd5e1" font-size="11">• No distillation from third-party</text>
  <text x="50" y="160" fill="#cbd5e1" font-size="11">  models (GPT, Claude, etc.)</text>
  <text x="50" y="182" fill="#cbd5e1" font-size="11">• Full control over training data</text>
  <text x="50" y="200" fill="#cbd5e1" font-size="11">  and reward signals</text>
  <text x="50" y="222" fill="#cbd5e1" font-size="11">• Steerable: adapts to new</text>
  <text x="50" y="240" fill="#cbd5e1" font-size="11">  tasks without being tied to a</text>
  <text x="50" y="258" fill="#cbd5e1" font-size="11">  teacher's design choices</text>
  
  <!-- Pillar 2: Clean Data -->
  <rect x="310" y="80" width="260" height="200" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="440" y="108" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700">2. Clean Data Foundation</text>
  <line x1="330" y1="120" x2="550" y2="120" stroke="#334155" stroke-width="1"/>
  <text x="330" y="142" fill="#cbd5e1" font-size="11">• AI-generated content excluded</text>
  <text x="330" y="160" fill="#cbd5e1" font-size="11">  from pre-training data</text>
  <text x="330" y="182" fill="#cbd5e1" font-size="11">• Commercially licensed data</text>
  <text x="330" y="200" fill="#cbd5e1" font-size="11">  only — enterprise-ready</text>
  <text x="330" y="222" fill="#cbd5e1" font-size="11">• Full traceability: "If we can't</text>
  <text x="330" y="240" fill="#cbd5e1" font-size="11">  account for what shaped a</text>
  <text x="330" y="258" fill="#cbd5e1" font-size="11">  model, we can't improve it"</text>
  
  <!-- Pillar 3: Self-Sufficient Stack -->
  <rect x="590" y="80" width="260" height="200" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="720" y="108" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">3. Full-Stack Control</text>
  <line x1="610" y1="120" x2="830" y2="120" stroke="#334155" stroke-width="1"/>
  <text x="610" y="142" fill="#cbd5e1" font-size="11">• Co-designed models with</text>
  <text x="610" y="160" fill="#cbd5e1" font-size="11">  Microsoft's own accelerators</text>
  <text x="610" y="182" fill="#cbd5e1" font-size="11">• In-house RL framework</text>
  <text x="610" y="200" fill="#cbd5e1" font-size="11">• GB200 cluster operational</text>
  <text x="610" y="222" fill="#cbd5e1" font-size="11">• End-to-end optimization</text>
  <text x="610" y="240" fill="#cbd5e1" font-size="11">  across silicon, model,</text>
  <text x="610" y="258" fill="#cbd5e1" font-size="11">  and deployment</text>
  
  <!-- Pipeline Flow -->
  <text x="440" y="318" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">The Hill-Climbing Loop</text>
  
  <!-- Pipeline boxes -->
  <rect x="40" y="340" width="140" height="50" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="110" y="370" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">Clean Data</text>
  
  <text x="198" y="370" fill="#475569" font-size="20">→</text>
  
  <rect x="220" y="340" width="140" height="50" rx="10" fill="#1a3a2a" stroke="#22c55e" stroke-width="1"/>
  <text x="290" y="370" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="600">Pre-Training</text>
  
  <text x="378" y="370" fill="#475569" font-size="20">→</text>
  
  <rect x="400" y="340" width="140" height="50" rx="10" fill="#2d1f4e" stroke="#a78bfa" stroke-width="1"/>
  <text x="470" y="370" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">RL + Rewards</text>
  
  <text x="558" y="370" fill="#475569" font-size="20">→</text>
  
  <rect x="580" y="340" width="140" height="50" rx="10" fill="#3a2d1f" stroke="#fb923c" stroke-width="1"/>
  <text x="650" y="370" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="600">Evaluation</text>
  
  <text x="738" y="370" fill="#475569" font-size="20">→</text>
  
  <rect x="760" y="340" width="90" height="50" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
  <text x="805" y="370" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="600">Deploy</text>
  
  <!-- Feedback loop arrow -->
  <line x1="805" y1="398" x2="805" y2="440" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="805" y1="440" x2="110" y2="440" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="110" y1="440" x2="110" y2="398" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4"/>
  <polygon points="105,402 110,390 115,402" fill="#f472b6"/>
  <text x="440" y="460" text-anchor="middle" fill="#64748b" font-size="11">Continuous improvement — absorbs better data, stronger rewards, more compute over time</text>
</svg>