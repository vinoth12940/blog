<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780">
  <defs>
    <linearGradient id="mtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#16243d"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="780" fill="url(#mtGrad)"/>

  <text x="720" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#fbbf24" letter-spacing="4">METR INDEPENDENT ASSESSMENT - PUBLISHED NOV 5, 2026</text>
  <text x="720" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#f8fafc">Anthropic Is Compounding at 1.9x</text>
  <text x="720" y="144" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94a3b8">Benchmark capability growth vs the lab's own March 2024 - October 2025 baseline (AECI index)</text>

  <!-- LEFT: rate bars -->
  <g font-family="Inter, Arial, sans-serif">
    <text x="420" y="252" text-anchor="end" font-size="17" fill="#cbd5e1">Mar 2024 - Oct 2025</text>
    <rect x="440" y="222" width="140" height="52" rx="9" fill="#1e1e2e" stroke="#475569" stroke-width="1.5"/>
    <text x="590" y="252" font-size="20" font-weight="700" fill="#e2e8f0">1.0x</text>
    <text x="660" y="252" font-size="13" fill="#64748b">historical baseline</text>

    <text x="420" y="382" text-anchor="end" font-size="17" font-weight="700" fill="#fbbf24">Oct 2025 - Oct 2026</text>
    <!-- CI whisker: 1.5x -> 210, 2.8x -> 392 -->
    <rect x="440" y="352" width="266" height="52" rx="9" fill="#2a2313" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="650" y1="378" x2="650" y2="378" stroke="#fbbf24" stroke-width="2"/>
    <rect x="440" y="352" width="266" height="52" rx="9" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="440" y1="418" x2="440" y2="338" stroke="#34d399" stroke-width="3"/>
    <line x1="440" y1="338" x2="832" y2="338" stroke="#34d399" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="832" y1="418" x2="832" y2="338" stroke="#34d399" stroke-width="3"/>
    <text x="716" y="382" font-size="20" font-weight="700" fill="#34d399">1.9x</text>
    <text x="880" y="352" font-size="13" fill="#94a3b8">95% CI: 1.5x - 2.8x</text>
    <text x="880" y="374" font-size="13" fill="#94a3b8">(dashed line = upper bound)</text>
  </g>
  <text x="90" y="470" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748b">Scale: 1.0x = 140px. The confidence interval brushes 2.8x - nearly triple the historical pace.</text>

  <!-- RIGHT: consequence cards -->
  <rect x="900" y="210" width="450" height="120" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1.5"/>
  <text x="925" y="250" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">~2 years of progress in one year</text>
  <text x="925" y="280" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">On well-specified benchmark tasks,</text>
  <text x="925" y="304" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">Oct 2026 vs the 19-month baseline</text>

  <rect x="900" y="350" width="450" height="120" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1.5"/>
  <text x="925" y="390" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">12x self-reported productivity</text>
  <text x="925" y="420" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">Internal staff using an Anthropic research</text>
  <text x="925" y="444" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">model - double what they reported on Mythos 5</text>

  <rect x="900" y="490" width="450" height="120" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1.5"/>
  <text x="925" y="530" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">AI is the driver</text>
  <text x="925" y="560" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">Acceleration attributed mostly to employees</text>
  <text x="925" y="584" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">using AI in research - not autonomous R+D</text>

  <!-- Caveat strip -->
  <rect x="240" y="632" width="960" height="76" rx="12" fill="#12203a" stroke="#334155" stroke-width="1.5"/>
  <text x="720" y="664" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#cbd5e1">Caveats: substantial uncertainty, supporting evidence partly redacted by Anthropic, and METR calls</text>
  <text x="720" y="690" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#cbd5e1">Anthropic's defense of its internal 2x risk threshold "overstated."</text>

  <text x="720" y="748" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Sources: unite.ai, Nov 5, 2026  &#183;  The Verge, Nov 2026  &#183;  METR via The Hacker News, Nov 6, 2026</text>
</svg>
