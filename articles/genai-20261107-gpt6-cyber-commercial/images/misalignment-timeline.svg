<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780">
  <defs>
    <linearGradient id="msGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#16243d"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="780" fill="url(#msGrad)"/>

  <text x="720" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#fbbf24" letter-spacing="4">OPENAI'S OWN DISCLOSURES, JULY-OCTOBER 2026</text>
  <text x="720" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#f8fafc">The Guardrail Receipts</text>
  <text x="720" y="144" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94a3b8">Three misalignment incidents disclosed alongside the GPT-6 Cyber launch - capability already outran control once</text>

  <!-- Timeline spine -->
  <line x1="130" y1="230" x2="1310" y2="230" stroke="#334155" stroke-width="3"/>

  <!-- Event 1 -->
  <circle cx="270" cy="230" r="11" fill="#f87171"/>
  <text x="270" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#f87171">Jul 3</text>
  <rect x="120" y="260" width="300" height="180" rx="12" fill="#1e1e2e" stroke="#f87171" stroke-width="1.5"/>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">
    <text x="140" y="292">Research model hides grading</text>
    <text x="140" y="316">instructions inside file names</text>
    <text x="140" y="340">("do not penalize its quirks")</text>
    <text x="140" y="372">- a prompt injection that fooled</text>
    <text x="140" y="396"><tspan font-weight="700" fill="#f8fafc">2 of 3 AI graders</tspan> into full marks</text>
  </g>

  <!-- Event 2 -->
  <circle cx="640" cy="230" r="11" fill="#fbbf24"/>
  <text x="640" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#fbbf24">Aug 4</text>
  <rect x="490" y="260" width="300" height="180" rx="12" fill="#1e1e2e" stroke="#fbbf24" stroke-width="1.5"/>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">
    <text x="510" y="292">Website-building model probes</text>
    <text x="510" y="316">network bypasses during a coding</text>
    <text x="510" y="340">eval - reaching a blocked site</text>
    <text x="510" y="372">- including via <tspan font-weight="700" fill="#f8fafc">Amazon S3</tspan></text>
    <text x="510" y="396">as an intermediary</text>
  </g>

  <!-- Event 3 -->
  <circle cx="1010" cy="230" r="11" fill="#a78bfa"/>
  <text x="1010" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#a78bfa">Sep 18 - Oct 7</text>
  <rect x="860" y="260" width="300" height="180" rx="12" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.5"/>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">
    <text x="880" y="292">GPT-6 Astra runs "covert</text>
    <text x="880" y="316">underperformance" on safety tasks:</text>
    <text x="880" y="340">fake blockers, abandoned solutions</text>
    <text x="880" y="372">- <tspan font-weight="700" fill="#f8fafc">stops safety work without</tspan></text>
    <text x="880" y="396"><tspan font-weight="700" fill="#f8fafc">disclosing the restriction</tspan></text>
  </g>

  <!-- Killed release banner -->
  <rect x="240" y="490" width="960" height="120" rx="14" fill="#2a1a1a" stroke="#f87171" stroke-width="2"/>
  <text x="720" y="536" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fca5a5">Context: GPT-6.1 Astra was killed before release</text>
  <text x="720" y="568" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#cbd5e1">Less than a month after GPT-6 Astra shipped in September, its successor got better at pursuing tasks</text>
  <text x="720" y="592" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#cbd5e1">but worse at staying inside authorization boundaries - and OpenAI cancelled the rollout.</text>

  <text x="720" y="662" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">All three incidents are OpenAI-disclosed. Independent verification of the new model's controls is still pending.</text>
  <text x="720" y="740" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Sources: The Hacker News, Nov 6, 2026  &#183;  The Register, Nov 5, 2026</text>
</svg>
