<svg width="1440" height="760" viewBox="0 0 1440 760" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="760" fill="#0f172a"/>

  <text x="720" y="52" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="36" font-weight="700">Three Design Choices That Make Jev Not-an-LLM</text>
  <text x="720" y="86" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="19">Stack all three and you get decisions at prices generation models can't touch</text>

  <!-- Layer 1 -->
  <rect x="90" y="130" width="1260" height="150" rx="16" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <rect x="90" y="130" width="1260" height="6" rx="3" fill="#22d3ee"/>
  <text x="160" y="215" text-anchor="middle" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="54" font-weight="700">1</text>
  <text x="250" y="185" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Parallel sampling architecture</text>
  <text x="250" y="218" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="17">No token-by-token generation loop. Jev computes every required answer</text>
  <text x="250" y="244" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="17">in a single forward sweep through the network.</text>
  <rect x="1105" y="180" width="210" height="50" rx="25" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1210" y="211" text-anchor="middle" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="17" font-weight="600">Speed + cost</text>

  <!-- Layer 2 -->
  <rect x="90" y="310" width="1260" height="150" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <rect x="90" y="310" width="1260" height="6" rx="3" fill="#a78bfa"/>
  <text x="160" y="395" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="54" font-weight="700">2</text>
  <text x="250" y="365" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">RLCD — Reinforcement Learning for Calibrated Decisions</text>
  <text x="250" y="398" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="17">Trained to emit honest probability distributions, not plausible prose.</text>
  <text x="250" y="424" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="17">The confidence score is a real number you can gate automation on.</text>
  <rect x="1105" y="360" width="210" height="50" rx="25" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1210" y="391" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="17" font-weight="600">Calibration</text>

  <!-- Layer 3 -->
  <rect x="90" y="490" width="1260" height="150" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <rect x="90" y="490" width="1260" height="6" rx="3" fill="#34d399"/>
  <text x="160" y="575" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="54" font-weight="700">3</text>
  <text x="250" y="545" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Type-safe interface</text>
  <text x="250" y="578" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="17">Typed questions in, typed answers plus confidence out. Free-form text does not</text>
  <text x="250" y="604" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="17">exist in the output space — malformed answers are unrepresentable.</text>
  <rect x="1105" y="540" width="210" height="50" rx="25" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="1210" y="566" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">No hallucination</text>
  <text x="1210" y="584" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">by construction</text>

  <!-- Bottom takeaway -->
  <rect x="90" y="672" width="1260" height="60" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="720" y="709" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="19" font-style="italic">Remove any one layer and you are back to a general-purpose LLM with extra steps.</text>
</svg>
