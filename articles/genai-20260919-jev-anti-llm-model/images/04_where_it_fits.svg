<svg width="1440" height="820" viewBox="0 0 1440 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="820" fill="#0f172a"/>

  <text x="720" y="52" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="36" font-weight="700">A Routing Rule for Agent Builders</text>
  <text x="720" y="86" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="19">Stop paying generation prices for classification work</text>

  <!-- Top box -->
  <rect x="500" y="120" width="440" height="70" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="720" y="150" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="19" font-weight="600">One step in your agent pipeline</text>
  <text x="720" y="175" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15">route · classify · check · extract · decide</text>

  <!-- Branch connectors -->
  <line x1="720" y1="190" x2="720" y2="240" stroke="#64748b" stroke-width="2.5"/>
  <line x1="270" y1="240" x2="1170" y2="240" stroke="#64748b" stroke-width="2.5"/>
  <line x1="270" y1="240" x2="270" y2="330" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <line x1="720" y1="240" x2="720" y2="330" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <line x1="1170" y1="240" x2="1170" y2="330" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>

  <text x="270" y="290" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="16" font-style="italic">Needs free-form output?</text>
  <text x="720" y="290" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="16" font-style="italic">Fixed answers + want real probabilities?</text>
  <text x="1170" y="290" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="16" font-style="italic">Stable schema + labeled data?</text>

  <!-- LLM box -->
  <rect x="80" y="335" width="380" height="180" rx="16" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <rect x="80" y="335" width="380" height="6" rx="3" fill="#22d3ee"/>
  <text x="270" y="380" text-anchor="middle" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Use the LLM</text>
  <text x="270" y="418" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="16">Writing, coding, planning,</text>
  <text x="270" y="442" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="16">conversation — anything where</text>
  <text x="270" y="466" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="16">the output is genuinely open-ended</text>

  <!-- Jev box -->
  <rect x="530" y="335" width="380" height="180" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
  <rect x="530" y="335" width="380" height="6" rx="3" fill="#34d399"/>
  <text x="720" y="380" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Use a System-1 model</text>
  <text x="720" y="418" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="16">Routing, tool choice, safety checks,</text>
  <text x="720" y="442" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="16">extraction — fixed answer sets where</text>
  <text x="720" y="466" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="16">calibrated confidence matters</text>
  <text x="720" y="497" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Jev: 70–500 ms · ~$0.0004/decision</text>

  <!-- Classic ML box -->
  <rect x="980" y="335" width="380" height="180" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <rect x="980" y="335" width="380" height="6" rx="3" fill="#a78bfa"/>
  <text x="1170" y="380" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Use classic ML</text>
  <text x="1170" y="418" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="16">XGBoost or fine-tuned BERT when</text>
  <text x="1170" y="442" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="16">the schema is frozen, you have months</text>
  <text x="1170" y="466" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="16">of labels, and unit cost is everything</text>

  <!-- Bottom band -->
  <rect x="80" y="560" width="1280" height="180" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <rect x="80" y="560" width="1280" height="6" rx="3" fill="#fbbf24"/>
  <text x="720" y="605" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="21" font-weight="700">The pattern emerging this month: LLM reasons, System-1 guards</text>
  <text x="720" y="642" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="17">A cheap classifier watches agent traces, vets tool calls, and catches jailbreak attempts</text>
  <text x="720" y="668" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="17">before they execute — at four decimal places per call instead of generation prices.</text>
  <text x="720" y="706" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="15" font-style="italic">Already running in production: Vercel uses Jev to review commands headed for GPT-5.6 Luna.</text>
</svg>
