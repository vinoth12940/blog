<svg width="1440" height="800" viewBox="0 0 1440 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="800" fill="#0f172a"/>

  <text x="720" y="52" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="36" font-weight="700">The Numbers — Including the One That Hurts</text>
  <text x="720" y="86" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="19">What Jev claims, what independent testers found, and the accuracy gap nobody is hiding</text>

  <!-- Card A: Latency -->
  <rect x="80" y="130" width="620" height="270" rx="16" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <rect x="80" y="130" width="620" height="6" rx="3" fill="#22d3ee"/>
  <text x="390" y="180" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="18" font-weight="600">Latency per decision</text>
  <text x="390" y="245" text-anchor="middle" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="52" font-weight="700">70–500 ms</text>
  <text x="390" y="290" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="19">vs 3–329 seconds for frontier LLMs</text>
  <text x="390" y="325" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15">end-to-end, same tasks (vendor-reported)</text>
  <text x="390" y="370" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15">A 70 ms classifier disappears inside a request.</text>
  <text x="390" y="392" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15">A 5-minute LLM call becomes your bottleneck.</text>

  <!-- Card B: Cost -->
  <rect x="740" y="130" width="620" height="270" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <rect x="740" y="130" width="620" height="6" rx="3" fill="#34d399"/>
  <text x="1050" y="180" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="18" font-weight="600">Cost per decision</text>
  <text x="1050" y="245" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="52" font-weight="700">$0.0004</text>
  <text x="1050" y="290" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="19">$0.042 per 1M input tokens</text>
  <text x="1050" y="325" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15">output tokens priced at zero — "too cheap to meter"</text>
  <text x="1050" y="370" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15">Input is metered by the billion. The pricing page</text>
  <text x="1050" y="392" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15">looks like cloud egress, not an API bill.</text>

  <!-- Card C: Independent test -->
  <rect x="80" y="440" width="620" height="270" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <rect x="80" y="440" width="620" height="6" rx="3" fill="#a78bfa"/>
  <text x="390" y="490" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="18" font-weight="600">Independent test (Every) — extraction</text>
  <text x="390" y="550" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="40" font-weight="700">0.35 s vs 8.83 s</text>
  <text x="390" y="592" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18">per passage — Jev vs Claude Fable 5.1</text>
  <text x="390" y="628" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="20" font-weight="600">~25× faster · ~580× cheaper</text>
  <text x="390" y="668" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15">Directionally corroborates the vendor claims.</text>
  <text x="390" y="690" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15">One task, one tester — not a full benchmark suite.</text>

  <!-- Card D: Accuracy tradeoff -->
  <rect x="740" y="440" width="620" height="270" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <rect x="740" y="440" width="620" height="6" rx="3" fill="#fbbf24"/>
  <text x="1050" y="490" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="18" font-weight="600">The honest number</text>
  <text x="1050" y="550" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="40" font-weight="700">67.8% vs 74.1%</text>
  <text x="1050" y="592" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="17">Jev's aggregate accuracy vs the best comparator LLM</text>
  <text x="1050" y="616" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="17">on TypeSafe's own four-workflow benchmark</text>
  <text x="1050" y="656" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15">Jev loses on raw accuracy. The bet: speed, cost and</text>
  <text x="1050" y="678" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15">calibration win more than 6 points of accuracy cost you.</text>

  <text x="720" y="760" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15">Sources: Forkast (Sep 17, 2026) · TechCrunch (Sep 18, 2026) · explainx.ai (Sep 19, 2026). Vendor figures marked; broad independent verification still early.</text>
</svg>
