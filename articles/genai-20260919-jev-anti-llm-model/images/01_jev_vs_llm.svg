<svg width="1440" height="820" viewBox="0 0 1440 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="820" fill="#0f172a"/>

  <text x="720" y="52" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="36" font-weight="700">The Same Transformer, Two Different Jobs</text>
  <text x="720" y="86" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="19">Jev (TypeSafe AI): a model that answers multiple-choice questions and never writes a word</text>

  <!-- LEFT: LLM path -->
  <text x="360" y="152" text-anchor="middle" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="23" font-weight="700">The LLM path — generate language</text>

  <rect x="80" y="175" width="560" height="62" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="213" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18">Prompt + context in</text>
  <line x1="360" y1="237" x2="360" y2="263" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>

  <rect x="80" y="268" width="560" height="84" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="360" y="302" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18">Transformer generates text</text>
  <text x="360" y="330" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16">one token at a time, sequentially</text>
  <line x1="360" y1="352" x2="360" y2="378" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>

  <rect x="80" y="383" width="560" height="62" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="421" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18">Free-text answer comes out</text>
  <line x1="360" y1="445" x2="360" y2="471" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>

  <rect x="80" y="476" width="560" height="96" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="360" y="512" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18">Parse it · validate it · retry it · hope</text>
  <text x="360" y="540" text-anchor="middle" fill="#f87171" font-family="-apple-system, sans-serif" font-size="15">hallucination risk · format drift · retry loops</text>
  <text x="360" y="562" text-anchor="middle" fill="#f87171" font-family="-apple-system, sans-serif" font-size="15">paying generation prices for a yes/no question</text>

  <text x="360" y="606" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="16" font-style="italic">Brilliant for writing. Expensive machinery for deciding.</text>

  <!-- VS divider -->
  <text x="720" y="390" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="30" font-weight="700">vs</text>

  <!-- RIGHT: Jev path -->
  <text x="1080" y="152" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="23" font-weight="700">The Jev path — decide, don't write</text>

  <rect x="800" y="175" width="560" height="62" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="1080" y="205" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="17">Unstructured state + typed questions</text>
  <text x="1080" y="228" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="15">(answers defined in advance, schema-style)</text>
  <line x1="1080" y1="237" x2="1080" y2="263" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <rect x="800" y="268" width="560" height="84" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="1080" y="302" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18">Transformer · parallel sampling</text>
  <text x="1080" y="330" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16">every required answer computed in one sweep</text>
  <line x1="1080" y1="352" x2="1080" y2="378" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <rect x="800" y="383" width="560" height="62" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="1080" y="413" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="17">Typed answers + calibrated probabilities</text>
  <text x="1080" y="436" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="15">P(option) you can gate a workflow on</text>
  <line x1="1080" y1="445" x2="1080" y2="471" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <rect x="800" y="476" width="560" height="96" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="1080" y="512" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18">No parsing. No hallucination by construction.</text>
  <text x="1080" y="540" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="15">the output space is defined before inference</text>
  <text x="1080" y="562" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="15">70–500 ms end-to-end · about $0.0004 per decision</text>

  <text x="1080" y="606" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="16" font-style="italic">Same transformer lineage. Radically different contract.</text>

  <!-- Bottom stat strip -->
  <rect x="80" y="648" width="310" height="130" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="235" y="700" text-anchor="middle" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="30" font-weight="700">25× faster</text>
  <text x="235" y="730" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">independent extraction test</text>
  <text x="235" y="752" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">vs Claude Fable 5.1 (Every)</text>

  <rect x="430" y="648" width="310" height="130" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="585" y="700" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="30" font-weight="700">580× cheaper</text>
  <text x="585" y="730" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">$0.0004 vs ~$0.23 per decision</text>
  <text x="585" y="752" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">(Every, extraction test)</text>

  <rect x="780" y="648" width="310" height="130" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="935" y="700" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="30" font-weight="700">5–18× faster</text>
  <text x="935" y="730" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">Vercel command-safety classifier</text>
  <text x="935" y="752" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">vs OpenAI GPT-5.6 Luna</text>

  <rect x="1130" y="648" width="310" height="130" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="1285" y="700" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="27" font-weight="700">67.8% vs 74.1%</text>
  <text x="1285" y="730" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">the accuracy tradeoff, from</text>
  <text x="1285" y="752" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">TypeSafe's own benchmark</text>
</svg>
