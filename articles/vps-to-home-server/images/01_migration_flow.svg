<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="900" height="400" fill="url(#bg)" rx="16"/>
  <text x="450" y="45" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">The Migration: Cloud to Home</text>
  <text x="450" y="70" text-anchor="middle" fill="#64748b" font-size="12">289,935 files · 19.2GB · ~15 minutes at 50 MB/s</text>
  <rect x="40" y="100" width="200" height="200" rx="12" fill="#1e1e2e" stroke="#ef4444" stroke-width="2"/>
  <rect x="40" y="100" width="200" height="40" rx="12" fill="url(#red)"/>
  <text x="140" y="126" text-anchor="middle" fill="white" font-size="14" font-weight="bold">CLOUD VPS</text>
  <text x="140" y="170" text-anchor="middle" fill="#94a3b8" font-size="11">Europe</text>
  <text x="140" y="192" text-anchor="middle" fill="#e2e8f0" font-size="12">$20/month</text>
  <text x="140" y="214" text-anchor="middle" fill="#94a3b8" font-size="10">8GB RAM · 40GB Disk</text>
  <text x="140" y="236" text-anchor="middle" fill="#94a3b8" font-size="10">5 Services · Docker</text>
  <text x="140" y="290" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold">DECOMMISSIONED</text>
  <line x1="260" y1="200" x2="370" y2="200" stroke="#fbbf24" stroke-width="3"/>
  <text x="315" y="185" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">23GB</text>
  <text x="315" y="220" text-anchor="middle" fill="#fbbf24" font-size="10">rsync</text>
  <rect x="380" y="120" width="140" height="160" rx="12" fill="#1e1e2e" stroke="#3b82f6" stroke-width="2"/>
  <rect x="380" y="120" width="140" height="35" rx="12" fill="url(#blue)"/>
  <text x="450" y="143" text-anchor="middle" fill="white" font-size="12" font-weight="bold">MacBook</text>
  <text x="450" y="175" text-anchor="middle" fill="#94a3b8" font-size="10">Control Plane</text>
  <text x="450" y="195" text-anchor="middle" fill="#94a3b8" font-size="10">SSH to both</text>
  <text x="450" y="235" text-anchor="middle" fill="#94a3b8" font-size="10">orchestrates</text>
  <line x1="540" y1="200" x2="650" y2="200" stroke="#22c55e" stroke-width="3"/>
  <text x="595" y="185" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">scp/rsync</text>
  <text x="595" y="220" text-anchor="middle" fill="#22c55e" font-size="10">SSH keys</text>
  <rect x="660" y="100" width="200" height="200" rx="12" fill="#1e1e2e" stroke="#22c55e" stroke-width="2"/>
  <rect x="660" y="100" width="200" height="40" rx="12" fill="url(#green)"/>
  <text x="760" y="126" text-anchor="middle" fill="white" font-size="14" font-weight="bold">HOME SERVER</text>
  <text x="760" y="170" text-anchor="middle" fill="#94a3b8" font-size="11">Under My Desk</text>
  <text x="760" y="192" text-anchor="middle" fill="#e2e8f0" font-size="12">$0/month</text>
  <text x="760" y="214" text-anchor="middle" fill="#94a3b8" font-size="10">16GB RAM · 1TB NVMe</text>
  <text x="760" y="236" text-anchor="middle" fill="#94a3b8" font-size="10">5 Services · Docker</text>
  <text x="760" y="260" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">6-Layer Auto-Recovery</text>
  <circle cx="760" cy="280" r="6" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="760" y="295" text-anchor="middle" fill="#22c55e" font-size="10">LIVE</text>
</svg>
