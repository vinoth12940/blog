<svg width="1440" height="760" viewBox="0 0 1440 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="danger-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="760" fill="#0f172a"/>

  <!-- Title -->
  <text x="720" y="48" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="34" font-weight="700">The Tokenizer Catch: Why "Same Price" Isn't Same Cost</text>
  <text x="720" y="78" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="16">Sonnet 5's new tokenizer maps the same text to ~1.0–1.35× more tokens</text>

  <!-- ============ LEFT: The illusion ============ -->
  <rect x="60" y="120" width="620" height="540" rx="16" fill="#1e1e2e" stroke="#334155" stroke-width="1.5"/>
  <text x="370" y="160" text-anchor="middle" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">The Rate Card (Looks Good)</text>
  <text x="370" y="186" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="14">Per-token pricing unchanged</text>

  <!-- Intro pricing -->
  <rect x="100" y="215" width="540" height="70" rx="10" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="120" y="245" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="17" font-weight="600">Introductory (through Aug 31)</text>
  <text x="120" y="270" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">$2 input / $10 output</text>
  <text x="620" y="260" text-anchor="end" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">per 1M tokens</text>

  <!-- Standard pricing -->
  <rect x="100" y="305" width="540" height="70" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="120" y="335" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="17" font-weight="600">Standard (from Sep 1)</text>
  <text x="120" y="360" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">$3 input / $15 output</text>
  <text x="620" y="350" text-anchor="end" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">same as Sonnet 4.6</text>

  <!-- Comparison to Sonnet 4.6 -->
  <text x="120" y="420" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">vs Sonnet 4.6 at standard pricing:</text>
  <rect x="120" y="440" width="250" height="44" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="245" y="467" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="15">Sonnet 4.6: $3 / $15</text>
  <rect x="390" y="440" width="250" height="44" rx="8" fill="#0f172a" stroke="#22d3ee"/>
  <text x="515" y="467" text-anchor="middle" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Sonnet 5: $3 / $15 ✓</text>

  <text x="370" y="520" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="14">Identical per-token list price.</text>
  <text x="370" y="544" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="14">Seems like a free upgrade, right?</text>
  <text x="370" y="580" text-anchor="middle" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">↓ Not so fast ↓</text>

  <!-- ============ RIGHT: The reality ============ -->
  <rect x="710" y="120" width="670" height="540" rx="16" fill="#1e1e2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="1045" y="160" text-anchor="middle" fill="#f87171" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">The Tokenizer Reality</text>
  <text x="1045" y="186" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="14">Same text → ~30% more tokens on average</text>

  <!-- Same prompt visual -->
  <text x="750" y="230" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Take the same 10,000-token prompt (on Sonnet 4.6):</text>

  <!-- Sonnet 4.6 tokenization -->
  <rect x="750" y="250" width="590" height="60" rx="10" fill="#0f172a" stroke="#475569"/>
  <text x="770" y="277" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16">Sonnet 4.6 tokenizer:</text>
  <text x="770" y="299" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="15">10,000 tokens → $0.030 input cost</text>

  <!-- Sonnet 5 tokenization -->
  <rect x="750" y="330" width="590" height="70" rx="10" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
  <text x="770" y="357" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="16">Sonnet 5 tokenizer (~1.35× worst case):</text>
  <text x="770" y="383" fill="#f87171" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">~13,500 tokens → $0.0405 input cost</text>

  <!-- Delta badge -->
  <rect x="850" y="420" width="390" height="50" rx="10" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-width="1.5"/>
  <text x="1045" y="452" text-anchor="middle" fill="#f87171" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Up to +35% real cost at same rate</text>

  <!-- The three things affected -->
  <text x="750" y="510" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">What this breaks if you don't recheck:</text>

  <circle cx="765" cy="540" r="5" fill="#f87171"/>
  <text x="782" y="546" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="15">Token budgets in agent loops (context fills faster)</text>

  <circle cx="765" cy="568" r="5" fill="#f87171"/>
  <text x="782" y="574" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="15">max_tokens limits (output may truncate)</text>

  <circle cx="765" cy="596" r="5" fill="#f87171"/>
  <text x="782" y="602" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="15">Per-request dollar cost (same prompt costs more)</text>

  <circle cx="765" cy="624" r="5" fill="#f87171"/>
  <text x="782" y="630" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="15">Context window holds ~25% less text in practice</text>

  <!-- Bottom note -->
  <rect x="60" y="690" width="1320" height="50" rx="10" fill="url(#danger-grad)"/>
  <text x="720" y="720" text-anchor="middle" fill="#f87171" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Action: Run your real prompts through both models. Compare actual token counts, not rate cards.</text>
</svg>
