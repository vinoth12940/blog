<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="900" height="420" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Local MTP Speculative Decoding on Apple Silicon</text>
  <text x="450" y="66" text-anchor="middle" fill="#64748b" font-size="13">Qwen 3.6 27B — 7 tok/s baseline → 18.3 tok/s with MLX native MTP</text>

  <!-- Center: MacBook -->
  <rect x="330" y="95" width="240" height="130" rx="14" fill="#1e1e2e" stroke="url(#teal)" stroke-width="2.5"/>
  <rect x="330" y="95" width="240" height="38" rx="14" fill="url(#teal)"/>
  <rect x="330" y="121" width="240" height="12" fill="url(#teal)"/>
  <text x="450" y="120" text-anchor="middle" fill="#0a0a0a" font-size="14" font-weight="bold">Apple M4 Pro · 48 GB</text>
  <text x="450" y="152" text-anchor="middle" fill="#94a3b8" font-size="11">Qwen 3.6 27B Q4/MLX</text>
  <text x="450" y="172" text-anchor="middle" fill="#5eead4" font-size="16" font-weight="bold">18.3 tok/s</text>
  <text x="450" y="192" text-anchor="middle" fill="#94a3b8" font-size="10">MTP Depth 3 · MLX · Metal</text>
  <text x="450" y="210" text-anchor="middle" fill="#64748b" font-size="9">120 GB/s bandwidth · 16.2 GB active</text>

  <!-- Left: Before -->
  <rect x="40" y="115" width="180" height="100" rx="10" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.5"/>
  <text x="130" y="140" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">llama.cpp MTP</text>
  <text x="130" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">GGUF Q4_K_XL</text>
  <text x="130" y="185" text-anchor="middle" fill="#f87171" font-size="18" font-weight="bold">10.5 tok/s</text>
  <text x="130" y="205" text-anchor="middle" fill="#64748b" font-size="9">CPU/GPU hybrid · Metal backend</text>

  <!-- Right: After -->
  <rect x="680" y="115" width="180" height="100" rx="10" fill="#1e1e2e" stroke="url(#teal)" stroke-width="2"/>
  <text x="770" y="140" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">MTPLX v0.3.6</text>
  <text x="770" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">MLX optimized · Metal native</text>
  <text x="770" y="185" text-anchor="middle" fill="#14b8a6" font-size="18" font-weight="bold">18.3 tok/s</text>
  <text x="770" y="205" text-anchor="middle" fill="#5eead4" font-size="9">2.6x speedup · math-correct</text>

  <!-- Bottom Section: Architecture Flow -->
  <rect x="80" y="260" width="740" height="130" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="450" y="285" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">MTP Speculative Decoding Pipeline</text>

  <!-- Draft Phase -->
  <rect x="110" y="300" width="150" height="65" rx="8" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="185" y="320" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">DRAFT</text>
  <text x="185" y="338" text-anchor="middle" fill="#94a3b8" font-size="9">MTP heads propose</text>
  <text x="185" y="353" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="bold">3 tokens at once</text>

  <!-- Arrow -->
  <line x1="265" y1="332" x2="320" y2="332" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="318,326 330,332 318,338" fill="#fbbf24"/>

  <!-- Verify Phase -->
  <rect x="335" y="300" width="170" height="65" rx="8" fill="#1a1a2e" stroke="url(#teal)" stroke-width="1.5"/>
  <text x="420" y="320" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">VERIFY</text>
  <text x="420" y="338" text-anchor="middle" fill="#94a3b8" font-size="9">Full model parallel</text>
  <text x="420" y="353" text-anchor="middle" fill="#14b8a6" font-size="10" font-weight="bold">1 pass for K tokens</text>

  <!-- Arrow -->
  <line x1="510" y1="332" x2="565" y2="332" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="563,326 575,332 563,338" fill="#fbbf24"/>

  <!-- Accept Phase -->
  <rect x="580" y="300" width="200" height="65" rx="8" fill="#1a1a2e" stroke="url(#amber)" stroke-width="1.5"/>
  <text x="680" y="320" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">ACCEPT</text>
  <text x="680" y="338" text-anchor="middle" fill="#94a3b8" font-size="9">Probability-ratio sampling</text>
  <text x="680" y="353" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="bold">~73%/48%/32% at D3</text>

  <!-- Footer -->
  <text x="450" y="408" text-anchor="middle" fill="#475569" font-size="10">May 2026 · MLX 0.31.2 · MTPLX v0.3.6 · Qwen 3.6 27B · M4 Pro 48 GB</text>
</svg>
