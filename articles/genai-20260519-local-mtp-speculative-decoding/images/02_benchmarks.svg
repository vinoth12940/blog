<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="900" height="420" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Performance Comparison: MTP Optimization Journey</text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-size="12">Same hardware (M4 Pro 48 GB), same model (Qwen 3.6 27B), different runtimes</text>

  <!-- Y-axis -->
  <line x1="100" y1="80" x2="100" y2="340" stroke="#334155" stroke-width="1"/>
  <text x="30" y="215" text-anchor="middle" fill="#94a3b8" font-size="11" transform="rotate(-90,30,215)">Tokens per Second</text>

  <!-- Grid lines -->
  <line x1="95" y1="340" x2="850" y2="340" stroke="#1e293b" stroke-width="1"/>
  <line x1="95" y1="288" x2="850" y2="288" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="95" y1="236" x2="850" y2="236" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="95" y1="184" x2="850" y2="184" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="95" y1="132" x2="850" y2="132" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="95" y1="80" x2="850" y2="80" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4"/>

  <!-- Y labels -->
  <text x="88" y="344" text-anchor="end" fill="#94a3b8" font-size="10">0</text>
  <text x="88" y="292" text-anchor="end" fill="#94a3b8" font-size="10">5</text>
  <text x="88" y="240" text-anchor="end" fill="#94a3b8" font-size="10">10</text>
  <text x="88" y="188" text-anchor="end" fill="#94a3b8" font-size="10">15</text>
  <text x="88" y="136" text-anchor="end" fill="#94a3b8" font-size="10">20</text>
  <text x="88" y="84" text-anchor="end" fill="#94a3b8" font-size="10">25</text>

  <!-- Bar 1: Baseline -->
  <rect x="160" y="267" width="100" height="73" rx="4" fill="#ef4444" opacity="0.85"/>
  <text x="210" y="258" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="bold">7.0</text>
  <text x="210" y="360" text-anchor="middle" fill="#94a3b8" font-size="10">Baseline</text>
  <text x="210" y="374" text-anchor="middle" fill="#64748b" font-size="9">(no MTP)</text>

  <!-- Bar 2: llama.cpp MTP -->
  <rect x="330" y="231" width="100" height="109" rx="4" fill="#f59e0b" opacity="0.85"/>
  <text x="380" y="222" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="bold">10.5</text>
  <text x="380" y="360" text-anchor="middle" fill="#94a3b8" font-size="10">llama.cpp</text>
  <text x="380" y="374" text-anchor="middle" fill="#64748b" font-size="9">+MTP GGUF</text>

  <!-- Bar 3: MTPLX Local -->
  <rect x="500" y="150" width="100" height="190" rx="4" fill="url(#teal)" opacity="0.9"/>
  <text x="550" y="142" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="bold">18.3</text>
  <text x="550" y="360" text-anchor="middle" fill="#94a3b8" font-size="10">MTPLX</text>
  <text x="550" y="374" text-anchor="middle" fill="#64748b" font-size="9">MLX · MTP D3</text>

  <!-- Bar 4: MTPLX LAN -->
  <rect x="670" y="192" width="100" height="148" rx="4" fill="#3b82f6" opacity="0.85"/>
  <text x="720" y="184" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="bold">14.3</text>
  <text x="720" y="360" text-anchor="middle" fill="#94a3b8" font-size="10">MTPLX LAN</text>
  <text x="720" y="374" text-anchor="middle" fill="#64748b" font-size="9">via WiFi</text>

  <!-- Speedup annotation -->
  <line x1="550" y1="110" x2="550" y2="120" stroke="#5eead4" stroke-width="1"/>
  <rect x="460" y="86" width="180" height="28" rx="6" fill="#0d9488" opacity="0.3" stroke="#14b8a6" stroke-width="1"/>
  <text x="550" y="105" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">2.6x speedup vs baseline</text>

  <!-- Future: MoE -->
  <rect x="810" y="80" width="60" height="260" rx="4" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6"/>
  <text x="840" y="72" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">25-40?</text>
  <text x="840" y="360" text-anchor="middle" fill="#a78bfa" font-size="10">MoE</text>
  <text x="840" y="374" text-anchor="middle" fill="#64748b" font-size="9">future</text>

  <!-- Footer -->
  <text x="450" y="408" text-anchor="middle" fill="#475569" font-size="10">Temperature 0.6 · top_p 0.95 · reasoning off · MTP depth 3</text>
</svg>
