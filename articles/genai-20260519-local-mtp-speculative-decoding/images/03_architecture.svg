<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Architecture: Local Inference Backend for AI Agent</text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-size="12">MacBook M4 Pro serves Qwen 27B to Linux agent via OpenAI-compatible API</text>

  <!-- MacBook Box -->
  <rect x="60" y="90" width="300" height="220" rx="14" fill="#111827" stroke="url(#teal)" stroke-width="2"/>
  <rect x="60" y="90" width="300" height="36" rx="14" fill="url(#teal)"/>
  <rect x="60" y="114" width="300" height="12" fill="url(#teal)"/>
  <text x="210" y="114" text-anchor="middle" fill="#0a0a0a" font-size="13" font-weight="bold">MacBook Pro M4 · macOS</text>

  <!-- MTPLX Server -->
  <rect x="85" y="145" width="250" height="60" rx="8" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="210" y="167" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">MTPLX Server :8000</text>
  <text x="210" y="187" text-anchor="middle" fill="#94a3b8" font-size="9">OpenAI + Anthropic API · MTP D3</text>

  <!-- Model -->
  <rect x="85" y="220" width="250" height="50" rx="8" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="210" y="242" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Qwen 3.6 27B MLX</text>
  <text x="210" y="260" text-anchor="middle" fill="#94a3b8" font-size="9">16.2 GB active · BF16/INT4 safetensors</text>

  <!-- Metal -->
  <rect x="85" y="283" width="250" height="18" rx="4" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
  <text x="210" y="296" text-anchor="middle" fill="#64748b" font-size="9">Apple Metal · custom qmv + GDN kernels</text>

  <!-- Arrow: LAN -->
  <line x1="365" y1="175" x2="485" y2="175" stroke="#5eead4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="395" y="155" width="70" height="20" rx="4" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
  <text x="430" y="169" text-anchor="middle" fill="#5eead4" font-size="9" font-weight="bold">LAN WiFi</text>
  <text x="430" y="150" text-anchor="middle" fill="#64748b" font-size="8">14.3 tok/s</text>

  <!-- Linux Server Box -->
  <rect x="490" y="90" width="350" height="220" rx="14" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
  <rect x="490" y="90" width="350" height="36" rx="14" fill="#f59e0b"/>
  <rect x="490" y="114" width="350" height="12" fill="#f59e0b"/>
  <text x="665" y="114" text-anchor="middle" fill="#0a0a0a" font-size="13" font-weight="bold">Linux Home Server</text>

  <!-- Hermes Agent -->
  <rect x="515" y="145" width="300" height="55" rx="8" fill="#1a1a2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="665" y="167" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">Hermes Agent v0.14.0</text>
  <text x="665" y="187" text-anchor="middle" fill="#94a3b8" font-size="9">config.yaml → mtplx provider · chat_completions</text>

  <!-- Hermes Services -->
  <rect x="515" y="215" width="140" height="40" rx="6" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
  <text x="585" y="234" text-anchor="middle" fill="#94a3b8" font-size="9">hermes-gateway</text>
  <text x="585" y="248" text-anchor="middle" fill="#64748b" font-size="8">systemd</text>

  <rect x="675" y="215" width="140" height="40" rx="6" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
  <text x="745" y="234" text-anchor="middle" fill="#94a3b8" font-size="9">hermes-dashboard</text>
  <text x="745" y="248" text-anchor="middle" fill="#64748b" font-size="8">systemd</text>

  <rect x="515" y="268" width="140" height="30" rx="6" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
  <text x="585" y="287" text-anchor="middle" fill="#94a3b8" font-size="9">hermes-mcp-server</text>

  <rect x="675" y="268" width="140" height="30" rx="6" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
  <text x="745" y="287" text-anchor="middle" fill="#94a3b8" font-size="9">hermes-workspace</text>

  <!-- Bottom: Key Metrics -->
  <rect x="80" y="335" width="740" height="55" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>

  <rect x="100" y="345" width="150" height="35" rx="6" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1"/>
  <text x="175" y="360" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold">18.3 tok/s</text>
  <text x="175" y="375" text-anchor="middle" fill="#64748b" font-size="9">local decode</text>

  <rect x="270" y="345" width="150" height="35" rx="6" fill="#1a1a2e" stroke="#14b8a6" stroke-width="1"/>
  <text x="345" y="360" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">14.3 tok/s</text>
  <text x="345" y="375" text-anchor="middle" fill="#64748b" font-size="9">over LAN</text>

  <rect x="440" y="345" width="150" height="35" rx="6" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="515" y="360" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="bold">0.66s TTFT</text>
  <text x="515" y="375" text-anchor="middle" fill="#64748b" font-size="9">time to first token</text>

  <rect x="610" y="345" width="150" height="35" rx="6" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="1"/>
  <text x="685" y="360" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">16.2 GB</text>
  <text x="685" y="375" text-anchor="middle" fill="#64748b" font-size="9">active memory</text>

  <!-- Footer -->
  <text x="450" y="408" text-anchor="middle" fill="#475569" font-size="10">192.168.1.x LAN · API key auth · OpenAI-compatible endpoint</text>
</svg>
