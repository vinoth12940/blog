<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#7f1d1d"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#14532d"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#7c2d12"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker>
  </defs>

  <rect width="900" height="450" fill="url(#bg)" rx="16"/>
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">A Practical Agent Security Checklist</text>
  <text x="450" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">What builders can do this week, not next quarter</text>

  <rect x="60" y="95" width="780" height="52" rx="10" fill="#1e1e2e" stroke="#22c55e" stroke-width="2"/>
  <text x="85" y="126" fill="#86efac" font-size="13" font-weight="800">1</text><text x="125" y="126" fill="#e2e8f0" font-size="13">Inventory every agent endpoint, dev server, MCP/tool server, and sandbox.</text>
  <rect x="60" y="160" width="780" height="52" rx="10" fill="#1e1e2e" stroke="#3b82f6" stroke-width="2"/>
  <text x="85" y="191" fill="#93c5fd" font-size="13" font-weight="800">2</text><text x="125" y="191" fill="#e2e8f0" font-size="13">Upgrade known vulnerable packages; pin minimum safe versions in CI.</text>
  <rect x="60" y="225" width="780" height="52" rx="10" fill="#1e1e2e" stroke="#fbbf24" stroke-width="2"/>
  <text x="85" y="256" fill="#fbbf24" font-size="13" font-weight="800">3</text><text x="125" y="256" fill="#e2e8f0" font-size="13">Replace blocklists with explicit allowlists for tool schemas and operations.</text>
  <rect x="60" y="290" width="780" height="52" rx="10" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="2"/>
  <text x="85" y="321" fill="#c4b5fd" font-size="13" font-weight="800">4</text><text x="125" y="321" fill="#e2e8f0" font-size="13">Run tool executors as isolated, low-privilege identities with restricted egress.</text>
  <rect x="60" y="355" width="780" height="52" rx="10" fill="#1e1e2e" stroke="#ef4444" stroke-width="2"/>
  <text x="85" y="386" fill="#fca5a5" font-size="13" font-weight="800">5</text><text x="125" y="386" fill="#e2e8f0" font-size="13">Log and alert on agent tool calls, shell spawn, unexpected file reads, and outbound traffic.</text>

</svg>