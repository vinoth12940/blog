<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#7f1d1d"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#14532d"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#7c2d12"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker>
  </defs>

  <rect width="950" height="400" fill="url(#bg)" rx="16"/>
  <text x="475" y="42" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">When Prompts Become Shells</text>
  <text x="475" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">Prompt injection is now a path into real execution surfaces</text>

  <rect x="50" y="120" width="210" height="150" rx="14" fill="#1e1e2e" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="150" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700">Untrusted Prompt</text>
  <text x="155" y="182" text-anchor="middle" fill="#e2e8f0" font-size="13">email · web page · ticket</text>
  <text x="155" y="208" text-anchor="middle" fill="#94a3b8" font-size="12">Looks like content</text>
  <text x="155" y="232" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">Actually controls input</text>
  <line x1="270" y1="195" x2="360" y2="195" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="370" y="110" width="210" height="170" rx="14" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="2"/>
  <text x="475" y="142" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="700">Agent Framework</text>
  <text x="475" y="176" text-anchor="middle" fill="#e2e8f0" font-size="13">LLM maps text</text>
  <text x="475" y="202" text-anchor="middle" fill="#e2e8f0" font-size="13">into tool schemas</text>
  <text x="475" y="234" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="700">Framework trusts it</text>
  <line x1="590" y1="195" x2="680" y2="195" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="690" y="120" width="210" height="150" rx="14" fill="#1e1e2e" stroke="#ef4444" stroke-width="2"/>
  <text x="795" y="150" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="700">Host Capability</text>
  <text x="795" y="182" text-anchor="middle" fill="#e2e8f0" font-size="13">file write · eval · shell</text>
  <text x="795" y="208" text-anchor="middle" fill="#94a3b8" font-size="12">Not a chatbot bug</text>
  <text x="795" y="232" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="800">Infrastructure risk</text>
  <rect x="250" y="315" width="450" height="42" rx="21" fill="#451a1a" stroke="#ef4444"/>
  <text x="475" y="342" text-anchor="middle" fill="#fecaca" font-size="14" font-weight="700">The LLM is not the security boundary. Your tools are.</text>

</svg>