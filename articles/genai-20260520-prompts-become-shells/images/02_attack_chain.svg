<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#7f1d1d"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#14532d"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#7c2d12"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker>
  </defs>

  <rect width="1030" height="380" fill="url(#bg)" rx="16"/>
  <text x="515" y="42" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">The Four-Hop Agent RCE Chain</text>
  <text x="515" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">How content crosses from language into infrastructure</text>

  <rect x="55" y="105" width="170" height="110" rx="12" fill="#1e1e2e" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="135" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">1. Injection</text>
  <text x="140" y="165" text-anchor="middle" fill="#e2e8f0" font-size="12">Prompt steers</text><text x="140" y="185" text-anchor="middle" fill="#e2e8f0" font-size="12">tool arguments</text>
  <line x1="232" y1="160" x2="295" y2="160" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="305" y="105" width="170" height="110" rx="12" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="2"/>
  <text x="390" y="135" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">2. Serialization</text>
  <text x="390" y="165" text-anchor="middle" fill="#e2e8f0" font-size="12">Text becomes</text><text x="390" y="185" text-anchor="middle" fill="#e2e8f0" font-size="12">API parameters</text>
  <line x1="482" y1="160" x2="545" y2="160" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="555" y="105" width="170" height="110" rx="12" fill="#1e1e2e" stroke="#fb923c" stroke-width="2"/>
  <text x="640" y="135" text-anchor="middle" fill="#fdba74" font-size="13" font-weight="700">3. Trust Bug</text>
  <text x="640" y="165" text-anchor="middle" fill="#e2e8f0" font-size="12">eval / path /</text><text x="640" y="185" text-anchor="middle" fill="#e2e8f0" font-size="12">sandbox edge</text>
  <line x1="732" y1="160" x2="795" y2="160" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="805" y="105" width="170" height="110" rx="12" fill="#1e1e2e" stroke="#ef4444" stroke-width="2"/>
  <text x="890" y="135" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">4. RCE</text>
  <text x="890" y="165" text-anchor="middle" fill="#e2e8f0" font-size="12">File system,</text><text x="890" y="185" text-anchor="middle" fill="#e2e8f0" font-size="12">network, shell</text>
  <rect x="120" y="260" width="790" height="72" rx="14" fill="#111827" stroke="#334155"/>
  <text x="155" y="290" fill="#fbbf24" font-size="14" font-weight="700">Defensive translation:</text>
  <text x="330" y="290" fill="#e2e8f0" font-size="14">treat every model-generated tool argument as attacker-controlled input.</text>
  <text x="155" y="315" fill="#94a3b8" font-size="12">Validate with allowlists, constrain paths, remove shell/eval, isolate runtimes, and log tool calls.</text>

</svg>