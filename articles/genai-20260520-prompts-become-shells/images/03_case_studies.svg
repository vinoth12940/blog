  <rect width="930" height="390" fill="url(#bg)" rx="16"/>
  <text x="465" y="42" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">Three Cases, One Pattern</text>
  <text x="465" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">The vulnerable primitive changes; the trust-boundary mistake repeats</text>

  <rect x="50" y="105" width="250" height="210" rx="14" fill="#1e1e2e" stroke="#3b82f6" stroke-width="2"/>
  <text x="175" y="135" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="800">Semantic Kernel</text>
  <text x="175" y="164" text-anchor="middle" fill="#e2e8f0" font-size="12">CVE-2026-26030</text>
  <text x="175" y="188" text-anchor="middle" fill="#94a3b8" font-size="11">Python InMemoryVectorStore</text>
  <text x="175" y="215" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="700">filter eval → RCE</text>
  <text x="175" y="250" text-anchor="middle" fill="#22c55e" font-size="12">Fix: semantic-kernel 1.39.4+</text>
  <rect x="340" y="105" width="250" height="210" rx="14" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="2"/>
  <text x="465" y="135" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="800">Semantic Kernel</text>
  <text x="465" y="164" text-anchor="middle" fill="#e2e8f0" font-size="12">CVE-2026-25592</text>
  <text x="465" y="188" text-anchor="middle" fill="#94a3b8" font-size="11">.NET SessionsPythonPlugin</text>
  <text x="465" y="215" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="700">AI-exposed file write</text>
  <text x="465" y="250" text-anchor="middle" fill="#22c55e" font-size="12">Fix: remove unsafe exposure</text>
  <rect x="630" y="105" width="250" height="210" rx="14" fill="#1e1e2e" stroke="#fb923c" stroke-width="2"/>
  <text x="755" y="135" text-anchor="middle" fill="#fdba74" font-size="14" font-weight="800">PraisonAI</text>
  <text x="755" y="164" text-anchor="middle" fill="#e2e8f0" font-size="12">CVE-2026-44338</text>
  <text x="755" y="188" text-anchor="middle" fill="#94a3b8" font-size="11">API server default auth off</text>
  <text x="755" y="215" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="700">remote workflow trigger</text>
  <text x="755" y="250" text-anchor="middle" fill="#22c55e" font-size="12">Fix: v4.6.34+ + firewall</text>
  <text x="465" y="350" text-anchor="middle" fill="#94a3b8" font-size="12">Sources: Microsoft Security Blog, GitHub/NVD advisories, Cloud Security Alliance note.</text>

