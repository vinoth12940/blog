<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="url(#bgGrad4)"/>

  <text x="720" y="55" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="32" font-weight="700">Model Routing Decision Guide</text>
  <text x="720" y="90" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="18">Which model to pick — hybrid routing saves 60-90% with zero quality loss</text>

  <!-- Decision start -->
  <rect x="600" y="130" width="240" height="55" rx="12" fill="#534AB7" opacity="0.2" stroke="#534AB7" stroke-width="1.5"/>
  <text x="720" y="163" text-anchor="middle" fill="#AFA9EC" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Incoming Request</text>

  <line x1="720" y1="190" x2="720" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Decision 1 -->
  <polygon points="720,225 920,300 720,375 520,300" fill="#1e293b" stroke="#FAC775" stroke-width="1.5"/>
  <text x="720" y="290" text-anchor="middle" fill="#FAC775" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Complex reasoning?</text>
  <text x="720" y="312" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">(multi-step logic,</text>
  <text x="720" y="330" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">research, architecture)</text>

  <!-- YES branch -->
  <line x1="920" y1="300" x2="980" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="950" y="290" text-anchor="middle" fill="#639922" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">YES</text>

  <rect x="980" y="260" width="220" height="80" rx="12" fill="#1e293b" stroke="#D85A30" stroke-width="1.5"/>
  <text x="1090" y="290" text-anchor="middle" fill="#F0997B" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Claude Sonnet 4.6</text>
  <text x="1090" y="312" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">$3.00 / $15.00 per 1M</text>
  <text x="1090" y="330" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Best reasoning + safety</text>

  <!-- NO branch -->
  <line x1="520" y1="300" x2="460" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="490" y="290" text-anchor="middle" fill="#378ADD" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">NO</text>

  <!-- Decision 2 -->
  <polygon points="340,400 540,475 340,550 140,475" fill="#1e293b" stroke="#FAC775" stroke-width="1.5"/>
  <text x="340" y="465" text-anchor="middle" fill="#FAC775" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Needs vision /</text>
  <text x="340" y="485" text-anchor="middle" fill="#FAC775" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">multimodal?</text>
  <text x="340" y="510" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">(images, PDFs, audio)</text>

  <!-- YES → Qwen -->
  <line x1="340" y1="550" x2="340" y2="590" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="360" y="575" fill="#639922" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">YES</text>

  <rect x="220" y="590" width="240" height="80" rx="12" fill="#1e293b" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="340" y="620" text-anchor="middle" fill="#5DCAA5" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Qwen3.5-Max</text>
  <text x="340" y="642" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">$1.40 / $6.00 per 1M</text>
  <text x="340" y="660" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Best multimodal value</text>

  <!-- NO → Decision 3 -->
  <line x1="140" y1="475" x2="80" y2="475" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="475" x2="80" y2="620" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="110" y="465" fill="#378ADD" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">NO</text>

  <polygon points="80,620 280,695 80,770 -120,695" fill="#1e293b" stroke="#FAC775" stroke-width="1.5"/>
  <text x="80" y="685" text-anchor="middle" fill="#FAC775" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Volume > 5M</text>
  <text x="80" y="705" text-anchor="middle" fill="#FAC775" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">tokens/month?</text>
  <text x="80" y="730" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">(agents, RAG, bulk)</text>

  <!-- YES → Self-host -->
  <line x1="280" y1="695" x2="380" y2="695" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="330" y="685" text-anchor="middle" fill="#639922" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">YES</text>

  <rect x="380" y="655" width="240" height="80" rx="12" fill="#1e293b" stroke="#639922" stroke-width="1.5"/>
  <text x="500" y="685" text-anchor="middle" fill="#97C459" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Self-Host DeepSeek</text>
  <text x="500" y="707" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">&lt;$0.01/M tokens (power)</text>
  <text x="500" y="725" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">4-bit quant on RTX 4090</text>

  <!-- NO → DeepSeek API -->
  <line x1="-120" y1="695" x2="-180" y2="695" stroke="#475569" stroke-width="2"/>
  <line x1="-180" y1="695" x2="-180" y2="655" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="-150" y="685" fill="#378ADD" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">NO</text>

  <!-- DeepSeek API box (offset to stay in view) -->
  <rect x="520" y="440" width="240" height="80" rx="12" fill="#1e293b" stroke="#1D9E75" stroke-width="2"/>
  <text x="640" y="470" text-anchor="middle" fill="#5DCAA5" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">DeepSeek-V3.2 API</text>
  <text x="640" y="492" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">$0.28 / $0.42 per 1M</text>
  <text x="640" y="510" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Best default for most workloads</text>

  <line x1="-180" y1="655" x2="-180" y2="480" stroke="#475569" stroke-width="2"/>
  <line x1="-180" y1="480" x2="520" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Savings summary -->
  <rect x="850" y="430" width="480" height="230" rx="16" fill="#0f172a" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="1090" y="465" text-anchor="middle" fill="#5DCAA5" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Hybrid Routing Savings</text>

  <line x1="890" y1="485" x2="1290" y2="485" stroke="#1e293b" stroke-width="1"/>

  <text x="890" y="515" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="15">All Claude → <tspan font-family="monospace" fill="#D85A30">$50,000/mo</tspan></text>
  <text x="890" y="545" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="15">80% DeepSeek + 20% Claude → <tspan font-family="monospace" fill="#5DCAA5">$11,200/mo</tspan></text>
  <text x="890" y="575" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="15">Self-host 50% + API 50% → <tspan font-family="monospace" fill="#97C459">$6,400/mo</tspan></text>

  <line x1="890" y1="595" x2="1290" y2="595" stroke="#1e293b" stroke-width="1"/>

  <text x="890" y="625" fill="#5DCAA5" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">→ 77-87% cost reduction</text>
  <text x="890" y="648" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">with negligible quality impact</text>

  <!-- Bottom note -->
  <text x="720" y="860" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="13">Use LiteLLM or similar routers to implement this pattern · Route by complexity classifier or simple heuristics</text>
</svg>
