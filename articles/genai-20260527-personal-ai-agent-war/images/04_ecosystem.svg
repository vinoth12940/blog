<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold">The 2026 AI Agent Ecosystem</text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-size="11">Tools, protocols, and frameworks powering the multi-agent revolution</text>

  <!-- Center: MCP Protocol -->
  <rect x="330" y="75" width="240" height="50" rx="12" fill="#1e1e2e" stroke="#fbbf24" stroke-width="2"/>
  <text x="450" y="97" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">MCP — Model Context Protocol</text>
  <text x="450" y="114" text-anchor="middle" fill="#94a3b8" font-size="10">The universal connector standard</text>

  <!-- Arrow from MCP down -->
  <line x1="450" y1="125" x2="450" y2="148" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent Platforms Row -->
  <text x="450" y="158" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">AGENT PLATFORMS</text>

  <!-- OpenClaw -->
  <rect x="40" y="170" width="190" height="70" rx="10" fill="#1e1e2e" stroke="#fb923c" stroke-width="2"/>
  <text x="135" y="195" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="bold">OpenClaw</text>
  <text x="135" y="213" text-anchor="middle" fill="#94a3b8" font-size="9">Self-hosted personal AI</text>
  <text x="135" y="228" text-anchor="middle" fill="#fbbf24" font-size="9">310K+ ⭐</text>

  <!-- Gemini Spark -->
  <rect x="250" y="170" width="190" height="70" rx="10" fill="#1e1e2e" stroke="#3b82f6" stroke-width="2"/>
  <text x="345" y="195" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="bold">Gemini Spark</text>
  <text x="345" y="213" text-anchor="middle" fill="#94a3b8" font-size="9">Cloud personal AI</text>
  <text x="345" y="228" text-anchor="middle" fill="#06b6d4" font-size="9">3.5 Flash + Antigravity</text>

  <!-- Claude Code -->
  <rect x="460" y="170" width="190" height="70" rx="10" fill="#1e1e2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="555" y="195" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">Claude Code</text>
  <text x="555" y="213" text-anchor="middle" fill="#94a3b8" font-size="9">Dev agent platform</text>
  <text x="555" y="228" text-anchor="middle" fill="#a78bfa" font-size="9">Plugins · Multi-agent</text>

  <!-- Codex CLI -->
  <rect x="670" y="170" width="190" height="70" rx="10" fill="#1e1e2e" stroke="#22c55e" stroke-width="2"/>
  <text x="765" y="195" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="bold">Codex CLI</text>
  <text x="765" y="213" text-anchor="middle" fill="#94a3b8" font-size="9">OpenAI coding agent</text>
  <text x="765" y="228" text-anchor="middle" fill="#22c55e" font-size="9">Sandbox · Autonomous</text>

  <!-- Arrows down from platforms -->
  <line x1="135" y1="240" x2="135" y2="268" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="345" y1="240" x2="345" y2="268" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="555" y1="240" x2="555" y2="268" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="765" y1="240" x2="765" y2="268" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- LLM Models Row -->
  <text x="450" y="278" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">FOUNDATION MODELS</text>

  <rect x="40" y="290" width="145" height="50" rx="10" fill="#1e1e2e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="112" y="312" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="bold">Gemini 3.5 Flash</text>
  <text x="112" y="328" text-anchor="middle" fill="#64748b" font-size="9">Google</text>

  <rect x="200" y="290" width="145" height="50" rx="10" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="272" y="312" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">Claude Opus 4.7</text>
  <text x="272" y="328" text-anchor="middle" fill="#64748b" font-size="9">Anthropic</text>

  <rect x="360" y="290" width="145" height="50" rx="10" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="432" y="312" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">GPT-5.5</text>
  <text x="432" y="328" text-anchor="middle" fill="#64748b" font-size="9">OpenAI</text>

  <rect x="520" y="290" width="145" height="50" rx="10" fill="#1e1e2e" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="592" y="312" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="bold">DeepSeek V4</text>
  <text x="592" y="328" text-anchor="middle" fill="#64748b" font-size="9">Open-weight</text>

  <rect x="680" y="290" width="170" height="50" rx="10" fill="#1e1e2e" stroke="#fb923c" stroke-width="1.5"/>
  <text x="765" y="312" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="bold">Llama 4 / Ollama</text>
  <text x="765" y="328" text-anchor="middle" fill="#64748b" font-size="9">Self-hosted / Local</text>

  <!-- Infrastructure layer -->
  <text x="450" y="375" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">INFRASTRUCTURE &amp; TOOLING</text>

  <rect x="40" y="385" width="130" height="40" rx="8" fill="#1e1e2e" stroke="#64748b" stroke-width="1"/>
  <text x="105" y="410" text-anchor="middle" fill="#94a3b8" font-size="10">Ollama (local)</text>

  <rect x="185" y="385" width="130" height="40" rx="8" fill="#1e1e2e" stroke="#64748b" stroke-width="1"/>
  <text x="250" y="410" text-anchor="middle" fill="#94a3b8" font-size="10">LangChain</text>

  <rect x="330" y="385" width="130" height="40" rx="8" fill="#1e1e2e" stroke="#64748b" stroke-width="1"/>
  <text x="395" y="410" text-anchor="middle" fill="#94a3b8" font-size="10">CrewAI</text>

  <rect x="475" y="385" width="130" height="40" rx="8" fill="#1e1e2e" stroke="#64748b" stroke-width="1"/>
  <text x="540" y="410" text-anchor="middle" fill="#94a3b8" font-size="10">LlamaIndex</text>

  <rect x="620" y="385" width="130" height="40" rx="8" fill="#1e1e2e" stroke="#64748b" stroke-width="1"/>
  <text x="685" y="410" text-anchor="middle" fill="#94a3b8" font-size="10">Tailscale</text>

  <rect x="765" y="385" width="95" height="40" rx="8" fill="#1e1e2e" stroke="#64748b" stroke-width="1"/>
  <text x="812" y="410" text-anchor="middle" fill="#94a3b8" font-size="10">Docker</text>

  <!-- Bottom insight -->
  <rect x="80" y="445" width="740" height="24" rx="8" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="450" y="462" text-anchor="middle" fill="#94a3b8" font-size="10">The 2026 stack: Specialized agents + MCP + multi-model backends → production AI that actually ships work</text>
</svg>