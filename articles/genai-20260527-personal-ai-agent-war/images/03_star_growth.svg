<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="350" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold">OpenClaw's GitHub Star Growth: A Record-Breaking Sprint</text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-size="11">Fastest-growing open-source project in GitHub history</text>

  <!-- Timeline bar -->
  <rect x="80" y="80" width="740" height="3" rx="2" fill="#334155"/>

  <!-- Timeline dots and labels -->
  <circle cx="120" cy="81" r="6" fill="#fb923c"/>
  <text x="120" y="105" text-anchor="middle" fill="#94a3b8" font-size="9">Jan 2026</text>
  <text x="120" y="118" text-anchor="middle" fill="#fb923c" font-size="10" font-weight="bold">Launch</text>

  <circle cx="260" cy="81" r="6" fill="#fb923c"/>
  <text x="260" y="105" text-anchor="middle" fill="#94a3b8" font-size="9">Feb 2026</text>
  <text x="260" y="118" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">50K ⭐</text>

  <circle cx="400" cy="81" r="6" fill="#fb923c"/>
  <text x="400" y="105" text-anchor="middle" fill="#94a3b8" font-size="9">Mar 3, 2026</text>
  <text x="400" y="118" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">250K ⭐</text>
  <text x="400" y="130" text-anchor="middle" fill="#ef4444" font-size="9">Beats React!</text>

  <circle cx="560" cy="81" r="6" fill="#fb923c"/>
  <text x="560" y="105" text-anchor="middle" fill="#94a3b8" font-size="9">Apr 2026</text>
  <text x="560" y="118" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">300K ⭐</text>

  <circle cx="720" cy="81" r="8" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="720" y="105" text-anchor="middle" fill="#94a3b8" font-size="9">May 2026</text>
  <text x="720" y="118" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="bold">310K+ ⭐</text>

  <!-- Comparison bars -->
  <text x="80" y="175" fill="#f8fafc" font-size="13" font-weight="bold">GitHub Stars Comparison</text>

  <!-- OpenClaw -->
  <rect x="80" y="195" width="600" height="36" rx="8" fill="url(#barOrange)" opacity="0.9"/>
  <text x="90" y="218" fill="white" font-size="12" font-weight="bold">OpenClaw — 310,000+ stars (4 months)</text>

  <!-- React -->
  <rect x="80" y="242" width="470" height="36" rx="8" fill="#1e1e2e" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="265" fill="#94a3b8" font-size="12" font-weight="bold">React — 243,000 stars (10 years)</text>

  <!-- FreeCodeCamp -->
  <rect x="80" y="289" width="380" height="36" rx="8" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="2"/>
  <text x="90" y="312" fill="#94a3b8" font-size="12" font-weight="bold">freeCodeCamp — 204,000 stars (8 years)</text>

  <!-- Insight -->
  <text x="450" y="345" text-anchor="middle" fill="#64748b" font-size="10">React took 10 years to reach 243K stars. OpenClaw did it in 60 days.</text>
</svg>