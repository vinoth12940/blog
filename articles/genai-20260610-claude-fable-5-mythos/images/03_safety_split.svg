<svg width="900" height="420" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="420" rx="16" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="600" fill="#f1f5f9" text-anchor="middle">One Model, Two Versions: The Safety Split</text>
  <text x="450" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Same underlying Mythos-class model — different safety configurations</text>

  <!-- Central divider -->
  <line x1="450" y1="80" x2="450" y2="400" stroke="#334155" stroke-width="1" stroke-dasharray="8 4"/>
  
  <!-- Shared base label -->
  <rect x="310" y="80" width="280" height="44" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="450" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#f59e0b" text-anchor="middle" dominant-baseline="central">Mythos-class base model</text>

  <!-- Branch arrows -->
  <line x1="390" y1="124" x2="250" y2="160" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="247,156 243,164 254,163" fill="#22c55e"/>
  <line x1="510" y1="124" x2="650" y2="160" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="647,156 656,163 647,164" fill="#f59e0b"/>

  <!-- LEFT: Fable 5 -->
  <rect x="80" y="165" width="340" height="220" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  
  <rect x="100" y="180" width="300" height="40" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
  <text x="250" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#22c55e" text-anchor="middle" dominant-baseline="central">Claude Fable 5</text>
  
  <text x="110" y="245" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#94a3b8">✓ Available to everyone</text>
  <text x="110" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#94a3b8">✓ Claude API + claude.ai</text>
  <text x="110" y="291" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#94a3b8">✓ AWS Bedrock + Vertex AI</text>
  <text x="110" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#94a3b8">✓ GitLab Duo integration</text>
  
  <line x1="100" y1="328" x2="400" y2="328" stroke="#334155" stroke-width="0.5"/>
  <text x="110" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#fb923c">⛔ Blocks cybersecurity exploits</text>
  <text x="110" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#fb923c">⛔ Blocks biology harm queries</text>

  <!-- RIGHT: Mythos 5 -->
  <rect x="480" y="165" width="340" height="220" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  
  <rect x="500" y="180" width="300" height="40" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="650" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#f59e0b" text-anchor="middle" dominant-baseline="central">Claude Mythos 5</text>
  
  <text x="510" y="245" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#94a3b8">🔒 Vetted partners only</text>
  <text x="510" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#94a3b8">🔒 Project Glasswing partners</text>
  <text x="510" y="291" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#94a3b8">🔒 Selected biology researchers</text>
  <text x="510" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#94a3b8">🔒 Enterprise with compliance</text>
  
  <line x1="500" y1="328" x2="800" y2="328" stroke="#334155" stroke-width="0.5"/>
  <text x="510" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#22c55e">✅ Full capability access</text>
  <text x="510" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#22c55e">✅ Security &amp; life sciences work</text>

  <!-- Pricing label (shared) -->
  <text x="450" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Both models: $10/M input · $50/M output · Same API endpoint structure</text>
</svg>