<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#16243d"/>
    </linearGradient>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f87171" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="880" fill="url(#heroGrad)"/>

  <text x="720" y="56" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#f87171" letter-spacing="4">SUPPLY-CHAIN ATTACK &#183; NOVEMBER 17, 2026</text>
  <text x="720" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#f8fafc">Anatomy of the agent-framework hijack</text>
  <text x="720" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94a3b8">Two malicious releases of Microsoft's official AI agent toolkit ran malware that never needed an import</text>

  <!-- Row 1: steps 1-3, left to right -->
  <rect x="80" y="190" width="380" height="170" rx="12" fill="#1e1e2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="104" y="222" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f87171">STEP 1 &#183; THE ENTRY</text>
  <text x="104" y="252" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">A stolen release certificate</text>
  <text x="104" y="280" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">Client cert + private key for the</text>
  <text x="104" y="300" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">Engineering System Release Pipeline,</text>
  <text x="104" y="320" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">the internal signing service</text>

  <line x1="460" y1="275" x2="524" y2="275" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="530" y="190" width="380" height="170" rx="12" fill="#1e1e2e" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="554" y="222" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">STEP 2 &#183; THE COVER</text>
  <text x="554" y="252" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Microsoft's own account</text>
  <text x="554" y="280" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">Published through the official</text>
  <text x="554" y="300" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">publisher - it looked like a routine</text>
  <text x="554" y="320" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">update to a 192K-download package</text>

  <line x1="910" y1="275" x2="974" y2="275" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="980" y="190" width="380" height="170" rx="12" fill="#1e1e2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="1004" y="222" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f87171">STEP 3 &#183; THE DROP</text>
  <text x="1004" y="252" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Versions 1.26.1 and 1.26.2</text>
  <text x="1004" y="280" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">Published to PyPI on Nov 17, both</text>
  <text x="1004" y="300" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">carrying a .pth startup hook with</text>
  <text x="1004" y="320" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">a credential stealer inside</text>

  <!-- wrap arrow: step 3 down to step 4 -->
  <path d="M 1170 360 L 1170 428 L 1164 428" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Row 2: steps 4-6, right to left -->
  <rect x="980" y="434" width="380" height="170" rx="12" fill="#1e1e2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="1004" y="466" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f87171">STEP 4 &#183; THE TRIGGER</text>
  <text x="1004" y="496" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Any Python start, no import</text>
  <text x="1004" y="524" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">A dev machine or CI runner runs</text>
  <text x="1004" y="544" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">python - the interpreter processes</text>
  <text x="1004" y="564" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">.pth hooks before any import</text>

  <line x1="980" y1="519" x2="916" y2="519" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="530" y="434" width="380" height="170" rx="12" fill="#1e1e2e" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="554" y="466" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">STEP 5 &#183; THE HAUL</text>
  <text x="554" y="496" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Copied secrets, minted tokens</text>
  <text x="554" y="524" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">Env vars, 300 process environments,</text>
  <text x="554" y="544" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">credential files - plus requests for</text>
  <text x="554" y="564" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">fresh Azure and GitHub tokens</text>

  <line x1="530" y1="519" x2="466" y2="519" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="80" y="434" width="380" height="170" rx="12" fill="#1e1e2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="104" y="466" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f87171">STEP 6 &#183; THE EXIT</text>
  <text x="104" y="496" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">One request to webhook.site</text>
  <text x="104" y="524" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">The haul is compressed, encoded</text>
  <text x="104" y="544" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">and exfiltrated in a single request</text>
  <text x="104" y="564" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">to an attacker-controlled endpoint</text>

  <!-- Stat strip -->
  <rect x="80" y="668" width="300" height="110" rx="12" fill="#111418" stroke="#1f2937" stroke-width="1"/>
  <text x="230" y="712" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#60a5fa">192,534</text>
  <text x="230" y="740" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94a3b8">monthly downloads</text>
  <text x="230" y="760" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748b">(OX Security)</text>

  <rect x="400" y="668" width="300" height="110" rx="12" fill="#111418" stroke="#1f2937" stroke-width="1"/>
  <text x="550" y="712" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#f87171">2.5 min</text>
  <text x="550" y="740" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94a3b8">between release one</text>
  <text x="550" y="760" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748b">and release two</text>

  <rect x="720" y="668" width="300" height="110" rx="12" fill="#111418" stroke="#1f2937" stroke-width="1"/>
  <text x="870" y="712" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#fbbf24">~8 min</text>
  <text x="870" y="740" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94a3b8">to quarantine the</text>
  <text x="870" y="760" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748b">second release</text>

  <rect x="1040" y="668" width="300" height="110" rx="12" fill="#111418" stroke="#1f2937" stroke-width="1"/>
  <text x="1190" y="712" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#34d399">3</text>
  <text x="1190" y="740" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94a3b8">unique successful thefts</text>
  <text x="1190" y="760" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748b">(Wiz estimate)</text>

  <text x="720" y="840" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748b">Sources: BleepingComputer, SiliconANGLE (Wiz), Help Net Security (StepSecurity, Socket, OX Security) - November 2026</text>
</svg>
