<svg width="1440" height="780" viewBox="0 0 1440 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="780" fill="#0f172a"/>
  <text x="60" y="86" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#e5e7eb">Why the blob ships to your client at all</text>
  <text x="60" y="126" font-family="Inter, -apple-system, sans-serif" font-size="22" fill="#94a3b8">Stateless tool loops force providers to hand hidden reasoning state to the app — in encrypted form</text>

  <!-- Step 1 -->
  <rect x="60" y="180" width="300" height="230" rx="16" fill="#111827" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="84" y="224" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#60a5fa">① Your app calls</text>
  <text x="84" y="262" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#e5e7eb">prompt + tool definitions</text>
  <text x="84" y="298" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#c9c9c9">stateless / zero-retention</text>
  <text x="84" y="326" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#c9c9c9">mode: the server keeps</text>
  <text x="84" y="354" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#c9c9c9">no session between calls</text>

  <line x1="360" y1="295" x2="420" y2="295" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="430" y="180" width="300" height="230" rx="16" fill="#111827" stroke="#c084fc" stroke-width="1.5"/>
  <text x="454" y="224" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#c084fc">② Model thinks</text>
  <text x="454" y="262" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#e5e7eb">hidden chain-of-thought</text>
  <text x="454" y="298" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#c9c9c9">exists server-side only</text>
  <text x="454" y="326" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#c9c9c9">for the length of this</text>
  <text x="454" y="354" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#c9c9c9">one response</text>

  <line x1="730" y1="295" x2="790" y2="295" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="800" y="180" width="300" height="230" rx="16" fill="#1a1a2e" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="824" y="224" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#fbbf24">③ Response ships out</text>
  <text x="824" y="262" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#e5e7eb">tool_use request</text>
  <text x="824" y="298" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#fbbf24">+ encrypted reasoning block</text>
  <text x="824" y="334" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#c9c9c9">your app can't read it,</text>
  <text x="824" y="362" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#c9c9c9">but must carry it onward</text>

  <line x1="1100" y1="295" x2="1160" y2="295" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="1170" y="180" width="210" height="230" rx="16" fill="#111827" stroke="#4ade80" stroke-width="1.5"/>
  <text x="1194" y="224" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#4ade80">④ Next turn</text>
  <text x="1194" y="262" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#e5e7eb">tool_result + blob</text>
  <text x="1194" y="298" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#c9c9c9">sent back; server</text>
  <text x="1194" y="326" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#c9c9c9">decrypts and resumes</text>
  <text x="1194" y="354" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#c9c9c9">the reasoning</text>

  <!-- callout -->
  <rect x="60" y="470" width="1320" height="150" rx="16" fill="#0f1729" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="520" font-family="Inter, -apple-system, sans-serif" font-size="23" font-weight="600" fill="#93c5fd">The portability is the design — and the attack surface</text>
  <text x="90" y="558" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#c9c9c9">Blobs replay across sessions, users, even accounts — and into sibling models from the same provider.</text>
  <text x="90" y="590" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#c9c9c9">Cryptographer Matthew Green demonstrated the replay in May 2026; providers saw no security issue at the time.</text>

  <text x="60" y="690" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#64748b">As of July 2026, no provider documents the cryptographic mechanism behind these blocks.</text>
</svg>
