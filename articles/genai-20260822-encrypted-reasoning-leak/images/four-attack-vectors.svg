<svg width="1440" height="860" viewBox="0 0 1440 860" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="860" fill="#0f172a"/>
  <text x="60" y="86" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#e5e7eb">Four attack vectors, one architectural flaw</text>
  <text x="60" y="126" font-family="Inter, -apple-system, sans-serif" font-size="22" fill="#94a3b8">What interchangeable encrypted reasoning blocks enable — measured by the Stolen Thoughts team</text>

  <!-- Vector 1 -->
  <rect x="60" y="170" width="640" height="290" rx="16" fill="#111827" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="88" y="218" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#60a5fa">① Anti-distillation bypass</text>
  <text x="88" y="258" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">Steal a frontier model's reasoning to distill into</text>
  <text x="88" y="286" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">cheaper models — without ever attacking the</text>
  <text x="88" y="314" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">safeguarded frontier model directly.</text>
  <text x="88" y="362" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#fbbf24">≈ $720 to decode 10,000 traces</text>
  <text x="88" y="390" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#94a3b8">at Claude Haiku 4.5 API rates (12k-token windows)</text>

  <!-- Vector 2 -->
  <rect x="740" y="170" width="640" height="290" rx="16" fill="#111827" stroke="#f87171" stroke-width="1.5"/>
  <text x="768" y="218" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#f87171">② Secrets hiding in public logs</text>
  <text x="768" y="258" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">Developers share session logs publicly, unaware</text>
  <text x="768" y="286" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">of what the encrypted blocks contain.</text>
  <text x="768" y="334" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#fbbf24">315,320 public reasoning blocks decoded</text>
  <text x="768" y="372" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">→ 367 PII artifacts · 182 credentials</text>
  <text x="768" y="404" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#94a3b8">including 62 API keys, 33 passwords, 30 emails</text>

  <!-- Vector 3 -->
  <rect x="60" y="490" width="640" height="290" rx="16" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="88" y="538" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#fbbf24">③ Harmful content in the hidden lane</text>
  <text x="88" y="578" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">The visible answer refuses a malicious request;</text>
  <text x="88" y="606" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">the decoded reasoning still contains hazardous</text>
  <text x="88" y="634" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">details the safety layer kept out of the output.</text>
  <text x="88" y="682" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#94a3b8">demonstrated on HarmBench-style queries (Opus 4.8)</text>

  <!-- Vector 4 -->
  <rect x="740" y="490" width="640" height="290" rx="16" fill="#111827" stroke="#c084fc" stroke-width="1.5"/>
  <text x="768" y="538" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#c084fc">④ Invisible prompt injection</text>
  <text x="768" y="578" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">Malicious payloads can ride inside encrypted</text>
  <text x="768" y="606" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">blocks — poisoning public agentic rollouts and</text>
  <text x="768" y="634" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">datasets that no human can visually inspect.</text>
  <text x="768" y="682" font-family="Inter, -apple-system, sans-serif" font-size="19" fill="#94a3b8">also: sanitize JSON in any chat input exposed to users</text>
</svg>
