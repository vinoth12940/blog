<svg width="1440" height="800" viewBox="0 0 1440 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="800" fill="#0f172a"/>
  <text x="60" y="86" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#e5e7eb">If you ship agent logs, strip the blobs first</text>
  <text x="60" y="126" font-family="Inter, -apple-system, sans-serif" font-size="22" fill="#94a3b8">A publish pipeline that deletes encrypted reasoning before anything leaves your machine</text>

  <!-- raw transcript -->
  <rect x="60" y="180" width="380" height="250" rx="16" fill="#111827" stroke="#f87171" stroke-width="1.5"/>
  <text x="84" y="226" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#f87171">Raw session transcript</text>
  <text x="84" y="268" font-family="'JetBrains Mono', monospace" font-size="17" fill="#94a3b8">{ "role": "assistant",</text>
  <text x="84" y="296" font-family="'JetBrains Mono', monospace" font-size="17" fill="#fbbf24">  "thinking": { "signature":</text>
  <text x="84" y="324" font-family="'JetBrains Mono', monospace" font-size="17" fill="#fbbf24">    "EvjTAQqJAQgPGAIq…" },</text>
  <text x="84" y="352" font-family="'JetBrains Mono', monospace" font-size="17" fill="#94a3b8">  "reasoning": { "encrypted_</text>
  <text x="84" y="380" font-family="'JetBrains Mono', monospace" font-size="17" fill="#94a3b8">    "content": "gAAAAA…" } }</text>

  <line x1="440" y1="305" x2="530" y2="305" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- scrubber -->
  <rect x="540" y="180" width="360" height="250" rx="16" fill="#1a1a2e" stroke="#4ade80" stroke-width="1.5"/>
  <text x="564" y="226" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#4ade80">Scrub before sharing</text>
  <text x="564" y="266" font-family="'JetBrains Mono', monospace" font-size="17" fill="#c9c9c9">drop fields:</text>
  <text x="564" y="298" font-family="'JetBrains Mono', monospace" font-size="17" fill="#f472b6">thinking.signature</text>
  <text x="564" y="330" font-family="'JetBrains Mono', monospace" font-size="17" fill="#f472b6">encrypted_content</text>
  <text x="564" y="362" font-family="'JetBrains Mono', monospace" font-size="17" fill="#f472b6">redacted reasoning blobs</text>
  <text x="564" y="400" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#94a3b8">verify field names against your provider schema</text>

  <line x1="900" y1="305" x2="990" y2="305" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- safe -->
  <rect x="1000" y="180" width="380" height="250" rx="16" fill="#111827" stroke="#4ade80" stroke-width="1.5"/>
  <text x="1024" y="226" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#4ade80">Safe to publish</text>
  <text x="1024" y="266" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">prompts, visible outputs,</text>
  <text x="1024" y="294" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">tool calls and results —</text>
  <text x="1024" y="322" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">with zero unreadable</text>
  <text x="1024" y="350" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#e5e7eb">baggage riding along</text>

  <!-- checklist -->
  <rect x="60" y="480" width="1320" height="270" rx="16" fill="#0f1729" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="530" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#93c5fd">Builder checklist</text>
  <circle cx="104" cy="576" r="5" fill="#4ade80"/><text x="126" y="583" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#c9c9c9">Treat encrypted reasoning as sensitive data you cannot read — because you cannot read it.</text>
  <circle cx="104" cy="620" r="5" fill="#4ade80"/><text x="126" y="627" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#c9c9c9">Never paste raw transcripts into GitHub issues, blog posts, bug reports, or datasets.</text>
  <circle cx="104" cy="664" r="5" fill="#4ade80"/><text x="126" y="671" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#c9c9c9">Rotate any API key that ever rode through a logged, shared, or uploaded session.</text>
  <circle cx="104" cy="708" r="5" fill="#4ade80"/><text x="126" y="715" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#c9c9c9">Prefer server-side (stateful) sessions where compliance allows — blobs never leave the provider.</text>
</svg>
