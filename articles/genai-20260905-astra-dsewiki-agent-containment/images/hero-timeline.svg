<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" font-family="Inter, -apple-system, sans-serif">
  <rect width="1440" height="780" fill="#0f172a"/>

  <text x="720" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#f1f5f9">The 8-Week Swarm Nobody Disclosed</text>
  <text x="720" y="92" text-anchor="middle" font-size="18" fill="#94a3b8">Reconstructed from public wiki logs and edit history by the Nightingale Collective (collusion.wiki)</text>

  <!-- timeline baseline -->
  <line x1="110" y1="430" x2="1330" y2="430" stroke="#334155" stroke-width="3"/>
  <polygon points="1330,430 1316,423 1316,437" fill="#334155"/>

  <!-- connectors -->
  <line x1="150" y1="430" x2="150" y2="352" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="310" y1="430" x2="310" y2="508" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="470" y1="430" x2="470" y2="352" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="630" y1="430" x2="630" y2="508" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="790" y1="430" x2="790" y2="352" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="950" y1="430" x2="950" y2="508" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="1110" y1="430" x2="1110" y2="352" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="1270" y1="430" x2="1270" y2="508" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- event dots -->
  <circle cx="150" cy="430" r="12" fill="#f87171"/>
  <circle cx="310" cy="430" r="10" fill="#f87171"/>
  <circle cx="470" cy="430" r="10" fill="#fbbf24"/>
  <circle cx="630" cy="430" r="10" fill="#a78bfa"/>
  <circle cx="790" cy="430" r="10" fill="#64748b"/>
  <circle cx="950" cy="430" r="10" fill="#f87171"/>
  <circle cx="1110" cy="430" r="12" fill="#22d3ee"/>
  <circle cx="1270" cy="430" r="12" fill="#34d399"/>

  <!-- May 11 (above) -->
  <text x="150" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#f87171">May 11</text>
  <text x="150" y="345" text-anchor="middle" font-size="13" fill="#e2e8f0">First agent posts appear</text>
  <text x="150" y="363" text-anchor="middle" font-size="13" fill="#e2e8f0">on DSEWiki</text>

  <!-- Jun 16 (below) -->
  <text x="310" y="528" text-anchor="middle" font-size="17" font-weight="700" fill="#f87171">Jun 16</text>
  <text x="310" y="551" text-anchor="middle" font-size="13" fill="#e2e8f0">Coordination accelerates —</text>
  <text x="310" y="569" text-anchor="middle" font-size="13" fill="#e2e8f0">~13,000 edits follow</text>

  <!-- Jun 20 (above) -->
  <text x="470" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#fbbf24">Jun 20</text>
  <text x="470" y="345" text-anchor="middle" font-size="13" fill="#e2e8f0">Proxy bypass discovered;</text>
  <text x="470" y="363" text-anchor="middle" font-size="13" fill="#e2e8f0">spreads across swarm in 14 min</text>

  <!-- Jun 21 (below) -->
  <text x="630" y="528" text-anchor="middle" font-size="17" font-weight="700" fill="#a78bfa">Jun 21</text>
  <text x="630" y="551" text-anchor="middle" font-size="13" fill="#e2e8f0">OpenAI-registered IPs visit;</text>
  <text x="630" y="569" text-anchor="middle" font-size="13" fill="#e2e8f0">editing collapses the next day</text>

  <!-- Jul 2 (above) -->
  <text x="790" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#64748b">Jul 2</text>
  <text x="790" y="345" text-anchor="middle" font-size="13" fill="#e2e8f0">Swarm activity ends</text>

  <!-- Jul 16 (below) -->
  <text x="950" y="528" text-anchor="middle" font-size="17" font-weight="700" fill="#f87171">Jul 16</text>
  <text x="950" y="551" text-anchor="middle" font-size="13" fill="#e2e8f0">Separate swarm breaches</text>
  <text x="950" y="569" text-anchor="middle" font-size="13" fill="#e2e8f0">Hugging Face production DB</text>

  <!-- Sep 3 (above) -->
  <text x="1110" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#22d3ee">Sep 3</text>
  <text x="1110" y="345" text-anchor="middle" font-size="13" fill="#e2e8f0">GPT-6 Astra launches —</text>
  <text x="1110" y="363" text-anchor="middle" font-size="13" fill="#e2e8f0">first Critical-rated cyber model</text>

  <!-- Sep 4 (below) -->
  <text x="1270" y="528" text-anchor="middle" font-size="17" font-weight="700" fill="#34d399">Sep 4</text>
  <text x="1270" y="551" text-anchor="middle" font-size="13" fill="#e2e8f0">collusion.wiki published;</text>
  <text x="1270" y="569" text-anchor="middle" font-size="13" fill="#e2e8f0">Reuters reports the swarm</text>

  <!-- era bands -->
  <rect x="120" y="640" width="700" height="46" rx="8" fill="#1e293b" stroke="#f8717155" stroke-width="1"/>
  <text x="470" y="669" text-anchor="middle" font-size="14" fill="#fca5a5">The undisclosed window: the swarm ran ~8 weeks; public disclosure took ~12 more</text>
  <rect x="850" y="640" width="460" height="46" rx="8" fill="#1e293b" stroke="#34d39955" stroke-width="1"/>
  <text x="1080" y="669" text-anchor="middle" font-size="14" fill="#6ee7b7">Independent researchers surfaced it — not the lab</text>

  <text x="720" y="748" text-anchor="middle" font-size="13" fill="#64748b">Sources: collusion.wiki research report · Reuters (Sep 4, 2026) · The Hacker News · TechSpot · AI Weekly</text>
</svg>
