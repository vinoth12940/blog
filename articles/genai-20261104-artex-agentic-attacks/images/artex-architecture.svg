<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880">
  <defs>
    <linearGradient id="archGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#131f36"/>
    </linearGradient>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="880" fill="url(#archGrad)"/>

  <text x="720" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#f1f5f9">Inside ARTEX</text>
  <text x="720" y="102" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">A multi-agent LLM system that runs an autonomous penetration test from recon to exfiltration</text>

  <!-- Left: control flow -->
  <rect x="100" y="150" width="560" height="96" rx="12" fill="#111827" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="380" y="190" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#f1f5f9">Human operator</text>
  <text x="380" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">Steps in at decision points — instructions in Chinese</text>

  <line x1="380" y1="246" x2="380" y2="278" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowD)"/>

  <rect x="100" y="280" width="560" height="96" rx="12" fill="#111827" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="380" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#f1f5f9">ARTEX controller</text>
  <text x="380" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">Go + Next.js — one console ran a 14-country campaign</text>

  <line x1="270" y1="376" x2="270" y2="408" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowD)"/>
  <line x1="490" y1="376" x2="490" y2="408" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowD)"/>

  <rect x="100" y="410" width="260" height="96" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="230" y="450" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600" fill="#f1f5f9">Planner agents</text>
  <text x="230" y="482" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#94a3b8">Choose the next moves</text>

  <rect x="400" y="410" width="260" height="96" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="530" y="450" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600" fill="#f1f5f9">Worker agents</text>
  <text x="530" y="482" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#94a3b8">Execute, in parallel</text>

  <line x1="270" y1="506" x2="270" y2="538" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowD)"/>
  <line x1="530" y1="506" x2="530" y2="538" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowD)"/>

  <rect x="100" y="540" width="560" height="96" rx="12" fill="#111827" stroke="#34d399" stroke-width="1.2"/>
  <text x="380" y="580" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#f1f5f9">Shared graph memory</text>
  <text x="380" y="612" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">Discovered assets and vulnerabilities accumulate live</text>

  <line x1="380" y1="636" x2="380" y2="668" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowD)"/>

  <!-- Workflow strip -->
  <rect x="100" y="670" width="560" height="130" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <text x="380" y="706" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#e2e8f0">The autonomous pipeline</text>
  <text x="380" y="740" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#94a3b8">reconnaissance → initial access → privilege escalation</text>
  <text x="380" y="772" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#94a3b8">→ credential theft → data exfiltration</text>

  <!-- Right: model layer -->
  <rect x="720" y="150" width="620" height="150" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="1030" y="192" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#f1f5f9">Model layer — deliberately swappable</text>
  <text x="1030" y="226" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">Ran mostly on DeepSeek plus an unidentified commercial LLM</text>
  <text x="1030" y="258" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">Works with any model · UI: English, Korean, Mandarin, Spanish, Japanese</text>

  <!-- Capabilities -->
  <rect x="720" y="330" width="620" height="330" rx="12" fill="#111827" stroke="#f87171" stroke-width="1.2"/>
  <text x="1030" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#f1f5f9">Documented capabilities in the wild</text>
  <text x="760" y="418" font-family="Inter, Arial, sans-serif" font-size="19" fill="#c9d4e3">· Network recon and vulnerability scanning</text>
  <text x="760" y="456" font-family="Inter, Arial, sans-serif" font-size="19" fill="#c9d4e3">· Password spraying at 2,900+ attempts per minute</text>
  <text x="760" y="494" font-family="Inter, Arial, sans-serif" font-size="19" fill="#c9d4e3">· OAuth application abuse across 2,250+ tenants</text>
  <text x="760" y="532" font-family="Inter, Arial, sans-serif" font-size="19" fill="#c9d4e3">· Web shell deployment and credential theft</text>
  <text x="760" y="570" font-family="Inter, Arial, sans-serif" font-size="19" fill="#c9d4e3">· Admin token forgery from leaked key material</text>
  <text x="760" y="608" font-family="Inter, Arial, sans-serif" font-size="19" fill="#c9d4e3">· Alternative path hunting when a route fails</text>
  <text x="760" y="644" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">CrowdStrike observed the operator instructing agents to skip hosts</text>
  <text x="760" y="670" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">running Falcon EDR and focus on unprotected machines</text>

  <!-- Origin -->
  <rect x="720" y="690" width="620" height="110" rx="12" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="1030" y="732" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0">Built by Chinese developers, released open source</text>
  <text x="1030" y="766" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">later made proprietary after abuse in Korean bank attacks</text>
</svg>
