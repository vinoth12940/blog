<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#131f36"/>
    </linearGradient>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="url(#heroGrad)"/>

  <text x="720" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">The ARTEX Campaign</text>
  <text x="720" y="104" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">One open-source agent framework, multiple threat groups, a month of machine-speed intrusions</text>

  <!-- Stat cards -->
  <rect x="100" y="150" width="290" height="130" rx="12" fill="#111827" stroke="#f87171" stroke-width="1.2"/>
  <text x="245" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#f87171">200+</text>
  <text x="245" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#94a3b8">organizations attacked</text>

  <rect x="420" y="150" width="290" height="130" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="565" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#a78bfa">14</text>
  <text x="565" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#94a3b8">countries in scope</text>

  <rect x="740" y="150" width="290" height="130" rx="12" fill="#111827" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="885" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#22d3ee">11 days</text>
  <text x="885" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#94a3b8">one ARTEX controller</text>

  <rect x="1060" y="150" width="290" height="130" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="1205" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#fbbf24">1.4B</text>
  <text x="1205" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#94a3b8">tokens in a single intrusion</text>

  <!-- Timeline -->
  <text x="120" y="352" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#f1f5f9">September – November 2026</text>
  <line x1="120" y1="470" x2="1320" y2="470" stroke="#475569" stroke-width="2"/>

  <!-- Milestone 1 (above) -->
  <circle cx="120" cy="470" r="10" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
  <text x="120" y="412" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#f1f5f9">Sept 2026</text>
  <text x="120" y="438" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">Storm-0940 starts ARTEX-driven ops</text>

  <!-- Milestone 2 (below) -->
  <circle cx="320" cy="470" r="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="320" y="514" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#f1f5f9">Oct 16</text>
  <text x="320" y="540" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">ConnectWise discloses breach</text>

  <!-- Milestone 3 (above) -->
  <circle cx="520" cy="470" r="10" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
  <text x="520" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#f1f5f9">Oct 17</text>
  <text x="520" y="438" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">Vapor Panda campaign begins</text>

  <!-- Milestone 4 (below) -->
  <circle cx="720" cy="470" r="10" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
  <text x="720" y="514" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#f1f5f9">Oct 21</text>
  <text x="720" y="540" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">Microsoft names ARTEX</text>

  <!-- Milestone 5 (above) -->
  <circle cx="920" cy="470" r="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="920" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#f1f5f9">Oct 26–31</text>
  <text x="920" y="438" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">Chainstack: dev to production</text>

  <!-- Milestone 6 (below) -->
  <circle cx="1120" cy="470" r="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="1120" y="514" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#f1f5f9">Oct 30</text>
  <text x="1120" y="540" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">WorkOS incident discovered</text>

  <!-- Milestone 7 (above) -->
  <circle cx="1320" cy="470" r="10" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
  <text x="1320" y="412" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#f1f5f9">Nov 2–3</text>
  <text x="1320" y="438" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">GitBook breach, disclosures land</text>

  <!-- Bottom band -->
  <rect x="100" y="620" width="1240" height="180" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="720" y="680" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600" fill="#f1f5f9">The same architecture you run every day — controller, planner, workers, shared memory</text>
  <text x="720" y="716" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">just pointed at someone else</text>
  <text x="720" y="766" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">Sources: Microsoft Threat Intelligence, CrowdStrike, DIVD, vendor disclosures</text>
</svg>
