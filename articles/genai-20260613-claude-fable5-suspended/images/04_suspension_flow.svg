<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How the suspension directive worked</title>
<style>
  :root {
    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-tertiary: #88877f;
    --bg-primary: #ffffff;
    --bg-secondary: #f6f5f0;
    --bg-tertiary: #eeedeb;
    --border: rgba(0,0,0,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary: #e8e6de;
      --text-secondary: #b4b2a9;
      --text-tertiary: #888780;
      --bg-primary: #1a1a18;
      --bg-secondary: #2c2c2a;
      --bg-tertiary: #3d3d3a;
      --border: rgba(255,255,255,0.15);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui,-apple-system,sans-serif; background: var(--bg-tertiary); display: flex; justify-content: center; padding: 40px 20px; }
  .card { background: var(--bg-primary); border-radius: 16px; padding: 32px; max-width: 780px; width: 100%; }
  h1 { font-size: 18px; font-weight: 500; color: var(--text-primary); margin-bottom: 8px; }
  .subtitle { font-size: 13px; color: var(--text-tertiary); margin-bottom: 24px; }
  svg { width: 100%; height: auto; }
  .t  { font-family: system-ui,-apple-system,sans-serif; font-size: 14px; fill: var(--text-primary); }
  .ts { font-family: system-ui,-apple-system,sans-serif; font-size: 12px; fill: var(--text-secondary); }
  .th { font-family: system-ui,-apple-system,sans-serif; font-size: 14px; fill: var(--text-primary); font-weight: 500; }
  .arr { stroke: var(--text-secondary); stroke-width: 1.5px; fill: none; }
  .node { cursor: pointer; transition: opacity 0.15s; }
  .node:hover { opacity: 0.82; }
  .c-gray > rect   { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray > .th    { fill: #444441; }
  .c-gray > .ts    { fill: #5F5E5A; }
  .c-amber > rect  { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber > .th   { fill: #633806; }
  .c-amber > .ts   { fill: #854F0B; }
  .c-red > rect    { fill: #FCEBEB; stroke: #A32D2D; }
  .c-red > .th     { fill: #791F1F; }
  .c-red > .ts     { fill: #A32D2D; }
  .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple > .th  { fill: #3C3489; }
  .c-purple > .ts  { fill: #534AB7; }
  .c-teal > rect   { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal > .th    { fill: #085041; }
  .c-teal > .ts    { fill: #0F6E56; }
  @media (prefers-color-scheme: dark) {
    .c-gray > rect   { fill: #444441; stroke: #B4B2A9; }
    .c-gray > .th    { fill: #D3D1C7; }
    .c-gray > .ts    { fill: #B4B2A9; }
    .c-amber > rect  { fill: #633806; stroke: #EF9F27; }
    .c-amber > .th   { fill: #FAC775; }
    .c-amber > .ts   { fill: #EF9F27; }
    .c-red > rect    { fill: #791F1F; stroke: #F09595; }
    .c-red > .th     { fill: #F7C1C1; }
    .c-red > .ts     { fill: #F09595; }
    .c-purple > rect { fill: #3C3489; stroke: #AFA9EC; }
    .c-purple > .th  { fill: #CECBF6; }
    .c-purple > .ts  { fill: #AFA9EC; }
    .c-teal > rect   { fill: #085041; stroke: #5DCAA5; }
    .c-teal > .th    { fill: #9FE1CB; }
    .c-teal > .ts    { fill: #5DCAA5; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>How the government directive unfolded</h1>
  <p class="subtitle">From Anthropic's awareness notice to global access cutoff · June 12, 2026</p>
<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g class="node c-gray">
    <rect x="44" y="40" width="592" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">US government cites jailbreak technique for cybersecurity misuse</text>
  </g>

  <line x1="340" y1="84" x2="340" y2="108" class="arr" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g class="node c-amber">
    <rect x="44" y="108" width="592" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="129" text-anchor="middle" dominant-baseline="central">Export control directive issued at 5:21 pm ET, June 12</text>
    <text class="ts" x="340" y="149" text-anchor="middle" dominant-baseline="central">Instructs suspension for all foreign nationals — inside or outside the US</text>
  </g>

  <line x1="340" y1="164" x2="340" y2="188" class="arr" marker-end="url(#arrow)"/>

  <!-- Decision fork -->
  <!-- Left fork: Anthropic disputes -->
  <line x1="220" y1="188" x2="160" y2="220" class="arr" marker-end="url(#arrow)" stroke="#854F0B"/>
  <g class="node c-amber">
    <rect x="44" y="220" width="232" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="160" y="241" text-anchor="middle" dominant-baseline="central">Anthropic files objection</text>
    <text class="ts" x="160" y="261" text-anchor="middle" dominant-baseline="central">"Misunderstanding" · working to restore</text>
  </g>

  <!-- Right fork: models go dark -->
  <line x1="460" y1="188" x2="520" y2="220" class="arr" marker-end="url(#arrow)" stroke="#A32D2D"/>
  <g class="node c-red">
    <rect x="404" y="220" width="232" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="520" y="241" text-anchor="middle" dominant-baseline="central">Fable 5 &amp; Mythos 5 offline</text>
    <text class="ts" x="520" y="261" text-anchor="middle" dominant-baseline="central">All users globally · no timeline given</text>
  </g>

  <!-- Connector box: what remains available -->
  <line x1="340" y1="188" x2="340" y2="212" class="arr" stroke="var(--text-secondary)"/>
  <text class="ts" x="348" y="200" dominant-baseline="central">complied</text>

  <!-- Bottom: what stays up -->
  <g class="node c-teal">
    <rect x="44" y="292" width="592" height="20" rx="8" stroke-width="0.5"/>
    <text class="ts" x="340" y="302" text-anchor="middle" dominant-baseline="central">All other Claude models remain active · Mythos 5 still available to vetted cyber defenders via Project Glasswing</text>
  </g>

</svg>
</div>
</body>
</html>
