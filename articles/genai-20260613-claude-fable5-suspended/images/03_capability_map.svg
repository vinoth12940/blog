<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fable 5 capability map</title>
<style>
  :root {
    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-tertiary: #88877f;
    --bg-primary: #ffffff;
    --bg-secondary: #f6f5f0;
    --bg-tertiary: #eeedeb;
    --border: rgba(0,0,0,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary: #e8e6de;
      --text-secondary: #b4b2a9;
      --text-tertiary: #888780;
      --bg-primary: #1a1a18;
      --bg-secondary: #2c2c2a;
      --bg-tertiary: #3d3d3a;
      --border: rgba(255,255,255,0.15);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui,-apple-system,sans-serif; background: var(--bg-tertiary); display: flex; justify-content: center; padding: 40px 20px; }
  .card { background: var(--bg-primary); border-radius: 16px; padding: 32px; max-width: 780px; width: 100%; }
  h1 { font-size: 18px; font-weight: 500; color: var(--text-primary); margin-bottom: 8px; }
  .subtitle { font-size: 13px; color: var(--text-tertiary); margin-bottom: 24px; }
  svg { width: 100%; height: auto; }
  .t  { font-family: system-ui,-apple-system,sans-serif; font-size: 14px; fill: var(--text-primary); }
  .ts { font-family: system-ui,-apple-system,sans-serif; font-size: 12px; fill: var(--text-secondary); }
  .th { font-family: system-ui,-apple-system,sans-serif; font-size: 14px; fill: var(--text-primary); font-weight: 500; }
  .arr { stroke: var(--text-secondary); stroke-width: 1.5px; fill: none; }
  .node { cursor: pointer; transition: opacity 0.15s; }
  .node:hover { opacity: 0.82; }
  .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple > .th { fill: #3C3489; }
  .c-purple > .ts { fill: #534AB7; }
  .c-teal > rect   { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal > .th    { fill: #085041; }
  .c-teal > .ts    { fill: #0F6E56; }
  .c-amber > rect  { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber > .th   { fill: #633806; }
  .c-amber > .ts   { fill: #854F0B; }
  .c-coral > rect  { fill: #FAECE7; stroke: #993C1D; }
  .c-coral > .th   { fill: #712B13; }
  .c-coral > .ts   { fill: #993C1D; }
  .c-blue > rect   { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue > .th    { fill: #0C447C; }
  .c-blue > .ts    { fill: #185FA5; }
  .c-gray > rect   { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray > .th    { fill: #444441; }
  .c-gray > .ts    { fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .c-purple > rect { fill: #3C3489; stroke: #AFA9EC; }
    .c-purple > .th { fill: #CECBF6; }
    .c-purple > .ts { fill: #AFA9EC; }
    .c-teal > rect   { fill: #085041; stroke: #5DCAA5; }
    .c-teal > .th    { fill: #9FE1CB; }
    .c-teal > .ts    { fill: #5DCAA5; }
    .c-amber > rect  { fill: #633806; stroke: #EF9F27; }
    .c-amber > .th   { fill: #FAC775; }
    .c-amber > .ts   { fill: #EF9F27; }
    .c-coral > rect  { fill: #712B13; stroke: #F0997B; }
    .c-coral > .th   { fill: #F5C4B3; }
    .c-coral > .ts   { fill: #F0997B; }
    .c-blue > rect   { fill: #0C447C; stroke: #85B7EB; }
    .c-blue > .th    { fill: #B5D4F4; }
    .c-blue > .ts    { fill: #85B7EB; }
    .c-gray > rect   { fill: #444441; stroke: #B4B2A9; }
    .c-gray > .th    { fill: #D3D1C7; }
    .c-gray > .ts    { fill: #B4B2A9; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>What Fable 5 can do — and what got it suspended</h1>
  <p class="subtitle">Hub-spoke capability map · capabilities in amber triggered the government directive</p>
<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Center hub -->
  <g class="node c-purple">
    <rect x="255" y="168" width="170" height="56" rx="12" stroke-width="0.5"/>
    <text class="th" x="340" y="190" text-anchor="middle" dominant-baseline="central">Claude Fable 5</text>
    <text class="ts" x="340" y="210" text-anchor="middle" dominant-baseline="central">Mythos-class · 1M token context</text>
  </g>

  <!-- Spoke: Software engineering (top-left) -->
  <line x1="287" y1="168" x2="212" y2="114" class="arr" marker-end="url(#arrow)"/>
  <g class="node c-teal">
    <rect x="44" y="80" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="144" y="101" text-anchor="middle" dominant-baseline="central">Software engineering</text>
    <text class="ts" x="144" y="121" text-anchor="middle" dominant-baseline="central">80.3% SWE-Bench · 50M-line migration</text>
  </g>

  <!-- Spoke: Vision (top-right) -->
  <line x1="393" y1="168" x2="468" y2="114" class="arr" marker-end="url(#arrow)"/>
  <g class="node c-teal">
    <rect x="436" y="80" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="536" y="101" text-anchor="middle" dominant-baseline="central">Vision reasoning</text>
    <text class="ts" x="536" y="121" text-anchor="middle" dominant-baseline="central">App rebuild from screenshots · Pokémon FireRed</text>
  </g>

  <!-- Spoke: Knowledge work (left) -->
  <line x1="255" y1="196" x2="212" y2="196" class="arr" marker-end="url(#arrow)"/>
  <g class="node c-blue">
    <rect x="44" y="174" width="168" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="128" y="196" text-anchor="middle" dominant-baseline="central">Finance &amp; knowledge work</text>
  </g>

  <!-- Spoke: Life sciences (right) -->
  <line x1="425" y1="196" x2="468" y2="196" class="arr" marker-end="url(#arrow)"/>
  <g class="node c-blue">
    <rect x="436" y="174" width="200" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="536" y="196" text-anchor="middle" dominant-baseline="central">Life sciences &amp; novel hypotheses</text>
  </g>

  <!-- Spoke: Long-horizon memory (bottom-left) — safe -->
  <line x1="287" y1="224" x2="212" y2="282" class="arr" marker-end="url(#arrow)"/>
  <g class="node c-teal">
    <rect x="44" y="258" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="144" y="279" text-anchor="middle" dominant-baseline="central">Long-horizon memory</text>
    <text class="ts" x="144" y="299" text-anchor="middle" dominant-baseline="central">Persistent notes · millions of tokens</text>
  </g>

  <!-- Spoke: Cybersecurity (bottom-right) — FLAGGED -->
  <line x1="393" y1="224" x2="468" y2="282" class="arr" marker-end="url(#arrow)"/>
  <g class="node c-amber">
    <rect x="436" y="258" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="536" y="279" text-anchor="middle" dominant-baseline="central">⚠ Cybersecurity</text>
    <text class="ts" x="536" y="299" text-anchor="middle" dominant-baseline="central">N-day → exploit in hours · flagged by US govt</text>
  </g>

  <!-- Legend -->
  <rect x="44" y="348" width="12" height="12" rx="2" fill="#0F6E56" opacity="0.7"/>
  <text class="ts" x="62" y="354" dominant-baseline="central">Approved capability</text>
  <rect x="220" y="348" width="12" height="12" rx="2" fill="#854F0B" opacity="0.8"/>
  <text class="ts" x="238" y="354" dominant-baseline="central">Triggered suspension</text>

</svg>
</div>
</body>
</html>
