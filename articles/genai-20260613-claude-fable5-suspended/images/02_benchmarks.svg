<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWE-Bench Pro comparison</title>
<style>
  :root {
    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-tertiary: #88877f;
    --bg-primary: #ffffff;
    --bg-secondary: #f6f5f0;
    --bg-tertiary: #eeedeb;
    --border: rgba(0,0,0,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary: #e8e6de;
      --text-secondary: #b4b2a9;
      --text-tertiary: #888780;
      --bg-primary: #1a1a18;
      --bg-secondary: #2c2c2a;
      --bg-tertiary: #3d3d3a;
      --border: rgba(255,255,255,0.15);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-tertiary); display: flex; justify-content: center; padding: 40px 20px; }
  .card { background: var(--bg-primary); border-radius: 16px; padding: 32px; max-width: 780px; width: 100%; }
  h1 { font-size: 18px; font-weight: 500; color: var(--text-primary); margin-bottom: 8px; }
  .subtitle { font-size: 13px; color: var(--text-tertiary); margin-bottom: 24px; }
  svg { width: 100%; height: auto; }
  .t  { font-family: system-ui,-apple-system,sans-serif; font-size: 14px; fill: var(--text-primary); }
  .ts { font-family: system-ui,-apple-system,sans-serif; font-size: 12px; fill: var(--text-secondary); }
  .th { font-family: system-ui,-apple-system,sans-serif; font-size: 14px; fill: var(--text-primary); font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <h1>SWE-Bench Pro agentic coding leaderboard</h1>
  <p class="subtitle">Pass rate % — higher is better · Source: Anthropic, independent testing (June 9, 2026)</p>
<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Axis line -->
  <line x1="200" y1="240" x2="640" y2="240" stroke="var(--border)" stroke-width="1"/>

  <!-- Grid lines at 20%, 40%, 60%, 80% -->
  <!-- 20% = 200 + 0.20*440 = 288 -->
  <!-- 40% = 200 + 0.40*440 = 376 -->
  <!-- 60% = 200 + 0.60*440 = 464 -->
  <!-- 80% = 200 + 0.80*440 = 552 -->
  <line x1="288" y1="50" x2="288" y2="240" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="376" y1="50" x2="376" y2="240" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="464" y1="50" x2="464" y2="240" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="552" y1="50" x2="552" y2="240" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3 4"/>
  <text class="ts" x="288" y="255" text-anchor="middle" dominant-baseline="central">20%</text>
  <text class="ts" x="376" y="255" text-anchor="middle" dominant-baseline="central">40%</text>
  <text class="ts" x="464" y="255" text-anchor="middle" dominant-baseline="central">60%</text>
  <text class="ts" x="552" y="255" text-anchor="middle" dominant-baseline="central">80%</text>
  <text class="ts" x="640" y="255" text-anchor="middle" dominant-baseline="central">100%</text>

  <!-- Bars — x scale: 200 + (pct/100)*440 -->

  <!-- Fable 5 = 80.3% → 200 + 0.803*440 = 553.3 -->
  <rect x="200" y="58" width="353" height="32" rx="4" fill="#0F6E56" opacity="0.9"/>
  <text class="th" x="192" y="74" text-anchor="end" dominant-baseline="central">Fable 5</text>
  <text class="ts" x="561" y="74" text-anchor="start" dominant-baseline="central">80.3%</text>

  <!-- Mythos Preview = 77.8% → 200 + 0.778*440 = 542.3 -->
  <rect x="200" y="102" width="342" height="32" rx="4" fill="#1D9E75" opacity="0.7"/>
  <text class="th" x="192" y="118" text-anchor="end" dominant-baseline="central">Mythos preview</text>
  <text class="ts" x="550" y="118" text-anchor="start" dominant-baseline="central">77.8%</text>

  <!-- Opus 4.8 = 69.2% → 200 + 0.692*440 = 504.5 -->
  <rect x="200" y="146" width="304" height="32" rx="4" fill="#5DCAA5" opacity="0.6"/>
  <text class="th" x="192" y="162" text-anchor="end" dominant-baseline="central">Opus 4.8</text>
  <text class="ts" x="512" y="162" text-anchor="start" dominant-baseline="central">69.2%</text>

  <!-- GPT-5.5 = 58.6% → 200 + 0.586*440 = 457.8 -->
  <rect x="200" y="190" width="258" height="32" rx="4" fill="#378ADD" opacity="0.6"/>
  <text class="th" x="192" y="206" text-anchor="end" dominant-baseline="central">GPT-5.5</text>
  <text class="ts" x="466" y="206" text-anchor="start" dominant-baseline="central">58.6%</text>

</svg>
</div>
</body>
</html>
