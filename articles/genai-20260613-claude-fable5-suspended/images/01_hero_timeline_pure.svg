<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Timeline spine -->
  <line x1="340" y1="56" x2="340" y2="304" class="arr" stroke-dasharray="none"/>

  <!-- Day label track -->
  <text class="ts" x="340" y="44" text-anchor="middle" dominant-baseline="central">June 2026</text>

  <!-- === EVENT 1: June 9 — Launch === -->
  <!-- Date marker -->
  <circle cx="340" cy="88" r="7" fill="#3B6D11" stroke="none"/>
  <text class="ts" x="340" y="72" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">Jun 9</text>
  <!-- Left card -->
  <g class="node c-green">
    <rect x="44" y="64" width="256" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="172" y="86" text-anchor="middle" dominant-baseline="central">Fable 5 launches publicly</text>
    <text class="ts" x="172" y="106" text-anchor="middle" dominant-baseline="central">First Mythos-class model · $10/$50 per 1M tokens</text>
  </g>
  <line x1="300" y1="92" x2="333" y2="92" class="arr" marker-end="url(#arrow)"/>

  <!-- === EVENT 2: June 9 — Benchmarks === -->
  <circle cx="340" cy="156" r="7" fill="#854F0B" stroke="none"/>
  <text class="ts" x="340" y="140" text-anchor="middle" dominant-baseline="central">Same day</text>
  <!-- Right card -->
  <g class="node c-amber">
    <rect x="380" y="132" width="256" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="508" y="154" text-anchor="middle" dominant-baseline="central">80.3% on SWE-Bench Pro</text>
    <text class="ts" x="508" y="174" text-anchor="middle" dominant-baseline="central">Stripe: 50M-line migration in 1 day vs 2+ months</text>
  </g>
  <line x1="347" y1="160" x2="377" y2="160" class="arr" marker-end="url(#arrow)"/>

  <!-- === EVENT 3: June 10-11 — Red team alert === -->
  <circle cx="340" cy="224" r="7" fill="#854F0B" stroke="none"/>
  <text class="ts" x="340" y="208" text-anchor="middle" dominant-baseline="central">Jun 10–11</text>
  <!-- Left card -->
  <g class="node c-amber">
    <rect x="44" y="200" width="256" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="172" y="222" text-anchor="middle" dominant-baseline="central">Jailbreak technique reported</text>
    <text class="ts" x="172" y="242" text-anchor="middle" dominant-baseline="central">US government cites national security concern</text>
  </g>
  <line x1="300" y1="228" x2="333" y2="228" class="arr" marker-end="url(#arrow)"/>

  <!-- === EVENT 4: June 12 — Suspension === -->
  <circle cx="340" cy="292" r="7" fill="#A32D2D" stroke="none"/>
  <text class="ts" x="340" y="276" text-anchor="middle" dominant-baseline="central">Jun 12, 5:21 pm ET</text>
  <!-- Right card -->
  <g class="node c-red">
    <rect x="380" y="268" width="256" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="508" y="290" text-anchor="middle" dominant-baseline="central">Access suspended — all users</text>
    <text class="ts" x="508" y="310" text-anchor="middle" dominant-baseline="central">Export control directive · models offline globally</text>
  </g>
  <line x1="347" y1="296" x2="377" y2="296" class="arr" marker-end="url(#arrow)"/>

</svg>