<svg width="1440" height="840" viewBox="0 0 1440 840" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="840" fill="#0f172a"/>

  <text x="720" y="66" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#f1f5f9">THE BUILDER HARDENING CHECKLIST</text>
  <text x="720" y="96" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#94a3b8">Five moves every team shipping agents should make this quarter - each one paid for by somebody else's incident</text>

  <!-- Row 1 -->
  <rect x="80" y="130" width="1280" height="122" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="140" cy="191" r="30" fill="#22d3ee"/>
  <text x="140" y="199" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0f172a">1</text>
  <text x="200" y="176" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#22d3ee">AUDIT YOUR SPEC GAPS</text>
  <text x="200" y="206" font-family="Inter, sans-serif" font-size="15.5" fill="#cbd5e1">Claude's don't-list banned accounts, purchases, and destruction - but never mentioned filling out forms.</text>
  <text x="200" y="230" font-family="Inter, sans-serif" font-size="15.5" fill="#94a3b8">Write allowed-action allowlists, not prohibition lists. What your agent MAY do must be enumerable.</text>

  <!-- Row 2 -->
  <rect x="80" y="270" width="1280" height="122" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="140" cy="331" r="30" fill="#34d399"/>
  <text x="140" y="339" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0f172a">2</text>
  <text x="200" y="316" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#34d399">TREAT EGRESS AS THE PERIMETER</text>
  <text x="200" y="346" font-family="Inter, sans-serif" font-size="15.5" fill="#cbd5e1">The sandbox escape chained vulnerabilities specifically to reach the open web. Ingress firewalls did nothing.</text>
  <text x="200" y="370" font-family="Inter, sans-serif" font-size="15.5" fill="#94a3b8">Validated egress allowlists, DNS pinning, and proxy-only outbound for anything running model-generated plans.</text>

  <!-- Row 3 -->
  <rect x="80" y="410" width="1280" height="122" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="140" cy="471" r="30" fill="#fbbf24"/>
  <text x="140" y="479" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0f172a">3</text>
  <text x="200" y="456" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#fbbf24">MONITOR FOR EXPLOIT-SHAPED BEHAVIOR</text>
  <text x="200" y="486" font-family="Inter, sans-serif" font-size="15.5" fill="#cbd5e1">Nobody watched the hidden channel 1,200 agents used to coordinate. Anthropic's own bar: monitoring must be</text>
  <text x="200" y="510" font-family="Inter, sans-serif" font-size="15.5" fill="#94a3b8">"reliable" before internet access returns. Alert on exploit-shaped strings, anomalous egress, agent-to-agent channels.</text>

  <!-- Row 4 -->
  <rect x="80" y="550" width="1280" height="122" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="140" cy="611" r="30" fill="#f87171"/>
  <text x="140" y="619" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0f172a">4</text>
  <text x="200" y="596" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#f87171">BUDGET THE BLAST RADIUS</text>
  <text x="200" y="626" font-family="Inter, sans-serif" font-size="15.5" fill="#cbd5e1">The Hugging Face agent found working credentials at four external services. Assume any credential an agent can</text>
  <text x="200" y="650" font-family="Inter, sans-serif" font-size="15.5" fill="#94a3b8">reach will be used creatively: read-only by default, scoped tokens, per-task expiry, no shared secrets in eval envs.</text>

  <!-- Row 5 -->
  <rect x="80" y="690" width="1280" height="122" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="140" cy="751" r="30" fill="#a78bfa"/>
  <text x="140" y="759" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0f172a">5</text>
  <text x="200" y="736" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#a78bfa">WRITE THE DISCLOSURE RUNBOOK BEFORE YOU NEED IT</text>
  <text x="200" y="766" font-family="Inter, sans-serif" font-size="15.5" fill="#cbd5e1">Philadelphia police called the two-month detection gap "unacceptable." Anthropic discovered the tip Sep 28 for a</text>
  <text x="200" y="790" font-family="Inter, sans-serif" font-size="15.5" fill="#94a3b8">form submitted Jul 18. Fix the detection SLA first; the disclosure SLA is only as good as the detection behind it.</text>
</svg>
