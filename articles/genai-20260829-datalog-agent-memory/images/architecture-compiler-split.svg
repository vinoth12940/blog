<svg width="1440" height="850" viewBox="0 0 1440 850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="850" fill="#0f172a"/>
  <text x="60" y="88" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#e5e7eb">The compiler split: probabilistic in, deterministic out</text>
  <text x="60" y="128" font-family="Inter, -apple-system, sans-serif" font-size="22" fill="#94a3b8">The LLM parses messy reality into facts ONCE. The database maintains every consequence after that.</text>

  <!-- Messy inputs -->
  <rect x="60" y="200" width="280" height="240" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="85" y="244" font-family="Inter, -apple-system, sans-serif" font-size="21" font-weight="600" fill="#94a3b8">Messy inputs</text>
  <text x="85" y="286" font-family="'JetBrains Mono', monospace" font-size="17" fill="#c9c9c9">&#183; source code</text>
  <text x="85" y="318" font-family="'JetBrains Mono', monospace" font-size="17" fill="#c9c9c9">&#183; debugger output</text>
  <text x="85" y="350" font-family="'JetBrains Mono', monospace" font-size="17" fill="#c9c9c9">&#183; natural-language notes</text>
  <text x="85" y="382" font-family="'JetBrains Mono', monospace" font-size="17" fill="#c9c9c9">&#183; tool results</text>

  <line x1="340" y1="320" x2="390" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LLM front-end -->
  <rect x="395" y="200" width="300" height="240" rx="16" fill="#1e1b34" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="420" y="244" font-family="Inter, -apple-system, sans-serif" font-size="21" font-weight="600" fill="#c4b5fd">LLM front-end</text>
  <text x="420" y="274" font-family="'JetBrains Mono', monospace" font-size="16" fill="#c4b5fd">(probabilistic parser)</text>
  <text x="420" y="316" font-family="'JetBrains Mono', monospace" font-size="16" fill="#ddd6fe">"freed object is reused</text>
  <text x="420" y="344" font-family="'JetBrains Mono', monospace" font-size="16" fill="#ddd6fe">as the write target"</text>
  <text x="420" y="382" font-family="'JetBrains Mono', monospace" font-size="16" fill="#a78bfa">&#8594; extracts ONCE, cached</text>

  <line x1="695" y1="320" x2="745" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Facts -->
  <rect x="750" y="200" width="270" height="240" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="775" y="244" font-family="Inter, -apple-system, sans-serif" font-size="21" font-weight="600" fill="#94a3b8">Structured facts</text>
  <text x="775" y="288" font-family="'JetBrains Mono', monospace" font-size="16" fill="#6ee7b7">controls(attacker, obj_a)</text>
  <text x="775" y="320" font-family="'JetBrains Mono', monospace" font-size="16" fill="#6ee7b7">points_to(obj_a, obj_b)</text>
  <text x="775" y="352" font-family="'JetBrains Mono', monospace" font-size="16" fill="#6ee7b7">kernel_object(obj_b)</text>
  <text x="775" y="398" font-family="'JetBrains Mono', monospace" font-size="15" fill="#9ca3af">+ validity intervals [t1, t2)</text>

  <line x1="1020" y1="320" x2="1070" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Lemmalog engine -->
  <rect x="1075" y="200" width="305" height="240" rx="16" fill="#0d2a26" stroke="#34d399" stroke-width="2"/>
  <text x="1100" y="244" font-family="Inter, -apple-system, sans-serif" font-size="21" font-weight="600" fill="#6ee7b7">Lemmalog engine</text>
  <text x="1100" y="274" font-family="'JetBrains Mono', monospace" font-size="16" fill="#6ee7b7">stratified Datalog rules</text>
  <text x="1100" y="306" font-family="'JetBrains Mono', monospace" font-size="16" fill="#6ee7b7">&#8594; fixed point</text>
  <text x="1100" y="344" font-family="'JetBrains Mono', monospace" font-size="16" fill="#d1fae5">incremental retraction</text>
  <text x="1100" y="376" font-family="'JetBrains Mono', monospace" font-size="16" fill="#d1fae5">provenance tracking</text>
  <text x="1100" y="408" font-family="'JetBrains Mono', monospace" font-size="16" fill="#d1fae5">auto-invalidation</text>

  <!-- Query paths -->
  <line x1="1227" y1="440" x2="1227" y2="510" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="690" y="515" width="690" height="110" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="720" y="551" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#94a3b8">Access paths</text>
  <text x="720" y="584" font-family="'JetBrains Mono', monospace" font-size="17" fill="#c9c9c9">demand-driven queries &#183; MCP server for agents</text>
  <text x="720" y="612" font-family="'JetBrains Mono', monospace" font-size="17" fill="#c9c9c9">hybrid retrieval: BM25 + graph + embeddings</text>

  <line x1="690" y1="570" x2="640" y2="570" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Back-end LLM -->
  <rect x="310" y="515" width="325" height="110" rx="16" fill="#1e1b34" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="335" y="557" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#c4b5fd">LLM back-end</text>
  <text x="335" y="595" font-family="'JetBrains Mono', monospace" font-size="16" fill="#ddd6fe">maintained state &#8594; answers &#183; next step &#183; actions</text>

  <!-- Bottom note -->
  <rect x="60" y="680" width="1320" height="120" rx="16" fill="#0f1729" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="730" font-family="Inter, -apple-system, sans-serif" font-size="23" font-weight="600" fill="#93c5fd">The amusing part: the parser is probabilistic &#8212; everything after it doesn&#8217;t have to be.</text>
  <text x="90" y="768" font-family="'JetBrains Mono', monospace" font-size="18" fill="#9ca3af">If a conclusion exists in the database, it has provenance. No provenance = not maintained state.</text>
</svg>
