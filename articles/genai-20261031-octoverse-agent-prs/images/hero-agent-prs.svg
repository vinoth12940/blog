<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#16243d"/>
    </linearGradient>
    <marker id="arrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="800" fill="url(#heroGrad)"/>

  <text x="720" y="70" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#f1f5f9">The Agent Takeover of the Pull Request</text>
  <text x="720" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#94a3b8">Share of GitHub pull requests that start with an agent's first draft · GitHub Octoverse 2026</text>

  <!-- Left: the big number -->
  <text x="360" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="150" font-weight="800" fill="#22d3ee">40%+</text>
  <text x="360" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0">of all pull requests on GitHub</text>
  <text x="360" y="428" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0">started with an agent's first draft</text>
  <rect x="250" y="456" width="220" height="44" rx="22" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1"/>
  <text x="360" y="483" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#22d3ee">September 2026</text>

  <!-- Right: trajectory bars -->
  <text x="1010" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600" fill="#cbd5e1">Six months from novelty to near-half</text>

  <!-- March bar: 17% -->
  <rect x="760" y="479" width="170" height="119" rx="8" fill="rgba(100,116,139,0.35)" stroke="#64748b" stroke-width="1"/>
  <text x="845" y="462" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#94a3b8">17%</text>
  <text x="845" y="628" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">March 2026</text>

  <!-- arrow -->
  <line x1="945" y1="500" x2="1010" y2="500" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowC)"/>

  <!-- September bar: 40% -->
  <rect x="1040" y="318" width="170" height="280" rx="8" fill="rgba(34,211,238,0.18)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1125" y="300" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#22d3ee">40%+</text>
  <text x="1125" y="628" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">September 2026</text>

  <text x="1010" y="668" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#94a3b8">Share up 2.4x in six months · agent PR volume up roughly 6x</text>

  <!-- Bottom chips -->
  <rect x="110" y="690" width="380" height="62" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="300" y="728" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">~110M pull requests opened in September</text>

  <rect x="530" y="690" width="380" height="62" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="720" y="728" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">1.3B pull requests merged this year</text>

  <rect x="950" y="690" width="380" height="62" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="1140" y="728" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">An average of 3.5M merges per day</text>

  <text x="720" y="786" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">Source: GitHub Octoverse 2026, presented at GitHub Universe, October 28, 2026</text>
</svg>
