<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="710" viewBox="0 0 1440 710">
  <defs>
    <linearGradient id="cmpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#131f36"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="710" fill="url(#cmpGrad)"/>

  <text x="720" y="66" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#f1f5f9">Agent PRs vs Traditional PRs</text>
  <text x="720" y="102" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">Pull requests that start with an agent's draft clear review at least as well as human-only ones</text>

  <!-- Legend -->
  <rect x="1000" y="130" width="20" height="20" rx="4" fill="rgba(34,211,238,0.25)" stroke="#22d3ee" stroke-width="1"/>
  <text x="1030" y="146" font-family="Inter, Arial, sans-serif" font-size="19" fill="#cbd5e1">Agent-drafted PRs</text>
  <rect x="1210" y="130" width="20" height="20" rx="4" fill="rgba(100,116,139,0.35)" stroke="#64748b" stroke-width="1"/>
  <text x="1240" y="146" font-family="Inter, Arial, sans-serif" font-size="19" fill="#cbd5e1">Traditional</text>

  <!-- Group 1: multi-file changes -->
  <text x="100" y="222" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" fill="#e2e8f0">Changed multiple files</text>
  <rect x="100" y="240" width="713" height="54" rx="8" fill="rgba(34,211,238,0.18)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="788" y="274" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#22d3ee">87%</text>
  <rect x="100" y="306" width="648" height="54" rx="8" fill="rgba(100,116,139,0.30)" stroke="#64748b" stroke-width="1"/>
  <text x="723" y="340" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#cbd5e1">79%</text>

  <!-- Group 2: merged within 2 weeks -->
  <text x="100" y="432" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" fill="#e2e8f0">Merged within two weeks</text>
  <rect x="100" y="450" width="738" height="54" rx="8" fill="rgba(34,211,238,0.18)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="813" y="484" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#22d3ee">90%</text>
  <rect x="100" y="516" width="705" height="54" rx="8" fill="rgba(100,116,139,0.30)" stroke="#64748b" stroke-width="1"/>
  <text x="780" y="550" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#cbd5e1">86%</text>

  <!-- Annotation -->
  <rect x="880" y="240" width="460" height="330" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="920" y="290" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">What this says</text>
  <text x="920" y="336" font-family="Inter, Arial, sans-serif" font-size="19" fill="#94a3b8">Agents are not landing typo</text>
  <text x="920" y="364" font-family="Inter, Arial, sans-serif" font-size="19" fill="#94a3b8">drive-bys. They take whole</text>
  <text x="920" y="392" font-family="Inter, Arial, sans-serif" font-size="19" fill="#94a3b8">tickets, touch more files,</text>
  <text x="920" y="420" font-family="Inter, Arial, sans-serif" font-size="19" fill="#94a3b8">and still merge faster than</text>
  <text x="920" y="448" font-family="Inter, Arial, sans-serif" font-size="19" fill="#94a3b8">traditional pull requests.</text>
  <line x1="920" y1="474" x2="1300" y2="474" stroke="#1f2937" stroke-width="1"/>
  <text x="920" y="510" font-family="Inter, Arial, sans-serif" font-size="18" font-style="italic" fill="#94a3b8">Caveat: teams that enable agents</text>
  <text x="920" y="536" font-family="Inter, Arial, sans-serif" font-size="18" font-style="italic" fill="#94a3b8">also design smaller, better-</text>
  <text x="920" y="562" font-family="Inter, Arial, sans-serif" font-size="18" font-style="italic" fill="#94a3b8">scoped work — selection bias is real.</text>

  <text x="720" y="668" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">Bars drawn to scale · As of September 2026 · Source: GitHub Octoverse 2026</text>
</svg>
