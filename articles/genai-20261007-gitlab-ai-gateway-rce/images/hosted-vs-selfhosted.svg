<svg width="1440" height="810" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="675" fill="#0f172a"/>

  <text x="600" y="48" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">Same vulnerability, two very different customers</text>
  <text x="600" y="76" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#94a3b8">The hybrid AI deployment model decides who has to scramble when a 9.9 lands</text>

  <!-- left: gitlab-hosted -->
  <rect x="60" y="108" width="520" height="360" rx="16" fill="#1e1e2e" stroke="#34d399" stroke-width="1.4"/>
  <text x="320" y="146" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#34d399">GitLab-hosted AI Gateway</text>
  <text x="320" y="170" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">GitLab.com · Dedicated · Self-Managed on hosted gateway</text>
  <rect x="90" y="192" width="460" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="320" y="222" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">gateway runs in GitLab's cloud</text>
  <rect x="90" y="252" width="460" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="320" y="282" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">"A fix has already been deployed" — before disclosure</text>
  <rect x="90" y="312" width="460" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="320" y="342" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">targeted outreach to affected customers first</text>
  <rect x="90" y="372" width="460" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="320" y="402" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#34d399">customer action required: none</text>
  <text x="320" y="448" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#64748b">the managed trade: they hold the keys, they hold the pager</text>

  <!-- right: self-hosted -->
  <rect x="620" y="108" width="520" height="360" rx="16" fill="#1e1e2e" stroke="#f87171" stroke-width="1.4"/>
  <text x="880" y="146" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#f87171">Self-hosted AI Gateway (Duo Self-Hosted)</text>
  <text x="880" y="170" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">air-gapped, regulated, or data-residency-constrained installs</text>
  <rect x="650" y="192" width="460" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="880" y="222" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">gateway runs on YOUR infrastructure</text>
  <rect x="650" y="252" width="460" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="880" y="282" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">impacted: 18.1.6 → 19.2.4, 19.3.x before 19.3.2, 19.4.x before 19.4.1</text>
  <rect x="650" y="312" width="460" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="880" y="342" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">"update immediately" — patch, restart, verify, document</text>
  <rect x="650" y="372" width="460" height="48" rx="8" fill="#0f172a" stroke="#f87171" stroke-width="1.2"/>
  <text x="880" y="402" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#f87171">customer action required: patch now, it's your shell</text>
  <text x="880" y="448" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#64748b">the self-hosting trade: you hold the keys, you hold the pager</text>

  <!-- bottom: pattern statement -->
  <rect x="60" y="500" width="1080" height="100" rx="12" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="600" y="534" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">This is the new shape of AI infrastructure incidents: one CVE, two customer classes,</text>
  <text x="600" y="560" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">and the self-hosters always hold the risk they chose.</text>
  <text x="600" y="588" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">Every AI gateway you run yourself — GitLab's, LiteLLM, a home-grown proxy — puts you in the right-hand column.</text>

  <text x="600" y="640" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b">Source: GitLab advisory, "GitLab AI Gateway Critical Patch Release," Oct 2, 2026</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
