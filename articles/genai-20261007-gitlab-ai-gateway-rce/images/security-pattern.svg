<svg width="1440" height="810" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="675" fill="#0f172a"/>

  <text x="600" y="48" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">The 2026 AI security pattern: trust the sandbox, lose the host</text>
  <text x="600" y="76" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#94a3b8">Three infrastructure vendors, one month, the same lesson about isolation layers around AI workloads</text>

  <!-- incident 1 -->
  <rect x="60" y="112" width="356" height="300" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="238" y="146" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#f87171">SEPTEMBER 2026</text>
  <text x="238" y="176" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f1f5f9">GitLab CE/EE</text>
  <text x="238" y="204" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#22d3ee">CVE-2026-85706</text>
  <text x="238" y="232" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">max-severity path traversal,</text>
  <text x="238" y="252" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">UNAUTHENTICATED read of</text>
  <text x="238" y="272" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">credentials and secrets</text>
  <rect x="90" y="296" width="296" height="40" rx="8" fill="#0f172a" stroke="#f87171" stroke-width="1"/>
  <text x="238" y="322" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f87171">CISA: exploited in the wild</text>
  <text x="238" y="364" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b">federal agencies: 3 days to patch (BOD 26-04)</text>
  <text x="238" y="392" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b">5th GitLab flaw tagged exploited since 2021</text>

  <!-- incident 2 -->
  <rect x="436" y="112" width="356" height="300" rx="12" fill="#1e1e2e" stroke="#f87171" stroke-width="1.6"/>
  <text x="614" y="146" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#f87171">OCTOBER 2, 2026</text>
  <text x="614" y="176" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f1f5f9">GitLab AI Gateway</text>
  <text x="614" y="204" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#22d3ee">CVE-2026-90970 · CVSS 9.9</text>
  <text x="614" y="232" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">prompt-template sandbox escape</text>
  <text x="614" y="252" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">to arbitrary command execution,</text>
  <text x="614" y="272" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">authenticated low-priv user</text>
  <rect x="466" y="296" width="296" height="40" rx="8" fill="#0f172a" stroke="#f87171" stroke-width="1"/>
  <text x="614" y="322" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f87171">"under certain conditions"</text>
  <text x="614" y="364" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b">the AI plumbing itself became the attack surface</text>
  <text x="614" y="392" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b">disclosed with targeted pre-outreach to self-hosters</text>

  <!-- incident 3 -->
  <rect x="812" y="112" width="328" height="300" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="976" y="146" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#f87171">OCTOBER 7, 2026</text>
  <text x="976" y="176" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f1f5f9">PoeLLM malware</text>
  <text x="976" y="204" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#22d3ee">exposed AI servers</text>
  <text x="976" y="232" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">cryptomining infections hitting</text>
  <text x="976" y="252" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">internet-exposed AI infrastructure</text>
  <rect x="842" y="296" width="268" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="976" y="322" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fca5a5">same week, same lesson</text>
  <text x="976" y="364" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b">attackers now inventory AI endpoints</text>
  <text x="976" y="392" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b">the way they once scanned for Redis</text>

  <!-- pattern band -->
  <rect x="60" y="440" width="1080" height="150" rx="12" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="600" y="474" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#a78bfa">The pattern across all three</text>
  <text x="600" y="504" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">The isolation layer around AI workloads is exactly where attackers now look first.</text>
  <text x="600" y="528" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">A path traversal in a forge is routine; a prompt-template sandbox escape is a new bug class</text>
  <text x="600" y="552" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">that only exists because products started rendering user templates against live credentials.</text>
  <text x="600" y="578" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">Sources: BleepingComputer Oct 2 + Oct 7, 2026; GitLab advisory Oct 2, 2026</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
