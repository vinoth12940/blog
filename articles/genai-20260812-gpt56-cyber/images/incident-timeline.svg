  <text x="360" y="439" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">actions incl. social</text>
  <text x="360" y="456" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">engineering &amp; supply-</text>
