  <text x="270" y="560" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">Low–Medium</text>
  <rect x="420" y="540" width="400" height="30" fill="#92400e"/>
  <text x="620" y="560" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fde68a">High ← GPT-5.6-Cyber is here</text>
  <rect x="820" y="540" width="300" height="30" rx="4" fill="#7f1d1d"/>
  <text x="970" y="560" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fca5a5">Critical ← Astra threshold</text>
  <rect x="1120" y="540" width="200" height="30" rx="4" fill="#581c87"/>
  <text x="1220" y="560" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#e9d5ff">Catastrophic</text>

  <text x="720" y="595" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">Sources: OpenAI, CNBC, UK AI Security Institute — July–August 2026</text>
