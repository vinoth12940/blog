  <text x="615" y="222" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">have crossed CRITICAL</text>
  <text x="615" y="239" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">cybersecurity threshold —</text>
