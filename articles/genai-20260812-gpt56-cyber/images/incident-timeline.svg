  <!-- Risk level gradient bar -->
  <rect x="120" y="540" width="1200" height="30" rx="4" fill="none" stroke="#1f2937"/>
  <text x="130" y="530" font-family="Inter, sans-serif" font-size="11" fill="#64748b">OpenAI Preparedness Framework Risk Levels:</text>
