  <text x="905" y="439" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">Found 2 Chrome V8</text>
  <text x="905" y="456" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">zero-days + 400+ kernel</text>
