  <rect x="310" y="696" width="180" height="9" rx="4" fill="url(#barGray)"/>
  <text x="400" y="690" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#9ca3af">1.5%</text>
