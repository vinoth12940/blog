  <path d="M 470 420 Q 700 300 1030 60" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 4" fill="none"/>
  <polygon points="1035,55 1025,48 1028,62" fill="#fbbf24"/>
  <text x="720" y="410" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#fbbf24" font-style="italic">63x improvement</text>

