  <circle cx="142" cy="375" r="3" fill="#3b82f6"/><text x="155" y="380" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">Vulnerability discovery</text>
  <circle cx="142" cy="400" r="3" fill="#3b82f6"/><text x="155" y="405" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">Secure code review</text>
  <circle cx="142" cy="425" r="3" fill="#3b82f6"/><text x="155" y="430" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">Malware analysis</text>
  <circle cx="142" cy="450" r="3" fill="#3b82f6"/><text x="155" y="455" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">Incident response</text>
  <circle cx="142" cy="475" r="3" fill="#3b82f6"/><text x="155" y="480" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">Patch validation</text>

  <rect x="130" y="510" width="500" height="50" rx="8" fill="#1e293b"/>
  <text x="380" y="542" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">⬛ Identity verification ⬛ Monitoring ⬛ Legal attestation</text>

  <text x="380" y="595" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#475569" font-style="italic">Same model, just with system guardrails removed</text>
  <text x="380" y="615" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#475569" font-style="italic">Alignment training still causes refusals</text>

  <!-- Red Tier Box -->
  <rect x="780" y="90" width="560" height="560" rx="16" fill="#2a0a0a" stroke="#dc2626" stroke-width="2"/>
  <rect x="780" y="90" width="560" height="60" rx="16" fill="#b91c1c"/>
  <rect x="780" y="130" width="560" height="20" fill="#b91c1c"/>
  <text x="1060" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#fff">🔴 Daybreak Red</text>
  <text x="1060" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#f87171">Purpose-trained for authorized offensive security</text>

  <text x="810" y="215" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#fca5a5">Model:</text>
  <text x="810" y="240" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#fff">GPT-5.6-Cyber (specialized training)</text>

  <text x="810" y="280" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#fca5a5">Completion Rate:</text>
  <text x="810" y="310" font-family="JetBrains Mono, monospace" font-size="28" font-weight="700" fill="#f87171">95%</text>
  <text x="890" y="310" font-family="Inter, sans-serif" font-size="12" fill="#64748b">on advanced cyber prompts</text>

  <text x="810" y="350" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#fca5a5">Supported Workflows:</text>
  <circle cx="822" cy="375" r="3" fill="#ef4444"/><text x="835" y="380" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">Zero-day vulnerability research</text>
  <circle cx="822" cy="400" r="3" fill="#ef4444"/><text x="835" y="405" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">Exploit chain development</text>
  <circle cx="822" cy="425" r="3" fill="#ef4444"/><text x="835" y="430" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">Exploit validation and testing</text>
  <circle cx="822" cy="450" r="3" fill="#ef4444"/><text x="835" y="455" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">Authorized red-teaming</text>
  <circle cx="822" cy="475" r="3" fill="#ef4444"/><text x="835" y="480" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">Authentication bypass research</text>

  <rect x="810" y="510" width="500" height="50" rx="8" fill="#1e293b"/>
  <text x="1060" y="542" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">⬛ All Blue requirements + additional vetting</text>

  <text x="1060" y="595" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#7f1d1d" font-style="italic">Found 2 Chrome V8 zero-days + 400+ kernel bugs</text>
  <text x="1060" y="615" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#7f1d1d" font-style="italic">Hardware security keys mandatory Sep 1, 2026</text>

  <!-- Arrow between tiers -->
  <text x="720" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#fbbf24">→</text>
  <text x="720" y="395" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#92400e">upgrade</text>

  <text x="720" y="690" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">Both tiers require identity verification, monitoring, approved-use restrictions, and legal attestations</text>
</svg>
