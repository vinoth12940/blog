<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="720" fill="url(#bg2)"/>

  <text x="720" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#f8fafc">OpenAI Daybreak: Two-Tier Access Architecture</text>

  <!-- Blue Tier Box -->
  <rect x="100" y="90" width="560" height="560" rx="16" fill="#0c1e3a" stroke="#2563eb" stroke-width="2"/>
  <rect x="100" y="90" width="560" height="60" rx="16" fill="#1d4ed8"/>
  <rect x="100" y="130" width="560" height="20" fill="#1d4ed8"/>
  <text x="380" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#fff">🛡️ Daybreak Blue</text>
  <text x="380" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#60a5fa">Recommended starting point for most defenders</text>

  <text x="130" y="215" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93c5fd">Model:</text>
  <text x="130" y="240" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#fff">GPT-5.6 Sol (guardrails removed)</text>

  <text x="130" y="280" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93c5fd">Completion Rate:</text>
  <text x="130" y="310" font-family="JetBrains Mono, monospace" font-size="28" font-weight="700" fill="#60a5fa">2%</text>
