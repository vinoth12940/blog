<svg width="1440" height="810" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="675" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">The Pi stack after October 1</text>
  <text x="600" y="76" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#94a3b8">One shared core, two products: the terminal agent you drive, and the substrate that runs without you</text>

  <!-- Pi 1.0 band -->
  <rect x="60" y="110" width="1080" height="128" rx="14" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="88" y="142" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#a78bfa">Pi 1.0 — the coding agent</text>
  <text x="88" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">one person, one terminal, one machine — hardened and minimal</text>
  <rect x="88" y="184" width="192" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="184" y="207" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#e2e8f0">Codemode: MCP + Jev</text>
  <rect x="294" y="184" width="192" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="390" y="207" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#e2e8f0">virtual models</text>
  <rect x="500" y="184" width="192" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="596" y="207" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#e2e8f0">deferred tool loading</text>
  <rect x="706" y="184" width="192" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="802" y="207" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#e2e8f0">cache warming</text>
  <rect x="912" y="184" width="200" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="1012" y="207" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#e2e8f0">mid-run system messages</text>

  <!-- shared core -->
  <rect x="60" y="258" width="1080" height="64" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="600" y="285" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#22d3ee">pi-ai — unified model API (shared code)</text>
  <text x="600" y="307" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">pluggable providers: OpenAI · Anthropic · Google · local — models are swappable per conversation</text>

  <!-- Pi Durable band -->
  <rect x="60" y="342" width="1080" height="252" rx="14" fill="#1e1e2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="88" y="376" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#34d399">Pi Durable — the long-run substrate (experimental)</text>
  <text x="88" y="400" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">many conversations, many clients, runs for days — survives its own process dying</text>

  <rect x="88" y="420" width="246" height="148" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="211" y="450" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Storage</text>
  <text x="211" y="476" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">Memory · SQLite · JSONL</text>
  <text x="211" y="498" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">conformance suite + benchmarks,</text>
  <text x="211" y="516" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">bring-your-own (Postgres, KV)</text>
  <text x="211" y="544" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#34d399">state lives where YOU put it</text>

  <rect x="352" y="420" width="246" height="148" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="475" y="450" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Conversations</text>
  <text x="475" y="476" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">concurrent, forkable at any point</text>
  <text x="475" y="498" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">steer while busy, join late,</text>
  <text x="475" y="516" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">multiplayer by committed state</text>
  <text x="475" y="544" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa">fork sees history, copies nothing</text>

  <rect x="616" y="420" width="246" height="148" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="739" y="450" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Extensions + hooks</text>
  <text x="739" y="476" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">prompts, tools, tasks as bundles;</text>
  <text x="739" y="498" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">hot-swappable while running;</text>
  <text x="739" y="516" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">hooks chain and can block calls</text>
  <text x="739" y="544" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#22d3ee">decisions memoized: first write wins</text>

  <rect x="880" y="420" width="232" height="148" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="996" y="450" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Durable tasks</text>
  <text x="996" y="476" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">multi-phase, committed, with</text>
  <text x="996" y="498" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">abort handlers that refund;</text>
  <text x="996" y="516" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">timers survive restarts</text>
  <text x="996" y="544" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f87171">idempotency keys on charges</text>

  <!-- runtime strip -->
  <rect x="60" y="614" width="1080" height="40" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="600" y="640" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">runs anywhere there's a JavaScript runtime: Node · Bun · Cloudflare Durable Objects — MIT licensed, ~15,000 lines</text>
</svg>
