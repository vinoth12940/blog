<svg width="1440" height="810" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="675" fill="#0f172a"/>

  <text x="600" y="48" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">The durable-execution pattern, in one pass</text>
  <text x="600" y="76" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#94a3b8">Why the checklist below works: each rule maps to a mechanism, not a vibe</text>

  <!-- center: task circle -->
  <circle cx="600" cy="360" r="120" fill="#1e1e2e" stroke="#34d399" stroke-width="2"/>
  <text x="600" y="340" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#34d399">Durable task</text>
  <text x="600" y="366" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">checkpoint before every step</text>
  <text x="600" y="388" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">intent → execute → commit</text>
  <text x="600" y="416" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#64748b">model call · tool call · compaction</text>

  <!-- 4 satellite cards -->
  <!-- top-left: memo -->
  <rect x="70" y="140" width="300" height="130" rx="12" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="220" y="172" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#a78bfa">Memoized decisions</text>
  <text x="220" y="196" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">a hook's approval is stored</text>
  <text x="220" y="216" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">as a memo — first write wins;</text>
  <text x="220" y="236" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">a restart re-reads, never re-asks</text>

  <!-- top-right: replay -->
  <rect x="830" y="140" width="300" height="130" rx="12" fill="#1e1e2e" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="980" y="172" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#22d3ee">Declared replay policy</text>
  <text x="980" y="196" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">replay:"safe" on reads = free rerun;</text>
  <text x="980" y="216" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">without it, the model is told the</text>
  <text x="980" y="236" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">call was interrupted — it decides</text>

  <!-- bottom-left: idempotency -->
  <rect x="70" y="450" width="300" height="130" rx="12" fill="#1e1e2e" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="220" y="482" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#fbbf24">Idempotency keys</text>
  <text x="220" y="506" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">a charge keyed by task id bills</text>
  <text x="220" y="526" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">once even if the phase reruns;</text>
  <text x="220" y="546" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">abort phases refund automatically</text>

  <!-- bottom-right: requestId -->
  <rect x="830" y="450" width="300" height="130" rx="12" fill="#1e1e2e" stroke="#34d399" stroke-width="1.3"/>
  <text x="980" y="482" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#34d399">Exactly-once inputs</text>
  <text x="980" y="506" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">requestId makes a submission</text>
  <text x="980" y="526" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">idempotent: the retry gets the</text>
  <text x="980" y="546" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">original answer, not a second job</text>

  <!-- spokes -->
  <line x1="338" y1="240" x2="512" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="862" y1="240" x2="688" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="338" y1="480" x2="512" y2="420" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="862" y1="480" x2="688" y2="420" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="600" y="634" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b">The same primitives Temporal made standard — rebuilt as a library sized for one engineer to hold in their head</text>
</svg>
