<svg width="1440" height="810" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="#0f172a"/>

  <text x="600" y="48" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">Deploy week on your home server, with and without durability</text>
  <text x="600" y="76" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#94a3b8">The same Monday-night agent fleet, twice</text>

  <!-- LEFT: without -->
  <rect x="60" y="110" width="530" height="470" rx="14" fill="#1e1e2e" stroke="#f87171" stroke-width="1.4"/>
  <text x="325" y="146" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#f87171">Without a durable harness</text>

  <rect x="100" y="170" width="450" height="64" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="325" y="196" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">11 p.m. — nightly triage agent is 40 minutes</text>
  <text x="325" y="216" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">into a repo-wide refactor</text>

  <line x1="325" y1="234" x2="325" y2="262" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="100" y="266" width="450" height="64" rx="10" fill="#0f172a" stroke="#f87171" stroke-width="1.4"/>
  <text x="325" y="292" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#f87171">11:40 p.m. — unattended-upgrades restarts the box</text>
  <text x="325" y="312" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#94a3b8">(it picked kernel security updates. it always does.)</text>

  <line x1="325" y1="330" x2="325" y2="358" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="100" y="362" width="450" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="325" y="390" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">Tuesday 7 a.m.: transcript in a dead tmux buffer,</text>
  <text x="325" y="412" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">three repos in half-migrated states, and no record</text>
  <text x="325" y="434" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">of whether the force-push went out before the reboot</text>

  <rect x="100" y="482" width="450" height="66" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="325" y="508" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">recovery = re-reading logs, re-paying tokens,</text>
  <text x="325" y="530" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">and hoping the git reflog loves you</text>

  <!-- RIGHT: with -->
  <rect x="630" y="110" width="530" height="470" rx="14" fill="#1e1e2e" stroke="#34d399" stroke-width="1.4"/>
  <text x="895" y="146" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#34d399">With a durable harness</text>

  <rect x="670" y="170" width="450" height="64" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="895" y="196" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">11 p.m. — same agent, same refactor,</text>
  <text x="895" y="216" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">every step checkpointed to SQLite first</text>

  <line x1="895" y1="234" x2="895" y2="262" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="670" y="266" width="450" height="64" rx="10" fill="#0f172a" stroke="#f87171" stroke-width="1.2"/>
  <text x="895" y="292" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#f87171">11:40 p.m. — same reboot, same mid-tool-call death</text>
  <text x="895" y="312" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#94a3b8">(the crash itself is not prevented. it's survived.)</text>

  <line x1="895" y1="330" x2="895" y2="358" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="670" y="362" width="450" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="895" y="390" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">Boot completes → systemd unit opens the same</text>
  <text x="895" y="412" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">storage → finds the unfinished task → reruns the</text>
  <text x="895" y="434" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#e2e8f0">interrupted step; completed steps are not re-billed</text>

  <rect x="670" y="482" width="450" height="66" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="895" y="508" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">recovery = automatic. your morning coffee is</text>
  <text x="895" y="530" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">spent reviewing the diff, not resurrecting state</text>

  <text x="600" y="630" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b">Self-hosted agents have always been one unattended-upgrades away from amnesia — that's the problem Pi Durable is built for</text>
</svg>
