<svg width="1440" height="810" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">One agent run, one bad night</text>
  <text x="600" y="80" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#94a3b8">What a durable harness promises: the crash is an event, not a catastrophe</text>

  <!-- Job pill -->
  <rect x="70" y="130" width="330" height="44" rx="22" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="235" y="157" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#c4b5fd">job: "fix the flaky login test"</text>
  <line x1="235" y1="174" x2="235" y2="300" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Timeline cards -->
  <!-- 1 submit -->
  <rect x="45" y="305" width="170" height="78" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="130" y="336" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Submit</text>
  <text x="130" y="358" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#94a3b8">requestId: job-42</text>

  <line x1="215" y1="344" x2="243" y2="344" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2 steps -->
  <rect x="248" y="305" width="170" height="78" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="333" y="336" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Run steps</text>
  <text x="333" y="358" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#94a3b8">model call → tool → tool</text>

  <line x1="418" y1="344" x2="446" y2="344" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 3 checkpoint chip above -->
  <rect x="262" y="240" width="330" height="40" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="427" y="265" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#34d399">checkpoint committed BEFORE every step</text>
  <line x1="427" y1="280" x2="427" y2="300" stroke="#34d399" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 4 crash -->
  <rect x="451" y="305" width="170" height="78" rx="12" fill="#1e1e2e" stroke="#f87171" stroke-width="1.6"/>
  <text x="536" y="336" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#f87171">3:07 a.m.</text>
  <text x="536" y="358" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#94a3b8">process dies — OOM / deploy / sleep</text>

  <line x1="621" y1="344" x2="649" y2="344" stroke="#f87171" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="635" y="330" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#f87171">restart</text>

  <!-- 5 resume -->
  <rect x="654" y="305" width="190" height="78" rx="12" fill="#1e1e2e" stroke="#34d399" stroke-width="1.6"/>
  <text x="749" y="336" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#34d399">New process</text>
  <text x="749" y="358" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#94a3b8">opens same storage → finds</text>
  <text x="749" y="374" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#94a3b8">unfinished tasks → resumes</text>

  <line x1="844" y1="344" x2="872" y2="344" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 6 done -->
  <rect x="877" y="305" width="200" height="78" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="977" y="336" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Done</text>
  <text x="977" y="358" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#94a3b8">only the interrupted step reruns;</text>
  <text x="977" y="374" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#94a3b8">submission answered exactly once</text>

  <!-- Old world strip -->
  <rect x="45" y="425" width="1032" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="561" y="447" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">The old world: process dies mid-run → transcript gone or half-written → you re-read the log and type "continue" —</text>
  <text x="561" y="467" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">and hope the queue didn't pop the job before doing the work.</text>

  <!-- Principle chips -->
  <rect x="45" y="510" width="325" height="72" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="207" y="540" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#a78bfa">Checkpoint before side effects</text>
  <text x="207" y="562" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#94a3b8">intent is stored, then the step runs</text>

  <rect x="398" y="510" width="325" height="72" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="560" y="540" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#22d3ee">Replay-safe vs interruptible</text>
  <text x="560" y="562" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#94a3b8">safe tools rerun; unsafe ones ask the model</text>

  <rect x="751" y="510" width="325" height="72" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="913" y="540" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#34d399">Exactly-once inputs</text>
  <text x="913" y="562" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#94a3b8">a retried client gets the original answer</text>

  <!-- Source line -->
  <text x="600" y="638" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b">The crash-survival model of Pi Durable (earendil.com, Oct 2026) — checkpointed tasks over SQLite/JSONL storage</text>
</svg>
