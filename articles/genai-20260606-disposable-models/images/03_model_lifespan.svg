  <text x="450" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#64748b">Time from launch to deprecation for recent OpenAI models</text>

  <!-- GPT-4 (Mar 2023 → Aug 2024) -->
