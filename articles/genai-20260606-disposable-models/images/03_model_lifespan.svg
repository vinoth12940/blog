  <text x="80" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#64748b">Mar 2023 → Aug 2024</text>
  <rect x="250" y="100" width="560" height="36" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="0.5"/>
