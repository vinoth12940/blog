<svg width="100%" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="timeline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="48" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="600" fill="#f1f5f9">The week AI models became disposable</text>
  <text x="450" y="74" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#64748b">May 28 — June 2, 2026: six days that reshaped the model lifecycle</text>

  <!-- Timeline bar -->
  <line x1="80" y1="120" x2="820" y2="120" stroke="#1e293b" stroke-width="3"/>
  <line x1="80" y1="120" x2="820" y2="120" stroke="url(#timeline-grad)" stroke-width="2" opacity="0.6"/>

  <!-- Date markers -->
  <circle cx="120" cy="120" r="5" fill="#3b82f6"/>
  <text x="120" y="145" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8">May 28</text>

  <circle cx="340" cy="120" r="5" fill="#a78bfa"/>
  <text x="340" y="145" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8">May 30</text>

  <circle cx="560" cy="120" r="5" fill="#f59e0b"/>
  <text x="560" y="145" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8">June 1</text>

  <circle cx="780" cy="120" r="5" fill="#ef4444"/>
  <text x="780" y="145" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8">June 2</text>

  <!-- Event 1: Claude Opus 4.8 Launch -->
  <line x1="120" y1="125" x2="120" y2="175" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="40" y="175" width="180" height="80" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="130" y="198" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#60a5fa">Claude Opus 4.8</text>
  <text x="130" y="215" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8">Launch day</text>
  <text x="130" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#64748b">$5/$25 + Fast $10/$50</text>
  <text x="130" y="248" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#22c55e">69.2% SWE-Bench Pro</text>

  <!-- Event 2: Community reaction / benchmarks -->
  <line x1="340" y1="125" x2="340" y2="175" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="255" y="175" width="180" height="80" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="345" y="198" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#c4b5fd">Opus 4.8 benchmarks</text>
  <text x="345" y="215" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8">flood developer feeds</text>
  <text x="345" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#64748b">+10.6 pts over GPT-5.5</text>
  <text x="345" y="248" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#64748b">on SWE-Bench Pro</text>

  <!-- Event 3: Anthropic IPO filing -->
  <line x1="560" y1="125" x2="560" y2="175" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="470" y="175" width="180" height="80" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="560" y="198" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#fbbf24">Anthropic files IPO</text>
  <text x="560" y="215" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8">Confidential S-1</text>
  <text x="560" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#64748b">Reported $65B valuation</text>
  <text x="560" y="248" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#64748b">Signal to OpenAI: we're here</text>

  <!-- Event 4: Codex sunset -->
  <line x1="780" y1="125" x2="780" y2="175" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="680" y="175" width="180" height="80" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="0.5"/>
  <text x="770" y="198" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#f87171">GPT-5.2 &amp; 5.3-Codex</text>
  <text x="770" y="215" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8">Sunset without warning</text>
  <text x="770" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#64748b">4-month model lifespan</text>
  <text x="770" y="248" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#ef4444">Developer backlash erupts</text>

  <!-- Bottom section: the big picture -->
  <rect x="80" y="300" width="740" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="450" y="330" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#e5e5e5">What this week means</text>

  <!-- Three columns -->
  <rect x="110" y="350" width="200" height="110" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="210" y="375" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#60a5fa">Speed of obsolescence</text>
  <text x="210" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8">GPT-4o: 11 months</text>
  <text x="210" y="415" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8">GPT-5.2: 4 months</text>
  <text x="210" y="432" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8">GPT-5.3-Codex: 4 months</text>
  <text x="210" y="452" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#f87171">Trend: shorter, not longer</text>

  <rect x="350" y="350" width="200" height="110" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="450" y="375" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#4ade80">Price compression</text>
  <text x="450" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8">Opus 4.8 Fast: 3x cheaper</text>
  <text x="450" y="415" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8">DeepSeek: 75% price cut</text>
  <text x="450" y="432" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8">GPT-5.5: $5/$30 unchanged</text>
  <text x="450" y="452" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#22c55e">Margins collapsing</text>

  <rect x="590" y="350" width="200" height="110" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="690" y="375" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#fbbf24">Developer trust</text>
  <text x="690" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8">Models you built on: gone</text>
  <text x="690" y="415" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8">No migration path offered</text>
  <text x="690" y="432" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8">API calls fail silently</text>
  <text x="690" y="452" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#f59e0b">Vendor lock-in hurts now</text>
</svg>