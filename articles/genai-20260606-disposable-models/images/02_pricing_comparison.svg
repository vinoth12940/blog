<svg width="100%" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="anthropic-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="openai-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="deepseek-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">Frontier model pricing: per million tokens (June 2026)</text>
  <text x="450" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#64748b">Input tokens (left) · Output tokens (right) — lower is better</text>

  <!-- Input tokens section -->
  <text x="60" y="95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">INPUT TOKENS ($/1M)</text>

  <!-- Claude Opus 4.8 -->
  <text x="60" y="125" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#e5e5e5">Claude Opus 4.8</text>
  <rect x="220" y="112" width="120" height="20" rx="4" fill="url(#anthropic-bar)"/>
  <text x="348" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#60a5fa">$5.00</text>

  <!-- Claude Opus 4.8 Fast -->
  <text x="60" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#94a3b8">Opus 4.8 Fast</text>
  <rect x="220" y="144" width="240" height="20" rx="4" fill="url(#anthropic-bar)" opacity="0.6"/>
  <text x="468" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#60a5fa">$10.00</text>

  <!-- GPT-5.5 -->
  <text x="60" y="189" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#e5e5e5">GPT-5.5</text>
  <rect x="220" y="176" width="120" height="20" rx="4" fill="url(#openai-bar)"/>
  <text x="348" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#fbbf24">$5.00</text>

  <!-- GPT-5.5 Pro -->
  <text x="60" y="221" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#94a3b8">GPT-5.5 Pro</text>
  <rect x="220" y="208" width="720" height="20" rx="4" fill="url(#openai-bar)" opacity="0.6"/>
  <text x="948" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#fbbf24">$30.00</text>

  <!-- DeepSeek V4 -->
  <text x="60" y="253" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#e5e5e5">DeepSeek V4</text>
  <rect x="220" y="240" width="12" height="20" rx="4" fill="url(#deepseek-bar)"/>
  <text x="240" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#4ade80">$0.14</text>

