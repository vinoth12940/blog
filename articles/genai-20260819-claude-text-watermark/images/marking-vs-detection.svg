<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="820" fill="url(#bg)"/>

  <text x="720" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Two Different Questions</text>
  <text x="720" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#64748b">Detection asks "was this probably written by AI?" — marking answers "did this text pass through Claude?" The industry is about to pivot from one to the other.</text>

  <!-- LEFT PANEL: detectors -->
  <rect x="70" y="130" width="630" height="540" rx="14" fill="#0c1626" stroke="#334155" stroke-width="1.5"/>
  <text x="385" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">AI detectors — infer after the fact</text>
  <text x="385" y="196" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#64748b">probabilistic guesswork from writing patterns</text>

  <rect x="110" y="220" width="260" height="58" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="240" y="256" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#e2e8f0">any text, any source</text>
  <line x1="370" y1="249" x2="430" y2="249" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowG)"/>
  <rect x="440" y="220" width="220" height="58" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="550" y="248" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#e2e8f0">pattern analysis</text>
  <text x="550" y="268" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">burstiness · perplexity</text>

  <line x1="550" y1="278" x2="550" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowG)"/>
  <rect x="380" y="338" width="340" height="58" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="550" y="366" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#e2e8f0">probability score</text>
  <text x="550" y="386" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">"85% likely AI" — never certain</text>

  <rect x="110" y="440" width="550" height="100" rx="10" fill="#2a1215" stroke="#ef4444" stroke-width="1.5"/>
  <text x="385" y="476" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f87171">Known failure modes</text>
  <text x="385" y="502" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#fca5a5">false accusations against non-native English writers</text>
  <text x="385" y="524" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#fca5a5">trivially fooled by light paraphrasing</text>

  <text x="385" y="590" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#94a3b8">does not know which model, or whether</text>
  <text x="385" y="612" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#94a3b8">any specific model touched the text at all</text>

  <!-- RIGHT PANEL: marking -->
  <rect x="740" y="130" width="630" height="540" rx="14" fill="#0c1626" stroke="#10b981" stroke-width="2"/>
  <text x="1055" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">Embedded marking — signal at the source</text>
  <text x="1055" y="196" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Anthropic places the signal inside its own output</text>

  <rect x="780" y="220" width="260" height="58" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="910" y="256" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#e2e8f0">Claude generates text</text>
  <line x1="1040" y1="249" x2="1100" y2="249" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="220" width="220" height="58" rx="10" fill="#052e1e" stroke="#10b981" stroke-width="1.5"/>
  <text x="1220" y="248" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#6ee7b7">mark woven in</text>
  <text x="1220" y="268" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">part of the text itself</text>

  <line x1="1220" y1="278" x2="1220" y2="330" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1050" y="338" width="340" height="58" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="1220" y="366" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#e2e8f0">travels on copy-paste</text>
  <text x="1220" y="386" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">may persist through some editing</text>

  <rect x="780" y="440" width="550" height="100" rx="10" fill="#0c1e3a" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1055" y="476" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#93c5fd">What it answers — and doesn't</text>
  <text x="1055" y="502" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#bfdbfe">"Claude processed this text" — yes or no</text>
  <text x="1055" y="524" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#bfdbfe">not "a human didn't write it" — proofreading marks too</text>

  <text x="1055" y="590" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#94a3b8">detection tools for users and third parties</text>
  <text x="1055" y="612" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#94a3b8">are promised — technical details still forthcoming</text>

  <!-- Bottom takeaway -->
  <rect x="70" y="700" width="1300" height="80" rx="12" fill="#052e1e" stroke="#10b981" stroke-width="1.5"/>
  <text x="720" y="736" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#6ee7b7">A placed signal beats an inferred guess — but a missing signal proves nothing.</text>
  <text x="720" y="762" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8">No watermark does not mean human-written; a watermark does not mean AI-authored.</text>
</svg>
