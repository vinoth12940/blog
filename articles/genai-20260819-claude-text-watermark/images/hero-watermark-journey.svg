<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="780" fill="url(#bg)"/>

  <text x="720" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">The Watermark Travels With the Text</text>
  <text x="720" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#64748b">Applied at the model level, woven into the words themselves — so it rides along on copy-paste, no matter which surface produced it.</text>

  <!-- Source: Claude model -->
  <rect x="70" y="150" width="360" height="230" rx="14" fill="#0c1626" stroke="#d97757" stroke-width="2"/>
  <text x="250" y="190" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Claude model</text>
  <text x="250" y="216" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8">generates text token by token</text>
  <rect x="100" y="240" width="300" height="44" rx="8" fill="#052e1e" stroke="#10b981" stroke-width="1.5"/>
  <text x="250" y="268" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#6ee7b7">imperceptible mark woven in</text>
  <text x="250" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8">does not change meaning,</text>
  <text x="250" y="336" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8">quality, or readability</text>

  <!-- Copy-paste arrow -->
  <line x1="430" y1="265" x2="520" y2="265" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="475" y="244" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#93c5fd">Ctrl+C / Ctrl+V</text>

  <!-- Destinations -->
  <rect x="530" y="130" width="840" height="280" rx="14" fill="#0c1626" stroke="#1e293b" stroke-width="1.5"/>
  <text x="560" y="165" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Wherever the words land — the mark comes along</text>

  <rect x="560" y="185" width="250" height="90" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="685" y="220" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Email</text>
  <text x="685" y="248" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#34d399">● mark present</text>

  <rect x="830" y="185" width="250" height="90" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="955" y="220" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Docs &amp; CMS</text>
  <text x="955" y="248" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#34d399">● mark present</text>

  <rect x="1100" y="185" width="250" height="90" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="1225" y="220" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Web &amp; social</text>
  <text x="1225" y="248" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#34d399">● mark present</text>

  <rect x="560" y="295" width="250" height="90" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="685" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Code comments</text>
  <text x="685" y="358" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#34d399">● mark present</text>

  <rect x="830" y="295" width="250" height="90" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="955" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Chat export</text>
  <text x="955" y="358" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#34d399">● mark present</text>

  <rect x="1100" y="295" width="250" height="90" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1225" y="326" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">After heavy edits</text>
  <text x="1225" y="354" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#f59e0b">◐ may not survive</text>

  <!-- File path -->
  <rect x="70" y="440" width="1300" height="150" rx="14" fill="#0c1626" stroke="#1e293b" stroke-width="1.5"/>
  <text x="100" y="478" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Generated files take a different route: signed provenance, not embedded text</text>

  <rect x="100" y="500" width="360" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="280" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#e2e8f0">PNG · JPG · SVG output</text>

  <line x1="460" y1="532" x2="540" y2="532" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="550" y="500" width="360" height="64" rx="10" fill="#0c1e3a" stroke="#2563eb" stroke-width="1.5"/>
  <text x="730" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#93c5fd">C2PA provenance metadata</text>

  <line x1="910" y1="532" x2="990" y2="532" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1000" y="500" width="340" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="1170" y="532" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#94a3b8">survives while metadata survives</text>
  <text x="1170" y="552" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#f87171">screenshot or conversion strips it</text>

  <!-- Bottom bar -->
  <rect x="70" y="630" width="1300" height="100" rx="12" fill="#0c1e3a" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="672" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#93c5fd">"Watermarking will be applied at the model level... present no matter which</text>
  <text x="720" y="700" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#93c5fd">Claude product or surface the text comes from." — Anthropic, August 10, 2026</text>
</svg>
