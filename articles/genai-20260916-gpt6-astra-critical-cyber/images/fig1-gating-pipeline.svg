<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; }
      .th { font-size: 14px; font-weight: 600; fill: #f1f5f9; }
      .ts { font-size: 12px; font-weight: 400; fill: #94a3b8; }
      .card-gray  { fill: #1e1e2e; stroke: #64748b; stroke-width: 0.8; }
      .card-red   { fill: #1e1e2e; stroke: #e24b4a; stroke-width: 1.1; }
      .card-amber { fill: #1e1e2e; stroke: #ef9f27; stroke-width: 0.8; }
      .card-teal  { fill: #1e1e2e; stroke: #5dcaa5; stroke-width: 0.8; }
      .chip       { fill: #0f172a; stroke: #3f3f46; stroke-width: 0.6; }
      .chip-red   { stroke: #a32d2d; }
      .arr-line   { stroke: #64748b; stroke-width: 1.4; fill: none; }
      .accent-red   { fill: #f87171; }
      .accent-amber { fill: #fbbf24; }
      .accent-teal  { fill: #34d399; }
    </style>
  </defs>
  <rect x="0" y="0" width="680" height="620" fill="#0f172a"/>

  <g>
    <rect x="40" y="30" width="600" height="104" rx="16" class="card-gray"/>
    <text class="th" x="64" y="58">Stage 1 — Pre-deployment evaluation</text>
    <text class="ts" x="64" y="80">Preparedness Framework scoring across cyber, bio, and autonomy risk</text>
    <text class="ts" x="64" y="100">Astra scored High on bio and autonomy, Critical on cybersecurity</text>
  </g>

  <line x1="340" y1="134" x2="340" y2="168" class="arr-line" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="176" width="600" height="104" rx="16" class="card-red"/>
    <text class="th accent-red" x="64" y="204">Stage 2 — Critical threshold reached</text>
    <text class="ts" x="64" y="226">First model ever to cross it, by OpenAI's own system card</text>
    <text class="ts" x="64" y="246">Definition: functional zero-day exploits in hardened systems, unassisted</text>
  </g>

  <line x1="340" y1="280" x2="340" y2="314" class="arr-line" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="322" width="600" height="150" rx="16" class="card-amber"/>
    <text class="th accent-amber" x="64" y="350">Stage 3 — Capability gating at release</text>
    <rect x="64" y="368" width="264" height="40" rx="8" class="chip"/>
    <text class="ts" x="196" y="392" text-anchor="middle">Allowed: secure code review</text>
    <rect x="352" y="368" width="264" height="40" rx="8" class="chip"/>
    <text class="ts" x="484" y="392" text-anchor="middle">Allowed: patch development</text>
    <rect x="64" y="416" width="264" height="40" rx="8" class="chip chip-red"/>
    <text class="ts" x="196" y="440" text-anchor="middle">Blocked: PoC exploit generation</text>
    <rect x="352" y="416" width="264" height="40" rx="8" class="chip chip-red"/>
    <text class="ts" x="484" y="440" text-anchor="middle">Deferred: PoC validation workflows</text>
  </g>

  <line x1="340" y1="472" x2="340" y2="506" class="arr-line" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="514" width="600" height="70" rx="16" class="card-teal"/>
    <text class="th accent-teal" x="64" y="542">Stage 4 — Staged access expansion</text>
    <text class="ts" x="64" y="564">Daybreak partners first, then Pro and Business, then Plus — all within 72 hours</text>
  </g>
</svg>
