<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; }
      .th { font-size: 14px; font-weight: 600; fill: #f1f5f9; }
      .ts { font-size: 12px; font-weight: 400; fill: #94a3b8; }
      .card { fill: #1e1e2e; stroke-width: 0.8; }
      .card-gray   { stroke: #64748b; }
      .card-purple { stroke: #afa9ec; }
      .card-teal   { stroke: #5dcaa5; }
      .card-coral  { stroke: #f0997b; }
      .card-amber  { stroke: #ef9f27; }
      .arr-line { stroke: #64748b; stroke-width: 1.4; fill: none; }
      .accent-purple { fill: #c4b5fd; }
      .accent-teal   { fill: #34d399; }
      .accent-coral  { fill: #fda4af; }
      .accent-amber  { fill: #fbbf24; }
    </style>
  </defs>
  <rect x="0" y="0" width="680" height="470" fill="#0f172a"/>

  <text class="th" x="340" y="46" text-anchor="middle">From model launch to your API key in 72 hours</text>

  <rect x="50" y="80" width="180" height="56" rx="8" class="card card-gray"/>
  <text class="th" x="140" y="102" text-anchor="middle">Sep 3</text>
  <text class="ts" x="140" y="122" text-anchor="middle">Critical disclosed</text>

  <line x1="230" y1="108" x2="250" y2="108" class="arr-line" marker-end="url(#arrow)"/>

  <rect x="256" y="80" width="180" height="56" rx="8" class="card card-purple"/>
  <text class="th accent-purple" x="346" y="102" text-anchor="middle">Sep 4</text>
  <text class="ts" x="346" y="122" text-anchor="middle">Pro + Business launch</text>

  <line x1="436" y1="108" x2="456" y2="108" class="arr-line" marker-end="url(#arrow)"/>

  <rect x="462" y="80" width="180" height="56" rx="8" class="card card-teal"/>
  <text class="th accent-teal" x="552" y="102" text-anchor="middle">Sep 5</text>
  <text class="ts" x="552" y="122" text-anchor="middle">$20 Plus rollout</text>

  <line x1="340" y1="136" x2="340" y2="172" class="arr-line" marker-end="url(#arrow)"/>

  <rect x="50" y="180" width="280" height="120" rx="16" class="card card-teal"/>
  <text class="th accent-teal" x="190" y="208" text-anchor="middle">Same week, ecosystem-wide</text>
  <text class="ts" x="190" y="234" text-anchor="middle">Claude Fable 5.1 and Mythos 5.1 (Sep 1)</text>
  <text class="ts" x="190" y="254" text-anchor="middle">Meta and Google shipped updates too</text>
  <text class="ts" x="190" y="274" text-anchor="middle">Nvidia closed its Hugging Face acquisition</text>

  <rect x="350" y="180" width="280" height="120" rx="16" class="card card-coral"/>
  <text class="th accent-coral" x="490" y="208" text-anchor="middle">What this means for builders</text>
  <text class="ts" x="490" y="234" text-anchor="middle">Your prompt-injection tests are stale in days</text>
  <text class="ts" x="490" y="254" text-anchor="middle">Agent sandboxing is now table stakes</text>
  <text class="ts" x="490" y="274" text-anchor="middle">Watch vendor disclosure cadence, not demos</text>

  <line x1="340" y1="300" x2="340" y2="336" class="arr-line" marker-end="url(#arrow)"/>

  <rect x="50" y="344" width="580" height="90" rx="16" class="card card-amber"/>
  <text class="th accent-amber" x="340" y="374" text-anchor="middle">The precedent</text>
  <text class="ts" x="340" y="398" text-anchor="middle">A capability-classified model shipped to consumers anyway — gated, not withheld</text>
  <text class="ts" x="340" y="418" text-anchor="middle">Every future lab release decision now points at this moment</text>
</svg>
