<svg width="1440" height="810" viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="810" fill="#0f172a"/>
  <text x="60" y="88" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#e5e7eb">Muse Glimmer 30B: the agent stack on one GPU</text>
  <text x="60" y="128" font-family="Inter, -apple-system, sans-serif" font-size="22" fill="#94a3b8">Meta distilled a frontier agent into 30B open weights — Apache 2.0, 128K context, vision, runs fully offline</text>

  <!-- Top row: the old way vs the Glimmer way -->
  <!-- Cloud agent path -->
  <rect x="60" y="190" width="610" height="300" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="90" y="236" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#94a3b8">The old assumption: agents need the cloud</text>
  <rect x="90" y="268" width="550" height="52" rx="10" fill="#0d1526" stroke="#475569" stroke-width="1"/>
  <text x="110" y="300" font-family="'JetBrains Mono', monospace" font-size="18" fill="#c9c9c9">API key + per-token cost + network round-trips</text>
  <rect x="90" y="336" width="550" height="52" rx="10" fill="#0d1526" stroke="#475569" stroke-width="1"/>
  <text x="110" y="368" font-family="'JetBrains Mono', monospace" font-size="18" fill="#c9c9c9">Your files, screenshots and context leave the device</text>
  <rect x="90" y="404" width="550" height="52" rx="10" fill="#0d1526" stroke="#475569" stroke-width="1"/>
  <text x="110" y="436" font-family="'JetBrains Mono', monospace" font-size="18" fill="#c9c9c9">Rate limits, outages, vendor lock-in</text>

  <!-- Glimmer path -->
  <rect x="770" y="190" width="610" height="300" rx="16" fill="#0d2a26" stroke="#22c55e" stroke-width="1.5"/>
  <text x="800" y="236" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#4ade80">The Glimmer bet: the agent IS the model</text>
  <rect x="800" y="268" width="550" height="52" rx="10" fill="#062018" stroke="#16a34a" stroke-width="1"/>
  <text x="820" y="300" font-family="'JetBrains Mono', monospace" font-size="18" fill="#d1fae5">Tool calls, retries, vision — trained in, not bolted on</text>
  <rect x="800" y="336" width="550" height="52" rx="10" fill="#062018" stroke="#16a34a" stroke-width="1"/>
  <text x="820" y="368" font-family="'JetBrains Mono', monospace" font-size="18" fill="#d1fae5">No API key, no per-token cost, works offline</text>
  <rect x="800" y="404" width="550" height="52" rx="10" fill="#062018" stroke="#16a34a" stroke-width="1"/>
  <text x="820" y="436" font-family="'JetBrains Mono', monospace" font-size="18" fill="#d1fae5">Apache 2.0 — most permissive Meta license yet</text>

  <!-- Distillation flow -->
  <rect x="60" y="530" width="300" height="170" rx="16" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="90" y="572" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#a78bfa">Muse Spark</text>
  <text x="90" y="602" font-family="Inter, -apple-system, sans-serif" font-size="17" fill="#94a3b8">Meta&#8217;s frontier teacher</text>
  <text x="90" y="630" font-family="Inter, -apple-system, sans-serif" font-size="17" fill="#94a3b8">Cloud-scale, closed</text>
  <text x="90" y="668" font-family="'JetBrains Mono', monospace" font-size="16" fill="#c9c9c9">logit distillation</text>

  <line x1="360" y1="615" x2="450" y2="615" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="405" y="598" font-family="Inter, -apple-system, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">distill</text>

  <rect x="460" y="530" width="430" height="170" rx="16" fill="#0d2a26" stroke="#22c55e" stroke-width="2"/>
  <text x="490" y="572" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#4ade80">Muse Glimmer 30B</text>
  <text x="490" y="602" font-family="Inter, -apple-system, sans-serif" font-size="17" fill="#d1fae5">Open weights · Apache 2.0</text>
  <text x="490" y="630" font-family="Inter, -apple-system, sans-serif" font-size="17" fill="#d1fae5">128K context · text + vision</text>
  <text x="490" y="668" font-family="'JetBrains Mono', monospace" font-size="16" fill="#86efac">~17-20 GB quantized</text>

  <line x1="890" y1="615" x2="980" y2="615" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="990" y="530" width="390" height="170" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="1020" y="572" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#e5e7eb">Runs on</text>
  <text x="1020" y="606" font-family="Inter, -apple-system, sans-serif" font-size="17" fill="#94a3b8">Mac (MLX) · single 24 GB GPU</text>
  <text x="1020" y="634" font-family="Inter, -apple-system, sans-serif" font-size="17" fill="#94a3b8">Ollama · LM Studio · llama.cpp · vLLM</text>
  <text x="1020" y="668" font-family="'JetBrains Mono', monospace" font-size="16" fill="#c9c9c9">168K+ downloads week one</text>

  <text x="60" y="760" font-family="Inter, -apple-system, sans-serif" font-size="16" fill="#64748b">Sources: research.meta.ai (Aug 10, 2026) · developer.meta.com · ollama.com/library/muse-glimmer</text>
</svg>
