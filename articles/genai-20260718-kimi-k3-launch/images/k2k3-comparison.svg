  <text x="110" y="395" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="18">Text + Image input</text>

  <text x="110" y="435" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">REASONING</text>
  <text x="110" y="465" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="18">Thinking / non-thinking toggle</text>

  <text x="110" y="505" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">AGENT SWARM</text>
