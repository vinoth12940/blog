  <text x="810" y="435" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">REASONING</text>
  <text x="810" y="465" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="18">Always-on deep reasoning</text>

  <text x="810" y="505" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">NEW: SWARM + GOAL</text>
  <text x="810" y="535" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="18">Multiplayer 3D game generation</text>

  <text x="810" y="575" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">FOCUS</text>
  <text x="810" y="605" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="18">Long-horizon coding + knowledge</text>

  <text x="810" y="645" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">LICENSE</text>
  <text x="810" y="675" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="18">Open-weight (Reuters confirmed)</text>

  <text x="810" y="715" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">ACCESS</text>
  <text x="810" y="745" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="18">API + Kimi workspace + Code CLI</text>

  <!-- Arrow between columns -->
  <path d="M 670 470 L 770 470" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Footer note -->
  <text x="720" y="850" fill="#475569" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Sources: Moonshot AI official site, Kimi API Platform docs, Reuters (July 17, 2026) · K3 open-weight release confirmed by Reuters</text>
</svg>
