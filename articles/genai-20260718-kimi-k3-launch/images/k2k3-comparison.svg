  <rect x="80" y="150" width="580" height="30" fill="#334155"/>
  <text x="370" y="158" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Kimi K2.6 (April 2026)</text>

