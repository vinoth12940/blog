  <!-- Title -->
  <text x="720" y="55" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Kimi K3 vs K2.6 — What Changed</text>
