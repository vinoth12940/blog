  <text x="110" y="575" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">STRENGTH</text>
  <text x="110" y="605" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="18">Coding + agent workflows</text>

  <text x="110" y="645" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">LICENSE</text>
  <text x="110" y="675" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="18">MIT (open weights)</text>

  <text x="110" y="715" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">DEPLOYMENT</text>
