<svg width="1440" height="680" viewBox="0 0 1440 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="680" fill="url(#bg4)"/>

  <!-- Title -->
  <text x="720" y="50" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" text-anchor="middle">The Open-Weight vs Closed-Frontier Gap — July 2026</text>
  <text x="720" y="80" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16" text-anchor="middle">Context window and parameter scale by model · The gap has effectively closed</text>

  <!-- Context Window Comparison section -->
  <text x="120" y="130" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">CONTEXT WINDOW (tokens)</text>

  <!-- Bar chart -->
  <!-- Kimi K3: 1M -->
  <rect x="120" y="150" width="700" height="36" rx="6" fill="#4f46e5"/>
  <text x="835" y="173" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">1M — Kimi K3</text>

  <!-- GLM-5.2: 1M -->
  <rect x="120" y="195" width="700" height="36" rx="6" fill="#4f46e5" opacity="0.7"/>
  <text x="835" y="218" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">1M — GLM-5.2 (Z.ai)</text>

  <!-- DeepSeek V4: 1M -->
  <rect x="120" y="240" width="700" height="36" rx="6" fill="#4f46e5" opacity="0.6"/>
  <text x="835" y="263" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">1M — DeepSeek V4</text>

  <!-- Claude Opus 4.8: 500K -->
  <rect x="120" y="285" width="350" height="36" rx="6" fill="#dc2626" opacity="0.8"/>
  <text x="485" y="308" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">500K — Claude Opus 4.8</text>

  <!-- GPT-5.5: 400K -->
  <rect x="120" y="330" width="280" height="36" rx="6" fill="#dc2626" opacity="0.7"/>
  <text x="415" y="353" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">400K — GPT-5.5</text>

  <!-- Kimi K2.6: 256K -->
  <rect x="120" y="375" width="179" height="36" rx="6" fill="#4f46e5" opacity="0.4"/>
  <text x="314" y="398" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">256K — Kimi K2.6</text>

  <!-- Divider -->
  <line x1="120" y1="440" x2="1320" y2="440" stroke="#334155" stroke-width="1"/>

  <!-- Parameter scale section -->
  <text x="120" y="475" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">TOTAL PARAMETERS</text>

  <!-- Kimi K3: 2.8T -->
  <rect x="120" y="495" width="933" height="36" rx="6" fill="#4f46e5"/>
  <text x="1070" y="518" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">2.8T — Kimi K3 (open)</text>

  <!-- DeepSeek V4: 1.6T -->
  <rect x="120" y="540" width="533" height="36" rx="6" fill="#4f46e5" opacity="0.7"/>
  <text x="670" y="563" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">1.6T — DeepSeek V4 (open)</text>

  <!-- GLM-5.2: 744B -->
  <rect x="120" y="585" width="248" height="36" rx="6" fill="#4f46e5" opacity="0.5"/>
  <text x="385" y="608" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">744B — GLM-5.2 (open)</text>

  <!-- Legend -->
  <rect x="1000" y="495" width="20" height="20" rx="4" fill="#4f46e5"/>
  <text x="1030" y="510" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Open weights</text>

  <!-- Footnote -->
  <text x="720" y="660" fill="#475569" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Open models now match or exceed closed frontier on context and scale · Sources: Official model docs, Reuters · July 2026</text>
</svg>
