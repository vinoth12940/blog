<svg width="100%" viewBox="0 0 1440 680" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a">

  <!-- Title -->
  <text x="720" y="50" text-anchor="middle" fill="#f1f5f9" font-size="28" font-weight="700" font-family="system-ui, sans-serif">What JADEPUFFER Hunted: The Credential Surface</text>
  <text x="720" y="78" text-anchor="middle" fill="#64748b" font-size="15" font-family="system-ui, sans-serif">AI infrastructure is now a primary attack target</text>

  <!-- Central node: AI Agent -->
  <circle cx="720" cy="360" r="70" fill="#1e1e2e" stroke="#ef4444" stroke-width="3"/>
  <text x="720" y="355" text-anchor="middle" fill="#fca5a5" font-size="16" font-weight="700" font-family="system-ui, sans-serif" dominant-baseline="central">JADEPUFFER</text>
  <text x="720" y="378" text-anchor="middle" fill="#64748b" font-size="12" font-family="system-ui, sans-serif" dominant-baseline="central">AI Agent</text>

  <!-- Spoke 1: LLM API Keys (top-left) -->
  <line x1="670" y1="310" x2="380" y2="180" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="100" y="140" width="280" height="80" rx="12" fill="#1e1e2e" stroke="#ef4444" stroke-width="2"/>
  <text x="240" y="165" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="700" font-family="system-ui, sans-serif">LLM API Keys</text>
  <text x="240" y="188" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">OpenAI · Anthropic</text>
  <text x="240" y="206" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">DeepSeek · Gemini</text>

  <!-- Spoke 2: Cloud Credentials (top-right) -->
  <line x1="770" y1="310" x2="1060" y2="180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="1060" y="140" width="280" height="80" rx="12" fill="#1e1e2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="1200" y="165" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="700" font-family="system-ui, sans-serif">Cloud Credentials</text>
  <text x="1200" y="188" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">AWS · Azure · GCP</text>
  <text x="1200" y="206" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Alibaba · Tencent · Huawei</text>

  <!-- Spoke 3: Database Credentials (left) -->
  <line x1="650" y1="360" x2="380" y2="360" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="100" y="320" width="280" height="80" rx="12" fill="#1e1e2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="240" y="345" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="700" font-family="system-ui, sans-serif">Database Access</text>
  <text x="240" y="368" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">MySQL · Nacos</text>
  <text x="240" y="386" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">MinIO object storage</text>

  <!-- Spoke 4: Crypto Wallets (right) -->
  <line x1="790" y1="360" x2="1060" y2="360" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="1060" y="320" width="280" height="80" rx="12" fill="#1e1e2e" stroke="#22d3ee" stroke-width="2"/>
  <text x="1200" y="345" text-anchor="middle" fill="#67e8f9" font-size="15" font-weight="700" font-family="system-ui, sans-serif">Crypto Wallets</text>
  <text x="1200" y="368" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Private keys</text>
  <text x="1200" y="386" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Seed phrases</text>

  <!-- Spoke 5: Config Files (bottom-left) -->
  <line x1="670" y1="410" x2="380" y2="540" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="100" y="500" width="280" height="80" rx="12" fill="#1e1e2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="240" y="525" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="700" font-family="system-ui, sans-serif">Config &amp; Secrets</text>
  <text x="240" y="548" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">.env files</text>
  <text x="240" y="566" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Secret managers</text>

  <!-- Spoke 6: Internal Services (bottom-right) -->
  <line x1="770" y1="410" x2="1060" y2="540" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="1060" y="500" width="280" height="80" rx="12" fill="#1e1e2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="1200" y="525" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="700" font-family="system-ui, sans-serif">Internal Services</text>
  <text x="1200" y="548" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Databases · Object stores</text>
  <text x="1200" y="566" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Default creds tested</text>

  <!-- Entry point label -->
  <rect x="580" y="115" width="280" height="45" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="720" y="143" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" dominant-baseline="central">Entry: CVE-2025-3248 (Langflow, CVSS 9.8)</text>

  <!-- Source -->
  <text x="720" y="650" text-anchor="middle" fill="#475569" font-size="12" font-family="system-ui, sans-serif">Source: Sysdig Threat Research Team — July 2026</text>
</svg>
