<svg width="100%" viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="720" y="50" text-anchor="middle" fill="#f1f5f9" font-size="32" font-weight="700" font-family="system-ui, sans-serif">JADEPUFFER: The Autonomous AI Kill Chain</text>
  <text x="720" y="80" text-anchor="middle" fill="#64748b" font-size="16" font-family="system-ui, sans-serif">600+ payloads · 0 human decisions after initial access</text>

  <!-- Phase labels (left side) -->
  <text x="45" y="135" fill="#94a3b8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">HUMAN</text>
  <text x="45" y="250" fill="#ef4444" font-size="13" font-weight="600" font-family="system-ui, sans-serif">AI AGENT</text>
  <text x="45" y="266" fill="#ef4444" font-size="11" font-family="system-ui, sans-serif">AUTONOMOUS</text>

  <!-- Phase 0: Human (gray) -->
  <rect x="80" y="105" width="280" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="220" y="130" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">Target Selection</text>
  <text x="220" y="150" text-anchor="middle" fill="#64748b" font-size="12" font-family="system-ui, sans-serif">Human chooses victim, sets up infra</text>

  <!-- Arrow down -->
  <line x1="220" y1="165" x2="220" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Phase 1: Initial Access (red) -->
  <rect x="80" y="205" width="280" height="60" rx="10" fill="#1e1e2e" stroke="#ef4444" stroke-width="2"/>
  <text x="220" y="230" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="600" font-family="system-ui, sans-serif">1. Initial Access</text>
  <text x="220" y="250" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">CVE-2025-3248 · Langflow RCE</text>

  <!-- Phase 2: Credential Harvesting (amber) -->
  <rect x="420" y="205" width="280" height="60" rx="10" fill="#1e1e2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="560" y="230" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="600" font-family="system-ui, sans-serif">2. Credential Harvesting</text>
  <text x="560" y="250" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">API keys, cloud creds, wallets</text>

  <!-- Phase 3: Lateral Movement (amber) -->
  <rect x="760" y="205" width="280" height="60" rx="10" fill="#1e1e2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="900" y="230" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="600" font-family="system-ui, sans-serif">3. Lateral Movement</text>
  <text x="900" y="250" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Databases, object stores, secrets</text>

  <!-- Phase 4: Privilege Escalation (purple) -->
  <rect x="1100" y="205" width="280" height="60" rx="10" fill="#1e1e2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="1240" y="230" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="600" font-family="system-ui, sans-serif">4. Privilege Escalation</text>
  <text x="1240" y="250" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">JWT forging, admin creation</text>

  <!-- Horizontal arrows between phases -->
  <line x1="360" y1="235" x2="420" y2="235" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="235" x2="760" y2="235" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1040" y1="235" x2="1100" y2="235" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Phase 5: Persistence (purple) -->
  <rect x="1100" y="335" width="280" height="60" rx="10" fill="#1e1e2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="1240" y="360" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="600" font-family="system-ui, sans-serif">5. Persistence</text>
  <text x="1240" y="380" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Scheduled beacons, backdoors</text>

  <!-- Phase 6: Encryption (red) -->
  <rect x="760" y="335" width="280" height="60" rx="10" fill="#1e1e2e" stroke="#ef4444" stroke-width="2"/>
  <text x="900" y="360" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="600" font-family="system-ui, sans-serif">6. Data Encryption</text>
  <text x="900" y="380" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">1,300+ Nacos records · AES</text>

  <!-- Phase 7: Ransom (red) -->
  <rect x="420" y="335" width="280" height="60" rx="10" fill="#1e1e2e" stroke="#ef4444" stroke-width="2"/>
  <text x="560" y="360" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="600" font-family="system-ui, sans-serif">7. Ransom Demand</text>
  <text x="560" y="380" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Self-generated Bitcoin note</text>

  <!-- Vertical arrow down -->
  <line x1="1240" y1="265" x2="1240" y2="335" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1100" y1="365" x2="1040" y2="365" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="365" x2="700" y2="365" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Self-healing callout -->
  <rect x="80" y="335" width="280" height="60" rx="10" fill="#1e1e2e" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="220" y="360" text-anchor="middle" fill="#67e8f9" font-size="15" font-weight="600" font-family="system-ui, sans-serif">Self-Healing</text>
  <text x="220" y="380" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">31s error → fix → re-attack</text>

  <!-- Stats section -->
  <line x1="80" y1="445" x2="1380" y2="445" stroke="#334155" stroke-width="1.5"/>

  <text x="220" y="495" text-anchor="middle" fill="#ef4444" font-size="42" font-weight="800" font-family="system-ui, sans-serif">600+</text>
  <text x="220" y="525" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Distinct payloads</text>

  <text x="560" y="495" text-anchor="middle" fill="#f59e0b" font-size="42" font-weight="800" font-family="system-ui, sans-serif">0</text>
  <text x="560" y="525" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Human steps (post-access)</text>

  <text x="900" y="495" text-anchor="middle" fill="#a78bfa" font-size="42" font-weight="800" font-family="system-ui, sans-serif">31s</text>
  <text x="900" y="525" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Error-to-fix turnaround</text>

  <text x="1240" y="495" text-anchor="middle" fill="#22d3ee" font-size="42" font-weight="800" font-family="system-ui, sans-serif">?</text>
  <text x="1240" y="525" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Model identity unknown</text>

  <!-- Bottom legend -->
  <line x1="80" y1="570" x2="1380" y2="570" stroke="#334155" stroke-width="1.5"/>

  <rect x="200" y="605" width="20" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="620" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" dominant-baseline="central">Human phase</text>

  <rect x="400" y="605" width="20" height="20" rx="4" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.5"/>
  <text x="430" y="620" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" dominant-baseline="central">Destructive (AI)</text>

  <rect x="620" y="605" width="20" height="20" rx="4" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="650" y="620" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" dominant-baseline="central">Recon &amp; harvesting (AI)</text>

  <rect x="870" y="605" width="20" height="20" rx="4" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="900" y="620" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" dominant-baseline="central">Escalation (AI)</text>

  <rect x="1090" y="605" width="20" height="20" rx="4" fill="#1e1e2e" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="1120" y="620" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" dominant-baseline="central">Adaptive behavior</text>

  <!-- Source -->
  <text x="720" y="700" text-anchor="middle" fill="#475569" font-size="12" font-family="system-ui, sans-serif">Source: Sysdig Threat Research Team · July 2026</text>
</svg>
