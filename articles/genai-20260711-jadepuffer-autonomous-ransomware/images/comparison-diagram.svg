  <text x="360" y="443" text-anchor="middle" fill="#64748b" font-size="12" font-family="system-ui, sans-serif">Manual execution</text>

  <!-- Summary -->
  <rect x="100" y="495" width="520" height="100" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" stroke-dasharray="4,2"/>
