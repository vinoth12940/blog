  <text x="1080" y="345" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="600" font-family="system-ui, sans-serif">AI agent runs 600+ payloads</text>
  <text x="1080" y="363" text-anchor="middle" fill="#64748b" font-size="12" font-family="system-ui, sans-serif">Recon, harvest, move, escalate — self-directed</text>

  <line x1="1080" y1="375" x2="1080" y2="400" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <rect x="820" y="400" width="520" height="55" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="1080" y="425" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="600" font-family="system-ui, sans-serif">AI agent encrypts &amp; demands ransom</text>
  <text x="1080" y="443" text-anchor="middle" fill="#64748b" font-size="12" font-family="system-ui, sans-serif">Self-generated ransom note</text>

  <!-- Summary -->
  <rect x="820" y="495" width="520" height="100" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="1080" y="525" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="600" font-family="system-ui, sans-serif">SUMMARY</text>
  <text x="1080" y="550" text-anchor="middle" fill="#fca5a5" font-size="14" font-family="system-ui, sans-serif">Human at ONE step — targeting</text>
  <text x="1080" y="570" text-anchor="middle" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">Bottleneck: machine speed, not human</text>

