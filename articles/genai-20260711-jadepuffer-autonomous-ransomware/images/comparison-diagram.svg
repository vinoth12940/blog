  <text x="360" y="265" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600" font-family="system-ui, sans-serif">Human gains access</text>
  <text x="360" y="283" text-anchor="middle" fill="#64748b" font-size="12" font-family="system-ui, sans-serif">Manual exploit</text>

  <line x1="360" y1="295" x2="360" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="100" y="320" width="520" height="55" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="360" y="345" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600" font-family="system-ui, sans-serif">Human runs each tool</text>
  <text x="360" y="363" text-anchor="middle" fill="#64748b" font-size="12" font-family="system-ui, sans-serif">Cobalt Strike, Mimikatz, etc.</text>

  <line x1="360" y1="375" x2="360" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="100" y="400" width="520" height="55" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
