      <path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="720" y="50" text-anchor="middle" fill="#f1f5f9" font-size="28" font-weight="700" font-family="system-ui, sans-serif">Traditional Ransomware vs. AI-Driven Ransomware</text>

  <!-- Left column: Traditional -->
  <text x="360" y="105" text-anchor="middle" fill="#64748b" font-size="18" font-weight="600" font-family="system-ui, sans-serif">Traditional Attack</text>
  <rect x="60" y="125" width="600" height="510" rx="16" fill="#1e1e2e" stroke="#475569" stroke-width="1.5"/>

  <rect x="100" y="160" width="520" height="55" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="360" y="185" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600" font-family="system-ui, sans-serif">Human chooses target</text>
  <text x="360" y="203" text-anchor="middle" fill="#64748b" font-size="12" font-family="system-ui, sans-serif">Manual</text>

  <line x1="360" y1="215" x2="360" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

