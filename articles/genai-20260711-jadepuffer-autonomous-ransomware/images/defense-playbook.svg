<svg width="100%" viewBox="0 0 1440 760" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a">

  <!-- Title -->
  <text x="720" y="50" text-anchor="middle" fill="#f1f5f9" font-size="28" font-weight="700" font-family="system-ui, sans-serif">Defense Playbook: Hardening AI Infrastructure</text>
  <text x="720" y="78" text-anchor="middle" fill="#64748b" font-size="15" font-family="system-ui, sans-serif">Six actions every team running AI agents should take today</text>

  <!-- Layer 1: Perimeter -->
  <rect x="80" y="110" width="1280" height="80" rx="12" fill="#1e1e2e" stroke="#ef4444" stroke-width="2"/>
  <rect x="100" y="125" width="50" height="50" rx="8" fill="#0f172a"/>
  <text x="125" y="150" text-anchor="middle" fill="#ef4444" font-size="22" font-weight="800" font-family="system-ui, sans-serif" dominant-baseline="central">1</text>
  <text x="170" y="148" fill="#fca5a5" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Patch CVE-2025-3248 immediately</text>
  <text x="170" y="172" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">If you run Langflow &lt; 1.3.0, you are exposed to the exact entry vector JADEPUFFER used. Update now.</text>

  <!-- Layer 2: Secrets -->
  <rect x="80" y="210" width="1280" height="80" rx="12" fill="#1e1e2e" stroke="#f59e0b" stroke-width="2"/>
  <rect x="100" y="225" width="50" height="50" rx="8" fill="#0f172a"/>
  <text x="125" y="250" text-anchor="middle" fill="#f59e0b" font-size="22" font-weight="800" font-family="system-ui, sans-serif" dominant-baseline="central">2</text>
  <text x="170" y="248" fill="#fcd34d" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Audit AI API key storage</text>
  <text x="170" y="272" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Treat LLM API keys like financial credentials. Never in .env files, config files, or plaintext env vars.</text>

  <!-- Layer 3: Network -->
  <rect x="80" y="310" width="1280" height="80" rx="12" fill="#1e1e2e" stroke="#a78bfa" stroke-width="2"/>
  <rect x="100" y="325" width="50" height="50" rx="8" fill="#0f172a"/>
  <text x="125" y="350" text-anchor="middle" fill="#a78bfa" font-size="22" font-weight="800" font-family="system-ui, sans-serif" dominant-baseline="central">3</text>
  <text x="170" y="348" fill="#c4b5fd" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Isolate AI infrastructure from production data</text>
  <text x="170" y="372" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Network segmentation between LLM orchestration platforms and databases, object stores, and secret managers.</text>

  <!-- Layer 4: Monitoring -->
  <rect x="80" y="410" width="1280" height="80" rx="12" fill="#1e1e2e" stroke="#22d3ee" stroke-width="2"/>
  <rect x="100" y="425" width="50" height="50" rx="8" fill="#0f172a"/>
  <text x="125" y="450" text-anchor="middle" fill="#22d3ee" font-size="22" font-weight="800" font-family="system-ui, sans-serif" dominant-baseline="central">4</text>
  <text x="170" y="448" fill="#67e8f9" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Deploy AI-driven detection &amp; automated response</text>
  <text x="170" y="472" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Human-speed SOC can't keep up with machine-speed attacks. Invest in behavioral anomaly detection now.</text>

  <!-- Layer 5: Access Control -->
  <rect x="80" y="510" width="1280" height="80" rx="12" fill="#1e1e2e" stroke="#22d3ee" stroke-width="2"/>
  <rect x="100" y="525" width="50" height="50" rx="8" fill="#0f172a"/>
  <text x="125" y="550" text-anchor="middle" fill="#22d3ee" font-size="22" font-weight="800" font-family="system-ui, sans-serif" dominant-baseline="central">5</text>
  <text x="170" y="548" fill="#67e8f9" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Implement kill switches for your own AI agents</text>
  <text x="170" y="572" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Every agentic deployment needs revocable credentials, rate limits, audit logging, and emergency shutdown.</text>

  <!-- Layer 6: Mindset -->
  <rect x="80" y="610" width="1280" height="80" rx="12" fill="#1e1e2e" stroke="#ef4444" stroke-width="2"/>
  <rect x="100" y="625" width="50" height="50" rx="8" fill="#0f172a"/>
  <text x="125" y="650" text-anchor="middle" fill="#ef4444" font-size="22" font-weight="800" font-family="system-ui, sans-serif" dominant-baseline="central">6</text>
  <text x="170" y="648" fill="#fca5a5" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Drop the assumption that attackers are human-bottlenecked</text>
  <text x="170" y="672" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">JADEPUFFER executed 600+ payloads autonomously. Design defenses for machine-speed, multi-path, adaptive attackers.</text>

  <!-- Source -->
  <text x="720" y="730" text-anchor="middle" fill="#475569" font-size="12" font-family="system-ui, sans-serif">Compiled from Sysdig TRT recommendations, CX Today analysis, and industry best practices — July 2026</text>
</svg>
