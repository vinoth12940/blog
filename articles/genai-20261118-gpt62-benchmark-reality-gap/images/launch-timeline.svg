    <text x="980" y="536" font-size="12" fill="#f8fafc">California sues</text>
    <text x="980" y="556" font-size="12" fill="#cbd5e1">OpenAI seeking changes</text>
    <text x="980" y="574" font-size="12" fill="#cbd5e1">after the Hugging Face</text>
