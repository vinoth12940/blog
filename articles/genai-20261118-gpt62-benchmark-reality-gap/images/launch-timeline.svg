  <!-- 7. Nov 17 (above) -->
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <circle cx="1150" cy="430" r="9" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
