    <circle cx="640" cy="430" r="7" fill="#fbbf24"/>
    <line x1="640" y1="437" x2="640" y2="480" stroke="#475569" stroke-width="1"/>
    <rect x="560" y="480" width="160" height="130" rx="10" fill="#1e1e2e" stroke="#fbbf24" stroke-width="1.2"/>
