    <rect x="730" y="250" width="160" height="130" rx="10" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="810" y="282" font-size="14" font-weight="700" fill="#a78bfa">Nov 9</text>
    <text x="810" y="306" font-size="12" fill="#f8fafc">Claude Fable 5.2</text>
    <text x="810" y="326" font-size="12" fill="#cbd5e1">launches; takes the</text>
    <text x="810" y="344" font-size="12" fill="#cbd5e1">AA index lead at 65</text>
  </g>

  <!-- 6. Nov 16 (below) -->
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <circle cx="980" cy="430" r="7" fill="#f87171"/>
    <line x1="980" y1="437" x2="980" y2="480" stroke="#475569" stroke-width="1"/>
    <rect x="900" y="480" width="160" height="130" rx="10" fill="#1e1e2e" stroke="#f87171" stroke-width="1.2"/>
