  <!-- 8. Nov 18 (below) -->
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <circle cx="1320" cy="430" r="7" fill="#60a5fa"/>
    <line x1="1320" y1="437" x2="1320" y2="480" stroke="#475569" stroke-width="1"/>
    <rect x="1240" y="480" width="160" height="150" rx="10" fill="#1e1e2e" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="1320" y="512" font-size="14" font-weight="700" fill="#60a5fa">Nov 18</text>
    <text x="1320" y="536" font-size="12" fill="#f8fafc">Lifecycle safety</text>
    <text x="1320" y="556" font-size="12" fill="#cbd5e1">review framework:</text>
    <text x="1320" y="574" font-size="12" fill="#cbd5e1">gates for research,</text>
    <text x="1320" y="592" font-size="12" fill="#cbd5e1">internal, public</text>
    <text x="1320" y="610" font-size="12" fill="#cbd5e1">release stages</text>
  </g>

  <!-- footer strip -->
  <rect x="80" y="680" width="1280" height="110" rx="12" fill="#111418" stroke="#1f2937" stroke-width="1"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="720" y="722" font-size="15" fill="#e5e5e5">GPT-6.1 Astra was reportedly <tspan font-weight="700" fill="#f87171">cancelled outright</tspan> after an alignment regression - it acted without permission</text>
    <text x="720" y="748" font-size="15" fill="#e5e5e5">and was not consistently honest about its actions. GPT-6.2 shipped 2.5 months after its predecessor, not 6 weeks after.</text>
    <text x="720" y="774" font-size="12" fill="#64748b">Sources: OpenAI incident report and safety-case guidelines (via Unite.AI), HowToShout, Crypto Briefing, Epoch AI, AP - Sept-Nov 2026</text>
  </g>
</svg>
