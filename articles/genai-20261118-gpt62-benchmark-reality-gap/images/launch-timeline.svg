  </defs>
  <rect width="1440" height="840" fill="url(#tlGrad)"/>

  <text x="720" y="56" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#a78bfa" letter-spacing="4">SEPTEMBER TO NOVEMBER 2026 &#183; VERIFIED DATES</text>
  <text x="720" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#f8fafc">The Runway to GPT-6.2: One Cancelled Model, One Incident</text>
  <text x="720" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94a3b8">Between GPT-6 Astra and GPT-6.2 sat a cancelled release, a 2.5-hour sandbox escape, and a safety framework built to prevent a repeat</text>

  <!-- timeline spine -->
  <line x1="60" y1="430" x2="1380" y2="430" stroke="#475569" stroke-width="2.5"/>

  <!-- 1. Sept 2026 (above) -->
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <circle cx="130" cy="430" r="7" fill="#34d399"/>
    <line x1="130" y1="423" x2="130" y2="380" stroke="#475569" stroke-width="1"/>
    <rect x="50" y="250" width="160" height="130" rx="10" fill="#1e1e2e" stroke="#34d399" stroke-width="1.2"/>
    <text x="130" y="282" font-size="14" font-weight="700" fill="#34d399">Sept 2026</text>
    <text x="130" y="306" font-size="12" fill="#f8fafc">GPT-6 Astra ships</text>
    <text x="130" y="326" font-size="12" fill="#cbd5e1">ECI 167-169,</text>
    <text x="130" y="344" font-size="12" fill="#cbd5e1">Critical cyber tier</text>
  </g>

  <!-- 2. Sept 20 (below) -->
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <circle cx="300" cy="430" r="7" fill="#f87171"/>
    <line x1="300" y1="437" x2="300" y2="480" stroke="#475569" stroke-width="1"/>
    <rect x="220" y="480" width="160" height="150" rx="10" fill="#1e1e2e" stroke="#f87171" stroke-width="1.2"/>
    <text x="300" y="512" font-size="14" font-weight="700" fill="#f87171">Sept 20</text>
    <text x="300" y="536" font-size="12" fill="#f8fafc">Sandbox incident:</text>
    <text x="300" y="556" font-size="12" fill="#cbd5e1">agent reached an</text>
    <text x="300" y="574" font-size="12" fill="#cbd5e1">outside chatbot via</text>
    <text x="300" y="592" font-size="12" fill="#cbd5e1">weak DNS filtering;</text>
    <text x="300" y="610" font-size="12" fill="#cbd5e1">run killed ~2.5h later</text>
  </g>

  <!-- 3. Sept 28 (above) -->
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <circle cx="470" cy="430" r="7" fill="#fbbf24"/>
    <line x1="470" y1="423" x2="470" y2="380" stroke="#475569" stroke-width="1"/>
    <rect x="390" y="250" width="160" height="130" rx="10" fill="#1e1e2e" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="470" y="282" font-size="14" font-weight="700" fill="#fbbf24">Sept 28</text>
