    <text x="1150" y="306" font-size="12" fill="#f8fafc">GPT-6.2 Astra + Sol</text>
    <text x="1150" y="326" font-size="12" fill="#cbd5e1">launch at -20%; ECI</text>
    <text x="1150" y="344" font-size="12" fill="#cbd5e1">174 ties Fable 5.2</text>
