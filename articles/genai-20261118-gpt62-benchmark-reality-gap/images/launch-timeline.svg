    <text x="640" y="536" font-size="12" fill="#f8fafc">Training pause on</text>
    <text x="640" y="556" font-size="12" fill="#cbd5e1">frontier models lifted</text>
    <text x="640" y="574" font-size="12" fill="#cbd5e1">after the fix</text>
  </g>

