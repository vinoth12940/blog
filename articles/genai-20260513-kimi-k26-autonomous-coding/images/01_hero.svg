<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Kimi K2.6 — Open-Weight Agent Model</text>
  <text x="450" y="68" text-anchor="middle" fill="#64748b" font-size="13">1 Trillion Parameters · 32B Activated · Runs Agents for Hours Autonomously</text>

  <!-- Three pillars -->
  <!-- Pillar 1: Architecture -->
  <rect x="40" y="100" width="240" height="270" rx="12" fill="#1e1e2e" stroke="#3b82f6" stroke-width="2"/>
  <rect x="40" y="100" width="240" height="46" rx="12" fill="url(#blue)"/>
  <rect x="40" y="128" width="240" height="18" fill="url(#blue)"/>
  <text x="160" y="130" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Architecture</text>
  <text x="160" y="168" text-anchor="middle" fill="#94a3b8" font-size="11">MoE Model</text>
  <text x="160" y="192" text-anchor="middle" fill="#60a5fa" font-size="20" font-weight="bold">1T</text>
  <text x="160" y="212" text-anchor="middle" fill="#94a3b8" font-size="11">Total Parameters</text>
  <line x1="60" y1="225" x2="260" y2="225" stroke="#334155" stroke-width="1"/>
  <text x="160" y="248" text-anchor="middle" fill="#34d399" font-size="18" font-weight="bold">32B</text>
  <text x="160" y="268" text-anchor="middle" fill="#94a3b8" font-size="11">Activated per Token</text>
  <line x1="60" y1="282" x2="260" y2="282" stroke="#334155" stroke-width="1"/>
  <text x="160" y="305" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="bold">262K</text>
  <text x="160" y="323" text-anchor="middle" fill="#94a3b8" font-size="11">Token Context Window</text>
  <text x="160" y="353" text-anchor="middle" fill="#64748b" font-size="10">Released April 20, 2026</text>

  <!-- Pillar 2: Coding -->
  <rect x="330" y="100" width="240" height="270" rx="12" fill="#1e1e2e" stroke="#22c55e" stroke-width="2"/>
  <rect x="330" y="100" width="240" height="46" rx="12" fill="url(#green)"/>
  <rect x="330" y="128" width="240" height="18" fill="url(#green)"/>
  <text x="450" y="130" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Coding Performance</text>
  <text x="450" y="168" text-anchor="middle" fill="#94a3b8" font-size="11">SWE-Bench Pro Score</text>
  <text x="450" y="200" text-anchor="middle" fill="#4ade80" font-size="28" font-weight="bold">58.6%</text>
  <text x="450" y="222" text-anchor="middle" fill="#86efac" font-size="11">Kimi K2.6 (open-weight) ✓ #1</text>
  <line x1="350" y1="235" x2="550" y2="235" stroke="#334155" stroke-width="1"/>
  <text x="450" y="258" text-anchor="middle" fill="#94a3b8" font-size="11">vs GPT-5.4 (closed)</text>
  <text x="450" y="278" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="bold">57.7%</text>
  <line x1="350" y1="295" x2="550" y2="295" stroke="#334155" stroke-width="1"/>
  <text x="450" y="318" text-anchor="middle" fill="#94a3b8" font-size="11">vs Claude Opus 4.6 (closed)</text>
  <text x="450" y="338" text-anchor="middle" fill="#f87171" font-size="18" font-weight="bold">53.4%</text>
  <text x="450" y="360" text-anchor="middle" fill="#64748b" font-size="10">Per model provider benchmarks</text>

  <!-- Pillar 3: Agent Swarm -->
  <rect x="620" y="100" width="240" height="270" rx="12" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="620" y="100" width="240" height="46" rx="12" fill="url(#purple)"/>
  <rect x="620" y="128" width="240" height="18" fill="url(#purple)"/>
  <text x="740" y="130" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Agent Swarm</text>
  <text x="740" y="168" text-anchor="middle" fill="#94a3b8" font-size="11">Concurrent Sub-Agents</text>
  <text x="740" y="200" text-anchor="middle" fill="#a78bfa" font-size="28" font-weight="bold">300</text>
  <text x="740" y="222" text-anchor="middle" fill="#c4b5fd" font-size="11">parallel agents at once</text>
  <line x1="640" y1="235" x2="840" y2="235" stroke="#334155" stroke-width="1"/>
  <text x="740" y="258" text-anchor="middle" fill="#94a3b8" font-size="11">Coordinated Steps</text>
  <text x="740" y="280" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="bold">4,000</text>
  <line x1="640" y1="296" x2="840" y2="296" stroke="#334155" stroke-width="1"/>
  <text x="740" y="319" text-anchor="middle" fill="#94a3b8" font-size="11">Real-World Execution</text>
  <text x="740" y="339" text-anchor="middle" fill="#fb923c" font-size="16" font-weight="bold">13 Hours</text>
  <text x="740" y="355" text-anchor="middle" fill="#94a3b8" font-size="10">autonomous, no human input</text>
  <text x="740" y="372" text-anchor="middle" fill="#64748b" font-size="10">April 20, 2026 · open-weight</text>

  <!-- Footer -->
  <text x="450" y="405" text-anchor="middle" fill="#475569" font-size="11">Moonshot AI · moonshotai/Kimi-K2.6 on HuggingFace</text>
</svg>
