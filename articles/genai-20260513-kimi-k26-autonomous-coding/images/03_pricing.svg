<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" fill="url(#bg)" rx="16"/>

  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Frontier Model Pricing — Closed vs Open-Weight</text>
  <text x="450" y="67" text-anchor="middle" fill="#64748b" font-size="12">Cost per million tokens (input / output) · May 2026 · Source: official pricing pages</text>

  <!-- Headers -->
  <text x="175" y="100" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">Model</text>
  <text x="390" y="100" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">Input $/M</text>
  <text x="530" y="100" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">Output $/M</text>
  <text x="680" y="100" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">Type</text>
  <text x="820" y="100" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">SWE-Bench Pro</text>
  <line x1="40" y1="108" x2="860" y2="108" stroke="#334155" stroke-width="1"/>

  <!-- Row 1: Kimi K2.6 — highlight -->
  <rect x="40" y="112" width="820" height="44" rx="6" fill="#0f2d0f"/>
  <text x="100" y="130" fill="#4ade80" font-size="10" font-weight="bold">✦ OPEN</text>
  <text x="175" y="140" text-anchor="middle" fill="#f0fdf4" font-size="13" font-weight="bold">Kimi K2.6</text>
  <text x="390" y="140" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold">$0.60</text>
  <text x="530" y="140" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold">$2.50</text>
  <text x="680" y="140" text-anchor="middle" fill="#86efac" font-size="12">Open-Weight</text>
  <text x="820" y="140" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold">58.6% 🥇</text>
  <line x1="40" y1="156" x2="860" y2="156" stroke="#334155" stroke-width="1"/>

  <!-- Row 2: GPT-5.4 -->
  <text x="175" y="180" text-anchor="middle" fill="#e2e8f0" font-size="13">GPT-5.4</text>
  <text x="390" y="180" text-anchor="middle" fill="#fbbf24" font-size="14">$2.50</text>
  <text x="530" y="180" text-anchor="middle" fill="#fbbf24" font-size="14">~$10.00</text>
  <text x="680" y="180" text-anchor="middle" fill="#94a3b8" font-size="12">Closed</text>
  <text x="820" y="180" text-anchor="middle" fill="#e2e8f0" font-size="13">57.7%</text>
  <line x1="40" y1="194" x2="860" y2="194" stroke="#1e293b" stroke-width="1"/>

  <!-- Row 3: Claude Opus 4.7 -->
  <text x="175" y="218" text-anchor="middle" fill="#e2e8f0" font-size="13">Claude Opus 4.7</text>
  <text x="390" y="218" text-anchor="middle" fill="#fbbf24" font-size="14">$5.00</text>
  <text x="530" y="218" text-anchor="middle" fill="#fbbf24" font-size="14">$25.00</text>
  <text x="680" y="218" text-anchor="middle" fill="#94a3b8" font-size="12">Closed</text>
  <text x="820" y="218" text-anchor="middle" fill="#e2e8f0" font-size="13">53.4%</text>
  <line x1="40" y1="232" x2="860" y2="232" stroke="#1e293b" stroke-width="1"/>

  <!-- Row 4: GPT-5.5 Instant -->
  <text x="175" y="256" text-anchor="middle" fill="#e2e8f0" font-size="13">GPT-5.5 Instant</text>
  <text x="390" y="256" text-anchor="middle" fill="#fbbf24" font-size="14">$5.00</text>
  <text x="530" y="256" text-anchor="middle" fill="#fbbf24" font-size="14">$30.00</text>
  <text x="680" y="256" text-anchor="middle" fill="#94a3b8" font-size="12">Closed</text>
  <text x="820" y="256" text-anchor="middle" fill="#94a3b8" font-size="13">—</text>
  <line x1="40" y1="270" x2="860" y2="270" stroke="#1e293b" stroke-width="1"/>

  <!-- Savings callout -->
  <rect x="40" y="278" width="820" height="48" rx="10" fill="#1e1e2e" stroke="#22c55e" stroke-width="1"/>
  <text x="450" y="300" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="bold">Kimi K2.6: same price as GPT-5.4 on input — yet scores higher on SWE-Bench Pro</text>
  <text x="450" y="318" text-anchor="middle" fill="#64748b" font-size="11">8× cheaper than Claude Opus 4.7 on output · the first open-weight to beat closed frontier models on coding</text>

  <text x="450" y="350" text-anchor="middle" fill="#475569" font-size="10">Sources: platform.kimi.ai/docs/pricing · openai.com/api/pricing · anthropic.com/claude/opus · SWE-Bench Pro per model providers</text>
</svg>
