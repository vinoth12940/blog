<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="url(#bg)" rx="16"/>

  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Agent Swarm Architecture — How Kimi K2.6 Executes Long Tasks</text>
  <text x="450" y="67" text-anchor="middle" fill="#64748b" font-size="12">From user prompt to autonomous multi-agent execution</text>

  <!-- Stage 1: User Task -->
  <rect x="40" y="100" width="160" height="72" rx="10" fill="#1e1e2e" stroke="#60a5fa" stroke-width="2"/>
  <text x="120" y="128" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">User Task</text>
  <text x="120" y="148" text-anchor="middle" fill="#64748b" font-size="10">Complex prompt or</text>
  <text x="120" y="163" text-anchor="middle" fill="#64748b" font-size="10">codebase mission</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="136" x2="248" y2="136" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 2: Orchestrator -->
  <rect x="250" y="100" width="180" height="72" rx="10" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="2"/>
  <text x="340" y="125" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">K2.6 Orchestrator</text>
  <text x="340" y="145" text-anchor="middle" fill="#64748b" font-size="10">Decomposes task into</text>
  <text x="340" y="160" text-anchor="middle" fill="#64748b" font-size="10">sub-agent workstreams</text>

  <!-- Arrow 2 -->
  <line x1="430" y1="136" x2="478" y2="136" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 3: Sub-Agents -->
  <rect x="480" y="88" width="380" height="200" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="670" y="108" text-anchor="middle" fill="#64748b" font-size="11" font-weight="bold">Sub-Agent Pool (up to 300 concurrent)</text>

  <!-- Sub-agent cards -->
  <rect x="496" y="115" width="100" height="64" rx="8" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="546" y="136" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">Agent A</text>
  <text x="546" y="153" text-anchor="middle" fill="#64748b" font-size="9">Code write</text>
  <text x="546" y="168" text-anchor="middle" fill="#64748b" font-size="9">+ test</text>

  <rect x="610" y="115" width="100" height="64" rx="8" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="660" y="136" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">Agent B</text>
  <text x="660" y="153" text-anchor="middle" fill="#64748b" font-size="9">File read</text>
  <text x="660" y="168" text-anchor="middle" fill="#64748b" font-size="9">+ search</text>

  <rect x="724" y="115" width="100" height="64" rx="8" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="774" y="136" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">Agent C</text>
  <text x="774" y="153" text-anchor="middle" fill="#64748b" font-size="9">Verification</text>
  <text x="774" y="168" text-anchor="middle" fill="#64748b" font-size="9">+ review</text>

  <text x="670" y="210" text-anchor="middle" fill="#475569" font-size="10">·  ·  ·  up to 297 more agents  ·  ·  ·</text>

  <!-- Tool calls box -->
  <rect x="496" y="228" width="328" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="660" y="247" text-anchor="middle" fill="#94a3b8" font-size="10">Tool Access: code interpreter · web search · file ops · browser</text>
  <text x="660" y="264" text-anchor="middle" fill="#64748b" font-size="10">1,000+ tool calls per session · 4,000 coordinated steps max</text>

  <!-- Arrow to result -->
  <line x1="670" y1="290" x2="670" y2="330" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Result -->
  <rect x="510" y="332" width="320" height="64" rx="10" fill="#1e1e2e" stroke="#fb923c" stroke-width="2"/>
  <text x="670" y="358" text-anchor="middle" fill="#fdba74" font-size="13" font-weight="bold">Deliverable Output</text>
  <text x="670" y="376" text-anchor="middle" fill="#94a3b8" font-size="10">Completed code, document, report, website</text>
  <text x="670" y="392" text-anchor="middle" fill="#64748b" font-size="10">Autonomously — up to 13 hours, no human input needed</text>

  <!-- Pulsing dot on sub-agents -->
  <circle cx="858" cy="140" r="5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="858" y="157" text-anchor="middle" fill="#22c55e" font-size="9">LIVE</text>

  <!-- Footer -->
  <text x="450" y="445" text-anchor="middle" fill="#475569" font-size="11">Kimi K2.6 Agent Swarm · Scales from K2.5's 100 agents / 1,500 steps to 300 agents / 4,000 steps</text>
</svg>
