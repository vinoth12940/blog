<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
    <linearGradient id="cardG4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#172033"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="780" fill="url(#bgGrad4)"/>

  <text x="720" y="48" text-anchor="middle" fill="#f1f5f9" font-size="30" font-weight="700">MCP Ecosystem at the Inflection Point</text>
  <text x="720" y="76" text-anchor="middle" fill="#64748b" font-size="16">The protocol layer between AI models and the world</text>

  <!-- LEFT COLUMN: Scale -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="420" height="640" rx="14" fill="url(#cardG4)" stroke="#22d3ee" stroke-width="2"/>
    <text x="210" y="40" text-anchor="middle" fill="#22d3ee" font-size="18" font-weight="700">📈 Scale (Pre-Revision)</text>
    <line x1="30" y1="55" x2="390" y2="55" stroke="#334155" stroke-width="1"/>

    <!-- Stat 1 -->
    <text x="30" y="105" fill="#f1f5f9" font-size="40" font-weight="800">97M</text>
    <text x="175" y="100" fill="#94a3b8" font-size="15">monthly SDK downloads</text>
    <text x="175" y="120" fill="#64748b" font-size="13">Python + TS + Go + C# combined</text>

    <!-- Stat 2 -->
    <text x="30" y="200" fill="#f1f5f9" font-size="40" font-weight="800">10K+</text>
    <text x="155" y="195" fill="#94a3b8" font-size="15">MCP servers deployed</text>
    <text x="155" y="215" fill="#64748b" font-size="13">across enterprises + community</text>

    <!-- Stat 3 -->
    <text x="30" y="295" fill="#f1f5f9" font-size="40" font-weight="800">78%</text>
    <text x="155" y="290" fill="#94a3b8" font-size="15">of enterprise AI teams</text>
    <text x="155" y="310" fill="#64748b" font-size="13">have MCP-backed agents in prod</text>

    <!-- Stat 4 -->
    <text x="30" y="390" fill="#f1f5f9" font-size="40" font-weight="800">2 yrs</text>
    <text x="165" y="385" fill="#94a3b8" font-size="15">since Anthropic's Nov 2024 launch</text>
    <text x="165" y="405" fill="#64748b" font-size="13">donated to AAIF in 2025</text>

    <!-- Stat 5 -->
    <text x="30" y="485" fill="#f1f5f9" font-size="40" font-weight="800">4</text>
    <text x="80" y="480" fill="#94a3b8" font-size="15">official SDKs</text>
    <text x="80" y="500" fill="#64748b" font-size="13">Python, TypeScript, Go, C#</text>

    <!-- Governance note -->
    <rect x="20" y="530" width="380" height="90" rx="10" fill="#0f172a" stroke="#475569"/>
    <text x="210" y="555" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="600">🏛 Governance</text>
    <text x="210" y="578" text-anchor="middle" fill="#cbd5e1" font-size="13">Linux Foundation's Agentic AI Foundation</text>
    <text x="210" y="598" text-anchor="middle" fill="#64748b" font-size="12">Co-founded by Anthropic, Block, OpenAI</text>
  </g>

  <!-- MIDDLE COLUMN: The Stack -->
  <g transform="translate(490, 110)">
    <rect x="0" y="0" width="420" height="640" rx="14" fill="url(#cardG4)" stroke="#a78bfa" stroke-width="2"/>
    <text x="210" y="40" text-anchor="middle" fill="#a78bfa" font-size="18" font-weight="700">🏗 The Stack</text>
    <line x1="30" y1="55" x2="390" y2="55" stroke="#334155" stroke-width="1"/>

    <!-- Layer: Models -->
    <rect x="20" y="80" width="380" height="70" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="210" y="105" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">AI MODELS</text>
    <text x="210" y="128" text-anchor="middle" fill="#cbd5e1" font-size="13">Claude Opus 5 · GPT-5.6 · Gemini 3 · Llama 4</text>
    <text x="210" y="145" text-anchor="middle" fill="#64748b" font-size="11">The brains — agentic, tool-calling</text>

    <!-- down arrow -->
    <text x="210" y="172" text-anchor="middle" fill="#475569" font-size="18">↓</text>

    <!-- Layer: Hosts -->
    <rect x="20" y="185" width="380" height="70" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <text x="210" y="210" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">MCP HOSTS / CLIENTS</text>
    <text x="210" y="233" text-anchor="middle" fill="#cbd5e1" font-size="13">Claude Code · Cursor · VS Code · Cline</text>
    <text x="210" y="250" text-anchor="middle" fill="#64748b" font-size="11">Where the user sits — embeds MCP clients</text>

    <text x="210" y="277" text-anchor="middle" fill="#475569" font-size="18">↓</text>

    <!-- Layer: Protocol -->
    <rect x="20" y="290" width="380" height="90" rx="10" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/>
    <text x="210" y="315" text-anchor="middle" fill="#c4b5fd" font-size="16" font-weight="700">⚡ MCP PROTOCOL 2026-07-28</text>
    <text x="210" y="340" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Stateless · JSON-RPC 2.0 · Extensions</text>
    <text x="210" y="362" text-anchor="middle" fill="#a78bfa" font-size="12">← THIS IS WHAT JUST CHANGED</text>

    <text x="210" y="397" text-anchor="middle" fill="#475569" font-size="18">↓</text>

    <!-- Layer: Gateways -->
    <rect x="20" y="410" width="380" height="70" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="210" y="435" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="700">GATEWAYS / LOAD BALANCERS</text>
    <text x="210" y="458" text-anchor="middle" fill="#cbd5e1" font-size="13">Arcade · Stacklok · enterprise proxies</text>
    <text x="210" y="475" text-anchor="middle" fill="#64748b" font-size="11">The layer that BENEFITS from stateless</text>

    <text x="210" y="502" text-anchor="middle" fill="#475569" font-size="18">↓</text>

    <!-- Layer: Servers -->
    <rect x="20" y="515" width="380" height="105" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <text x="210" y="540" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="700">MCP SERVERS</text>
    <text x="210" y="563" text-anchor="middle" fill="#cbd5e1" font-size="13">10K+ servers · tools, resources, prompts</text>
    <text x="210" y="585" text-anchor="middle" fill="#64748b" font-size="12">GitHub · Slack · Postgres · filesystem</text>
    <text x="210" y="603" text-anchor="middle" fill="#64748b" font-size="12">Jira · Salesforce · custom internal APIs</text>
  </g>

  <!-- RIGHT COLUMN: Who Benefits -->
  <g transform="translate(940, 110)">
    <rect x="0" y="0" width="460" height="640" rx="14" fill="url(#cardG4)" stroke="#34d399" stroke-width="2"/>
    <text x="230" y="40" text-anchor="middle" fill="#34d399" font-size="18" font-weight="700">🏆 Who Benefits Most</text>
    <line x1="30" y1="55" x2="430" y2="55" stroke="#334155" stroke-width="1"/>

    <!-- Winner 1 -->
    <rect x="20" y="80" width="420" height="100" rx="10" fill="#0f172a" stroke="#334155"/>
    <rect x="20" y="80" width="6" height="100" rx="3" fill="#34d399"/>
    <text x="45" y="108" fill="#6ee7b7" font-size="15" font-weight="700">Enterprise Platform Teams</text>
    <text x="45" y="130" fill="#cbd5e1" font-size="13">Multiple servers behind LBs, multi-region,</text>
    <text x="45" y="148" fill="#cbd5e1" font-size="13">unified policy control point for agents</text>
    <text x="45" y="168" fill="#64748b" font-size="12" font-style="italic">→ Stateless = real horizontal scaling</text>

    <!-- Winner 2 -->
    <rect x="20" y="195" width="420" height="100" rx="10" fill="#0f172a" stroke="#334155"/>
    <rect x="20" y="195" width="6" height="100" rx="3" fill="#22d3ee"/>
    <text x="45" y="223" fill="#67e8f9" font-size="15" font-weight="700">Gateway Startups (Arcade, Stacklok)</text>
    <text x="45" y="245" fill="#cbd5e1" font-size="13">Headers enable L7 routing without DPI;</text>
    <text x="45" y="263" fill="#cbd5e1" font-size="13">MCP becomes operable like REST/gRPC</text>
    <text x="45" y="283" fill="#64748b" font-size="12" font-style="italic">→ Their thesis is validated by the spec</text>

    <!-- Winner 3 -->
    <rect x="20" y="310" width="420" height="100" rx="10" fill="#0f172a" stroke="#334155"/>
    <rect x="20" y="310" width="6" height="100" rx="3" fill="#a78bfa"/>
    <text x="45" y="338" fill="#c4b5fd" font-size="15" font-weight="700">Security / Governance Teams</text>
    <text x="45" y="360" fill="#cbd5e1" font-size="13">OAuth 2.0 alignment + iss validation;</text>
    <text x="45" y="378" fill="#cbd5e1" font-size="13">unified authz control point for agents</text>
    <text x="45" y="398" fill="#64748b" font-size="12" font-style="italic">→ "Agent-aware policy" now practical</text>

    <!-- Winner 4 -->
    <rect x="20" y="425" width="420" height="100" rx="10" fill="#0f172a" stroke="#334155"/>
    <rect x="20" y="425" width="6" height="100" rx="3" fill="#f59e0b"/>
    <text x="45" y="453" fill="#fcd34d" font-size="15" font-weight="700">Developers Building UIs</text>
    <text x="45" y="475" fill="#cbd5e1" font-size="13">MCP Apps extension = interactive HTML</text>
    <text x="45" y="493" fill="#cbd5e1" font-size="13">rendered in sandboxed iframe (not just text)</text>
    <text x="45" y="513" fill="#64748b" font-size="12" font-style="italic">→ Servers can now ship full UIs</text>

    <!-- Who's at risk -->
    <rect x="20" y="540" width="420" height="85" rx="10" fill="#450a0a" opacity="0.4" stroke="#ef4444" stroke-width="1.5"/>
    <text x="45" y="566" fill="#fca5a5" font-size="14" font-weight="700">⚠ Who's at Risk</text>
    <text x="45" y="588" fill="#fca5a5" font-size="13">Custom/homebrew MCP implementations</text>
    <text x="45" y="606" fill="#cbd5e1" font-size="12">that bypassed the SDKs — major rewrite ahead</text>
  </g>
</svg>
