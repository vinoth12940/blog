<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
    <linearGradient id="cardG2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#172033"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="800" fill="url(#bgGrad2)"/>

  <!-- Title -->
  <text x="720" y="50" text-anchor="middle" fill="#f1f5f9" font-size="30" font-weight="700">What Changed in the 2026-07-28 Revision</text>
  <text x="720" y="78" text-anchor="middle" fill="#64748b" font-size="16">6 pillars of the biggest MCP overhaul since launch</text>

  <!-- Pillar 1: Stateless Core -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="660" height="200" rx="14" fill="url(#cardG2)" stroke="#34d399" stroke-width="2"/>
    <circle cx="40" cy="45" r="22" fill="#34d399" opacity="0.2"/>
    <text x="40" y="52" text-anchor="middle" fill="#6ee7b7" font-size="20" font-weight="700">1</text>
    <text x="80" y="40" fill="#f1f5f9" font-size="20" font-weight="700">Stateless Core</text>
    <text x="80" y="62" fill="#34d399" font-size="13" font-weight="600">✓ The headline change</text>
    <text x="25" y="95" fill="#cbd5e1" font-size="14">• <tspan font-weight="600" fill="#e2e8f0">Removed:</tspan> initialize() handshake + protocol-level session IDs</text>
    <text x="25" y="118" fill="#cbd5e1" font-size="14">• <tspan font-weight="600" fill="#e2e8f0">Replaced:</tspan> version, client identity, capabilities ride in</text>
    <text x="45" y="138" fill="#cbd5e1" font-size="14">the <tspan font-family="monospace" fill="#22d3ee">_meta</tspan> parameter on <tspan font-weight="600">every request</tspan></text>
    <text x="25" y="161" fill="#cbd5e1" font-size="14">• New <tspan font-family="monospace" fill="#22d3ee">server/discover</tspan> method fetches capabilities on-demand</text>
    <text x="25" y="184" fill="#64748b" font-size="13" font-style="italic">→ Any request can be routed to any server instance</text>
  </g>

  <!-- Pillar 2: Routable Headers -->
  <g transform="translate(740, 110)">
    <rect x="0" y="0" width="660" height="200" rx="14" fill="url(#cardG2)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="40" cy="45" r="22" fill="#22d3ee" opacity="0.2"/>
    <text x="40" y="52" text-anchor="middle" fill="#67e8f9" font-size="20" font-weight="700">2</text>
    <text x="80" y="40" fill="#f1f5f9" font-size="20" font-weight="700">Routable HTTP Headers</text>
    <text x="80" y="62" fill="#22d3ee" font-size="13" font-weight="600">✓ Networking gear can route without parsing JSON-RPC</text>
    <text x="25" y="95" fill="#cbd5e1" font-size="14">• <tspan font-family="monospace" fill="#22d3ee">Mcp-Method</tspan> header required on every request</text>
    <text x="25" y="118" fill="#cbd5e1" font-size="14">• <tspan font-family="monospace" fill="#22d3ee">Mcp-Name</tspan> header for tools/call, resources/read, prompts/get</text>
    <text x="25" y="141" fill="#cbd5e1" font-size="14">• Load balancers route by header, no JSON-RPC body inspection</text>
    <text x="25" y="164" fill="#cbd5e1" font-size="14">• Servers reject requests where headers and body disagree</text>
    <text x="25" y="187" fill="#64748b" font-size="13" font-style="italic">→ Gateway-friendly: L7 routing without deep packet inspection</text>
  </g>

  <!-- Pillar 3: MRTR -->
  <g transform="translate(40, 330)">
    <rect x="0" y="0" width="660" height="200" rx="14" fill="url(#cardG2)" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="40" cy="45" r="22" fill="#a78bfa" opacity="0.2"/>
    <text x="40" y="52" text-anchor="middle" fill="#c4b5fd" font-size="20" font-weight="700">3</text>
    <text x="80" y="40" fill="#f1f5f9" font-size="20" font-weight="700">Multi-Round-Trip Requests (MRTR)</text>
    <text x="80" y="62" fill="#a78bfa" font-size="13" font-weight="600">✓ User confirmation without holding a stream open</text>
    <text x="25" y="95" fill="#cbd5e1" font-size="14">• Old way: keep SSE stream open while waiting for human input</text>
    <text x="25" y="118" fill="#cbd5e1" font-size="14">• New: server returns <tspan font-family="monospace" fill="#22d3ee">InputRequiredResult</tspan> + a</text>
    <text x="45" y="138" fill="#cbd5e1" font-size="14"><tspan font-family="monospace" fill="#22d3ee">requestState</tspan> blob (opaque to client)</text>
    <text x="25" y="161" fill="#cbd5e1" font-size="14">• Client reissues the call with answers + echoed state</text>
    <text x="25" y="184" fill="#64748b" font-size="13" font-style="italic">→ Any server instance picks up the retry — no pinning</text>
  </g>

  <!-- Pillar 4: Authorization Hardening -->
  <g transform="translate(740, 330)">
    <rect x="0" y="0" width="660" height="200" rx="14" fill="url(#cardG2)" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="40" cy="45" r="22" fill="#f59e0b" opacity="0.2"/>
    <text x="40" y="52" text-anchor="middle" fill="#fcd34d" font-size="20" font-weight="700">4</text>
    <text x="80" y="40" fill="#f1f5f9" font-size="20" font-weight="700">Authorization Hardening</text>
    <text x="80" y="62" fill="#f59e0b" font-size="13" font-weight="600">✓ Aligned with OAuth 2.0 / OIDC</text>
    <text x="25" y="95" fill="#cbd5e1" font-size="14">• Clients must validate <tspan font-family="monospace" fill="#22d3ee">iss</tspan> param per RFC 9207</text>
    <text x="25" y="118" fill="#cbd5e1" font-size="14">• Mitigates mix-up attacks (1 client → many servers)</text>
    <text x="25" y="141" fill="#cbd5e1" font-size="14">• <tspan font-family="monospace" fill="#22d3ee">application_type</tspan> declared in Dynamic Client Registration</text>
    <text x="25" y="164" fill="#cbd5e1" font-size="14">• CLI/desktop clients no longer mis-typed as "web"</text>
    <text x="25" y="187" fill="#64748b" font-size="13" font-style="italic">→ localhost redirect URIs finally work correctly</text>
  </g>

  <!-- Pillar 5: Deprecated Features -->
  <g transform="translate(40, 550)">
    <rect x="0" y="0" width="660" height="220" rx="14" fill="url(#cardG2)" stroke="#ef4444" stroke-width="2"/>
    <circle cx="40" cy="45" r="22" fill="#ef4444" opacity="0.2"/>
    <text x="40" y="52" text-anchor="middle" fill="#fca5a5" font-size="20" font-weight="700">5</text>
    <text x="80" y="40" fill="#f1f5f9" font-size="20" font-weight="700">Deprecated Features</text>
    <text x="80" y="62" fill="#ef4444" font-size="13" font-weight="600">⚠ 3 core features on a removal clock (12+ months)</text>
    <text x="25" y="95" fill="#cbd5e1" font-size="14">• <tspan font-weight="600" fill="#fca5a5">Roots</tspan> (filesystem boundaries) → use tool params / resource URIs</text>
    <text x="25" y="118" fill="#cbd5e1" font-size="14">• <tspan font-weight="600" fill="#fca5a5">Sampling</tspan> (server asks client's LLM) → direct LLM API calls</text>
    <text x="25" y="141" fill="#cbd5e1" font-size="14">• <tspan font-weight="600" fill="#fca5a5">Logging</tspan> (protocol-level notifications) → OpenTelemetry</text>
    <text x="25" y="164" fill="#cbd5e1" font-size="14">• Methods still work for ≥12 months — but plan migration</text>
    <text x="25" y="187" fill="#cbd5e1" font-size="14">• New error code: <tspan font-family="monospace" fill="#22d3ee">-32602</tspan> Invalid Params (was <tspan font-family="monospace">-32002</tspan>)</text>
    <text x="25" y="210" fill="#64748b" font-size="13" font-style="italic">→ "A lot of things that made MCP are gone" — David Soria Parra, Anthropic</text>
  </g>

  <!-- Pillar 6: Extensions -->
  <g transform="translate(740, 550)">
    <rect x="0" y="0" width="660" height="220" rx="14" fill="url(#cardG2)" stroke="#34d399" stroke-width="2"/>
    <circle cx="40" cy="45" r="22" fill="#34d399" opacity="0.2"/>
    <text x="40" y="52" text-anchor="middle" fill="#6ee7b7" font-size="20" font-weight="700">6</text>
    <text x="80" y="40" fill="#f1f5f9" font-size="20" font-weight="700">Extensions Framework</text>
    <text x="80" y="62" fill="#34d399" font-size="13" font-weight="600">✓ Test features before baking into the core</text>
    <text x="25" y="95" fill="#cbd5e1" font-size="14">• Identified by reverse-DNS IDs, negotiated via <tspan font-family="monospace" fill="#22d3ee">extensions</tspan> map</text>
    <text x="25" y="118" fill="#cbd5e1" font-size="14">• Live in own repos, version independently of spec</text>
    <text x="25" y="141" fill="#cbd5e1" font-size="14">• <tspan font-weight="600" fill="#6ee7b7">MCP Apps</tspan> — interactive HTML/JS apps via sandboxed iframe</text>
    <text x="25" y="164" fill="#cbd5e1" font-size="14">• <tspan font-weight="600" fill="#6ee7b7">Tasks</tspan> — long-running ops (tasks/get, tasks/update, tasks/cancel)</text>
    <text x="25" y="187" fill="#cbd5e1" font-size="14">• Build your own domain-specific extensions</text>
    <text x="25" y="210" fill="#64748b" font-size="13" font-style="italic">→ "A model to test things before we bake them in" — Den Delimarsky</text>
  </g>
</svg>
