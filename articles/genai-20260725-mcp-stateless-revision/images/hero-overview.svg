<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#172033"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1440" height="760" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="720" y="50" text-anchor="middle" fill="#f1f5f9" font-size="30" font-weight="700">MCP 2026-07-28: Stateful → Stateless</text>
  <text x="720" y="78" text-anchor="middle" fill="#64748b" font-size="16">The biggest Model Context Protocol overhaul since launch</text>

  <!-- LEFT: STATEFUL (old) -->
  <g transform="translate(40, 110)">
    <!-- Panel header -->
    <rect x="0" y="0" width="640" height="610" rx="16" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2" opacity="0.95"/>

    <!-- OLD badge -->
    <rect x="20" y="20" width="80" height="32" rx="8" fill="#ef4444" opacity="0.2"/>
    <text x="60" y="41" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">OLD</text>

    <text x="320" y="42" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="600">Stateful Sessions</text>

    <!-- Client -->
    <rect x="40" y="90" width="560" height="80" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="320" y="120" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">MCP Client (Claude, Cursor, etc.)</text>
    <text x="320" y="145" text-anchor="middle" fill="#64748b" font-size="13">1. initialize() handshake → server returns SessionID</text>

    <!-- Load Balancer -->
    <rect x="200" y="220" width="240" height="50" rx="8" fill="#334155" stroke="#475569"/>
    <text x="320" y="252" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="600">Load Balancer</text>
    <text x="450" y="252" fill="#ef4444" font-size="12">⚠ sticky sessions</text>

    <!-- Arrow client -> LB -->
    <line x1="320" y1="170" x2="320" y2="218" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="350" y="198" fill="#ef4444" font-size="12">SessionID: abc-123</text>

    <!-- 3 Server boxes with session state -->
    <!-- Server 1 -->
    <rect x="40" y="310" width="180" height="120" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <text x="130" y="335" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Server A</text>
    <rect x="55" y="350" width="150" height="60" rx="6" fill="#7f1d1d" opacity="0.4"/>
    <text x="130" y="372" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">Session Store</text>
    <text x="130" y="392" text-anchor="middle" fill="#f87171" font-size="11" font-family="monospace">abc-123 ✓</text>
    <text x="130" y="418" text-anchor="middle" fill="#64748b" font-size="11">stuck here forever</text>

    <!-- Server 2 -->
    <rect x="230" y="310" width="180" height="120" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="320" y="335" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">Server B</text>
    <rect x="245" y="350" width="150" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="320" y="372" text-anchor="middle" fill="#64748b" font-size="12">Session Store</text>
    <text x="320" y="392" text-anchor="middle" fill="#475569" font-size="11" font-family="monospace">abc-123 ✗</text>
    <text x="320" y="418" text-anchor="middle" fill="#64748b" font-size="11">doesn't know it</text>

    <!-- Server 3 -->
    <rect x="420" y="310" width="180" height="120" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="510" y="335" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">Server C</text>
    <rect x="435" y="350" width="150" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="510" y="372" text-anchor="middle" fill="#64748b" font-size="12">Session Store</text>
    <text x="510" y="392" text-anchor="middle" fill="#475569" font-size="11" font-family="monospace">abc-123 ✗</text>
    <text x="510" y="418" text-anchor="middle" fill="#64748b" font-size="11">doesn't know it</text>

    <!-- arrows LB to servers -->
    <line x1="240" y1="270" x2="130" y2="308" stroke="#475569" stroke-width="1.5"/>
    <line x1="320" y1="270" x2="320" y2="308" stroke="#475569" stroke-width="1.5"/>
    <line x1="400" y1="270" x2="510" y2="308" stroke="#475569" stroke-width="1.5"/>

    <!-- Problems list -->
    <text x="320" y="475" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="700">Problems</text>
    <text x="30" y="505" fill="#fca5a5" font-size="13">• Requires shared session store or sticky sessions</text>
    <text x="30" y="528" fill="#fca5a5" font-size="13">• Breaks behind stateless load balancers</text>
    <text x="30" y="551" fill="#fca5a5" font-size="13">• Session expiry forces re-handshakes</text>
    <text x="30" y="574" fill="#fca5a5" font-size="13">• Fights horizontal scaling — can't move</text>
    <text x="30" y="597" fill="#fca5a5" font-size="13">• 10K+ enterprise servers hit this wall</text>
  </g>

  <!-- RIGHT: STATELESS (new) -->
  <g transform="translate(760, 110)">
    <!-- Panel header -->
    <rect x="0" y="0" width="640" height="610" rx="16" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2" opacity="0.95"/>

    <!-- NEW badge -->
    <rect x="20" y="20" width="80" height="32" rx="8" fill="#34d399" opacity="0.2"/>
    <text x="60" y="41" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">NEW</text>

    <text x="320" y="42" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="600">Stateless Core</text>

    <!-- Client -->
    <rect x="40" y="90" width="560" height="80" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="320" y="120" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">MCP Client</text>
    <text x="320" y="145" text-anchor="middle" fill="#64748b" font-size="13">No initialize() — capabilities ride in _meta on every request</text>

    <!-- Load Balancer -->
    <rect x="200" y="220" width="240" height="50" rx="8" fill="#334155" stroke="#475569"/>
    <text x="320" y="252" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="600">Load Balancer</text>
    <text x="460" y="252" fill="#34d399" font-size="12">✓ round-robin</text>

    <!-- Arrow client -> LB -->
    <line x1="320" y1="170" x2="320" y2="218" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="350" y="198" fill="#34d399" font-size="12">_meta: {version, caps}</text>

    <!-- 3 Server boxes (any can serve) -->
    <!-- Server 1 -->
    <rect x="40" y="310" width="180" height="120" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="130" y="335" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Server A</text>
    <rect x="55" y="350" width="150" height="60" rx="6" fill="#064e3b" opacity="0.4"/>
    <text x="130" y="372" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Stateless</text>
    <text x="130" y="392" text-anchor="middle" fill="#34d399" font-size="11" font-family="monospace">handles any req ✓</text>
    <text x="130" y="418" text-anchor="middle" fill="#64748b" font-size="11">handles it</text>

    <!-- Server 2 -->
    <rect x="230" y="310" width="180" height="120" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="320" y="335" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Server B</text>
    <rect x="245" y="350" width="150" height="60" rx="6" fill="#064e3b" opacity="0.4"/>
    <text x="320" y="372" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Stateless</text>
    <text x="320" y="392" text-anchor="middle" fill="#34d399" font-size="11" font-family="monospace">handles any req ✓</text>
    <text x="320" y="418" text-anchor="middle" fill="#64748b" font-size="11">handles it</text>

    <!-- Server 3 -->
    <rect x="420" y="310" width="180" height="120" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="510" y="335" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Server C</text>
    <rect x="435" y="350" width="150" height="60" rx="6" fill="#064e3b" opacity="0.4"/>
    <text x="510" y="372" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Stateless</text>
    <text x="510" y="392" text-anchor="middle" fill="#34d399" font-size="11" font-family="monospace">handles any req ✓</text>
    <text x="510" y="418" text-anchor="middle" fill="#64748b" font-size="11">handles it</text>

    <!-- arrows LB to servers -->
    <line x1="240" y1="270" x2="130" y2="308" stroke="#34d399" stroke-width="1.5"/>
    <line x1="320" y1="270" x2="320" y2="308" stroke="#34d399" stroke-width="1.5"/>
    <line x1="400" y1="270" x2="510" y2="308" stroke="#34d399" stroke-width="1.5"/>

    <!-- Benefits list -->
    <text x="320" y="475" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">Benefits</text>
    <text x="30" y="505" fill="#6ee7b7" font-size="13">• Any server instance handles any request</text>
    <text x="30" y="528" fill="#6ee7b7" font-size="13">• Plain round-robin LB, no session affinity</text>
    <text x="30" y="551" fill="#6ee7b7" font-size="13">• No session expiry / re-handshake churn</text>
    <text x="30" y="574" fill="#6ee7b7" font-size="13">• Scales like a normal web service</text>
    <text x="30" y="597" fill="#6ee7b7" font-size="13">• Mirrors the stateless Claude Messages API</text>
  </g>

  <!-- Arrow between panels -->
  <text x="720" y="400" text-anchor="middle" fill="#22d3ee" font-size="36" font-weight="700">→</text>
</svg>
