<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrG3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1440" height="820" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <text x="720" y="48" text-anchor="middle" fill="#f1f5f9" font-size="30" font-weight="700">Migration Decision: Are You Affected?</text>
  <text x="720" y="76" text-anchor="middle" fill="#64748b" font-size="16">How much work depends entirely on how you built your MCP integration</text>

  <!-- Start node -->
  <rect x="520" y="110" width="400" height="60" rx="30" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="720" y="146" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">How did you build your MCP integration?</text>

  <!-- arrow down split -->
  <line x1="720" y1="170" x2="720" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="195" x2="1240" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="195" x2="200" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrW)"/>
  <line x1="720" y1="195" x2="720" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrW)"/>
  <line x1="1240" y1="195" x2="1240" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrW)"/>

  <!-- PATH A: Official SDK -->
  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="320" height="540" rx="14" fill="#172033" stroke="#34d399" stroke-width="2"/>
    <rect x="15" y="15" width="110" height="28" rx="6" fill="#34d399" opacity="0.2"/>
    <text x="70" y="34" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">PATH A · EASY</text>
    <text x="160" y="34" text-anchor="middle" fill="#94a3b8" font-size="14">~Hours</text>

    <text x="160" y="80" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">Used Official SDK</text>
    <text x="160" y="100" text-anchor="middle" fill="#64748b" font-size="13">Python, TS, Go, C#</text>

    <!-- Steps -->
    <rect x="20" y="125" width="280" height="50" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="155" text-anchor="middle" fill="#cbd5e1" font-size="13">✓ Update to beta SDK</text>

    <line x1="160" y1="175" x2="160" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="190" width="280" height="50" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="220" text-anchor="middle" fill="#cbd5e1" font-size="13">✓ Run existing test suite</text>

    <line x1="160" y1="240" x2="160" y2="255" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="255" width="280" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="280" text-anchor="middle" fill="#cbd5e1" font-size="13">✓ Rename FastMCP → MCPServer</text>
    <text x="160" y="300" text-anchor="middle" fill="#64748b" font-size="12">(Python v2 only)</text>

    <line x1="160" y1="320" x2="160" y2="335" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="335" width="280" height="50" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="365" text-anchor="middle" fill="#cbd5e1" font-size="13">✓ Pin upper bound on deps</text>

    <!-- Result -->
    <rect x="20" y="420" width="280" height="100" rx="10" fill="#064e3b" opacity="0.3" stroke="#34d399" stroke-width="2"/>
    <text x="160" y="450" text-anchor="middle" fill="#6ee7b7" font-size="15" font-weight="700">You're fine.</text>
    <text x="160" y="473" text-anchor="middle" fill="#34d399" font-size="12">SDK abstracts the stateless</text>
    <text x="160" y="490" text-anchor="middle" fill="#34d399" font-size="12">transition for you</text>
  </g>

  <!-- PATH B: Homebrew -->
  <g transform="translate(400, 220)">
    <rect x="0" y="0" width="320" height="540" rx="14" fill="#172033" stroke="#f59e0b" stroke-width="2"/>
    <rect x="15" y="15" width="120" height="28" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="75" y="34" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="700">PATH B · MEDIUM</text>
    <text x="180" y="34" text-anchor="middle" fill="#94a3b8" font-size="14">~Days</text>

    <text x="160" y="80" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">Forked / Extended SDK</text>
    <text x="160" y="100" text-anchor="middle" fill="#64748b" font-size="13">Custom middleware or transports</text>

    <rect x="20" y="125" width="280" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="150" text-anchor="middle" fill="#cbd5e1" font-size="13">⚠ Audit session ID usage</text>
    <text x="160" y="170" text-anchor="middle" fill="#64748b" font-size="12">where do you store/expect it?</text>

    <line x1="160" y1="190" x2="160" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="205" width="280" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="230" text-anchor="middle" fill="#cbd5e1" font-size="13">⚠ Add Mcp-Method header</text>
    <text x="160" y="250" text-anchor="middle" fill="#64748b" font-size="12">to all HTTP transport calls</text>

    <line x1="160" y1="270" x2="160" y2="285" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="285" width="280" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="310" text-anchor="middle" fill="#cbd5e1" font-size="13">⚠ Move caps to _meta</text>
    <text x="160" y="330" text-anchor="middle" fill="#64748b" font-size="12">remove initialize() dependency</text>

    <line x1="160" y1="350" x2="160" y2="365" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="365" width="280" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="390" text-anchor="middle" fill="#cbd5e1" font-size="13">⚠ Replace Sampling calls</text>
    <text x="160" y="410" text-anchor="middle" fill="#64748b" font-size="12">with direct LLM API integration</text>

    <!-- Result -->
    <rect x="20" y="450" width="280" height="80" rx="10" fill="#451a03" opacity="0.3" stroke="#f59e0b" stroke-width="2"/>
    <text x="160" y="478" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="700">Plan a sprint.</text>
    <text x="160" y="500" text-anchor="middle" fill="#f59e0b" font-size="12">12-month deprecation window</text>
    <text x="160" y="517" text-anchor="middle" fill="#f59e0b" font-size="12">gives you runway</text>
  </g>

  <!-- PATH C: Custom Impl -->
  <g transform="translate(760, 220)">
    <rect x="0" y="0" width="320" height="540" rx="14" fill="#172033" stroke="#ef4444" stroke-width="2"/>
    <rect x="15" y="15" width="130" height="28" rx="6" fill="#ef4444" opacity="0.2"/>
    <text x="80" y="34" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">PATH C · HARD</text>
    <text x="195" y="34" text-anchor="middle" fill="#94a3b8" font-size="14">~Weeks</text>

    <text x="160" y="80" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">Custom Implementation</text>
    <text x="160" y="100" text-anchor="middle" fill="#64748b" font-size="13">Hand-rolled JSON-RPC, no SDK</text>

    <rect x="20" y="125" width="280" height="50" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="155" text-anchor="middle" fill="#cbd5e1" font-size="13">✗ Remove initialize() entirely</text>

    <line x1="160" y1="175" x2="160" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="190" width="280" height="50" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="220" text-anchor="middle" fill="#cbd5e1" font-size="13">✗ Implement _meta propagation</text>

    <line x1="160" y1="240" x2="160" y2="255" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="255" width="280" height="50" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="285" text-anchor="middle" fill="#cbd5e1" font-size="13">✗ Add Mcp-Method/Mcp-Name</text>

    <line x1="160" y1="305" x2="160" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="320" width="280" height="50" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="350" text-anchor="middle" fill="#cbd5e1" font-size="13">✗ Implement MRTR for confirmations</text>

    <line x1="160" y1="370" x2="160" y2="385" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="385" width="280" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="410" text-anchor="middle" fill="#cbd5e1" font-size="13">✗ OAuth 2.0 iss validation</text>
    <text x="160" y="430" text-anchor="middle" fill="#64748b" font-size="12">+ RFC 9207 + app_type</text>

    <!-- Result -->
    <rect x="20" y="470" width="280" height="60" rx="10" fill="#450a0a" opacity="0.3" stroke="#ef4444" stroke-width="2"/>
    <text x="160" y="495" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="700">"A lot of uplift."</text>
    <text x="160" y="515" text-anchor="middle" fill="#ef4444" font-size="12">— David Soria Parra, Anthropic</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(1120, 220)">
    <rect x="0" y="0" width="280" height="540" rx="14" fill="#172033" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="15" y="15" width="100" height="28" rx="6" fill="#22d3ee" opacity="0.2"/>
    <text x="65" y="34" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">UNIVERSAL</text>

    <text x="140" y="80" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">For Everyone</text>
    <text x="140" y="100" text-anchor="middle" fill="#64748b" font-size="13">regardless of path</text>

    <rect x="20" y="125" width="240" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="140" y="150" text-anchor="middle" fill="#cbd5e1" font-size="13">📋 Check error code</text>
    <text x="140" y="170" text-anchor="middle" fill="#64748b" font-size="11">-32002 → -32602</text>

    <line x1="140" y1="190" x2="140" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="205" width="240" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="140" y="230" text-anchor="middle" fill="#cbd5e1" font-size="13">📋 Test backward compat</text>
    <text x="140" y="250" text-anchor="middle" fill="#64748b" font-size="11">2025-11-25 clients still work</text>

    <line x1="140" y1="270" x2="140" y2="285" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="285" width="240" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="140" y="310" text-anchor="middle" fill="#cbd5e1" font-size="13">📋 Evaluate extensions</text>
    <text x="140" y="330" text-anchor="middle" fill="#64748b" font-size="11">MCP Apps, Tasks</text>

    <line x1="140" y1="350" x2="140" y2="365" stroke="#475569" stroke-width="1.5" marker-end="url(#arrW)"/>

    <rect x="20" y="365" width="240" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="140" y="390" text-anchor="middle" fill="#cbd5e1" font-size="13">📋 Plan deprecation exit</text>
    <text x="140" y="410" text-anchor="middle" fill="#64748b" font-size="11">Roots/Sampling/Logging</text>

    <!-- Final box -->
    <rect x="20" y="450" width="240" height="80" rx="10" fill="#0c4a6e" opacity="0.3" stroke="#22d3ee" stroke-width="2"/>
    <text x="140" y="478" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">Test before July 28</text>
    <text x="140" y="500" text-anchor="middle" fill="#22d3ee" font-size="12">Beta SDKs are out NOW</text>
    <text x="140" y="517" text-anchor="middle" fill="#22d3ee" font-size="12">Python/TS/Go/C#</text>
  </g>
</svg>
