<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#d946ef"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#16a34a"/><stop offset="100%" stop-color="#22c55e"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="900" height="430" fill="url(#bg)" rx="16"/>
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">The Agent Stack Google Is Assembling</text>
  <text x="450" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">A consumer-facing agent needs more than a model: it needs surfaces, harness, runtime, and tools</text>
  
  <rect x="80" y="105" width="740" height="58" rx="12" fill="#1e1e2e" stroke="#06b6d4" stroke-width="2"/>
  <text x="110" y="140" fill="#67e8f9" font-size="13" font-weight="bold">Surface</text><text x="225" y="140" fill="#e2e8f0" font-size="14">Search box, AI Mode, Gemini app, Chrome, Docs</text>
  <rect x="80" y="178" width="740" height="58" rx="12" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="2"/>
  <text x="110" y="213" fill="#c4b5fd" font-size="13" font-weight="bold">Model</text><text x="225" y="213" fill="#e2e8f0" font-size="14">Gemini 3.5 Flash now; 3.5 Pro coming next month</text>
  <rect x="80" y="251" width="740" height="58" rx="12" fill="#1e1e2e" stroke="#f472b6" stroke-width="2"/>
  <text x="110" y="286" fill="#f9a8d4" font-size="13" font-weight="bold">Harness</text><text x="225" y="286" fill="#e2e8f0" font-size="14">Antigravity, subagents, generated UI, long-horizon workflows</text>
  <rect x="80" y="324" width="740" height="58" rx="12" fill="#1e1e2e" stroke="#22c55e" stroke-width="2"/>
  <text x="110" y="359" fill="#86efac" font-size="13" font-weight="bold">Runtime</text><text x="225" y="359" fill="#e2e8f0" font-size="14">Dedicated Google Cloud VMs, MCP tools, product data connectors</text>

</svg>