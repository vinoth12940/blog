<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#d946ef"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#16a34a"/><stop offset="100%" stop-color="#22c55e"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="900" height="400" fill="url(#bg)" rx="16"/>
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">The Trust Layer Becomes Infrastructure</text>
  <text x="450" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">SynthID and Content Credentials move alongside the agent push</text>
  
  <rect x="90" y="105" width="720" height="240" rx="18" fill="#111827" stroke="#334155"/>
  <circle cx="190" cy="215" r="58" fill="#1e1e2e" stroke="#3b82f6" stroke-width="3"/>
  <text x="190" y="205" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">100B+</text><text x="190" y="230" text-anchor="middle" fill="#94a3b8" font-size="12">images/videos</text>
  <circle cx="450" cy="215" r="58" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="3"/>
  <text x="450" y="205" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">60K</text><text x="450" y="230" text-anchor="middle" fill="#94a3b8" font-size="12">years audio</text>
  <circle cx="710" cy="215" r="58" fill="#1e1e2e" stroke="#22c55e" stroke-width="3"/>
  <text x="710" y="205" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Partners</text><text x="710" y="230" text-anchor="middle" fill="#94a3b8" font-size="12">OpenAI + others</text>
  <line x1="248" y1="215" x2="392" y2="215" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="508" y1="215" x2="652" y2="215" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="322" text-anchor="middle" fill="#64748b" font-size="12">Agentic systems increase output volume; provenance becomes infrastructure, not a nice-to-have.</text>

</svg>