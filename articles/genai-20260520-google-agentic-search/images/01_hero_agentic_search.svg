<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#d946ef"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#16a34a"/><stop offset="100%" stop-color="#22c55e"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="900" height="400" fill="url(#bg)" rx="16"/>
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Google I/O 2026: The Agentic Search Shift</text>
  <text x="450" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">Search becomes a runtime for background agents, generated UIs, and personal workflows</text>
  
  <rect x="55" y="95" width="790" height="245" rx="18" fill="#111827" stroke="#334155"/>
  <text x="450" y="128" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">From Answer Engine to Action Engine</text>
  <rect x="85" y="160" width="170" height="120" rx="14" fill="#1e1e2e" stroke="#3b82f6" stroke-width="2"/><text x="170.0" y="190" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">Search</text><text x="170.0" y="218" text-anchor="middle" fill="#94a3b8" font-size="12">2.5B AI Overview users</text><text x="170.0" y="238" text-anchor="middle" fill="#94a3b8" font-size="12">1B AI Mode users</text><line x1="255" y1="220" x2="330" y2="220" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="160" width="190" height="120" rx="14" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="2"/><text x="425.0" y="190" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">Gemini 3.5 Flash</text><text x="425.0" y="218" text-anchor="middle" fill="#94a3b8" font-size="12">Default in AI Mode</text><text x="425.0" y="238" text-anchor="middle" fill="#94a3b8" font-size="12">4x output speed claim</text><line x1="520" y1="220" x2="595" y2="220" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/><rect x="595" y="160" width="220" height="120" rx="14" fill="#1e1e2e" stroke="#22c55e" stroke-width="2"/><text x="705.0" y="190" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">Agents</text><text x="705.0" y="218" text-anchor="middle" fill="#94a3b8" font-size="12">24/7 monitoring</text><text x="705.0" y="238" text-anchor="middle" fill="#94a3b8" font-size="12">booking + mini apps</text><text x="450" y="318" text-anchor="middle" fill="#64748b" font-size="12">Google is moving discovery, reasoning, and execution into the same surface.</text>
</svg>