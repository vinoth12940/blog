<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>

  <text x="720" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="27" font-weight="700" fill="#f8fafc">GLM-5.3: Same 743B Base Model, Every Gain From Post-Training</text>
  <text x="720" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#64748b">No pretraining was repeated. RL environments, long-horizon training, and more compute produced every jump below.</text>

  <!-- GLM-5.2 card -->
  <rect x="80" y="130" width="360" height="520" rx="16" fill="#0c1626" stroke="#475569" stroke-width="2"/>
  <rect x="80" y="130" width="360" height="58" rx="16" fill="#1e293b"/>
  <rect x="80" y="170" width="360" height="18" fill="#1e293b"/>
  <text x="260" y="167" text-anchor="middle" font-family="Inter, sans-serif" font-size="21" font-weight="700" fill="#e2e8f0">GLM-5.2 (June 2026)</text>
  <text x="260" y="216" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#64748b">743B-param MoE · ~40B active per token</text>

  <text x="110" y="260" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Benchmark baseline</text>
  <circle cx="122" cy="290" r="3" fill="#64748b"/><text x="136" y="295" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">Terminal-Bench 3.0</text>
  <text x="410" y="295" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#94a3b8">4.6</text>
  <circle cx="122" cy="325" r="3" fill="#64748b"/><text x="136" y="330" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">DeepSWE v1.1</text>
  <text x="410" y="330" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#94a3b8">46.2</text>
  <circle cx="122" cy="360" r="3" fill="#64748b"/><text x="136" y="365" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">ExploitBench</text>
  <text x="410" y="365" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#94a3b8">24.4</text>
  <circle cx="122" cy="395" r="3" fill="#64748b"/><text x="136" y="400" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">ExploitGym (2h)</text>
  <text x="410" y="400" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#94a3b8">29</text>
  <circle cx="122" cy="430" r="3" fill="#64748b"/><text x="136" y="435" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">Agents' Last Exam CLI</text>
  <text x="410" y="435" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#94a3b8">23.8</text>

  <text x="110" y="490" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Weights: MIT, days after launch</text>
  <text x="110" y="525" font-family="Inter, sans-serif" font-size="13" fill="#64748b">The frontier baseline Z.ai kept</text>
  <text x="110" y="548" font-family="Inter, sans-serif" font-size="13" fill="#64748b">training on top of.</text>

  <!-- Post-training stack -->
  <rect x="500" y="150" width="400" height="66" rx="10" fill="#0c1e3a" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="178" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#93c5fd">IndexShare</text>
  <text x="700" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#60a5fa">efficient long-context reasoning</text>

  <rect x="500" y="244" width="400" height="66" rx="10" fill="#0c1e3a" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="272" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#93c5fd">SAO</text>
  <text x="700" y="294" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#60a5fa">RL for long-horizon, multi-step tasks</text>

  <rect x="500" y="338" width="400" height="66" rx="10" fill="#0c1e3a" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="366" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#93c5fd">slime (open source)</text>
  <text x="700" y="388" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#60a5fa">asynchronous RL training infrastructure</text>

  <rect x="500" y="432" width="400" height="66" rx="10" fill="#0c1e3a" stroke="#7c3aed" stroke-width="2"/>
  <text x="700" y="460" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#c4b5fd">Scaled environment pipelines</text>
  <text x="700" y="482" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8b5cf6">research agents + judge agents verify tasks</text>

  <text x="700" y="545" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#94a3b8">One month of scaling:</text>
  <text x="700" y="570" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">more environments · more diversity · more compute</text>
  <text x="700" y="598" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#64748b">some tasks = several days of expert engineer work</text>

  <!-- Arrows -->
  <line x1="440" y1="360" x2="492" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="900" y1="360" x2="952" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- GLM-5.3 card -->
  <rect x="1000" y="130" width="360" height="520" rx="16" fill="#052e1e" stroke="#10b981" stroke-width="2.5"/>
  <rect x="1000" y="130" width="360" height="58" rx="16" fill="#064e3b"/>
  <rect x="1000" y="170" width="360" height="18" fill="#064e3b"/>
  <text x="1180" y="167" text-anchor="middle" font-family="Inter, sans-serif" font-size="21" font-weight="700" fill="#d1fae5">GLM-5.3 (Aug 14, 2026)</text>
  <text x="1180" y="216" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#34d399">identical base weights · post-training only</text>

  <text x="1030" y="260" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6ee7b7">Result</text>
  <circle cx="1042" cy="290" r="3" fill="#10b981"/><text x="1056" y="295" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">Terminal-Bench 3.0</text>
  <text x="1330" y="295" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#34d399">28.3</text>
  <circle cx="1042" cy="325" r="3" fill="#10b981"/><text x="1056" y="330" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">DeepSWE v1.1</text>
  <text x="1330" y="330" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#34d399">66.9</text>
  <circle cx="1042" cy="360" r="3" fill="#10b981"/><text x="1056" y="365" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">ExploitBench</text>
  <text x="1330" y="365" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#34d399">54.4</text>
  <circle cx="1042" cy="395" r="3" fill="#10b981"/><text x="1056" y="400" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">ExploitGym (2h)</text>
  <text x="1330" y="400" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#34d399">105</text>
  <circle cx="1042" cy="430" r="3" fill="#10b981"/><text x="1056" y="435" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">Agents' Last Exam CLI</text>
  <text x="1330" y="435" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#34d399">28.5</text>

  <text x="1030" y="490" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6ee7b7">Weights: held back</text>
  <rect x="1030" y="508" width="300" height="34" rx="17" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1180" y="530" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#fca5a5">First GLM safety hold · ~Aug 28</text>
  <text x="1030" y="575" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Open-weights SOTA: Terminal-Bench 3.0,</text>
  <text x="1030" y="598" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Agents' Last Exam, CyberGym (all models)</text>

  <text x="720" y="715" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#94a3b8">Z.ai Code Bench: 31.4% at ~50K output tokens vs Opus 4.8's 29.5% at 120K —</text>
  <text x="720" y="740" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#94a3b8">more done with 58% fewer tokens. Claude Fable 5 still leads at 39.5%.</text>
  <text x="720" y="776" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#475569">Source: Z.ai GLM-5.3 launch post (vendor-reported benchmarks), Aug 14, 2026</text>
</svg>
