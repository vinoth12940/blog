<svg width="1440" height="810" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="#0f172a"/>

  <text x="600" y="52" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#f1f5f9">Your agent stack just became a security architecture</text>
  <text x="600" y="80" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#94a3b8">Four layers, each answering a question the layer above cannot</text>

  <!-- Layer 4 top -->
  <g>
    <rect x="120" y="112" width="960" height="98" rx="12" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="600" y="146" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#a78bfa">Access tiers — who gets the dangerous capability at all</text>
    <text x="600" y="172" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">OpenAI: alpha testers first, then the "Daybreak Blue" defensive-use program</text>
    <text x="600" y="193" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">answers: should this deployment exist?</text>
  </g>

  <line x1="600" y1="210" x2="600" y2="240" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow3)"/>

  <!-- Layer 3 -->
  <g>
    <rect x="120" y="246" width="960" height="98" rx="12" fill="#1e1e2e" stroke="#5eead4" stroke-width="1.5"/>
    <text x="600" y="280" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#5eead4">Model-level refusals — the model policing itself</text>
    <text x="600" y="306" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">91.5% refusal on cyber jailbreak attempts — strong, but probabilistic</text>
    <text x="600" y="327" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">answers: will it comply with an attacker? (usually not — but not never)</text>
  </g>

  <line x1="600" y1="344" x2="600" y2="374" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow3)"/>

  <!-- Layer 2 -->
  <g>
    <rect x="120" y="380" width="960" height="98" rx="12" fill="#1e1e2e" stroke="#fb923c" stroke-width="1.5"/>
    <text x="600" y="414" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#fb923c">Runtime policy fences — scope verified before every execution</text>
    <text x="600" y="440" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">OpenShell (Apache 2.0, v0.1.0): traces actions, refuses workloads with provable escape paths</text>
    <text x="600" y="461" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">answers: is this specific action inside the granted scope?</text>
  </g>

  <line x1="600" y1="478" x2="600" y2="508" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow3)"/>

  <!-- Layer 1 bottom -->
  <g>
    <rect x="120" y="514" width="960" height="98" rx="12" fill="#1e1e2e" stroke="#f87171" stroke-width="1.5"/>
    <text x="600" y="548" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#f87171">Hardware enforcement — quarantine that a compromised host cannot reach</text>
    <text x="600" y="574" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">Nvidia Sentry on BlueField-4 DPUs: inspects agent traffic at line speed, kills in milliseconds, out-of-band</text>
    <text x="600" y="595" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">answers: if everything above failed, who can still pull the plug?</text>
  </g>

  <text x="600" y="648" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">The shape mirrors zero trust: never trust the layer above you, verify everything below you</text>
</svg>
