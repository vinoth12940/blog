<svg width="1440" height="810" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">September 2026: agents moved into their own computers</text>
  <text x="600" y="80" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#94a3b8">OpenAI's "Dots" and the containment stack that showed up three days later</text>

  <!-- User node -->
  <g>
    <rect x="45" y="150" width="185" height="72" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
    <text x="137" y="180" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">You</text>
    <text x="137" y="203" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">one chat window</text>
  </g>

  <line x1="230" y1="186" x2="292" y2="186" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="261" y="172" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#94a3b8">goal</text>

  <!-- Dot agent card -->
  <g>
    <rect x="300" y="118" width="300" height="136" rx="14" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="450" y="152" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#a78bfa">Dot — your agent</text>
    <text x="450" y="176" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#94a3b8">always-on, runs for days</text>
    <rect x="322" y="196" width="256" height="38" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="450" y="219" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#c4b5fd">its own cloud computer</text>
  </g>

  <!-- Capability chips (right column) -->
  <line x1="600" y1="186" x2="668" y2="186" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#arrowP)"/>
  <text x="634" y="172" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#94a3b8">acts</text>

  <g>
    <rect x="678" y="96" width="250" height="50" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
    <text x="803" y="126" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#5eead4">Email and calendar</text>
  </g>
  <g>
    <rect x="678" y="162" width="250" height="50" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
    <text x="803" y="192" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#5eead4">Bookings and purchases</text>
  </g>
  <g>
    <rect x="678" y="228" width="250" height="50" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
    <text x="803" y="258" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#5eead4">Files, code, reports</text>
  </g>

  <!-- arrow down from Dot to containment -->
  <line x1="450" y1="254" x2="450" y2="316" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="462" y="290" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">every action now passes through</text>

  <!-- Containment stack band -->
  <g>
    <rect x="300" y="326" width="270" height="118" rx="14" fill="#1e1e2e" stroke="#fb923c" stroke-width="1.5"/>
    <text x="435" y="360" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#fb923c">Policy fence</text>
    <text x="435" y="384" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">OpenShell runtime (open source)</text>
    <text x="435" y="404" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">verifies scope before execution</text>
    <text x="435" y="424" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">refuses provable escape paths</text>
  </g>

  <line x1="570" y1="385" x2="640" y2="385" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <g>
    <rect x="650" y="326" width="278" height="118" rx="14" fill="#1e1e2e" stroke="#f87171" stroke-width="1.5"/>
    <text x="789" y="360" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#f87171">Hardware kill switch</text>
    <text x="789" y="384" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">Nvidia Sentry on BlueField-4 DPU</text>
    <text x="789" y="404" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">quarantines agents out-of-band,</text>
    <text x="789" y="424" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">unreachable from a hacked host</text>
  </g>

  <!-- The gap callout -->
  <g>
    <rect x="80" y="490" width="1040" height="130" rx="14" fill="#1a1330" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="600" y="526" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#fbbf24">The gap nobody shipped a fix for</text>
    <text x="600" y="556" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#e2e8f0">Consumer agents with your credit card — a $1B SMS agent with no published safety boundary —</text>
    <text x="600" y="580" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#e2e8f0">run outside every layer above. The enterprise got containment; consumers got a phone number.</text>
  </g>

  <text x="600" y="655" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#475569">Sources: OpenAI DevDay 2026, Nvidia Open Agent Safety Platform, UK AISI evaluations — Sep 28-30, 2026</text>
</svg>
