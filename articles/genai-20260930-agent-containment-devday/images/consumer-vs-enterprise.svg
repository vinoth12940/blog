<svg width="1440" height="760" viewBox="0 0 1200 634" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="634" fill="#0f172a"/>

  <text x="600" y="48" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f1f5f9">Same week, opposite philosophies</text>
  <text x="600" y="75" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#94a3b8">The enterprise agent and the consumer agent got completely different ships</text>

  <!-- Left column header -->
  <g>
    <rect x="60" y="102" width="520" height="56" rx="12" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="320" y="136" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#a78bfa">Enterprise: gated, fenced, audited</text>
  </g>

  <!-- Right column header -->
  <g>
    <rect x="620" y="102" width="520" height="56" rx="12" fill="#1e1e2e" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="880" y="136" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#fbbf24">Consumer: shipped, unmeasured</text>
  </g>

  <!-- Left rows -->
  <g>
    <rect x="60" y="176" width="520" height="74" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
    <text x="84" y="206" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e2e8f0">GPT-6 Astra</text>
    <text x="84" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">held back from public launch; staged alpha, then defensive program</text>
  </g>
  <g>
    <rect x="60" y="266" width="520" height="74" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
    <text x="84" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e2e8f0">GPT-6.1 Astra</text>
    <text x="84" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">cancelled outright — "didn't meet the scope and authorization bar"</text>
  </g>
  <g>
    <rect x="60" y="356" width="520" height="74" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
    <text x="84" y="386" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e2e8f0">OpenShell + Sentry</text>
    <text x="84" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">runtime fences plus a DPU kill switch, 100+ enterprise partners</text>
  </g>
  <g>
    <rect x="60" y="446" width="520" height="74" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
    <text x="84" y="476" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e2e8f0">Published metrics</text>
    <text x="84" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">benchmarks, refusal rates, incident reports — all public and arguable</text>
  </g>

  <!-- Right rows -->
  <g>
    <rect x="620" y="176" width="520" height="74" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
    <text x="644" y="206" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e2e8f0">$1B SMS agent (Instinct)</text>
    <text x="644" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">books travel, pays bills, orders groceries — from your phone number</text>
  </g>
  <g>
    <rect x="620" y="266" width="520" height="74" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
    <text x="644" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e2e8f0">Meta Muse + integrations</text>
    <text x="644" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">synced 187,000 iMessage rows for a tester who declined access</text>
  </g>
  <g>
    <rect x="620" y="356" width="520" height="74" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
    <text x="644" y="386" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e2e8f0">Scope of the safety stack</text>
    <text x="644" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">enterprise deployments on hyperscaler infrastructure — not your SMS thread</text>
  </g>
  <g>
    <rect x="620" y="446" width="520" height="74" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
    <text x="644" y="476" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e2e8f0">Published metrics</text>
    <text x="644" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#94a3b8">none — no users, no growth, no revenue, no safety evals</text>
  </g>

  <!-- Bottom takeaway -->
  <g>
    <rect x="60" y="548" width="1080" height="62" rx="12" fill="#1a1330" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="600" y="574" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#fbbf24">The agents handling consumer money and messages are the ones operating with the least disclosure</text>
    <text x="600" y="596" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#e2e8f0">and the pattern repeated across four labs in one 48-hour window</text>
  </g>
</svg>
