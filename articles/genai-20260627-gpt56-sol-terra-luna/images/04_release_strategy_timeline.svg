<svg width="1440" height="760" viewBox="0 0 1440 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="760" fill="#0f172a"/>

  <!-- Title -->
  <text x="720" y="55" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="36" font-weight="700">The Government-Influenced Release</text>
  <text x="720" y="88" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="18">Why GPT-5.6 didn't just drop — it was previewed to the US government first</text>

  <!-- Timeline line -->
  <line x1="180" y1="200" x2="1260" y2="200" stroke="#334155" stroke-width="3"/>

  <!-- Phase 1 -->
  <circle cx="240" cy="200" r="14" fill="#fbbf24"/>
  <text x="240" y="170" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Phase 1</text>
  <rect x="80" y="230" width="320" height="160" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="240" y="258" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Government preview</text>
  <text x="240" y="285" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">OpenAI shares capabilities</text>
  <text x="240" y="305" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">with US government</text>
  <text x="240" y="335" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">At their request, limited preview</text>
  <text x="240" y="355" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">rather than full GA</text>
  <rect x="120" y="365" width="240" height="20" rx="10" fill="#fbbf24" opacity="0.1"/>
  <text x="240" y="380" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Unprecedented for OpenAI</text>

  <!-- Phase 2 -->
  <circle cx="600" cy="200" r="14" fill="#60a5fa"/>
  <text x="600" y="170" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Phase 2</text>
  <rect x="440" y="230" width="320" height="160" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="600" y="258" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Trusted partner access</text>
  <text x="600" y="285" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">Small group of vetted</text>
  <text x="600" y="305" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">organizations</text>
  <text x="600" y="335" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Participation shared</text>
  <text x="600" y="355" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">with the government</text>
  <rect x="480" y="365" width="240" height="20" rx="10" fill="#60a5fa" opacity="0.1"/>
  <text x="600" y="380" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">June 26, 2026 — today</text>

  <!-- Phase 3 -->
  <circle cx="960" cy="200" r="14" fill="#34d399"/>
  <text x="960" y="170" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Phase 3</text>
  <rect x="800" y="230" width="320" height="160" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="960" y="258" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">General availability</text>
  <text x="960" y="285" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">Sol, Terra, Luna available</text>
  <text x="960" y="305" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">to all developers</text>
  <text x="960" y="335" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">"In the coming weeks"</text>
  <text x="960" y="355" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">No fixed date given</text>
  <rect x="840" y="365" width="240" height="20" rx="10" fill="#34d399" opacity="0.1"/>
  <text x="960" y="380" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Expected July 2026</text>

  <!-- Phase 4 -->
  <circle cx="1200" cy="200" r="14" fill="#475569"/>
  <text x="1200" y="170" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Phase 4</text>
  <rect x="1080" y="230" width="240" height="160" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="1200" y="258" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Tier divergence</text>
  <text x="1200" y="285" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="14">Each tier evolves</text>
  <text x="1200" y="305" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="14">on its own cadence</text>
  <text x="1200" y="335" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="13">Sol ≠ Terra ≠ Luna</text>
  <text x="1200" y="355" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="13">going forward</text>

  <!-- Context section -->
  <line x1="120" y1="440" x2="1320" y2="440" stroke="#334155" stroke-width="1"/>

  <text x="120" y="475" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="20" font-weight="600">Why this matters:</text>

  <rect x="120" y="495" width="400" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="140" y="520" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Precedent set</text>
  <text x="140" y="542" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Frontier models now require</text>
  <text x="140" y="560" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">government awareness before release</text>
  <text x="140" y="578" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Echoes Claude Fable 5 export controls (June 2026)</text>

  <rect x="540" y="495" width="400" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="560" y="520" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Developer impact</text>
  <text x="560" y="542" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">API access gated behind</text>
  <text x="560" y="560" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">trusted-partner approval</text>
  <text x="560" y="578" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Most devs still on GPT-5.5 for now</text>

  <rect x="960" y="495" width="360" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="980" y="520" fill="#f87171" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Geopolitical signal</text>
  <text x="980" y="542" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Five Eyes AI cyber warning (June 22)</text>
  <text x="980" y="560" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">coincides with controlled release</text>
  <text x="980" y="578" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">National security framing accelerating</text>

  <!-- Footer -->
  <text x="720" y="640" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="16" font-style="italic">"As part of our ongoing engagement with the U.S. government, we previewed</text>
  <text x="720" y="665" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="16" font-style="italic">our plans and the models' capabilities ahead of today's launch."</text>
  <text x="720" y="695" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="14">— OpenAI, June 26, 2026</text>
</svg>
