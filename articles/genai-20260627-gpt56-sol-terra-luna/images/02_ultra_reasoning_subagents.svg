<svg width="1440" height="820" viewBox="0 0 1440 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="820" fill="#0f172a"/>

  <!-- Title -->
  <text x="720" y="55" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="36" font-weight="700">GPT-5.6 Sol "ultra" Reasoning Mode</text>
  <text x="720" y="88" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="18">Beyond single-agent: subagents accelerate complex work in parallel</text>

  <!-- User prompt -->
  <rect x="540" y="120" width="360" height="56" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="720" y="145" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="600">User prompt (complex task)</text>
  <text x="720" y="166" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="14">e.g. "Audit this codebase for security vulnerabilities"</text>

  <line x1="720" y1="176" x2="720" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Sol Orchestrator -->
  <rect x="460" y="230" width="520" height="80" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="720" y="262" text-anchor="middle" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">GPT-5.6 Sol — Orchestrator</text>
  <text x="720" y="290" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16">Plans → decomposes task → dispatches subagents → synthesizes</text>

  <!-- Fan-out lines -->
  <line x1="500" y1="310" x2="230" y2="390" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="640" y1="310" x2="500" y2="390" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="800" y1="310" x2="940" y2="390" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="940" y1="310" x2="1210" y2="390" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Subagent 1 -->
  <rect x="80" y="400" width="300" height="100" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="230" y="428" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="17" font-weight="600">Subagent 1</text>
  <text x="230" y="452" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="15">Static analysis</text>
  <text x="230" y="476" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Dependencies, imports, config</text>

  <!-- Subagent 2 -->
  <rect x="410" y="400" width="300" height="100" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="560" y="428" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="17" font-weight="600">Subagent 2</text>
  <text x="560" y="452" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="15">Dynamic analysis</text>
  <text x="560" y="476" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Runtime traces, test execution</text>

  <!-- Subagent 3 -->
  <rect x="740" y="400" width="300" height="100" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="890" y="428" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="17" font-weight="600">Subagent 3</text>
  <text x="890" y="452" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="15">Vulnerability scan</text>
  <text x="890" y="476" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">CVE matching, exploit paths</text>

  <!-- Subagent 4 -->
  <rect x="1070" y="400" width="300" height="100" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1220" y="428" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="17" font-weight="600">Subagent 4</text>
  <text x="1220" y="452" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="15">Patch generation</text>
  <text x="1220" y="476" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Fix proposals, test diffs</text>

  <!-- Fan-in lines -->
  <line x1="230" y1="500" x2="500" y2="580" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="560" y1="500" x2="640" y2="580" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="890" y1="500" x2="800" y2="580" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="1220" y1="500" x2="940" y2="580" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Synthesis -->
  <rect x="460" y="590" width="520" height="80" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="720" y="622" text-anchor="middle" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">Sol — Synthesis &amp; response</text>
  <text x="720" y="650" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16">Merges findings → prioritizes → delivers unified report</text>

  <line x1="720" y1="670" x2="720" y2="710" stroke="#475569" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Output -->
  <rect x="500" y="720" width="440" height="56" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="720" y="745" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="18" font-weight="600">Unified, comprehensive response</text>
  <text x="720" y="766" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="14">4 parallel agents → single coherent answer</text>
</svg>
