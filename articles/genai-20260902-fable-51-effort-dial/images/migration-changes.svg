<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" font-family="Inter, -apple-system, sans-serif">
  <rect width="1440" height="880" fill="#0f172a"/>

  <text x="720" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#f1f5f9">Migrating to claude-fable-5-1</text>
  <text x="720" y="92" text-anchor="middle" font-size="18" fill="#94a3b8">Three breaking changes to handle, five additive upgrades to adopt — plus an effort default that changes your bill</text>

  <!-- Left: breaking -->
  <rect x="70" y="130" width="630" height="560" rx="16" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="100" y="180" font-size="22" font-weight="700" fill="#f87171">⚠ Breaking — will error or invalidate</text>

  <g>
    <rect x="100" y="210" width="570" height="130" rx="10" fill="#0b1220" stroke="#7f1d1d" stroke-width="1"/>
    <text x="125" y="245" font-size="16" font-weight="700" fill="#fca5a5">1 · Forced tool use now returns an error</text>
    <text x="125" y="272" font-size="14" fill="#94a3b8">tool_choice forcing is rejected on 5.1. Prompt for</text>
    <text x="125" y="294" font-size="14" fill="#94a3b8">tool use or restructure the loop instead.</text>

    <rect x="100" y="360" width="570" height="130" rx="10" fill="#0b1220" stroke="#7f1d1d" stroke-width="1"/>
    <text x="125" y="395" font-size="16" font-weight="700" fill="#fca5a5">2 · Thinking blocks are bound to their model</text>
    <text x="125" y="422" font-size="14" fill="#94a3b8">Claude Fable 5.1 cannot read thinking blocks</text>
    <text x="125" y="444" font-size="14" fill="#94a3b8">produced by earlier models in a shared history.</text>

    <rect x="100" y="510" width="570" height="130" rx="10" fill="#0b1220" stroke="#7f1d1d" stroke-width="1"/>
    <text x="125" y="545" font-size="16" font-weight="700" fill="#fca5a5">3 · Editing earlier turns invalidates thinking</text>
    <text x="125" y="572" font-size="14" fill="#94a3b8">Retroactive prompt edits bust the thinking cache —</text>
    <text x="125" y="594" font-size="14" fill="#94a3b8">branch-fork patterns cost more than they used to.</text>
  </g>

  <!-- Right: additive -->
  <rect x="740" y="130" width="630" height="560" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="770" y="180" font-size="22" font-weight="700" fill="#34d399">✚ Additive — opt in and save</text>

  <g font-size="16" font-weight="700" fill="#a7f3d0">
    <text x="770" y="245">1 · Per-message effort (beta)</text>
    <text x="770" y="313">2 · Turn-scoped system messages (beta)</text>
    <text x="770" y="381">3 · Progress updates between tool calls (beta)</text>
    <text x="770" y="449">4 · Cache reads at $0.25 per MTok (−75%)</text>
    <text x="770" y="517">5 · Content provenance</text>
  </g>
  <g font-size="14" fill="#94a3b8">
    <text x="770" y="270">dial effort up only for the hard steps, down for the rest</text>
    <text x="770" y="338">inject instructions for one turn without polluting history</text>
    <text x="770" y="406">display: "updates" streams readable progress mid-loop</text>
    <text x="770" y="474">the single biggest lever for context-heavy agent budgets</text>
    <text x="770" y="542">provenance metadata for AI-generated content</text>
  </g>

  <rect x="770" y="580" width="570" height="80" rx="10" fill="#0b1220" stroke="#065f46" stroke-width="1"/>
  <text x="795" y="612" font-size="14" fill="#6ee7b7" font-family="JetBrains Mono, monospace">model: claude-fable-5-1</text>
  <text x="795" y="640" font-size="14" fill="#6ee7b7" font-family="JetBrains Mono, monospace">Bedrock: anthropic.claude-fable-5-1 · Vertex: same ID</text>

  <!-- bottom strip -->
  <rect x="70" y="720" width="1300" height="100" rx="14" fill="#271c03" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="720" y="760" text-anchor="middle" font-size="18" font-weight="700" fill="#fbbf24">Default effort: Claude Code = high · Claude.ai and Claude Cowork = medium</text>
  <text x="720" y="792" text-anchor="middle" font-size="15" fill="#fcd34d">Re-run your evals at your real default effort before comparing this bill to your old one.</text>

  <text x="720" y="856" text-anchor="middle" font-size="12" fill="#475569">Source: Claude Fable 5.1 docs — what's new and migration guide (platform.claude.com, Sep 2026)</text>
</svg>
