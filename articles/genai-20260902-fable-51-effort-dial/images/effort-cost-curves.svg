<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, -apple-system, sans-serif">
  <rect width="1440" height="900" fill="#0f172a"/>

  <text x="720" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#f1f5f9">The Frontier Is a Cost Curve, Not a Number</text>
  <text x="720" y="92" text-anchor="middle" font-size="18" fill="#94a3b8">Terminal-Bench-Science 0.1 — score vs cost per task (Anthropic-reported, Sep 2026)</text>

  <!-- plot frame -->
  <rect x="110" y="140" width="870" height="620" fill="#0b1220" stroke="#334155" stroke-width="1"/>

  <!-- gridlines: cost 10,15,20,30,40,50 mapped x = 110 + (c-10)/40*870 -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="110" y1="140" x2="110" y2="760"/>
    <line x1="218.75" y1="140" x2="218.75" y2="760"/>
    <line x1="327.5" y1="140" x2="327.5" y2="760"/>
    <line x1="545" y1="140" x2="545" y2="760"/>
    <line x1="762.5" y1="140" x2="762.5" y2="760"/>
    <line x1="980" y1="140" x2="980" y2="760"/>
    <!-- score lines 10..60 step 10: y = 760 - s/60*620 -->
    <line x1="110" y1="656.7" x2="980" y2="656.7"/>
    <line x1="110" y1="553.3" x2="980" y2="553.3"/>
    <line x1="110" y1="450" x2="980" y2="450"/>
    <line x1="110" y1="346.7" x2="980" y2="346.7"/>
    <line x1="110" y1="243.3" x2="980" y2="243.3"/>
    <line x1="110" y1="140" x2="980" y2="140"/>
  </g>

  <!-- axis labels -->
  <g font-size="13" fill="#64748b">
    <text x="110" y="784" text-anchor="middle">$10</text>
    <text x="218.75" y="784" text-anchor="middle">$15</text>
    <text x="327.5" y="784" text-anchor="middle">$20</text>
    <text x="545" y="784" text-anchor="middle">$30</text>
    <text x="762.5" y="784" text-anchor="middle">$40</text>
    <text x="980" y="784" text-anchor="middle">$50</text>
    <text x="98" y="660" text-anchor="end">10%</text>
    <text x="98" y="557" text-anchor="end">20%</text>
    <text x="98" y="454" text-anchor="end">30%</text>
    <text x="98" y="350" text-anchor="end">40%</text>
    <text x="98" y="247" text-anchor="end">50%</text>
    <text x="98" y="144" text-anchor="end">60%</text>
  </g>
  <text x="545" y="820" text-anchor="middle" font-size="15" fill="#94a3b8">Mean cost per task (USD)</text>
  <text x="52" y="450" text-anchor="middle" font-size="15" fill="#94a3b8" transform="rotate(-90 52 450)">Score (%)</text>

  <!-- reference lines: Opus 5 29.0% -> y=460.3 ; GPT-5.6 Sol 22.4% -> y=528.5 -->
  <line x1="110" y1="460.3" x2="980" y2="460.3" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="7 6" opacity="0.75"/>
  <text x="972" y="441" text-anchor="end" font-size="13" fill="#fbbf24" paint-order="stroke" stroke="#0f172a" stroke-width="7" font-weight="600">Opus 5: 29.0% (default effort)</text>
  <line x1="110" y1="528.5" x2="980" y2="528.5" stroke="#f87171" stroke-width="1.5" stroke-dasharray="7 6" opacity="0.7"/>
  <text x="972" y="509" text-anchor="end" font-size="13" fill="#f87171" paint-order="stroke" stroke="#0f172a" stroke-width="7" font-weight="600">GPT-5.6 Sol: 22.4% (default effort)</text>

  <!-- Fable 5 polyline: (17.1,12.3)->(25,21.4)->(34.3,25.0)->(36,23.4)->(44.1,24.7)
       x: 379.4, 563.8, 756.0, 801.8, 970.2 ; y: 632.9, 538.9, 501.7, 518.2, 504.8 -->
  <polyline points="379.4,632.9 563.8,538.9 756.0,501.7 801.8,518.2 970.2,504.8" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 4"/>
  <g fill="#94a3b8">
    <circle cx="379.4" cy="632.9" r="6"/>
    <circle cx="563.8" cy="538.9" r="6"/>
    <circle cx="756.0" cy="501.7" r="6"/>
    <circle cx="801.8" cy="518.2" r="6"/>
    <circle cx="970.2" cy="504.8" r="7" stroke="#e2e8f0" stroke-width="2"/>
  </g>
  <text x="962" y="478" text-anchor="end" font-size="14" font-weight="600" fill="#94a3b8" paint-order="stroke" stroke="#0f172a" stroke-width="7">Fable 5 @ max: 24.7% at $44.1</text>
  <text x="379.4" y="660" text-anchor="middle" font-size="12" fill="#64748b">low</text>

  <!-- Fable 5.1 polyline: (11.1,26.3)->(14.9,35.7)->(20.3,40.0)->(31.8,49.5)->(37.9,52.6)
       x: 131.9, 221.4, 351.5, 611.7, 743.5 ; y: 488.4, 390.7, 346.7, 248.8, 216.5 -->
  <polyline points="131.9,488.4 221.4,390.7 351.5,346.7 611.7,248.8 743.5,216.5" fill="none" stroke="#22d3ee" stroke-width="3"/>
  <g fill="#22d3ee">
    <circle cx="131.9" cy="488.4" r="7" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="221.4" cy="390.7" r="6"/>
    <circle cx="351.5" cy="346.7" r="6"/>
    <circle cx="611.7" cy="248.8" r="6"/>
    <circle cx="743.5" cy="216.5" r="6"/>
  </g>
  <text x="150" y="516" font-size="14" font-weight="700" fill="#22d3ee">Fable 5.1 @ low: 26.3% at $11.1</text>
  <text x="743.5" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#22d3ee">Fable 5.1 @ max: 52.6% at $37.9</text>

  <!-- key insight arrow -->
  <path d="M 940 508 C 850 430, 700 400, 480 430" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrG)"/>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect x="430" y="570" width="440" height="64" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="650" y="597" text-anchor="middle" font-size="15" font-weight="700" fill="#34d399">Fable 5.1 at LOW beats Fable 5 at MAX</text>
  <text x="650" y="620" text-anchor="middle" font-size="13" fill="#a7f3d0">26.3% vs 24.7% — at one quarter of the cost</text>

  <!-- right panel -->
  <rect x="1010" y="140" width="360" height="620" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="1035" y="180" font-size="18" font-weight="700" fill="#f1f5f9">How to read this</text>
  <g font-size="14" fill="#cbd5e1">
    <text x="1035" y="222">• Effort buys the last points at a</text>
    <text x="1048" y="244">premium: 26.3% → 52.6% costs</text>
    <text x="1048" y="266">$11.1 → $37.9 per task.</text>
    <text x="1035" y="310">• Prior-gen MAX effort is now</text>
    <text x="1048" y="332">dominated by this-gen LOW —</text>
    <text x="1048" y="354">the chart's most important point.</text>
    <text x="1035" y="398">• Comparing models at different</text>
    <text x="1048" y="420">effort levels compares different</text>
    <text x="1048" y="442">products. Match effort first.</text>
    <text x="1035" y="486">• Fable 5.1 @ max nearly doubles</text>
    <text x="1048" y="508">Fable 5 @ max (52.6 vs 24.7)</text>
    <text x="1048" y="530">on scientific terminal tasks.</text>
  </g>
  <line x1="1035" y1="560" x2="1345" y2="560" stroke="#334155" stroke-width="1"/>
  <text x="1035" y="592" font-size="13" font-weight="700" fill="#fbbf24">Effort ladder (Fable 5.1)</text>
  <g font-size="13.5" fill="#94a3b8" font-family="JetBrains Mono, monospace">
    <text x="1035" y="620">low    26.3%  $11.1</text>
    <text x="1035" y="644">med    35.7%  $14.9</text>
    <text x="1035" y="668">high   40.0%  $20.3</text>
    <text x="1035" y="692">xhigh  49.5%  $31.8</text>
    <text x="1035" y="716">max    52.6%  $37.9</text>
  </g>

  <text x="720" y="862" text-anchor="middle" font-size="12" fill="#475569">Effort-level data: Anthropic Terminal-Bench-Science 0.1 chart (standard error ±3.5–4.5 pts per model). Opus 5 and GPT-5.6 Sol: default-effort scores from the same launch post.</text>
</svg>
