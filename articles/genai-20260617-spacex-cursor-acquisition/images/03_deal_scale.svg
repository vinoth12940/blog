<svg width="100%" viewBox="0 0 1440 780" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="1440" height="780" fill="#0a0a0a"/>
<text x="720" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#e5e5e5">The $60 Billion Question — Deal Scale in Context</text>
<text x="720" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#9ca3af">Largest venture-backed startup acquisition in history</text>

<!-- Bar chart: horizontal bars -->
<!-- Scale: 1px per $0.05B, so $60B = 1200px max. Start bars at x=320 -->

<!-- SpaceX / Cursor $60B -->
<rect x="320" y="130" width="1200" height="60" rx="6" fill="#3a1a1a" stroke="#E24B4A" stroke-width="1"/>
<text x="310" y="160" text-anchor="end" dominant-baseline="central" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#f87171">SpaceX → Cursor</text>
<text x="1530" y="160" dominant-baseline="central" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#f87171">$60B</text>
<text x="320" y="160" dominant-baseline="central" font-family="Inter, sans-serif" font-size="13" fill="#F09595" text-anchor="start" style="padding-left:10px">  June 2026 · all-stock</text>

<!-- Microsoft → Activision $69B (for reference) -->
<rect x="320" y="210" width="1380" height="50" rx="6" fill="#0f2a22" stroke="#1d9e75" stroke-width="0.8"/>
<text x="310" y="235" text-anchor="end" dominant-baseline="central" font-family="Inter, sans-serif" font-size="16" fill="#34d399">Microsoft → Activision</text>
<text x="1710" y="235" dominant-baseline="central" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#34d399">$69B</text>

<!-- Broadcom → VMware $61B -->
<rect x="320" y="272" width="1220" height="50" rx="6" fill="#1a1a2e" stroke="#475569" stroke-width="0.8"/>
<text x="310" y="297" text-anchor="end" dominant-baseline="central" font-family="Inter, sans-serif" font-size="16" fill="#94a3b8">Broadcom → VMware</text>
<text x="1545" y="297" dominant-baseline="central" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">$61B</text>

<!-- Cisco → Splunk $28B -->
<rect x="320" y="334" width="560" height="50" rx="6" fill="#1a1a2e" stroke="#475569" stroke-width="0.8"/>
<text x="310" y="359" text-anchor="end" dominant-baseline="central" font-family="Inter, sans-serif" font-size="16" fill="#94a3b8">Cisco → Splunk</text>
<text x="885" y="359" dominant-baseline="central" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">$28B</text>

<!-- Cognition → Windsurf $0.25B -->
<rect x="320" y="396" width="5" height="50" rx="3" fill="#1a1a2e" stroke="#475569" stroke-width="0.8"/>
<text x="310" y="421" text-anchor="end" dominant-baseline="central" font-family="Inter, sans-serif" font-size="16" fill="#94a3b8">Cognition → Windsurf</text>
<text x="332" y="421" dominant-baseline="central" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">$0.25B</text>

<!-- Horizontal axis line -->
<line x1="320" y1="475" x2="1520" y2="475" stroke="#333" stroke-width="1"/>
<text x="320" y="495" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">$0</text>
<text x="620" y="495" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">$15B</text>
<text x="920" y="495" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">$30B</text>
<text x="1220" y="495" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">$45B</text>
<text x="1520" y="495" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">$60B</text>

<!-- What $60B bought section -->
<text x="720" y="545" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#e5e5e5">What $60 billion actually bought</text>

<!-- Three stat cards -->
<rect x="80" y="570" width="400" height="140" rx="12" fill="#221a3a" stroke="#7F77DD" stroke-width="1"/>
<text x="280" y="600" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#a78bfa">1M+</text>
<text x="280" y="630" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#CECBF6">daily active users</text>
<text x="280" y="655" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#9ca3af">largest AI coding dev base</text>
<text x="280" y="680" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#9ca3af">by user count</text>

<rect x="520" y="570" width="400" height="140" rx="12" fill="#0f2a22" stroke="#1d9e75" stroke-width="1"/>
<text x="720" y="600" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#34d399">$2-3B</text>
<text x="720" y="630" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#9FE1CB">annualized revenue</text>
<text x="720" y="655" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#9ca3af">$1B ARR by Nov 2025</text>
<text x="720" y="680" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#9ca3af">doubled in 3 months</text>

<rect x="960" y="570" width="400" height="140" rx="12" fill="#0b1a2e" stroke="#378ADD" stroke-width="1"/>
<text x="1160" y="600" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#60a5fa">3.4%</text>
<text x="1160" y="630" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#B5D4F4">dilution at IPO valuation</text>
<text x="1160" y="655" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#9ca3af">SpaceX valued >$2T</text>
<text x="1160" y="680" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#9ca3af">SPCX priced at $135</text>
</svg>
