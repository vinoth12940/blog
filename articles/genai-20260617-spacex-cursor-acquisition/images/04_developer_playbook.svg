<svg width="100%" viewBox="0 0 1440 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="1440" height="720" fill="#0a0a0a"/>
<text x="720" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#e5e5e5">Developer Playbook: What to Do Now</text>
<text x="720" y="78" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#9ca3af">Three scenarios depending on your current setup and risk tolerance</text>

<!-- Scenario 1: Stay on Cursor -->
<rect x="60" y="120" width="400" height="530" rx="16" fill="#221a3a" stroke="#7F77DD" stroke-width="1"/>
<text x="260" y="155" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#a78bfa">Stay on Cursor</text>
<text x="260" y="182" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#CECBF6">lowest friction · highest lock-in risk</text>

<rect x="90" y="205" width="340" height="50" rx="8" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
<text x="260" y="230" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#e5e5e5">Nothing breaks today</text>

<rect x="90" y="265" width="340" height="50" rx="8" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
<text x="260" y="290" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#e5e5e5">Model selection continues</text>

<rect x="90" y="325" width="340" height="50" rx="8" fill="#3a1a1a" stroke="#E24B4A" stroke-width="0.5"/>
<text x="260" y="350" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#f87171">Watch for Grok defaulting</text>

<rect x="90" y="385" width="340" height="50" rx="8" fill="#3a1a1a" stroke="#E24B4A" stroke-width="0.5"/>
<text x="260" y="410" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#f87171">Pricing may change Q3</text>

<rect x="90" y="445" width="340" height="50" rx="8" fill="#3a1a1a" stroke="#E24B4A" stroke-width="0.5"/>
<text x="260" y="470" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#f87171">Telemetry feeds Grok</text>

<rect x="90" y="520" width="340" height="80" rx="8" fill="#3a2a08" stroke="#BA7517" stroke-width="1"/>
<text x="260" y="548" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#fbbf24">Best for:</text>
<text x="260" y="572" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#FAC775">Individual devs who value</text>
<text x="260" y="590" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#FAC775">flow-state over independence</text>

<!-- Scenario 2: Adopt Claude Code -->
<rect x="520" y="120" width="400" height="530" rx="16" fill="#0b1a2e" stroke="#378ADD" stroke-width="1"/>
<text x="720" y="155" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#60a5fa">Adopt Claude Code</text>
<text x="720" y="182" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#B5D4F4">neutral · model-agnostic · CLI-native</text>

<rect x="550" y="205" width="340" height="50" rx="8" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
<text x="720" y="230" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#34d399">#1 pro usage Q1 2026</text>

<rect x="550" y="265" width="340" height="50" rx="8" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
<text x="720" y="290" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#34d399">Runs in any terminal</text>

<rect x="550" y="325" width="340" height="50" rx="8" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
<text x="720" y="350" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#34d399">Works with any editor</text>

<rect x="550" y="385" width="340" height="50" rx="8" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
<text x="720" y="410" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#34d399">Opus 4.8 — 88.6% SWE-bench</text>

<rect x="550" y="445" width="340" height="50" rx="8" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
<text x="720" y="470" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#34d399">$20 Pro · $100 Max</text>

<rect x="550" y="520" width="340" height="80" rx="8" fill="#0f2a22" stroke="#1d9e75" stroke-width="1"/>
<text x="720" y="548" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#34d399">Best for:</text>
<text x="720" y="572" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#9FE1CB">Teams &amp; engineers who want</text>
<text x="720" y="590" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#9FE1CB">a neutral, portable tool</text>

<!-- Scenario 3: Go Local -->
<rect x="980" y="120" width="400" height="530" rx="16" fill="#0f2a22" stroke="#1d9e75" stroke-width="1"/>
<text x="1180" y="155" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#34d399">Go Local / Open</text>
<text x="1180" y="182" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#9FE1CB">zero lock-in · zero telemetry</text>

<rect x="1010" y="205" width="340" height="50" rx="8" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
<text x="1180" y="230" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#e5e5e5">Ollama + local models</text>

<rect x="1010" y="265" width="340" height="50" rx="8" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
<text x="1180" y="290" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#e5e5e5">Gemma 4 12B · Qwen 3.5</text>

<rect x="1010" y="325" width="340" height="50" rx="8" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
<text x="1180" y="350" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#e5e5e5">Geopolitically neutral</text>

<rect x="1010" y="385" width="340" height="50" rx="8" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
<text x="1180" y="410" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#e5e5e5">Export-control immune</text>

<rect x="1010" y="445" width="340" height="50" rx="8" fill="#0a0a0a" stroke="#333" stroke-width="0.5"/>
<text x="1180" y="470" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#e5e5e5">No vendor dependency</text>

<rect x="1010" y="520" width="340" height="80" rx="8" fill="#3a2a08" stroke="#BA7517" stroke-width="1"/>
<text x="1180" y="548" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#fbbf24">Best for:</text>
<text x="1180" y="572" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#FAC775">Privacy-first devs &amp; teams</text>
<text x="1180" y="590" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="14" fill="#FAC775">outside US export jurisdiction</text>

<text x="720" y="685" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#6b7280">Community consensus (June 2026): Two-tool standard — Cursor for flow-state, Claude Code for team/engineering work</text>
</svg>
