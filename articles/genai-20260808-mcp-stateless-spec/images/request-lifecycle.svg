<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="720" fill="url(#bg2)"/>
  
  <!-- Title -->
  <text x="720" y="50" text-anchor="middle" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="28" font-weight="700">Protocol Request Lifecycle: Old vs New</text>
  <text x="720" y="78" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="16">How a single tools/call request flows</text>

  <!-- OLD FLOW -->
  <text x="360" y="120" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="18" font-weight="700">OLD: Stateful (4+ round trips)</text>
  
  <!-- Step boxes OLD -->
  <rect x="80" y="140" width="560" height="50" rx="8" fill="#1e1e2e" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="170" fill="#f59e0b" font-family="monospace" font-size="13">1. POST /mcp — initialize { capabilities }</text>

  <rect x="80" y="210" width="560" height="50" rx="8" fill="#1e1e2e" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="240" fill="#f59e0b" font-family="monospace" font-size="13">2. Response: 200 { serverInfo, protocolVersion } + Mcp-Session-Id</text>

  <rect x="80" y="280" width="560" height="50" rx="8" fill="#1e1e2e" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="310" fill="#f59e0b" font-family="monospace" font-size="13">3. POST /mcp — notifications/initialized (with session)</text>

  <rect x="80" y="350" width="560" height="50" rx="8" fill="#1e1e2e" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="380" fill="#f59e0b" font-family="monospace" font-size="13">4. POST /mcp — tools/call (with session, held-open stream)</text>

  <rect x="80" y="420" width="560" height="50" rx="8" fill="#1e1e2e" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="450" fill="#f59e0b" font-family="monospace" font-size="13">5. Response: result (stream held open for server→client)</text>

  <rect x="80" y="500" width="560" height="70" rx="10" fill="#3f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="360" y="525" text-anchor="middle" fill="#fca5a5" font-family="Inter, sans-serif" font-size="14" font-weight="600">Connection must stay alive between steps 1-5</text>
  <text x="360" y="545" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">If it drops → re-initialize from scratch</text>
  <text x="360" y="560" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Server-bound. No LB. No failover.</text>

  <!-- NEW FLOW -->
  <text x="1080" y="120" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="18" font-weight="700">NEW: Stateless (1 round trip)</text>
  
  <rect x="800" y="140" width="560" height="50" rx="8" fill="#1e1e2e" stroke="#10b981" stroke-width="1.5"/>
  <text x="820" y="170" fill="#34d399" font-family="monospace" font-size="13">1. POST /mcp (any instance) — tools/call</text>

  <rect x="800" y="210" width="560" height="50" rx="8" fill="#1e1e2e" stroke="#10b981" stroke-width="1.5"/>
  <text x="820" y="240" fill="#6ee7b7" font-family="monospace" font-size="12">   Headers: Mcp-Method: tools/call, Mcp-Name: search</text>

  <rect x="800" y="280" width="560" height="50" rx="8" fill="#1e1e2e" stroke="#10b981" stroke-width="1.5"/>
  <text x="820" y="310" fill="#6ee7b7" font-family="monospace" font-size="12">   Body: { _meta: { clientInfo: {...} }, params: {...} }</text>

  <rect x="800" y="350" width="560" height="50" rx="8" fill="#1e1e2e" stroke="#10b981" stroke-width="1.5"/>
  <text x="820" y="380" fill="#34d399" font-family="monospace" font-size="13">2. Response: 200 { result } — done.</text>

  <rect x="800" y="420" width="560" height="50" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="820" y="450" fill="#6ee7b7" font-family="monospace" font-size="12">   Optional: server/discover RPC for upfront capabilities</text>

  <rect x="800" y="500" width="560" height="70" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="1080" y="525" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="14" font-weight="600">Fire and forget — each request is independent</text>
  <text x="1080" y="545" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Connection close doesn't affect future requests</text>
  <text x="1080" y="560" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11">LB-friendly. Failover-safe. Horizontally scalable.</text>

  <!-- VS Divider -->
  <line x1="720" y1="110" x2="720" y2="580" stroke="#334155" stroke-width="2" stroke-dasharray="8,4"/>
  <circle cx="720" cy="345" r="25" fill="#1e1e2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="720" y="352" text-anchor="middle" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="700">VS</text>

  <!-- Footer stat -->
  <rect x="200" y="610" width="1040" height="60" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="720" y="638" text-anchor="middle" fill="#c4b5fd" font-family="Inter, sans-serif" font-size="15" font-weight="600">Net effect: 4+ round trips → 1 round trip per call</text>
  <text x="720" y="658" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Round-robin load balancing without shared storage or sticky sessions</text>
</svg>