<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="660" fill="url(#bg4)"/>

  <!-- Title -->
  <text x="720" y="48" text-anchor="middle" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="28" font-weight="700">What's New: Feature Breakdown</text>
  <text x="720" y="75" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="16">Seven major additions in the 2026-07-28 specification</text>

  <!-- Feature cards grid -->
  <!-- Row 1 -->
  <rect x="60" y="110" width="410" height="160" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <circle cx="95" cy="145" r="18" fill="#064e3b"/>
  <text x="95" y="152" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="18" font-weight="800">1</text>
  <text x="125" y="150" fill="#34d399" font-family="Inter, sans-serif" font-size="16" font-weight="700">Stateless Protocol Core</text>
  <text x="80" y="180" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">Retires initialize/initialized handshake</text>
  <text x="80" y="200" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">and Mcp-Session-Id. Each request is</text>
  <text x="80" y="220" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">self-describing via _meta.</text>
  <text x="80" y="245" fill="#64748b" font-family="monospace" font-size="11">server/discover RPC replaces handshake</text>

  <rect x="515" y="110" width="410" height="160" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="550" cy="145" r="18" fill="#1e3a5f"/>
  <text x="550" y="152" text-anchor="middle" fill="#60a5fa" font-family="Inter, sans-serif" font-size="18" font-weight="800">2</text>
  <text x="580" y="150" fill="#60a5fa" font-family="Inter, sans-serif" font-size="16" font-weight="700">Multi Round-Trip Requests</text>
  <text x="535" y="180" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">Replaces held-open streams for</text>
  <text x="535" y="200" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">elicitation/sampling. Server returns</text>
  <text x="535" y="220" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">resultType: "input_required", client</text>
  <text x="535" y="240" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">retries with inputResponses.</text>
  <text x="535" y="258" fill="#64748b" font-family="monospace" font-size="11">SEP-2322</text>

  <rect x="970" y="110" width="410" height="160" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="1005" cy="145" r="18" fill="#78350f"/>
  <text x="1005" y="152" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="18" font-weight="800">3</text>
  <text x="1035" y="150" fill="#fbbf24" font-family="Inter, sans-serif" font-size="16" font-weight="700">Header-Based Routing</text>
  <text x="990" y="180" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">Mcp-Method and Mcp-Name travel</text>
  <text x="990" y="200" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">in HTTP headers. Gateways, WAFs,</text>
  <text x="990" y="220" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">and rate limiters route on headers</text>
  <text x="990" y="240" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">without parsing JSON bodies.</text>
  <text x="990" y="258" fill="#64748b" font-family="monospace" font-size="11">SEP-2243</text>

  <!-- Row 2 -->
  <rect x="60" y="290" width="410" height="160" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="95" cy="325" r="18" fill="#4c1d95"/>
  <text x="95" y="332" text-anchor="middle" fill="#c4b5fd" font-family="Inter, sans-serif" font-size="18" font-weight="800">4</text>
  <text x="125" y="330" fill="#c4b5fd" font-family="Inter, sans-serif" font-size="16" font-weight="700">Cacheable List Results</text>
  <text x="80" y="360" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">tools/list, prompts/list now carry</text>
  <text x="80" y="380" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">ttlMs and cacheScope. Clients cache</text>
  <text x="80" y="400" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">tool catalogs. Deterministic order</text>
  <text x="80" y="420" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">keeps prompt caches stable.</text>
  <text x="80" y="438" fill="#64748b" font-family="monospace" font-size="11">SEP-2549</text>

  <rect x="515" y="290" width="410" height="160" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <circle cx="550" cy="325" r="18" fill="#7f1d1d"/>
  <text x="550" y="332" text-anchor="middle" fill="#fca5a5" font-family="Inter, sans-serif" font-size="18" font-weight="800">5</text>
  <text x="580" y="330" fill="#fca5a5" font-family="Inter, sans-serif" font-size="16" font-weight="700">Authorization Hardening</text>
  <text x="535" y="360" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">RFC 9207 iss validation. Credentials</text>
  <text x="535" y="380" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">bound to issuing server. DCR formally</text>
  <text x="535" y="400" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">deprecated → Client ID Metadata</text>
  <text x="535" y="420" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">Documents (CIMD).</text>
  <text x="535" y="438" fill="#64748b" font-family="monospace" font-size="11">SEP-2468, SEP-837, SEP-2352</text>

  <rect x="970" y="290" width="410" height="160" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="1005" cy="325" r="18" fill="#164e63"/>
  <text x="1005" y="332" text-anchor="middle" fill="#67e8f9" font-family="Inter, sans-serif" font-size="18" font-weight="800">6</text>
  <text x="1035" y="330" fill="#67e8f9" font-family="Inter, sans-serif" font-size="16" font-weight="700">Tasks Extension</text>
  <text x="990" y="360" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">Tasks move from experimental to</text>
  <text x="990" y="380" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">io.modelcontextprotocol/tasks. Poll-</text>
  <text x="990" y="400" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">based tasks/get + tasks/update.</text>
  <text x="990" y="420" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">subscriptions/listen for notifications.</text>
  <text x="990" y="438" fill="#64748b" font-family="monospace" font-size="11">SEP-2663</text>

  <!-- Row 3: Deprecation policy -->
  <rect x="290" y="470" width="860" height="140" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <circle cx="325" cy="505" r="18" fill="#334155"/>
  <text x="325" y="512" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="18" font-weight="800">7</text>
  <text x="355" y="510" fill="#94a3b8" font-family="Inter, sans-serif" font-size="16" font-weight="700">Formal Deprecation Policy + Extensions Framework</text>
  <text x="310" y="540" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">12-month minimum deprecation window. Roots, Sampling, Logging deprecated (still work, timeline TBD).</text>
  <text x="310" y="560" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">Legacy HTTP+SSE transport deprecated with year-long offramp. Extensions framework formalized:</text>
  <text x="310" y="580" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">Tasks, MCP Apps, Enterprise Managed Authorization (EMA) join the extensions system.</text>
  <text x="310" y="598" fill="#64748b" font-family="monospace" font-size="11">SEP-2575, SEP-2567, SEP-2577</text>
</svg>