<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1440" height="810" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="720" y="55" text-anchor="middle" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="32" font-weight="700">MCP 2026-07-28: Stateful → Stateless</text>
  <text x="720" y="85" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="18">The Protocol's Biggest Architecture Shift</text>

  <!-- LEFT: Old Stateful Model -->
  <rect x="80" y="130" width="480" height="580" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="2"/>
  <text x="320" y="170" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="22" font-weight="700">BEFORE: Stateful (2025-11-25)</text>
  
  <!-- Client box -->
  <rect x="140" y="200" width="360" height="70" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="232" text-anchor="middle" fill="#60a5fa" font-family="Inter, sans-serif" font-size="16" font-weight="600">MCP Client</text>
  <text x="320" y="252" text-anchor="middle" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13">Holds session state</text>

  <!-- Bidirectional arrows -->
  <path d="M 260 280 L 260 340 M 380 280 L 380 340" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <polygon points="260,340 254,328 266,328" fill="#f59e0b"/>
  <polygon points="380,280 374,292 386,292" fill="#f59e0b"/>
  <text x="320" y="320" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="13">initialize ← → initialized</text>

  <!-- Server box -->
  <rect x="140" y="360" width="360" height="70" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="320" y="392" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="16" font-weight="600">MCP Server (Single Instance)</text>
  <text x="320" y="412" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Bound to session ID</text>

  <!-- Issues -->
  <text x="320" y="465" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="14" font-weight="600">⚠ Problems</text>
  <g font-family="Inter, sans-serif" font-size="13" fill="#fca5a5">
    <text x="120" y="495">• Held-open bidirectional streams</text>
    <text x="120" y="520">• Server-to-client requests need persistent connection</text>
    <text x="120" y="545">• Can't load-balance across instances</text>
    <text x="120" y="570">• No shared storage = broken failover</text>
    <text x="120" y="595">• Mcp-Session-Id coupling</text>
  </g>
  <rect x="140" y="625" width="360" height="55" rx="8" fill="#3f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="320" y="650" text-anchor="middle" fill="#fca5a5" font-family="Inter, sans-serif" font-size="14" font-weight="600">Hard to scale horizontally</text>
  <text x="320" y="668" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Single-instance bottleneck</text>

  <!-- Arrow between -->
  <path d="M 580 400 L 670 400" stroke="#a78bfa" stroke-width="3" fill="none"/>
  <polygon points="670,400 660,392 660,408" fill="#a78bfa"/>
  <text x="625" y="385" text-anchor="middle" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="600">Upgrade</text>

  <!-- RIGHT: New Stateless Model -->
  <rect x="700" y="130" width="660" height="580" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="1030" y="170" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="22" font-weight="700">AFTER: Stateless (2026-07-28)</text>
  
  <!-- Client box -->
  <rect x="760" y="200" width="540" height="70" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="1030" y="232" text-anchor="middle" fill="#60a5fa" font-family="Inter, sans-serif" font-size="16" font-weight="600">MCP Client</text>
  <text x="1030" y="252" text-anchor="middle" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13">Each request is self-describing (_meta carries identity)</text>

  <!-- Request arrows to LB -->
  <path d="M 1030 280 L 1030 335" stroke="#34d399" stroke-width="2.5" fill="none"/>
  <polygon points="1030,335 1024,323 1036,323" fill="#34d399"/>

  <!-- Load balancer -->
  <rect x="820" y="345" width="420" height="45" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="1030" y="373" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="14" font-weight="600">Round-Robin Load Balancer (Header-Routed)</text>

  <!-- Arrows to instances -->
  <path d="M 880 390 L 820 440 M 1030 390 L 1030 440 M 1180 390 L 1240 440" stroke="#34d399" stroke-width="2" fill="none"/>
  <polygon points="820,440 814,430 826,430" fill="#34d399"/>
  <polygon points="1030,440 1024,430 1036,430" fill="#34d399"/>
  <polygon points="1240,440 1234,430 1246,430" fill="#34d399"/>

  <!-- Server instances -->
  <rect x="760" y="445" width="120" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="820" y="468" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12" font-weight="600">Server A</text>
  <text x="820" y="484" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Instance 1</text>

  <rect x="970" y="445" width="120" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="1030" y="468" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12" font-weight="600">Server B</text>
  <text x="1030" y="484" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Instance 2</text>

  <rect x="1180" y="445" width="120" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="1240" y="468" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12" font-weight="600">Server C</text>
  <text x="1240" y="484" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Instance 3</text>

  <!-- Benefits -->
  <text x="1030" y="530" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="14" font-weight="600">✓ Advantages</text>
  <g font-family="Inter, sans-serif" font-size="13" fill="#6ee7b7">
    <text x="740" y="558">• Any request lands on any instance — no shared storage needed</text>
    <text x="740" y="583">• Mcp-Method + Mcp-Name headers for gateway routing</text>
    <text x="740" y="608">• Multi Round-Trip Requests replace held-open streams</text>
    <text x="740" y="633">• Cacheable list responses (ttlMs + cacheScope)</text>
    <text x="740" y="658">• No initialize handshake — server/discover RPC is optional</text>
  </g>
  <rect x="760" y="675" width="540" height="30" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1030" y="695" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="14" font-weight="600">Horizontally scalable, production-grade</text>
</svg>