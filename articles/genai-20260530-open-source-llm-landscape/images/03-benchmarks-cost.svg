<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Open-Source LLM Benchmarks — May 2026 Leaderboard</text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-size="12">Coding, Reasoning, and Cost compared across the top 5 open-weight models</text>

  <!-- SWE-Bench Verified Bar Chart -->
  <text x="60" y="88" fill="#3b82f6" font-size="13" font-weight="bold">SWE-Bench Verified (%)</text>

  <!-- Axis -->
  <line x1="60" y1="100" x2="60" y2="195" stroke="#334155" stroke-width="1"/>
  <line x1="60" y1="195" x2="840" y2="195" stroke="#334155" stroke-width="1"/>

  <!-- Scale labels -->
  <text x="55" y="105" text-anchor="end" fill="#64748b" font-size="9">100</text>
  <text x="55" y="130" text-anchor="end" fill="#64748b" font-size="9">75</text>
  <text x="55" y="155" text-anchor="end" fill="#64748b" font-size="9">50</text>
  <text x="55" y="180" text-anchor="end" fill="#64748b" font-size="9">25</text>

  <!-- Grid lines -->
  <line x1="60" y1="105" x2="840" y2="105" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="60" y1="130" x2="840" y2="130" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="60" y1="155" x2="840" y2="155" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- DeepSeek V4 Pro: 80.6% -->
  <rect x="95" y="108" width="120" height="87" rx="4" fill="#3b82f6" opacity="0.85"/>
  <text x="155" y="105" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">80.6%</text>
  <text x="155" y="210" text-anchor="middle" fill="#94a3b8" font-size="10">DeepSeek V4 Pro</text>

  <!-- MiMo V2.5: 78.9% -->
  <rect x="245" y="110" width="120" height="85" rx="4" fill="#06b6d4" opacity="0.85"/>
  <text x="305" y="107" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="bold">78.9%</text>
  <text x="305" y="210" text-anchor="middle" fill="#94a3b8" font-size="10">MiMo V2.5 Pro</text>

  <!-- Mistral Med 3.5: 77.6% -->
  <rect x="395" y="111" width="120" height="84" rx="4" fill="#f59e0b" opacity="0.85"/>
  <text x="455" y="108" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">77.6%</text>
  <text x="455" y="210" text-anchor="middle" fill="#94a3b8" font-size="10">Mistral Med 3.5</text>

  <!-- GLM-5.1: ~76% (estimated from data) -->
  <rect x="545" y="114" width="120" height="81" rx="4" fill="#f59e0b" opacity="0.7"/>
  <text x="605" y="111" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">~76%</text>
  <text x="605" y="210" text-anchor="middle" fill="#94a3b8" font-size="10">GLM-5.1</text>

  <!-- Qwen 3.6-35B: ~74% -->
  <rect x="695" y="116" width="120" height="79" rx="4" fill="#8b5cf6" opacity="0.85"/>
  <text x="755" y="113" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">~74%</text>
  <text x="755" y="210" text-anchor="middle" fill="#94a3b8" font-size="10">Qwen 3.6-35B</text>

  <!-- Reference line: Claude Opus 4.7 -->
  <line x1="60" y1="109" x2="840" y2="109" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="840" y="105" text-anchor="end" fill="#ef4444" font-size="9" font-weight="bold">Claude Opus 4.7 (closed)</text>

  <!-- Cost Comparison Section -->
  <text x="60" y="250" fill="#22c55e" font-size="13" font-weight="bold">API Cost per 1M Output Tokens ($)</text>

  <!-- Cost bars (horizontal, inverted = cheaper is better, shorter bar) -->
  <rect x="200" y="265" width="700" height="30" rx="6" fill="#1e1e2e"/>

  <!-- DeepSeek V4 Flash: $0.28 -->
  <rect x="200" y="265" width="8" height="30" rx="4" fill="#22c55e"/>
  <text x="215" y="285" fill="#22c55e" font-size="11" font-weight="bold">$0.28 — DeepSeek V4 Flash</text>

  <!-- DeepSeek V4 Pro: $0.87 -->
  <rect x="200" y="300" width="20" height="30" rx="4" fill="#22c55e" opacity="0.8"/>
  <text x="227" y="320" fill="#22c55e" font-size="11" font-weight="bold">$0.87 — DeepSeek V4 Pro</text>

  <!-- Qwen 3.6: ~$0.50 -->
  <rect x="200" y="335" width="12" height="30" rx="4" fill="#8b5cf6"/>
  <text x="219" y="355" fill="#c4b5fd" font-size="11" font-weight="bold">~$0.50 — Qwen 3.6-35B</text>

  <!-- Reference: GPT-5.5: $30 -->
  <rect x="200" y="370" width="480" height="30" rx="4" fill="#ef4444" opacity="0.4"/>
  <text x="685" y="390" fill="#ef4444" font-size="11" font-weight="bold">$30 — GPT-5.5 (closed)</text>

  <!-- Reference: Claude Opus 4.7: $25 -->
  <rect x="200" y="405" width="400" height="30" rx="4" fill="#ef4444" opacity="0.3"/>
  <text x="605" y="425" fill="#ef4444" font-size="11" font-weight="bold">$25 — Claude Opus 4.7 (closed)</text>

  <!-- Bottom insight -->
  <rect x="100" y="455" width="700" height="35" rx="8" fill="#1e1e2e" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="450" y="477" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">💡 DeepSeek V4 Pro is 35-86× cheaper than Claude Opus 4.7 — with MIT license</text>
</svg>