  <text x="200" y="460" fill="#3b82f6" font-size="11" font-weight="bold">Dense 31B → 31B active</text>
  <text x="450" y="460" fill="#fbbf24" font-size="14">→</text>
  <text x="530" y="460" fill="#22c55e" font-size="11" font-weight="bold">MoE 1.6T → only 49B active</text>
  <text x="450" y="477" text-anchor="middle" fill="#94a3b8" font-size="10">33x more parameters stored, same-order inference cost</text>
