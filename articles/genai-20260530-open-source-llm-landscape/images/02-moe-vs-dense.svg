  <text x="225" y="395" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="bold">⚠ 100% compute per token</text>
  <text x="225" y="412" text-anchor="middle" fill="#94a3b8" font-size="10">All neurons fire → expensive inference</text>

