<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="url(#bg)" rx="16"/>

  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold">Claude Code Plugin Architecture</text>
  <text x="450" y="62" text-anchor="middle" fill="#64748b" font-size="12">How plugins, hooks, and subagents compose into workflows</text>

  <!-- Step 1: Developer -->
  <rect x="30" y="100" width="140" height="75" rx="10" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="100" y="130" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">Developer</text>
  <text x="100" y="150" text-anchor="middle" fill="#94a3b8" font-size="10">installs plugin</text>
  <text x="100" y="166" text-anchor="middle" fill="#94a3b8" font-size="10">via .zip / URL</text>

  <!-- Arrow 1 -->
  <line x1="173" y1="137" x2="215" y2="137" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Plugin Marketplace -->
  <rect x="218" y="100" width="150" height="75" rx="10" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="293" y="128" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">🧩 Marketplace</text>
  <text x="293" y="148" text-anchor="middle" fill="#94a3b8" font-size="10">version tracking</text>
  <text x="293" y="164" text-anchor="middle" fill="#94a3b8" font-size="10">auto-update</text>

  <!-- Arrow 2 -->
  <line x1="371" y1="137" x2="413" y2="137" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Claude Code Core -->
  <rect x="416" y="80" width="160" height="115" rx="10" fill="#1e1e2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="496" y="110" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">Claude Code</text>
  <text x="496" y="130" text-anchor="middle" fill="#94a3b8" font-size="10">Routes task to:</text>
  <text x="496" y="148" text-anchor="middle" fill="#e2e8f0" font-size="10">→ Slash command</text>
  <text x="496" y="164" text-anchor="middle" fill="#e2e8f0" font-size="10">→ Hook trigger</text>
  <text x="496" y="180" text-anchor="middle" fill="#e2e8f0" font-size="10">→ Subagent dispatch</text>

  <!-- Arrow 3 -->
  <line x1="579" y1="137" x2="621" y2="120" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="579" y1="155" x2="621" y2="175" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4a: Subagents -->
  <rect x="624" y="85" width="135" height="65" rx="10" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="692" y="110" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">🤖 Subagents</text>
  <text x="692" y="130" text-anchor="middle" fill="#94a3b8" font-size="10">parallel workers</text>
  <text x="692" y="145" text-anchor="middle" fill="#94a3b8" font-size="10">worktree isolation</text>

  <!-- Step 4b: Hooks -->
  <rect x="624" y="165" width="135" height="55" rx="10" fill="#1e1e2e" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="692" y="190" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="bold">⚡ Hooks</text>
  <text x="692" y="210" text-anchor="middle" fill="#94a3b8" font-size="10">event callbacks</text>

  <!-- Arrow merge -->
  <line x1="762" y1="117" x2="795" y2="145" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="762" y1="192" x2="795" y2="160" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Output -->
  <rect x="798" y="120" width="80" height="65" rx="10" fill="#1e1e2e" stroke="#22c55e" stroke-width="2"/>
  <text x="838" y="148" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">Done</text>
  <text x="838" y="166" text-anchor="middle" fill="#22c55e" font-size="10">✓ result</text>
  <circle cx="838" cy="178" r="4" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom: Ctrl+R history search -->
  <rect x="50" y="260" width="240" height="70" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="170" y="285" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="bold">Ctrl+R History Search</text>
  <text x="170" y="304" text-anchor="middle" fill="#64748b" font-size="10">search commands across</text>
  <text x="170" y="320" text-anchor="middle" fill="#64748b" font-size="10">ALL projects at once</text>

  <!-- Bottom: /ultrareview -->
  <rect x="330" y="260" width="240" height="70" rx="10" fill="#1e1e2e" stroke="#ef4444" stroke-width="1"/>
  <text x="450" y="285" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">/ultrareview</text>
  <text x="450" y="304" text-anchor="middle" fill="#64748b" font-size="10">parallel review agents</text>
  <text x="450" y="320" text-anchor="middle" fill="#64748b" font-size="10">$5–$20 per run · thorough</text>

  <!-- Bottom: Hard Deny Rules -->
  <rect x="610" y="260" width="240" height="70" rx="10" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="730" y="285" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">Auto Mode Hard Deny</text>
  <text x="730" y="304" text-anchor="middle" fill="#64748b" font-size="10">block risky actions</text>
  <text x="730" y="320" text-anchor="middle" fill="#64748b" font-size="10">unconditionally in auto</text>
</svg>
