<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="900" height="420" fill="url(#bg)" rx="16"/>
  
  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Claude Code in 2026</text>
  <text x="450" y="70" text-anchor="middle" fill="#64748b" font-size="13">From coding assistant → full developer ecosystem</text>
  
  <!-- Center: Claude Code -->
  <rect x="355" y="160" width="190" height="100" rx="12" fill="#1e1e2e" stroke="url(#amber)" stroke-width="2.5"/>
  <rect x="355" y="160" width="190" height="36" rx="12" fill="url(#amber)"/>
  <rect x="355" y="184" width="190" height="12" fill="url(#amber)"/>
  <text x="450" y="184" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="bold">Claude Code</text>
  <text x="450" y="215" text-anchor="middle" fill="#94a3b8" font-size="10">Opus 4.7 · 1M context</text>
  <text x="450" y="233" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">87.6% SWE-Bench</text>
  <text x="450" y="251" text-anchor="middle" fill="#94a3b8" font-size="10">xhigh effort · auto mode</text>
  
  <!-- Left: Plugins -->
  <rect x="40" y="100" width="170" height="85" rx="10" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="125" y="125" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">🧩 Plugin Marketplace</text>
  <text x="125" y="147" text-anchor="middle" fill="#94a3b8" font-size="10">Slash commands</text>
  <text x="125" y="163" text-anchor="middle" fill="#94a3b8" font-size="10">ZIP/URL install</text>
  <text x="125" y="179" text-anchor="middle" fill="#94a3b8" font-size="10">Auto-update</text>
  
  <!-- Left: Hooks -->
  <rect x="40" y="230" width="170" height="85" rx="10" fill="#1e1e2e" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="125" y="255" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="bold">⚡ Hooks</text>
  <text x="125" y="276" text-anchor="middle" fill="#94a3b8" font-size="10">Event-driven automation</text>
  <text x="125" y="292" text-anchor="middle" fill="#94a3b8" font-size="10">Hard deny rules</text>
  <text x="125" y="308" text-anchor="middle" fill="#94a3b8" font-size="10">Pre/post tool triggers</text>
  
  <!-- Right: Subagents -->
  <rect x="690" y="100" width="170" height="85" rx="10" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="775" y="125" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">🤖 Subagents</text>
  <text x="775" y="147" text-anchor="middle" fill="#94a3b8" font-size="10">YAML-defined agents</text>
  <text x="775" y="163" text-anchor="middle" fill="#94a3b8" font-size="10">Parallel task execution</text>
  <text x="775" y="179" text-anchor="middle" fill="#94a3b8" font-size="10">Agent view dashboard</text>
  
  <!-- Right: Worktrees -->
  <rect x="690" y="230" width="170" height="85" rx="10" fill="#1e1e2e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="775" y="255" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">🌿 Worktrees</text>
  <text x="775" y="276" text-anchor="middle" fill="#94a3b8" font-size="10">Parallel git branches</text>
  <text x="775" y="292" text-anchor="middle" fill="#94a3b8" font-size="10">Background isolation</text>
  <text x="775" y="308" text-anchor="middle" fill="#94a3b8" font-size="10">Branch from HEAD/remote</text>
  
  <!-- Bottom: Ultrareview -->
  <rect x="310" y="310" width="280" height="70" rx="10" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.5"/>
  <text x="450" y="335" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">🔍 /ultrareview</text>
  <text x="450" y="355" text-anchor="middle" fill="#94a3b8" font-size="10">Parallel reviewer agents · $5–$20/run</text>
  <text x="450" y="372" text-anchor="middle" fill="#94a3b8" font-size="10">Multi-perspective code review in one command</text>
  
  <!-- Arrows from Claude Code to each -->
  <line x1="355" y1="195" x2="215" y2="155" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="355" y1="235" x2="215" y2="265" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="195" x2="685" y2="155" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="235" x2="685" y2="265" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="260" x2="450" y2="305" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="450" y="406" text-anchor="middle" fill="#475569" font-size="10">May 2026 · Anthropic · Opus 4.7 · 3x production tasks vs 4.6</text>
</svg>
