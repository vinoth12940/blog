<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="url(#bg)" rx="16"/>
  
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold">Claude Opus 4.7 Benchmark Comparison</text>
  <text x="450" y="65" text-anchor="middle" fill="#64748b" font-size="12">Same price, major performance leap — $5/$25 per MTok</text>

  <!-- Labels row -->
  <text x="200" y="100" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">Opus 4.6</text>
  <text x="600" y="100" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Opus 4.7</text>
  
  <!-- SWE-Bench -->
  <text x="60" y="140" fill="#94a3b8" font-size="11">SWE-Bench Verified</text>
  <!-- Bar 4.6 -->
  <rect x="140" y="120" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="140" y="120" width="182" height="28" rx="6" fill="#1e3a5f"/>
  <text x="330" y="139" text-anchor="end" fill="#93c5fd" font-size="12" font-weight="bold">80.8%</text>
  <!-- Bar 4.7 -->
  <rect x="440" y="120" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="440" y="120" width="193" height="28" rx="6" fill="#1d4ed8"/>
  <text x="642" y="139" text-anchor="end" fill="#93c5fd" font-size="12" font-weight="bold">87.6%</text>
  <!-- delta -->
  <text x="820" y="139" fill="#22c55e" font-size="11" font-weight="bold">+6.8pp</text>
  
  <!-- Rakuten SWE -->
  <text x="60" y="185" fill="#94a3b8" font-size="11">Rakuten SWE-Bench</text>
  <rect x="140" y="165" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="140" y="165" width="73" height="28" rx="6" fill="#1e3a5f"/>
  <text x="217" y="184" text-anchor="end" fill="#93c5fd" font-size="12" font-weight="bold">1x</text>
  <rect x="440" y="165" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="440" y="165" width="220" height="28" rx="6" fill="#1d4ed8"/>
  <text x="654" y="184" text-anchor="end" fill="#93c5fd" font-size="12" font-weight="bold">3x tasks</text>
  <text x="820" y="184" fill="#22c55e" font-size="11" font-weight="bold">+3x</text>
  
  <!-- Vision resolution -->
  <text x="60" y="230" fill="#94a3b8" font-size="11">Vision Resolution</text>
  <rect x="140" y="210" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="140" y="210" width="66" height="28" rx="6" fill="#2d1b69"/>
  <text x="210" y="229" text-anchor="end" fill="#c4b5fd" font-size="12" font-weight="bold">1x</text>
  <rect x="440" y="210" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="440" y="210" width="220" height="28" rx="6" fill="#4c1d95"/>
  <text x="654" y="229" text-anchor="end" fill="#c4b5fd" font-size="12" font-weight="bold">3.3x res.</text>
  <text x="820" y="229" fill="#22c55e" font-size="11" font-weight="bold">+3.3x</text>
  
  <!-- Context Window -->
  <text x="60" y="275" fill="#94a3b8" font-size="11">Context Window</text>
  <rect x="140" y="255" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="140" y="255" width="110" height="28" rx="6" fill="#1e3a5f"/>
  <text x="254" y="274" text-anchor="end" fill="#93c5fd" font-size="12" font-weight="bold">200K</text>
  <rect x="440" y="255" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="440" y="255" width="220" height="28" rx="6" fill="#1d4ed8"/>
  <text x="654" y="274" text-anchor="end" fill="#93c5fd" font-size="12" font-weight="bold">1M context</text>
  <text x="820" y="274" fill="#22c55e" font-size="11" font-weight="bold">+5x</text>
  
  <!-- Effort Levels -->
  <text x="60" y="320" fill="#94a3b8" font-size="11">Effort Levels</text>
  <rect x="140" y="300" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="250" y="319" text-anchor="middle" fill="#64748b" font-size="11">low / medium / high / max</text>
  <rect x="440" y="300" width="220" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="550" y="319" text-anchor="middle" fill="#fbbf24" font-size="11">+ xhigh (new)</text>
  <text x="820" y="319" fill="#22c55e" font-size="11" font-weight="bold">NEW</text>
  
  <!-- Pricing badge -->
  <rect x="180" y="365" width="540" height="50" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="450" y="388" text-anchor="middle" fill="#94a3b8" font-size="11">API Pricing (unchanged from 4.6)</text>
  <text x="330" y="406" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">$5/MTok input</text>
  <text x="450" y="406" text-anchor="middle" fill="#64748b" font-size="12">·</text>
  <text x="570" y="406" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">$25/MTok output</text>
</svg>
