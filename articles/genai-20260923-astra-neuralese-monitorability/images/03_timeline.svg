<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
  <defs>
    <marker id="tlarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="1440" height="820" fill="#0f172a"/>
  <text x="720" y="56" text-anchor="middle" fill="#f1f5f9" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">From flagship launch to safety debate in 36 hours</text>
  <text x="720" y="86" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="17">The GPT-6 Astra chain-of-thought timeline</text>

  <!-- main line -->
  <line x1="100" y1="430" x2="1340" y2="430" stroke="#22d3ee" stroke-width="3" marker-end="url(#tlarrow)"/>

  <!-- Node 1: launch -->
  <g>
    <circle cx="180" cy="430" r="10" fill="#22d3ee"/>
    <rect x="80" y="470" width="260" height="230" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="210" y="504" text-anchor="middle" fill="#22d3ee" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Sep 3 - Launch</text>
    <text x="210" y="536" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="15">GPT-6 Astra ships</text>
    <text x="210" y="562" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">$10/$50 per 1M tokens</text>
    <text x="210" y="586" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">$20/$100 fast tier</text>
    <text x="210" y="618" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">System card discloses</text>
    <text x="210" y="640" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">"decreased CoT</text>
    <text x="210" y="662" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">monitorability"</text>
  </g>

  <!-- Node 2: The Information report -->
  <g>
    <circle cx="470" cy="430" r="10" fill="#fbbf24"/>
    <rect x="370" y="130" width="260" height="270" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="500" y="164" text-anchor="middle" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Sep 3 - The report</text>
    <text x="500" y="196" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="15">The Information:</text>
    <text x="500" y="220" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">Astra built on "recurrent</text>
    <text x="500" y="242" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">depth" (looped transformer)</text>
    <text x="500" y="274" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">More thinking happens inside</text>
    <text x="500" y="296" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">the hidden state - less needs</text>
    <text x="500" y="318" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">to be written down</text>
    <text x="500" y="352" text-anchor="middle" fill="#a78bfa" font-family="Inter, Arial, sans-serif" font-size="13.5" font-style="italic">Safety researcher Ryan</text>
    <text x="500" y="374" text-anchor="middle" fill="#a78bfa" font-family="Inter, Arial, sans-serif" font-size="13.5" font-style="italic">Greenblatt: "may be the single</text>
    <text x="500" y="396" text-anchor="middle" fill="#a78bfa" font-family="Inter, Arial, sans-serif" font-size="13.5" font-style="italic">worst development" for AI safety</text>
  </g>

  <!-- Node 3: panic -->
  <g>
    <circle cx="760" cy="430" r="10" fill="#f87171"/>
    <rect x="660" y="470" width="260" height="230" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="790" y="504" text-anchor="middle" fill="#f87171" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">The "neuralese" fear</text>
    <text x="790" y="536" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="15">If models reason in</text>
    <text x="790" y="560" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">latent space, the safety</text>
    <text x="790" y="582" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">window closes:</text>
    <text x="790" y="612" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">- no readable scratchpad</text>
    <text x="790" y="634" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">- no CoT monitoring</text>
    <text x="790" y="656" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">- no auditing the notes</text>
    <text x="790" y="688" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="13" font-style="italic">OpenAI called this framing "panic"</text>
  </g>

  <!-- Node 4: Pachocki response -->
  <g>
    <circle cx="1050" cy="430" r="10" fill="#34d399"/>
    <rect x="950" y="130" width="260" height="270" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="1080" y="164" text-anchor="middle" fill="#34d399" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">OpenAI pushes back</text>
    <text x="1080" y="196" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="15">Chief scientist Jakub</text>
    <text x="1080" y="220" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">Pachocki: Astra is not a</text>
    <text x="1080" y="242" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">neuralese model</text>
    <text x="1080" y="274" text-anchor="middle" fill="#34d399" font-family="Inter, Arial, sans-serif" font-size="13.5">- depth within 2x of GPT-4</text>
    <text x="1080" y="296" text-anchor="middle" fill="#34d399" font-family="Inter, Arial, sans-serif" font-size="13.5">- CoT controllability 93%</text>
    <text x="1080" y="318" text-anchor="middle" fill="#34d399" font-family="Inter, Arial, sans-serif" font-size="13.5">  (Sol: 48%)</text>
    <text x="1080" y="350" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">Critics: first step down a</text>
    <text x="1080" y="372" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">slippery slope is still a step</text>
  </g>

  <!-- Node 5: the week after -->
  <g>
    <circle cx="1300" cy="430" r="10" fill="#a78bfa"/>
    <rect x="1150" y="470" width="240" height="230" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="1270" y="504" text-anchor="middle" fill="#a78bfa" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Sep 22 - context</text>
    <text x="1270" y="536" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="15">Frontier price war:</text>
    <text x="1270" y="562" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">Opus 5.5 + GPT-6 Sol/Luna</text>
    <text x="1270" y="584" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">Grok 4.7 - 3 cuts in 48h</text>
    <text x="1270" y="616" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">Astra architecture is now</text>
    <text x="1270" y="638" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">the template others may</text>
    <text x="1270" y="660" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13.5">copy at lower prices</text>
  </g>

  <text x="720" y="770" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">Sources: The Information, Transformer, Latent Space AINews, OpenAI statements - September 2026</text>
</svg>
