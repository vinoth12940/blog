<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800">
  <rect width="1440" height="800" fill="#0f172a"/>
  <text x="720" y="56" text-anchor="middle" fill="#f1f5f9" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">The UK AISI numbers behind the controversy</text>
  <text x="720" y="86" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="17">Astra vs GPT-5.6 Sol, from the GPT-6 system card evaluation</text>

  <!-- Panel 1: time horizon -->
  <g>
    <rect x="70" y="130" width="620" height="560" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="380" y="174" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">No-CoT time horizon</text>
    <text x="380" y="200" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14">how long a task the model completes per step, without written reasoning</text>

    <!-- axis -->
    <line x1="150" y1="600" x2="640" y2="600" stroke="#475569" stroke-width="1.5"/>

    <!-- Sol bar: 3.6 min -->
    <rect x="210" y="522" width="90" height="78" rx="6" fill="#334155"/>
    <text x="255" y="508" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">3.6 min</text>
    <text x="255" y="632" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="15">GPT-5.6 Sol</text>

    <!-- Astra bar: 30.9 min (proportional: 30.9/3.6 = 8.58x -> 78*8.58 = 669 too tall; cap at 440px with break note) -->
    <rect x="420" y="160" width="90" height="440" rx="6" fill="#22d3ee"/>
    <text x="465" y="140" text-anchor="middle" fill="#22d3ee" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">30.9 min</text>
    <text x="465" y="632" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="15">GPT-6 Astra</text>

    <text x="380" y="676" text-anchor="middle" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">~8.6x more work per single step</text>
    <text x="380" y="700" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="13">(bars to scale; Astra truncated for layout)</text>
  </g>

  <!-- Panel 2: CoT controllability -->
  <g>
    <rect x="750" y="130" width="620" height="560" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="1060" y="174" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">CoT controllability</text>
    <text x="1060" y="200" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14">can steering the written reasoning steer the outcome?</text>

    <!-- axis -->
    <line x1="830" y1="600" x2="1320" y2="600" stroke="#475569" stroke-width="1.5"/>

    <!-- Sol: 48% -> height 192 -->
    <rect x="890" y="408" width="90" height="192" rx="6" fill="#334155"/>
    <text x="935" y="394" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">48%</text>
    <text x="935" y="632" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="15">GPT-5.6 Sol</text>

    <!-- Astra: 93% -> height 372 -->
    <rect x="1100" y="228" width="90" height="372" rx="6" fill="#22d3ee"/>
    <text x="1145" y="214" text-anchor="middle" fill="#22d3ee" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">93%</text>
    <text x="1145" y="632" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="15">GPT-6 Astra</text>

    <text x="1060" y="670" text-anchor="middle" fill="#34d399" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Astra's visible reasoning is still highly steerable</text>
    <text x="1060" y="694" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="13">OpenAI's chief scientist cited both figures as evidence</text>
    <text x="1060" y="712" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="13">that Astra is not a neuralese model</text>
  </g>

  <text x="720" y="740" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">Third-party read: reasoning summaries omitted up to 80% of reasoning steps on long simulated cyber trajectories (UK AISI)</text>
  <text x="720" y="764" text-anchor="middle" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="13">Sources: GPT-6 Astra system card; UK AI Safety Institute evaluation; Transformer / The Information coverage, Sep 2026</text>
</svg>
