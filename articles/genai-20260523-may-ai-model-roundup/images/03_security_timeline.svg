<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="380" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">May 2026 AI Security Incidents</text>
  <text x="450" y="62" text-anchor="middle" fill="#64748b" font-size="12">The attack surface expanded faster than the defenses</text>

  <!-- Incident 1: LMDeploy -->
  <rect x="30" y="85" width="410" height="130" rx="12" fill="#1e1e2e" stroke="#ef4444" stroke-width="2"/>
  <rect x="30" y="85" width="410" height="36" rx="12" fill="#7f1d1d"/>
  <text x="235" y="109" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="bold">CVE-2026-33626 — LMDeploy SSRF</text>
  <text x="50" y="142" fill="#e2e8f0" font-size="12">Disclosed: April 20, 2026</text>
  <text x="50" y="162" fill="#ef4444" font-size="13" font-weight="bold">First exploit: 12 hours 31 minutes later</text>
  <text x="50" y="182" fill="#94a3b8" font-size="11">Vision-LLM image loading endpoint used for SSRF</text>
  <text x="50" y="200" fill="#94a3b8" font-size="11">Attackers pivoted from AI inference to internal network</text>

  <!-- Incident 2: Claude Code -->
  <rect x="460" y="85" width="410" height="130" rx="12" fill="#1e1e2e" stroke="#f59e0b" stroke-width="2"/>
  <rect x="460" y="85" width="410" height="36" rx="12" fill="#78350f"/>
  <text x="665" y="109" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold">Claude Code Source Leak</text>
  <text x="480" y="142" fill="#e2e8f0" font-size="12">Date: March 31 — April 1, 2026</text>
  <text x="480" y="162" fill="#fbbf24" font-size="13" font-weight="bold">513,000 lines of internal source code</text>
  <text x="480" y="182" fill="#94a3b8" font-size="11">npm source maps exposed agentic logic</text>
  <text x="480" y="200" fill="#94a3b8" font-size="11">Blueprint for Claude Code's OS interaction model public</text>

  <!-- Key Insight Box -->
  <rect x="30" y="230" width="840" height="70" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="450" y="252" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Verizon DBIR 2026: AI-related data breaches surpassed stolen credentials for the first time</text>
  <text x="450" y="272" text-anchor="middle" fill="#94a3b8" font-size="11">31,000+ incidents reviewed — software flaw exploitation now #1 attack vector</text>
  <text x="450" y="290" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="bold">Palo Alto: "4 immediate steps for agentic defense" — May 2026 update</text>

  <!-- Timeline bar -->
  <rect x="30" y="315" width="840" height="45" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="50" y="334" fill="#94a3b8" font-size="10">Mar 31</text>
  <circle cx="95" cy="330" r="4" fill="#f59e0b"/>
  <line x1="110" y1="330" x2="250" y2="330" stroke="#334155" stroke-width="2"/>
  <text x="180" y="348" fill="#94a3b8" font-size="9">Claude Code leaked</text>
  <circle cx="265" cy="330" r="4" fill="#ef4444"/>
  <text x="260" y="322" fill="#94a3b8" font-size="9">Apr 20</text>
  <line x1="280" y1="330" x2="420" y2="330" stroke="#334155" stroke-width="2"/>
  <circle cx="435" cy="330" r="4" fill="#ef4444"/>
  <text x="415" y="322" fill="#94a3b8" font-size="9">Apr 22</text>
  <line x1="450" y1="330" x2="590" y2="330" stroke="#334155" stroke-width="2"/>
  <circle cx="605" cy="330" r="4" fill="#ef4444"/>
  <text x="585" y="322" fill="#94a3b8" font-size="9">May 13</text>
  <line x1="620" y1="330" x2="760" y2="330" stroke="#334155" stroke-width="2"/>
  <circle cx="775" cy="330" r="4" fill="#ef4444"/>
  <text x="755" y="322" fill="#94a3b8" font-size="9">May 19</text>
  <text x="795" y="348" fill="#94a3b8" font-size="9">Verizon report</text>
  <text x="620" y="348" fill="#94a3b8" font-size="9">Palo Alto update</text>
  <text x="440" y="348" fill="#94a3b8" font-size="9">Sysdig analysis</text>
  <text x="270" y="348" fill="#94a3b8" font-size="9">CVE disclosed</text>

  <!-- Footer -->
  <text x="450" y="375" text-anchor="middle" fill="#475569" font-size="10">Sources: sysdig.com, reddit.com, verizon.com, paloaltonetworks.com</text>
</svg>