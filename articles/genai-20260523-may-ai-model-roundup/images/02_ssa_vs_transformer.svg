<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">How SSA Breaks the Quadratic Attention Barrier</text>
  <text x="450" y="62" text-anchor="middle" fill="#64748b" font-size="12">Standard Transformer O(n²) vs Subquadratic Sparse Attention O(n·k)</text>

  <!-- LEFT: Standard Transformer -->
  <text x="225" y="95" text-anchor="middle" fill="#ef4444" font-size="15" font-weight="bold">Standard Transformer</text>

  <!-- Grid representation (simplified) -->
  <rect x="75" y="110" width="300" height="160" rx="8" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="225" y="132" text-anchor="middle" fill="#94a3b8" font-size="10">Every token compares to every other token</text>

  <!-- Draw a small grid of dots with all connections -->
  <g opacity="0.7">
    <!-- Grid dots -->
    <circle cx="130" cy="175" r="4" fill="#ef4444"/>
    <circle cx="175" cy="175" r="4" fill="#ef4444"/>
    <circle cx="220" cy="175" r="4" fill="#ef4444"/>
    <circle cx="265" cy="175" r="4" fill="#ef4444"/>
    <circle cx="310" cy="175" r="4" fill="#ef4444"/>
    <circle cx="130" cy="220" r="4" fill="#ef4444"/>
    <circle cx="175" cy="220" r="4" fill="#ef4444"/>
    <circle cx="220" cy="220" r="4" fill="#ef4444"/>
    <circle cx="265" cy="220" r="4" fill="#ef4444"/>
    <circle cx="310" cy="220" r="4" fill="#ef4444"/>
    <!-- All connections (quadratic) -->
    <line x1="130" y1="175" x2="175" y2="175" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="130" y1="175" x2="220" y2="175" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="130" y1="175" x2="265" y2="175" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="130" y1="175" x2="310" y2="175" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="130" y1="175" x2="130" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="130" y1="175" x2="175" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="130" y1="175" x2="220" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="130" y1="175" x2="265" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="130" y1="175" x2="310" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="175" y1="175" x2="220" y2="175" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="175" y1="175" x2="265" y2="175" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="175" y1="175" x2="310" y2="175" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="175" y1="175" x2="130" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="175" y1="175" x2="175" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="175" y1="175" x2="220" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="175" y1="175" x2="265" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="175" y1="175" x2="310" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="220" y1="175" x2="265" y2="175" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="220" y1="175" x2="310" y2="175" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="220" y1="175" x2="130" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="220" y1="175" x2="175" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="220" y1="175" x2="220" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="220" y1="175" x2="265" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="220" y1="175" x2="310" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="265" y1="175" x2="310" y2="175" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="265" y1="175" x2="130" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="265" y1="175" x2="175" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="265" y1="175" x2="220" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="265" y1="175" x2="265" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="265" y1="175" x2="310" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="130" y1="220" x2="175" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="130" y1="220" x2="220" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="130" y1="220" x2="265" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="130" y1="220" x2="310" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="175" y1="220" x2="220" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="175" y1="220" x2="265" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="175" y1="220" x2="310" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="220" y1="220" x2="265" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="220" y1="220" x2="310" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
    <line x1="265" y1="220" x2="310" y2="220" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
  </g>

  <text x="225" y="260" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">O(n²) — compute explodes</text>
  <text x="225" y="278" text-anchor="middle" fill="#94a3b8" font-size="10">10K tokens → 100M comparisons</text>
  <text x="225" y="293" text-anchor="middle" fill="#94a3b8" font-size="10">1M tokens → 1 trillion comparisons</text>

  <!-- Cost box -->
  <rect x="95" y="310" width="260" height="55" rx="8" fill="#1e1e2e" stroke="#ef4444" stroke-width="1"/>
  <text x="225" y="333" text-anchor="middle" fill="#94a3b8" font-size="10">RULER 128K cost:</text>
  <text x="225" y="354" text-anchor="middle" fill="#ef4444" font-size="16" font-weight="bold">~$2,600 (Opus 4.7)</text>

  <!-- RIGHT: SSA -->
  <text x="675" y="95" text-anchor="middle" fill="#22c55e" font-size="15" font-weight="bold">SSA (SubQ)</text>

  <rect x="525" y="110" width="300" height="160" rx="8" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="675" y="132" text-anchor="middle" fill="#94a3b8" font-size="10">Only relevant token pairs compared</text>

  <!-- Sparse connections -->
  <g opacity="0.9">
    <circle cx="580" cy="175" r="4" fill="#22c55e"/>
    <circle cx="625" cy="175" r="4" fill="#22c55e"/>
    <circle cx="670" cy="175" r="4" fill="#22c55e"/>
    <circle cx="715" cy="175" r="4" fill="#22c55e"/>
    <circle cx="760" cy="175" r="4" fill="#22c55e"/>
    <circle cx="580" cy="220" r="4" fill="#22c55e"/>
    <circle cx="625" cy="220" r="4" fill="#22c55e"/>
    <circle cx="670" cy="220" r="4" fill="#22c55e"/>
    <circle cx="715" cy="220" r="4" fill="#22c55e"/>
    <circle cx="760" cy="220" r="4" fill="#22c55e"/>
    <!-- Sparse: only nearby + select cross -->
    <line x1="580" y1="175" x2="625" y2="175" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <line x1="625" y1="175" x2="670" y2="175" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <line x1="670" y1="175" x2="715" y2="175" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <line x1="715" y1="175" x2="760" y2="175" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <line x1="580" y1="220" x2="625" y2="220" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <line x1="625" y1="220" x2="670" y2="220" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <line x1="670" y1="220" x2="715" y2="220" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <line x1="715" y1="220" x2="760" y2="220" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <!-- Select cross-connections -->
    <line x1="670" y1="175" x2="670" y2="220" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>
    <line x1="580" y1="175" x2="715" y2="220" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>
    <line x1="760" y1="175" x2="625" y2="220" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>
  </g>

  <text x="675" y="260" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">O(n·k) — scales linearly</text>
  <text x="675" y="278" text-anchor="middle" fill="#94a3b8" font-size="10">10K tokens → 100K comparisons</text>
  <text x="675" y="293" text-anchor="middle" fill="#94a3b8" font-size="10">1M tokens → 10M comparisons</text>

  <!-- Cost box -->
  <rect x="545" y="310" width="260" height="55" rx="8" fill="#1e1e2e" stroke="#22c55e" stroke-width="1"/>
  <text x="675" y="333" text-anchor="middle" fill="#94a3b8" font-size="10">RULER 128K cost:</text>
  <text x="675" y="354" text-anchor="middle" fill="#22c55e" font-size="16" font-weight="bold">~$8 (SubQ 1M)</text>

  <!-- Speedup bar -->
  <rect x="100" y="390" width="700" height="50" rx="10" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="450" y="410" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Speedup: 7.2x at 128K → 52x at 1M → ~1000x at 12M tokens</text>
  <text x="450" y="430" text-anchor="middle" fill="#94a3b8" font-size="10">Context compute reduced by 63% while matching or exceeding frontier accuracy</text>

  <!-- Center arrow -->
  <line x1="400" y1="195" x2="500" y2="195" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrowRight)"/>
  <text x="450" y="185" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">SSA</text>

  <!-- Footer -->
  <text x="450" y="475" text-anchor="middle" fill="#475569" font-size="10">Source: subq.ai — Introducing SubQ (May 5, 2026)</text>
</svg>