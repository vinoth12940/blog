<svg width="100%" viewBox="0 0 1440 760" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f09595" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, system-ui, sans-serif; fill: #e8e6de; }
    .title { font-size: 26px; font-weight: 600; fill: #ffffff; }
    .subtitle { font-size: 16px; fill: #94a3b8; }
    .label { font-size: 17px; font-weight: 500; fill: #f1f5f9; }
    .sub { font-size: 14px; fill: #94a3b8; }
    .code { font-size: 14px; fill: #38bdf8; font-family: 'SF Mono', 'Cascadia Code', monospace; }
    .danger { font-size: 14px; fill: #fca5a5; font-weight: 600; }
    .rect-step { fill: #1e1e2e; stroke: #38bdf8; stroke-width: 1.5; rx: 12; }
    .rect-danger { fill: #1e1e2e; stroke: #ef4444; stroke-width: 1.5; rx: 12; }
    .rect-exec { fill: #1e1e2e; stroke: #f59e0b; stroke-width: 1.5; rx: 12; }
    .rect-sandbox { fill: #1e1e2e; stroke: #8b5cf6; stroke-width: 1.5; rx: 12; }
    .step-num { font-size: 13px; font-weight: 700; fill: #38bdf8; }
    .arrow-down { stroke: #64748b; stroke-width: 2; fill: none; }
    .arrow-danger { stroke: #ef4444; stroke-width: 2; fill: none; }
  </style>

  <rect width="1440" height="760" fill="#0f172a"/>

  <text x="720" y="50" text-anchor="middle" class="title">AutoJack: One Webpage RCEs Your Agent's Host</text>
  <text x="720" y="80" text-anchor="middle" class="subtitle">AutoGen Studio — how localhost trust boundary dissolves when agents browse the web</text>

  <!-- Attacker side -->
  <text x="320" y="125" text-anchor="middle" class="step-num">ATTACKER (REMOTE)</text>

  <rect x="80" y="140" width="480" height="80" class="rect-danger"/>
  <text x="320" y="170" text-anchor="middle" class="label">Malicious webpage planted</text>
  <text x="320" y="195" text-anchor="middle" class="sub">Comment on news site, or user tricked into URL</text>

  <line x1="320" y1="225" x2="320" y2="260" class="arrow-danger" marker-end="url(#arrow3)"/>

  <rect x="80" y="265" width="480" height="80" class="rect-danger"/>
  <text x="320" y="295" text-anchor="middle" class="label">Page contains hidden JavaScript</text>
  <text x="320" y="320" text-anchor="middle" class="code">ws://localhost:8081/api/mcp/ws/&lt;id&gt;?server_params=...</text>

  <line x1="560" y1="305" x2="720" y2="305" class="arrow-danger" marker-end="url(#arrow3)"/>

  <!-- Agent side -->
  <text x="1040" y="125" text-anchor="middle" class="step-num">DEVELOPER HOST</text>

  <rect x="720" y="140" width="640" height="80" class="rect-step"/>
  <text x="1040" y="170" text-anchor="middle" class="label">AutoGen agent with browsing tools</text>
  <text x="1040" y="195" text-anchor="middle" class="sub">MultimodalWebSurfer renders the malicious page</text>

  <line x1="1040" y1="225" x2="1040" y2="260" class="arrow-down" marker-end="url(#arrow3)"/>

  <rect x="720" y="265" width="640" height="80" class="rect-danger"/>
  <text x="1040" y="295" text-anchor="middle" class="label">Headless browser executes JS on localhost</text>
  <text x="1040" y="320" text-anchor="middle" class="danger">Origin = localhost → passes allowlist check</text>

  <line x1="1040" y1="350" x2="1040" y2="385" class="arrow-danger" marker-end="url(#arrow3)"/>

  <!-- Three weaknesses -->
  <text x="1040" y="380" text-anchor="middle" class="step-num">THREE WEAKNESSES CHAINED</text>

  <rect x="720" y="395" width="200" height="100" class="rect-danger"/>
  <text x="820" y="422" text-anchor="middle" class="label">Issue 1</text>
  <text x="820" y="445" text-anchor="middle" class="sub">Origin allowlist</text>
  <text x="820" y="462" text-anchor="middle" class="sub">defeated by agent</text>
  <text x="820" y="480" text-anchor="middle" class="sub">on same machine</text>

  <rect x="940" y="395" width="200" height="100" class="rect-danger"/>
  <text x="1040" y="422" text-anchor="middle" class="label">Issue 2</text>
  <text x="1040" y="445" text-anchor="middle" class="sub">Auth middleware</text>
  <text x="1040" y="462" text-anchor="middle" class="sub">skips MCP paths</text>
  <text x="1040" y="480" text-anchor="middle" class="sub">entirely</text>

  <rect x="1160" y="395" width="200" height="100" class="rect-danger"/>
  <text x="1260" y="422" text-anchor="middle" class="label">Issue 3</text>
  <text x="1260" y="445" text-anchor="middle" class="sub">server_params from</text>
  <text x="1260" y="462" text-anchor="middle" class="sub">URL = command</text>
  <text x="1260" y="480" text-anchor="middle" class="sub">line, verbatim</text>

  <line x1="1040" y1="500" x2="1040" y2="535" class="arrow-danger" marker-end="url(#arrow3)"/>

  <!-- Outcome -->
  <rect x="720" y="540" width="640" height="100" class="rect-exec"/>
  <text x="1040" y="570" text-anchor="middle" class="label">StdioServerParams spawns arbitrary process</text>
  <text x="1040" y="598" text-anchor="middle" class="danger">calc.exe / powershell -enc / bash -c '...' — no allowlist</text>
  <text x="1040" y="622" text-anchor="middle" class="sub">Runs under the developer's account, with developer's privileges</text>

  <line x1="60" y1="670" x2="1380" y2="670" stroke="#334155" stroke-width="1"/>

  <text x="720" y="700" text-anchor="middle" class="subtitle">Fixed in AutoGen main branch commit b047730 — never shipped in PyPI release</text>
  <text x="720" y="730" text-anchor="middle" class="subtitle">Source: Microsoft Defender Security Research Team (June 18, 2026)</text>
</svg>
