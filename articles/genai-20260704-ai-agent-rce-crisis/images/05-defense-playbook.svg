<svg width="100%" viewBox="0 0 1440 840" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5dcaa5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, system-ui, sans-serif; fill: #e8e6de; }
    .title { font-size: 26px; font-weight: 600; fill: #ffffff; }
    .subtitle { font-size: 16px; fill: #94a3b8; }
    .label { font-size: 17px; font-weight: 500; fill: #f1f5f9; }
    .sub { font-size: 14px; fill: #94a3b8; }
    .rule { font-size: 15px; font-weight: 500; fill: #5dcaa5; }
    .rule-sub { font-size: 13px; fill: #94a3b8; }
    .rect-do { fill: #1e1e2e; stroke: #0f6e56; stroke-width: 1.5; rx: 12; }
    .rect-dont { fill: #1e1e2e; stroke: #a32d2d; stroke-width: 1.5; rx: 12; }
    .check { font-size: 20px; font-weight: 700; fill: #5dcaa5; }
    .x { font-size: 20px; font-weight: 700; fill: #f09595; }
    .section { font-size: 13px; font-weight: 700; fill: #64748b; text-transform: uppercase; letter-spacing: 1.5px; }
  </style>

  <rect width="1440" height="840" fill="#0f172a"/>

  <text x="720" y="50" text-anchor="middle" class="title">Securing AI Agents: Defense-in-Depth Playbook</text>
  <text x="720" y="80" text-anchor="middle" class="subtitle">Seven rules derived from the 2026 agent framework exploit research</text>

  <line x1="60" y1="110" x2="1380" y2="110" stroke="#334155" stroke-width="1"/>

  <!-- Left column: DO -->
  <text x="360" y="145" text-anchor="middle" class="section">✓ DO</text>

  <rect x="60" y="165" width="600" height="80" class="rect-do"/>
  <text x="80" y="195" class="check">1</text>
  <text x="110" y="195" class="rule">Treat every model-controlled tool parameter as attacker input</text>
  <text x="110" y="218" class="rule-sub">Any kwarg the LLM can influence = untrusted. Validate, sanitize, allowlist.</text>

  <rect x="60" y="260" width="600" height="80" class="rect-do"/>
  <text x="80" y="290" class="check">2</text>
  <text x="110" y="290" class="rule">Use AST allowlists, not blocklists, for dynamic code execution</text>
  <text x="110" y="313" class="rule-sub">Blocklists in Python are inherently fragile — alternative syntax defeats them.</text>

  <rect x="60" y="355" width="600" height="80" class="rect-do"/>
  <text x="80" y="385" class="check">3</text>
  <text x="110" y="385" class="rule">Authenticate every localhost control plane</text>
  <text x="110" y="408" class="rule-sub">MCP WebSockets, debug endpoints, dev servers — all require auth.</text>

  <rect x="60" y="450" width="600" height="80" class="rect-do"/>
  <text x="80" y="480" class="check">4</text>
  <text x="110" y="480" class="rule">Allowlist which executables MCP servers can spawn</text>
  <text x="110" y="503" class="rule-sub">Never accept arbitrary command + args from a query parameter.</text>

  <rect x="60" y="545" width="600" height="80" class="rect-do"/>
  <text x="80" y="575" class="check">5</text>
  <text x="110" y="575" class="rule">Isolate agent identity from developer identity</text>
  <text x="110" y="598" class="rule-sub">Different OS user, container, or VM. Reduce blast radius.</text>

  <!-- Right column: DON'T -->
  <text x="1080" y="145" text-anchor="middle" class="section">✗ DON'T</text>

  <rect x="780" y="165" width="600" height="80" class="rect-dont"/>
  <text x="800" y="195" class="x">1</text>
  <text x="830" y="195" class="rule" style="fill:#f09595">Treat your LLM as a security boundary</text>
  <text x="830" y="218" class="rule-sub">The model translates intent into tool calls. It does not enforce security.</text>

  <rect x="780" y="260" width="600" height="80" class="rect-dont"/>
  <text x="800" y="290" class="x">2</text>
  <text x="830" y="290" class="rule" style="fill:#f09595">Mark internal file-write helpers as KernelFunction</text>
  <text x="830" y="313" class="rule-sub">If the model can call it, prompt injection can reach it. Hide helpers.</text>

  <rect x="780" y="355" width="600" height="80" class="rect-dont"/>
  <text x="800" y="385" class="x">3</text>
  <text x="830" y="385" class="rule" style="fill:#f09595">Trust localhost / 127.0.0.1 origin checks for agents</text>
  <text x="830" y="408" class="rule-sub">A browsing agent inherits localhost identity. Origin is meaningless.</text>

  <rect x="780" y="450" width="600" height="80" class="rect-dont"/>
  <text x="800" y="480" class="x">4</text>
  <text x="830" y="480" class="rule" style="fill:#f09595">Run agents with browsing + code execution on your daily-driver</text>
  <text x="830" y="503" class="rule-sub">This is the exact substrate needed for confused-deputy attacks.</text>

  <rect x="780" y="545" width="600" height="80" class="rect-dont"/>
  <text x="800" y="575" class="x">5</text>
  <text x="830" y="575" class="rule" style="fill:#f09595">Expose agent servers to the public internet without auth</text>
  <text x="830" y="598" class="rule-sub">7,000 Langflow servers were found this way. Don't be 7,001.</text>

  <!-- Bottom bar -->
  <rect x="60" y="660" width="1320" height="120" class="rect-do" style="stroke:#38bdf8"/>
  <text x="720" y="690" text-anchor="middle" class="label" style="fill:#38bdf8">THE CORE PRINCIPLE</text>
  <text x="720" y="720" text-anchor="middle" class="sub">Correlate signals across two layers:</text>
  <text x="720" y="745" text-anchor="middle" class="sub"><tspan style="fill:#38bdf8;font-weight:600">AI model level</tspan> (prompt shields, content safety) <tspan style="fill:#64748b">+</tspan> <tspan style="fill:#fbbf24;font-weight:600">host level</tspan> (EDR, process monitoring, network filtering)</text>
  <text x="720" y="765" text-anchor="middle" class="sub">If the model guardrail fails, endpoint defense must catch anomalous behavior.</text>

  <text x="720" y="815" text-anchor="middle" class="sub">Source: Microsoft Defender Security Research, Cloud Security Alliance, Check Point Research (2026)</text>
</svg>
