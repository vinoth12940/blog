<svg width="100%" viewBox="0 0 1440 720" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f09595" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, system-ui, sans-serif; fill: #e8e6de; }
    .title { font-size: 26px; font-weight: 600; fill: #ffffff; }
    .subtitle { font-size: 16px; fill: #94a3b8; }
    .label { font-size: 17px; font-weight: 500; fill: #f1f5f9; }
    .sub { font-size: 14px; fill: #94a3b8; }
    .cve { font-size: 13px; font-weight: 600; fill: #fca5a5; font-family: 'SF Mono', monospace; }
    .impact { font-size: 13px; font-weight: 600; fill: #fbbf24; }
    .rect-agent { fill: #1e1e2e; stroke: #38bdf8; stroke-width: 1.5; rx: 12; }
    .rect-vuln { fill: #1e1e2e; stroke: #ef4444; stroke-width: 1.5; rx: 12; }
    .rect-outcome { fill: #1e1e2e; stroke: #f59e0b; stroke-width: 1.5; rx: 12; }
    .arrow { stroke: #64748b; stroke-width: 2; fill: none; }
    .arrow-danger { stroke: #ef4444; stroke-width: 2; fill: none; }
    .section { fill: #94a3b8; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  </style>

  <rect width="1440" height="720" fill="#0f172a"/>

  <text x="720" y="50" text-anchor="middle" class="title">Prompt Injection → RCE: The 2026 Agent Framework Crisis</text>
  <text x="720" y="80" text-anchor="middle" class="subtitle">Five CVEs across three major frameworks turned natural language into a code execution primitive</text>

  <line x1="60" y1="110" x2="1380" y2="110" stroke="#334155" stroke-width="1"/>

  <!-- Column headers -->
  <text x="240" y="140" text-anchor="middle" class="section">Framework</text>
  <text x="640" y="140" text-anchor="middle" class="section">Vulnerability</text>
  <text x="1080" y="140" text-anchor="middle" class="section">Impact</text>

  <!-- Row 1: Semantic Kernel -->
  <g>
    <rect x="60" y="160" width="360" height="120" class="rect-agent"/>
    <text x="240" y="195" text-anchor="middle" class="label">Microsoft Semantic Kernel</text>
    <text x="240" y="220" text-anchor="middle" class="sub">27,000+ GitHub stars</text>
    <text x="240" y="245" text-anchor="middle" class="sub">Python + .NET SDK</text>

    <line x1="420" y1="220" x2="460" y2="220" class="arrow-danger" marker-end="url(#arrow)"/>

    <rect x="460" y="160" width="360" height="120" class="rect-vuln"/>
    <text x="640" y="195" text-anchor="middle" class="label">eval() filter injection</text>
    <text x="640" y="222" text-anchor="middle" class="cve">CVE-2026-26030 · CVE-2026-25592</text>
    <text x="640" y="248" text-anchor="middle" class="sub">Blocklist bypass via class hierarchy traversal</text>

    <line x1="820" y1="220" x2="860" y2="220" class="arrow-danger" marker-end="url(#arrow)"/>

    <rect x="860" y="160" width="440" height="120" class="rect-outcome"/>
    <text x="1080" y="195" text-anchor="middle" class="label">Host-level RCE</text>
    <text x="1080" y="222" text-anchor="middle" class="impact">calc.exe from a single prompt</text>
    <text x="1080" y="248" text-anchor="middle" class="sub">Sandbox escape to Windows Startup folder</text>
  </g>

  <!-- Row 2: AutoGen Studio -->
  <g>
    <rect x="60" y="310" width="360" height="120" class="rect-agent"/>
    <text x="240" y="345" text-anchor="middle" class="label">AutoGen Studio (AutoJack)</text>
    <text x="240" y="370" text-anchor="middle" class="sub">Multi-agent prototyping UI</text>
    <text x="240" y="395" text-anchor="middle" class="sub">MCP WebSocket control plane</text>

    <line x1="420" y1="370" x2="460" y2="370" class="arrow-danger" marker-end="url(#arrow)"/>

    <rect x="460" y="310" width="360" height="120" class="rect-vuln"/>
    <text x="640" y="345" text-anchor="middle" class="label">Localhost trust bypass</text>
    <text x="640" y="372" text-anchor="middle" class="cve">CWE-306 · CWE-78 · CWE-1385</text>
    <text x="640" y="398" text-anchor="middle" class="sub">Unauthenticated WebSocket + origin spoof</text>

    <line x1="820" y1="370" x2="860" y2="370" class="arrow-danger" marker-end="url(#arrow)"/>

    <rect x="860" y="310" width="440" height="120" class="rect-outcome"/>
    <text x="1080" y="345" text-anchor="middle" class="label">Arbitrary process spawn</text>
    <text x="1080" y="372" text-anchor="middle" class="impact">One malicious webpage = full RCE</text>
    <text x="1080" y="398" text-anchor="middle" class="sub">Agent becomes confused deputy for attacker</text>
  </g>

  <!-- Row 3: LangGraph/Langflow -->
  <g>
    <rect x="60" y="460" width="360" height="120" class="rect-agent"/>
    <text x="240" y="495" text-anchor="middle" class="label">LangGraph / Langflow</text>
    <text x="240" y="520" text-anchor="middle" class="sub">LangChain ecosystem orchestration</text>
    <text x="240" y="545" text-anchor="middle" class="sub">Self-hosted agent servers</text>

    <line x1="420" y1="520" x2="460" y2="520" class="arrow-danger" marker-end="url(#arrow)"/>

    <rect x="460" y="460" width="360" height="120" class="rect-vuln"/>
    <text x="640" y="495" text-anchor="middle" class="label">SQLi + unsafe deserialization</text>
    <text x="640" y="522" text-anchor="middle" class="cve">CVE-2025-67644 · CVE-2026-28277</text>
    <text x="640" y="548" text-anchor="middle" class="sub">SQLite checkpointer + msgpack flaw</text>

    <line x1="820" y1="520" x2="860" y2="520" class="arrow-danger" marker-end="url(#arrow)"/>

    <rect x="860" y="460" width="440" height="120" class="rect-outcome"/>
    <text x="1080" y="495" text-anchor="middle" class="label">7,000 servers compromised</text>
    <text x="1080" y="522" text-anchor="middle" class="impact">Full server takeover at scale</text>
    <text x="1080" y="548" text-anchor="middle" class="sub">Redis checkpointer also affected</text>
  </g>

  <line x1="60" y1="610" x2="1380" y2="610" stroke="#334155" stroke-width="1"/>

  <text x="720" y="645" text-anchor="middle" class="subtitle">All five CVEs disclosed May–June 2026. All patched. The pattern is systemic.</text>
  <text x="720" y="675" text-anchor="middle" class="subtitle">Your LLM is not a security boundary.</text>
</svg>
