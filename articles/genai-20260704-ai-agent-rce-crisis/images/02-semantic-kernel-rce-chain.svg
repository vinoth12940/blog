<svg width="100%" viewBox="0 0 1440 800" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f09595" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, system-ui, sans-serif; fill: #e8e6de; }
    .title { font-size: 26px; font-weight: 600; fill: #ffffff; }
    .subtitle { font-size: 16px; fill: #94a3b8; }
    .label { font-size: 17px; font-weight: 500; fill: #f1f5f9; }
    .sub { font-size: 14px; fill: #94a3b8; }
    .code { font-size: 14px; fill: #38bdf8; font-family: 'SF Mono', 'Cascadia Code', monospace; }
    .danger { font-size: 14px; fill: #fca5a5; font-weight: 600; }
    .rect-step { fill: #1e1e2e; stroke: #38bdf8; stroke-width: 1.5; rx: 12; }
    .rect-danger { fill: #1e1e2e; stroke: #ef4444; stroke-width: 1.5; rx: 12; }
    .rect-exec { fill: #1e1e2e; stroke: #f59e0b; stroke-width: 1.5; rx: 12; }
    .rect-input { fill: #1e1e2e; stroke: #64748b; stroke-width: 1.5; rx: 12; }
    .step-num { font-size: 13px; font-weight: 700; fill: #38bdf8; }
    .arrow-down { stroke: #64748b; stroke-width: 2; fill: none; }
    .arrow-danger { stroke: #ef4444; stroke-width: 2; fill: none; }
  </style>

  <rect width="1440" height="800" fill="#0f172a"/>

  <text x="720" y="50" text-anchor="middle" class="title">CVE-2026-26030: How a Single Prompt Became RCE</text>
  <text x="720" y="80" text-anchor="middle" class="subtitle">Microsoft Semantic Kernel — In-Memory Vector Store filter injection attack chain</text>

  <!-- Step 1: Attacker input -->
  <text x="720" y="125" text-anchor="middle" class="step-num">STEP 1 — ATTACKER INPUT</text>
  <rect x="460" y="140" width="520" height="90" class="rect-input"/>
  <text x="720" y="170" text-anchor="middle" class="label">Malicious prompt injected via user input</text>
  <text x="720" y="195" text-anchor="middle" class="code">Find hotels in ' or MALICIOUS_CODE or '</text>
  <text x="720" y="215" text-anchor="middle" class="sub">Prompt injection vector: chat input, RAG document, web page</text>

  <line x1="720" y1="235" x2="720" y2="270" class="arrow-danger" marker-end="url(#arrow2)"/>

  <!-- Step 2: Model parses -->
  <text x="720" y="265" text-anchor="middle" class="step-num">STEP 2 — MODEL PARSES INTO TOOL CALL</text>
  <rect x="460" y="280" width="520" height="90" class="rect-step"/>
  <text x="720" y="310" text-anchor="middle" class="label">AI model formats parameter into lambda</text>
  <text x="720" y="338" text-anchor="middle" class="code">lambda x: x.city == '' or MALICIOUS_CODE or ''</text>
  <text x="720" y="358" text-anchor="middle" class="sub">Model behaves exactly as designed — it just parses language</text>

  <line x1="720" y1="375" x2="720" y2="410" class="arrow-danger" marker-end="url(#arrow2)"/>

  <!-- Step 3: Blocklist bypass -->
  <text x="720" y="405" text-anchor="middle" class="step-num">STEP 3 — AST BLOCKLIST BYPASSED</text>
  <rect x="460" y="420" width="520" height="110" class="rect-danger"/>
  <text x="720" y="450" text-anchor="middle" class="label">Payload traverses Python class hierarchy</text>
  <text x="720" y="478" text-anchor="middle" class="code">tuple().__class__.__base__.__subclasses__()</text>
  <text x="720" y="498" text-anchor="middle" class="danger">→ finds BuiltinImporter → loads os → calls system()</text>
  <text x="720" y="518" text-anchor="middle" class="sub">__builtins__={} bypassed; blocklist missed dangerous names</text>

  <line x1="720" y1="535" x2="720" y2="570" class="arrow-danger" marker-end="url(#arrow2)"/>

  <!-- Step 4: eval() executes -->
  <text x="720" y="565" text-anchor="middle" class="step-num">STEP 4 — eval() EXECUTES ON HOST</text>
  <rect x="460" y="580" width="520" height="100" class="rect-exec"/>
  <text x="720" y="610" text-anchor="middle" class="label">Arbitrary shell command runs on the agent host</text>
  <text x="720" y="638" text-anchor="middle" class="danger">calc.exe launched — or anything else</text>
  <text x="720" y="658" text-anchor="middle" class="sub">No browser exploit. No memory corruption. No attachment. Just a prompt.</text>

  <text x="720" y="710" text-anchor="middle" class="subtitle">Patched in semantic-kernel 1.39.4 (Python) · 1.71.0 (.NET)</text>
  <text x="720" y="740" text-anchor="middle" class="subtitle">Fix: AST node allowlist + function call allowlist + dangerous attribute blocklist</text>
  <text x="720" y="770" text-anchor="middle" class="sub">Source: Microsoft Defender Security Research Team (May 7, 2026)</text>
</svg>
