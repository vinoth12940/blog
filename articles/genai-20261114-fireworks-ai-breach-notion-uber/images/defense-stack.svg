<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880">
  <defs>
    <linearGradient id="defGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#16243d"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="880" fill="url(#defGrad)"/>

  <text x="720" y="56" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#60a5fa" letter-spacing="4">WHAT BUILDERS SHOULD ACTUALLY DO</text>
  <text x="720" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#f8fafc">The Five-Layer AI Vendor Defense</text>
  <text x="720" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94a3b8">Each layer maps to a failure that actually happened this month - nothing here is theoretical</text>

  <g font-family="Inter, Arial, sans-serif">
    <!-- Layer 1 -->
    <rect x="120" y="185" width="1200" height="112" rx="12" fill="#1e1e2e" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="160" y="228" font-size="15" font-weight="700" fill="#60a5fa">LAYER 1 &#183; INVENTORY</text>
    <text x="160" y="258" font-size="17" font-weight="700" fill="#f8fafc">Know every vendor that holds your prompts, transcripts, or documents</text>
    <text x="160" y="284" font-size="13.5" fill="#cbd5e1">Uber's driver's license data sat with an inference vendor, not with Uber. If you can't list your AI vendors in 5 minutes, layer 2 is moot.</text>

    <!-- Layer 2 -->
    <rect x="120" y="317" width="1200" height="112" rx="12" fill="#1e1e2e" stroke="#34d399" stroke-width="1.5"/>
    <text x="160" y="360" font-size="15" font-weight="700" fill="#34d399">LAYER 2 &#183; MINIMIZE</text>
    <text x="160" y="390" font-size="17" font-weight="700" fill="#f8fafc">Send and store the least data the feature needs - retention limits included</text>
    <text x="160" y="416" font-size="13.5" fill="#cbd5e1">Notion's transcripts leaked because full chats were persisted. Identity documents at an AI vendor is a choice someone made.</text>

    <!-- Layer 3 -->
    <rect x="120" y="449" width="1200" height="112" rx="12" fill="#1e1e2e" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="160" y="492" font-size="15" font-weight="700" fill="#fbbf24">LAYER 3 &#183; SCOPE CREDENTIALS</text>
    <text x="160" y="522" font-size="17" font-weight="700" fill="#f8fafc">Assume vendor-side credentials can be stolen - scope what they can reach</text>
    <text x="160" y="548" font-size="13.5" fill="#cbd5e1">In October, stolen internal credentials at the vendor unlocked customer data. Ask vendors: what can one credential touch?</text>

    <!-- Layer 4 -->
    <rect x="120" y="581" width="1200" height="112" rx="12" fill="#1e1e2e" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="160" y="624" font-size="15" font-weight="700" fill="#a78bfa">LAYER 4 &#183; WATCH TOKEN FLOW</text>
    <text x="160" y="654" font-size="17" font-weight="700" fill="#f8fafc">Treat usage anomalies as breach signals - stolen tokens burn quota</text>
    <text x="160" y="680" font-size="13.5" fill="#cbd5e1">Token resale is the stated business model of these attackers. A usage curve that jumps without your traffic jumping is evidence.</text>

    <!-- Layer 5 -->
    <rect x="120" y="713" width="1200" height="112" rx="12" fill="#1e1e2e" stroke="#f87171" stroke-width="1.5"/>
    <text x="160" y="756" font-size="15" font-weight="700" fill="#f87171">LAYER 5 &#183; ATTRIBUTION</text>
    <text x="160" y="786" font-size="17" font-weight="700" fill="#f8fafc">Log so you can answer "whose data leaked?" in hours, not weeks</text>
    <text x="160" y="812" font-size="13.5" fill="#cbd5e1">Notion couldn't map stolen transcripts to customers. Unattributable breach data turns an incident into a regulatory open question.</text>
  </g>

  <text x="720" y="858" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-style="italic" fill="#64748b">Each layer maps to a verified failure from the Fireworks incidents (Oct-Nov 2026)</text>
</svg>
