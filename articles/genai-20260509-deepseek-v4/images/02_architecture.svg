<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)" rx="16"/>

  <text x="450" y="45" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold">DeepSeek V4 Architecture: Hybrid Attention for 1M Context</text>
  <text x="450" y="68" text-anchor="middle" fill="#64748b" font-size="12">How CSA + HCA enables efficient long-context inference</text>

  <!-- Standard Attention problem -->
  <rect x="40" y="90" width="380" height="160" rx="12" fill="#1e1e2e" stroke="#ef4444" stroke-width="2"/>
  <text x="230" y="118" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="bold">X Standard Attention (Old Approach)</text>
  <text x="230" y="142" text-anchor="middle" fill="#94a3b8" font-size="11">Memory: O(n^2) with sequence length</text>
  <text x="230" y="162" text-anchor="middle" fill="#94a3b8" font-size="11">Doubling context -> 4x memory and compute</text>
  <text x="230" y="182" text-anchor="middle" fill="#94a3b8" font-size="11">1M tokens = practically infeasible</text>
  <text x="230" y="210" text-anchor="middle" fill="#ef4444" font-size="12">Max practical context: ~128K tokens</text>
  <text x="230" y="232" text-anchor="middle" fill="#64748b" font-size="10">Most frontier models (GPT-4, Claude 3) hit this wall</text>

  <!-- Arrow -->
  <text x="450" y="180" text-anchor="middle" fill="#fbbf24" font-size="20">-></text>

  <!-- DeepSeek V4 solution -->
  <rect x="480" y="90" width="380" height="160" rx="12" fill="#1e1e2e" stroke="#22c55e" stroke-width="2"/>
  <text x="670" y="118" text-anchor="middle" fill="#86efac" font-size="13" font-weight="bold">OK DeepSeek V4 Hybrid Attention</text>
  <text x="670" y="142" text-anchor="middle" fill="#94a3b8" font-size="11">CSA: Token-wise sparse key-value compression</text>
  <text x="670" y="162" text-anchor="middle" fill="#94a3b8" font-size="11">HCA: Heavy compression for distant tokens</text>
  <text x="670" y="182" text-anchor="middle" fill="#94a3b8" font-size="11">Near-linear memory scaling with context</text>
  <text x="670" y="210" text-anchor="middle" fill="#22c55e" font-size="12">Max practical context: 1M tokens</text>
  <text x="670" y="232" text-anchor="middle" fill="#64748b" font-size="10">~8x more context than most competitor models</text>

  <!-- MoE Architecture section -->
  <text x="450" y="285" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">Mixture-of-Experts: Efficiency at Scale</text>

  <!-- MoE boxes -->
  <rect x="40" y="302" width="180" height="80" rx="10" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="130" y="330" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Total Parameters</text>
  <text x="130" y="355" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">1.6T</text>
  <text x="130" y="375" text-anchor="middle" fill="#64748b" font-size="10">V4-Pro model size</text>

  <rect x="240" y="302" width="180" height="80" rx="10" fill="#1e1e2e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="330" y="330" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">Active Per Token</text>
  <text x="330" y="355" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">49B</text>
  <text x="330" y="375" text-anchor="middle" fill="#64748b" font-size="10">only these experts fire</text>

  <rect x="440" y="302" width="180" height="80" rx="10" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="530" y="330" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold">Cost Efficiency</text>
  <text x="530" y="355" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">3%</text>
  <text x="530" y="375" text-anchor="middle" fill="#64748b" font-size="10">active params ratio</text>

  <rect x="640" y="302" width="220" height="80" rx="10" fill="#1e1e2e" stroke="#fb923c" stroke-width="1.5"/>
  <text x="750" y="330" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="bold">V4-Flash (smaller)</text>
  <text x="750" y="352" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">284B / 13B active</text>
  <text x="750" y="372" text-anchor="middle" fill="#94a3b8" font-size="10">DSA attention · faster · cheaper</text>

  <!-- Footer note -->
  <text x="450" y="420" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Key insight: Only 3% of parameters activate per token - dense-model quality at a fraction of the inference cost</text>
  <text x="450" y="445" text-anchor="middle" fill="#475569" font-size="10">Source: HuggingFace model card, DeepSeek API docs, April 2026</text>
</svg>
