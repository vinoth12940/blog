<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" fill="url(#bg)" rx="16"/>

  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold">Cost per Million Output Tokens: May 2026</text>
  <text x="450" y="65" text-anchor="middle" fill="#64748b" font-size="12">DeepSeek V4-Pro vs leading frontier models (official pricing)</text>

  <!-- Bar chart -->
  <!-- DeepSeek V4-Pro at 75% off: $0.87 -->
  <text x="155" y="108" text-anchor="end" fill="#e2e8f0" font-size="12">DeepSeek V4-Pro (75% off)</text>
  <rect x="165" y="92" width="26" height="24" rx="4" fill="#22c55e"/>
  <text x="198" y="109" fill="#86efac" font-size="12" font-weight="bold">$0.87</text>

  <!-- DeepSeek V4-Pro list price: $3.48 -->
  <text x="155" y="148" text-anchor="end" fill="#e2e8f0" font-size="12">DeepSeek V4-Pro (list price)</text>
  <rect x="165" y="132" width="104" height="24" rx="4" fill="#3b82f6"/>
  <text x="276" y="149" fill="#93c5fd" font-size="12" font-weight="bold">$3.48</text>

  <!-- GPT-5.5: ~$30 -->
  <text x="155" y="188" text-anchor="end" fill="#e2e8f0" font-size="12">GPT-5.5</text>
  <rect x="165" y="172" width="300" height="24" rx="4" fill="#f59e0b"/>
  <text x="472" y="189" fill="#fcd34d" font-size="12" font-weight="bold">~$30</text>

  <!-- Claude Opus 4.7: $25 -->
  <text x="155" y="228" text-anchor="end" fill="#e2e8f0" font-size="12">Claude Opus 4.7</text>
  <rect x="165" y="212" width="250" height="24" rx="4" fill="#8b5cf6"/>
  <text x="422" y="229" fill="#c4b5fd" font-size="12" font-weight="bold">$25</text>

  <!-- Gemini 3 Pro: ~$28 (estimated) -->
  <text x="155" y="268" text-anchor="end" fill="#e2e8f0" font-size="12">GPT-5.4 / Gemini-3.1-Pro</text>
  <rect x="165" y="252" width="280" height="24" rx="4" fill="#ef4444"/>
  <text x="452" y="269" fill="#fca5a5" font-size="12" font-weight="bold">~$28</text>

  <!-- Key insight -->
  <rect x="40" y="305" width="820" height="70" rx="12" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="450" y="332" text-anchor="middle" fill="#86efac" font-size="13" font-weight="bold">💡 Key Takeaway</text>
  <text x="450" y="355" text-anchor="middle" fill="#e2e8f0" font-size="12">DeepSeek V4-Pro at list price is ~7x cheaper than Claude Opus 4.7 and ~8x cheaper than GPT-5.5</text>
  <text x="450" y="375" text-anchor="middle" fill="#94a3b8" font-size="11">At the 75% discount (extended as of April 26, 2026), the gap widens to ~29x cheaper than GPT-5.5</text>
</svg>
