<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="dsg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">DeepSeek V4: The Open-Weight Giant That Changed the Game</text>
  <text x="450" y="70" text-anchor="middle" fill="#64748b" font-size="13">April 24, 2026 · 1.6T Parameters · MIT License · $0.87/M Output Tokens</text>

  <!-- DS V4 Center box -->
  <rect x="340" y="110" width="220" height="110" rx="14" fill="#1e1e2e" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="340" y="110" width="220" height="38" rx="14" fill="url(#dsg)"/>
  <rect x="340" y="132" width="220" height="16" fill="url(#dsg)"/>
  <text x="450" y="135" text-anchor="middle" fill="white" font-size="14" font-weight="bold">DeepSeek V4-Pro</text>
  <text x="450" y="162" text-anchor="middle" fill="#94a3b8" font-size="11">1.6T total / 49B active params</text>
  <text x="450" y="180" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">1M Token Context</text>
  <text x="450" y="200" text-anchor="middle" fill="#22c55e" font-size="11">MIT License · Open Weights</text>

  <!-- Left: Architecture -->
  <rect x="50" y="115" width="210" height="100" rx="12" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="2"/>
  <text x="155" y="142" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">Hybrid Attention</text>
  <text x="155" y="163" text-anchor="middle" fill="#94a3b8" font-size="10">CSA (Compressed Sparse)</text>
  <text x="155" y="179" text-anchor="middle" fill="#94a3b8" font-size="10">+ HCA (Heavily Compressed)</text>
  <text x="155" y="198" text-anchor="middle" fill="#c4b5fd" font-size="11">Efficient 1M-ctx inference</text>
  <line x1="260" y1="165" x2="338" y2="165" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right: Cost -->
  <rect x="640" y="115" width="210" height="100" rx="12" fill="#1e1e2e" stroke="#22c55e" stroke-width="2"/>
  <text x="745" y="142" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">API Pricing (75% off launch)</text>
  <text x="745" y="163" text-anchor="middle" fill="#94a3b8" font-size="10">Input: $0.435/M tokens</text>
  <text x="745" y="179" text-anchor="middle" fill="#94a3b8" font-size="10">Output: $0.87/M tokens</text>
  <text x="745" y="198" text-anchor="middle" fill="#22c55e" font-size="11">vs Claude Opus: $25/M output</text>
  <line x1="562" y1="165" x2="638" y2="165" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Benchmark bars -->
  <text x="450" y="260" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold">Benchmark Scores (per official model card)</text>

  <!-- SWE-bench bar -->
  <text x="80" y="290" fill="#94a3b8" font-size="11">SWE-bench Verified</text>
  <rect x="220" y="277" width="300" height="18" rx="6" fill="#1e293b"/>
  <rect x="220" y="277" width="166" height="18" rx="6" fill="#3b82f6"/>
  <text x="395" y="291" fill="#e2e8f0" font-size="11" font-weight="bold">55.4%</text>

  <!-- MMLU-Pro bar -->
  <text x="80" y="320" fill="#94a3b8" font-size="11">MMLU-Pro</text>
  <rect x="220" y="307" width="300" height="18" rx="6" fill="#1e293b"/>
  <rect x="220" y="307" width="255" height="18" rx="6" fill="#8b5cf6"/>
  <text x="484" y="321" fill="#e2e8f0" font-size="11" font-weight="bold">85.0%</text>

  <!-- LiveCodeBench bar -->
  <text x="80" y="350" fill="#94a3b8" font-size="11">LiveCodeBench</text>
  <rect x="220" y="337" width="300" height="18" rx="6" fill="#1e293b"/>
  <rect x="220" y="337" width="222" height="18" rx="6" fill="#22c55e"/>
  <text x="451" y="351" fill="#e2e8f0" font-size="11" font-weight="bold">74.1%</text>

  <!-- AIME bar -->
  <text x="80" y="380" fill="#94a3b8" font-size="11">AIME 2025</text>
  <rect x="220" y="367" width="300" height="18" rx="6" fill="#1e293b"/>
  <rect x="220" y="367" width="268" height="18" rx="6" fill="#fb923c"/>
  <text x="497" y="381" fill="#e2e8f0" font-size="11" font-weight="bold">89.3%</text>

  <!-- Footnote -->
  <text x="450" y="410" text-anchor="middle" fill="#475569" font-size="10">Source: DeepSeek V4 Model Card (April 27, 2026) — scores flagged as self-reported pending third-party verification</text>
</svg>
