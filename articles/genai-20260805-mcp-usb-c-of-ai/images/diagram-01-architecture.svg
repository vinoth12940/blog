<svg width="100%" viewBox="0 0 1440 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="720" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="720" y="50" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="28" font-weight="700">MCP Architecture: Host · Client · Server</text>
  <text x="720" y="78" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="16">JSON-RPC 2.0 over stdio or HTTP+SSE</text>

  <!-- ===== HOST CONTAINER ===== -->
  <rect x="80" y="110" width="500" height="530" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="330" y="140" text-anchor="middle" fill="#818cf8" font-family="Inter, sans-serif" font-size="18" font-weight="600">MCP HOST</text>
  <text x="330" y="160" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="13">AI application (Claude, ChatGPT, VS Code, Cursor)</text>

  <!-- LLM Box -->
  <rect x="140" y="185" width="380" height="65" rx="10" fill="#312e81" stroke="#4f46e5" stroke-width="0.8"/>
  <text x="330" y="210" text-anchor="middle" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="16" font-weight="600">LLM Engine</text>
  <text x="330" y="230" text-anchor="middle" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="13">Claude · GPT · Gemini · Qwen</text>

  <!-- Host logic -->
  <rect x="140" y="275" width="380" height="65" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="330" y="300" text-anchor="middle" fill="#bfdbfe" font-family="Inter, sans-serif" font-size="16" font-weight="600">Tool Orchestrator</text>
  <text x="330" y="320" text-anchor="middle" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13">Decides when to call tools · injects results</text>

  <!-- Client A -->
  <rect x="140" y="375" width="170" height="70" rx="10" fill="#134e4a" stroke="#14b8a6" stroke-width="0.8"/>
  <text x="225" y="402" text-anchor="middle" fill="#99f6e4" font-family="Inter, sans-serif" font-size="15" font-weight="600">MCP Client A</text>
  <text x="225" y="422" text-anchor="middle" fill="#5eead4" font-family="Inter, sans-serif" font-size="12">1:1 with Server A</text>

  <!-- Client B -->
  <rect x="350" y="375" width="170" height="70" rx="10" fill="#134e4a" stroke="#14b8a6" stroke-width="0.8"/>
  <text x="435" y="402" text-anchor="middle" fill="#99f6e4" font-family="Inter, sans-serif" font-size="15" font-weight="600">MCP Client B</text>
  <text x="435" y="422" text-anchor="middle" fill="#5eead4" font-family="Inter, sans-serif" font-size="12">1:1 with Server B</text>

  <!-- Client C -->
  <rect x="140" y="475" width="170" height="70" rx="10" fill="#134e4a" stroke="#14b8a6" stroke-width="0.8"/>
  <text x="225" y="502" text-anchor="middle" fill="#99f6e4" font-family="Inter, sans-serif" font-size="15" font-weight="600">MCP Client C</text>
  <text x="225" y="522" text-anchor="middle" fill="#5eead4" font-family="Inter, sans-serif" font-size="12">1:1 with Server C</text>

  <!-- Client D -->
  <rect x="350" y="475" width="170" height="70" rx="10" fill="#134e4a" stroke="#14b8a6" stroke-width="0.8"/>
  <text x="435" y="502" text-anchor="middle" fill="#99f6e4" font-family="Inter, sans-serif" font-size="15" font-weight="600">MCP Client D</text>
  <text x="435" y="522" text-anchor="middle" fill="#5eead4" font-family="Inter, sans-serif" font-size="12">1:1 with Server D</text>

  <!-- Internal arrows from orchestrator to clients -->
  <line x1="330" y1="340" x2="225" y2="370" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="340" x2="435" y2="370" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="340" x2="225" y2="470" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="330" y1="340" x2="435" y2="470" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ===== CONNECTING ARROWS (JSON-RPC) ===== -->
  <line x1="310" y1="445" x2="650" y2="200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <line x1="520" y1="445" x2="650" y2="380" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <line x1="310" y1="545" x2="650" y2="560" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <line x1="520" y1="545" x2="650" y2="740" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>

  <text x="590" y="300" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" transform="rotate(-35, 590, 300)">JSON-RPC 2.0</text>

  <!-- ===== MCP SERVERS (Right side) ===== -->
  <!-- Server A: Database -->
  <rect x="660" y="160" width="300" height="80" rx="12" fill="#7c2d12" stroke="#ea580c" stroke-width="0.8"/>
  <text x="810" y="188" text-anchor="middle" fill="#fed7aa" font-family="Inter, sans-serif" font-size="17" font-weight="600">🗄️ Database Server</text>
  <text x="810" y="210" text-anchor="middle" fill="#fdba74" font-family="Inter, sans-serif" font-size="13">SQL queries · schema introspection</text>
  <text x="810" y="228" text-anchor="middle" fill="#fb923c" font-family="JetBrains Mono, monospace" font-size="11">PostgreSQL · MySQL · SQLite</text>

  <!-- Server B: File System -->
  <rect x="660" y="340" width="300" height="80" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="810" y="368" text-anchor="middle" fill="#bfdbfe" font-family="Inter, sans-serif" font-size="17" font-weight="600">📁 File System Server</text>
  <text x="810" y="390" text-anchor="middle" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13">Read/write files · directory listing</text>
  <text x="810" y="408" text-anchor="middle" fill="#60a5fa" font-family="JetBrains Mono, monospace" font-size="11">Local · Git · S3</text>

  <!-- Server C: API Gateway -->
  <rect x="660" y="520" width="300" height="80" rx="12" fill="#3b0764" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="810" y="548" text-anchor="middle" fill="#ddd6fe" font-family="Inter, sans-serif" font-size="17" font-weight="600">🌐 API Server</text>
  <text x="810" y="570" text-anchor="middle" fill="#c4b5fd" font-family="Inter, sans-serif" font-size="13">External APIs · webhooks · OAuth</text>
  <text x="810" y="588" text-anchor="middle" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="11">REST · GraphQL · gRPC</text>

  <!-- ===== SDK LANGUAGES (bottom) ===== -->
  <rect x="1020" y="110" width="340" height="530" rx="16" fill="#1a2e1a" stroke="#22c55e" stroke-width="0.6" stroke-dasharray="4,4"/>
  <text x="1190" y="140" text-anchor="middle" fill="#86efac" font-family="Inter, sans-serif" font-size="18" font-weight="600">11 SDK Languages</text>
  <text x="1190" y="160" text-anchor="middle" fill="#4ade80" font-family="Inter, sans-serif" font-size="13">Official SDKs maintained by AAIF</text>

  <rect x="1060" y="185" width="260" height="38" rx="6" fill="#0f172a" stroke="#16a34a" stroke-width="0.5"/>
  <text x="1190" y="208" text-anchor="middle" fill="#86efac" font-family="JetBrains Mono, monospace" font-size="14">Python · TypeScript · Java</text>

  <rect x="1060" y="233" width="260" height="38" rx="6" fill="#0f172a" stroke="#16a34a" stroke-width="0.5"/>
  <text x="1190" y="256" text-anchor="middle" fill="#86efac" font-family="JetBrains Mono, monospace" font-size="14">Kotlin · C# · Go · Rust</text>

  <rect x="1060" y="281" width="260" height="38" rx="6" fill="#0f172a" stroke="#16a34a" stroke-width="0.5"/>
  <text x="1190" y="304" text-anchor="middle" fill="#86efac" font-family="JetBrains Mono, monospace" font-size="14">Ruby · Swift · PHP · Perl</text>

  <!-- Registry note -->
  <rect x="1060" y="355" width="260" height="120" rx="10" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="1190" y="380" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="15" font-weight="600">MCP Registry</text>
  <text x="1190" y="404" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="26" font-weight="700">210+</text>
  <text x="1190" y="425" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Community servers</text>
  <text x="1190" y="448" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11">github.com/mcp</text>
  <text x="1190" y="463" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Hosted by GitHub</text>

  <!-- Governance -->
  <rect x="1060" y="495" width="260" height="65" rx="10" fill="#1e1b3a" stroke="#818cf8" stroke-width="0.5"/>
  <text x="1190" y="520" text-anchor="middle" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="15" font-weight="600">Linux Foundation</text>
  <text x="1190" y="540" text-anchor="middle" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="12">Agentic AI Foundation (AAIF)</text>
  <text x="1190" y="555" text-anchor="middle" fill="#818cf8" font-family="Inter, sans-serif" font-size="11">Anthropic + OpenAI + Block</text>

  <!-- Footer -->
  <text x="720" y="700" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="12">Host creates one client per server · Servers are independent processes · Communication via JSON-RPC 2.0</text>
</svg>
