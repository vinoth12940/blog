  <text x="1080" y="395" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">1,200 attendees</text>
  <text x="1080" y="410" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">NYC · Gateways + gRPC</text>
  <text x="1080" y="434" text-anchor="middle" fill="#fdba74" font-family="Inter, sans-serif" font-size="12" font-weight="600">Salesforce: 4.5M calls</text>
  <text x="1080" y="450" text-anchor="middle" fill="#fdba74" font-family="Inter, sans-serif" font-size="12" font-weight="600">via MCP</text>
