  <text x="430" y="410" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">integrates MCP</text>
  <text x="430" y="434" text-anchor="middle" fill="#60a5fa" font-family="Inter, sans-serif" font-size="12" font-weight="600">Rival adopts rival's</text>
