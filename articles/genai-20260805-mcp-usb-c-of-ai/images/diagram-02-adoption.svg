  <text x="610" y="175" text-anchor="middle" fill="#fef3c7" font-family="Inter, sans-serif" font-size="14" font-weight="600">Security Research</text>
  <text x="610" y="195" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Prompt injection</text>
  <text x="610" y="210" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">tool poisoning found</text>
  <text x="610" y="234" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="12">ArXiv: 2503.23278</text>
