  <text x="770" y="434" text-anchor="middle" fill="#5eead4" font-family="Inter, sans-serif" font-size="12" font-weight="600">Third-party tools</text>
  <text x="770" y="450" text-anchor="middle" fill="#5eead4" font-family="Inter, sans-serif" font-size="12" font-weight="600">inside ChatGPT</text>
  <line x1="770" y1="350" x2="770" y2="320" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow2)"/>

