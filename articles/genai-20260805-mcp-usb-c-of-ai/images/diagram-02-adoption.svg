<svg width="100%" viewBox="0 0 1440 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="bg-grad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="560" fill="url(#bg-grad2)"/>

  <text x="720" y="45" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="26" font-weight="700">MCP Adoption Timeline</text>
  <text x="720" y="70" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="15">From Anthropic experiment to industry standard in under 2 years</text>

  <!-- Timeline axis -->
  <line x1="120" y1="300" x2="1320" y2="300" stroke="#334155" stroke-width="3"/>

  <!-- ===== Milestone 1: Nov 2024 ===== -->
  <circle cx="200" cy="300" r="14" fill="#4f46e5" stroke="#818cf8" stroke-width="2"/>
  <text x="200" y="305" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="10" font-weight="700">1</text>
  <text x="200" y="340" text-anchor="middle" fill="#818cf8" font-family="Inter, sans-serif" font-size="14" font-weight="600">Nov 2024</text>

  <rect x="110" y="150" width="180" height="120" rx="10" fill="#1e293b" stroke="#4f46e5" stroke-width="0.8"/>
  <text x="200" y="175" text-anchor="middle" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="14" font-weight="600">Anthropic Launch</text>
  <text x="200" y="195" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Open standard for AI</text>
  <text x="200" y="210" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">data integration</text>
  <text x="200" y="234" text-anchor="middle" fill="#818cf8" font-family="JetBrains Mono, monospace" font-size="11">Python · TS · C# · Java</text>
  <text x="200" y="252" text-anchor="middle" fill="#818cf8" font-family="JetBrains Mono, monospace" font-size="11">SDKs released</text>
  <line x1="200" y1="265" x2="200" y2="286" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ===== Milestone 2: Mar 2025 ===== -->
  <circle cx="430" cy="300" r="14" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
  <text x="430" y="305" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="10" font-weight="700">2</text>
  <text x="430" y="340" text-anchor="middle" fill="#60a5fa" font-family="Inter, sans-serif" font-size="14" font-weight="600">Mar 2025</text>

  <rect x="340" y="350" width="180" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8"/>
