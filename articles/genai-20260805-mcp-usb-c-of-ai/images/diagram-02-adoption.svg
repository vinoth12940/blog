  <text x="1240" y="175" text-anchor="middle" fill="#bbf7d0" font-family="Inter, sans-serif" font-size="14" font-weight="600">Industry Standard</text>
  <text x="1240" y="195" text-anchor="middle" fill="#4ade80" font-family="Inter, sans-serif" font-size="22" font-weight="700">210+ Servers</text>
  <text x="1240" y="218" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">11 SDK languages</text>
  <text x="1240" y="234" text-anchor="middle" fill="#4ade80" font-family="Inter, sans-serif" font-size="12" font-weight="600">49.6K GitHub stars</text>
  <text x="1240" y="252" text-anchor="middle" fill="#4ade80" font-family="Inter, sans-serif" font-size="12" font-weight="600">GitHub MCP Registry</text>
  <line x1="1240" y1="270" x2="1240" y2="282" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Footer -->
  <text x="720" y="520" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="12">Key inflection: Dec 2025 Linux Foundation transfer removed vendor-lockin concerns · Apr 2026 Dev Summit signaled production readiness</text>
</svg>
