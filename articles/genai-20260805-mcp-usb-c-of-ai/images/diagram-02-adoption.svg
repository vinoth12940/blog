  <text x="940" y="195" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">AAIF created</text>
  <text x="940" y="210" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">under Linux Foundation</text>
  <text x="940" y="234" text-anchor="middle" fill="#a78bfa" font-family="Inter, sans-serif" font-size="12" font-weight="600">Anthropic + OpenAI</text>
  <text x="940" y="252" text-anchor="middle" fill="#a78bfa" font-family="Inter, sans-serif" font-size="12" font-weight="600">+ Block co-founders</text>
  <line x1="940" y1="270" x2="940" y2="286" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow2)"/>

