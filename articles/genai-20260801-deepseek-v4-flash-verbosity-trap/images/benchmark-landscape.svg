  <rect x="220" y="218" width="110" height="372" rx="4" fill="#22d3ee"/>
  <text x="275" y="208" text-anchor="middle" fill="#67e8f9" font-family="Inter, sans-serif" font-size="15" font-weight="700">82.7</text>
  <text x="275" y="618" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Terminal</text>
  <text x="275" y="636" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Bench 2.1</text>
  <text x="275" y="656" text-anchor="middle" fill="#22d3ee" font-family="Inter, sans-serif" font-size="11" font-weight="600">agentic</text>

  <!-- Cybergym 76.7 -> h = 345 -->
  <rect x="360" y="245" width="110" height="345" rx="4" fill="#22d3ee"/>
  <text x="415" y="235" text-anchor="middle" fill="#67e8f9" font-family="Inter, sans-serif" font-size="15" font-weight="700">76.7</text>
  <text x="415" y="618" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Cybergym</text>
