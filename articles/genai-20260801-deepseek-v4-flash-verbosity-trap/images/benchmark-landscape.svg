  <rect x="780" y="322" width="110" height="268" rx="4" fill="#67e8f9"/>
  <text x="835" y="312" text-anchor="middle" fill="#a5f3fc" font-family="Inter, sans-serif" font-size="15" font-weight="700">59.6</text>
  <text x="835" y="618" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">DSBench</text>
  <text x="835" y="636" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Hard</text>
  <text x="835" y="656" text-anchor="middle" fill="#0ea5e9" font-family="Inter, sans-serif" font-size="11" font-weight="600">tool-use</text>

