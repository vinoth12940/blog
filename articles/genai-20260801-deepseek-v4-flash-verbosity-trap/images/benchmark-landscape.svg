  <rect x="920" y="345" width="110" height="245" rx="4" fill="#67e8f9"/>
  <text x="975" y="335" text-anchor="middle" fill="#a5f3fc" font-family="Inter, sans-serif" font-size="15" font-weight="700">54.4</text>
