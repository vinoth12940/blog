  <text x="160" y="325" text-anchor="end" fill="#64748b" font-family="Inter, sans-serif" font-size="12">50</text>
  <text x="160" y="415" text-anchor="end" fill="#64748b" font-family="Inter, sans-serif" font-size="12">25</text>
  <text x="160" y="505" text-anchor="end" fill="#64748b" font-family="Inter, sans-serif" font-size="12">10</text>
  <text x="160" y="595" text-anchor="end" fill="#64748b" font-family="Inter, sans-serif" font-size="12">0</text>

  <!-- Bars: positions x from 220, each bar width 110, gap 30 -->
