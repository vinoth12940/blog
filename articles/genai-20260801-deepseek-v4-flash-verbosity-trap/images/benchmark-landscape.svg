<svg width="1440" height="760" viewBox="0 0 1440 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="760" fill="url(#bg2)"/>

  <text x="720" y="54" text-anchor="middle" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="30" font-weight="800">Benchmark Landscape: Where V4 Flash Actually Wins</text>
  <text x="720" y="88" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="17">Strong on agentic / tool-use evaluations. Brutal on long-horizon autonomy.</text>

  <!-- Chart area -->
  <!-- Y-axis label -->
  <text x="60" y="380" fill="#475569" font-family="Inter, sans-serif" font-size="13" transform="rotate(-90 60 380)">score (higher = better)</text>

  <!-- Grid lines -->
  <line x1="180" y1="140" x2="1380" y2="140" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="180" y1="230" x2="1380" y2="230" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="180" y1="320" x2="1380" y2="320" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="180" y1="410" x2="1380" y2="410" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="180" y1="500" x2="1380" y2="500" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="180" y1="590" x2="1380" y2="590" stroke="#334155" stroke-width="1.5"/>

