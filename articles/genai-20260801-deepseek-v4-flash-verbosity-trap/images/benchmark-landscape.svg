  <text x="975" y="656" text-anchor="middle" fill="#0ea5e9" font-family="Inter, sans-serif" font-size="11" font-weight="600">tool-use</text>

  <!-- NL2Repo 54.2 -> h = 244 -->
  <rect x="1060" y="346" width="110" height="244" rx="4" fill="#67e8f9"/>
  <text x="1115" y="336" text-anchor="middle" fill="#a5f3fc" font-family="Inter, sans-serif" font-size="15" font-weight="700">54.2</text>
  <text x="1115" y="618" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">NL2Repo</text>
  <text x="1115" y="656" text-anchor="middle" fill="#0ea5e9" font-family="Inter, sans-serif" font-size="11" font-weight="600">tool-use</text>

  <!-- Agent Last Exam 25.2 -> h = 113 -->
  <rect x="1200" y="477" width="110" height="113" rx="4" fill="#f87171"/>
  <text x="1255" y="467" text-anchor="middle" fill="#fca5a5" font-family="Inter, sans-serif" font-size="15" font-weight="700">25.2</text>
  <text x="1255" y="618" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Agent Last</text>
  <text x="1255" y="636" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Exam</text>
  <text x="1255" y="656" text-anchor="middle" fill="#f87171" font-family="Inter, sans-serif" font-size="11" font-weight="600">long-horizon</text>

  <!-- Baseline/median reference line at 50 -->
  <line x1="180" y1="365" x2="1380" y2="365" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
  <text x="1375" y="360" text-anchor="end" fill="#fbbf24" font-family="Inter, sans-serif" font-size="12" font-weight="600">class median ≈ 50</text>

  <!-- Legend -->
  <rect x="180" y="690" width="16" height="16" rx="3" fill="#22d3ee"/>
  <text x="204" y="703" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">agentic / terminal</text>
  <rect x="380" y="690" width="16" height="16" rx="3" fill="#67e8f9"/>
  <text x="404" y="703" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">tool-use / engineering</text>
  <rect x="620" y="690" width="16" height="16" rx="3" fill="#f87171"/>
  <text x="644" y="703" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">long-horizon autonomy (unsolved)</text>
  <rect x="940" y="690" width="16" height="16" rx="3" fill="#fbbf24" opacity="0.7"/>
  <text x="964" y="703" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">class median reference</text>

  <text x="720" y="740" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="12" font-style="italic">Vendor-published scores (DeepSeek Harness, max effort). Verify on your own evals.</text>
