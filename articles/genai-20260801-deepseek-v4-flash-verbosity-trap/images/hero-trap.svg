<svg width="1440" height="600" viewBox="0 0 1440 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="600" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="720" y="62" text-anchor="middle" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="34" font-weight="800">DeepSeek V4 Flash: The Per-Token Trap</text>
  <text x="720" y="100" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="19" font-weight="400">Cheap tokens don't mean cheap tasks — the verbosity multiplier nobody benchmarks</text>

  <!-- Left panel: the model -->
  <g>
    <rect x="100" y="160" width="380" height="320" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="290" y="200" text-anchor="middle" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">deepseek-v4-flash</text>
    <line x1="140" y1="218" x2="440" y2="218" stroke="#334155" stroke-width="1"/>

    <!-- Intelligence rank -->
    <text x="290" y="262" text-anchor="middle" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="58" font-weight="800">#2</text>
    <text x="290" y="292" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="15">of 162 models · Intelligence Index 50</text>

    <!-- Price rank -->
    <rect x="150" y="320" width="280" height="44" rx="8" fill="#064e3b"/>
    <text x="290" y="348" text-anchor="middle" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="17" font-weight="700">$0.14 / $0.28 per 1M · #1 cheapest</text>

    <!-- Context -->
    <rect x="150" y="380" width="280" height="40" rx="8" fill="#0c4a6e"/>
    <text x="290" y="406" text-anchor="middle" fill="#67e8f9" font-family="Inter, sans-serif" font-size="16" font-weight="600">1M token context window</text>

    <!-- Cache -->
    <rect x="150" y="432" width="280" height="40" rx="8" fill="#1e1b4b"/>
    <text x="290" y="458" text-anchor="middle" fill="#c4b5fd" font-family="Inter, sans-serif" font-size="16" font-weight="600">98% cache-hit discount</text>
  </g>

  <!-- Arrow / multiplier -->
  <g>
    <text x="640" y="300" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="20" font-weight="700">BUT</text>
    <text x="640" y="332" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="14">verbosity</text>
    <line x1="500" y1="320" x2="780" y2="320" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="640" y="356" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="13">×3.4</text>
  </g>

  <!-- Right panel: the reality -->
  <g>
    <rect x="800" y="160" width="540" height="320" rx="20" fill="#1c1117" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="1070" y="200" text-anchor="middle" fill="#fca5a5" font-family="Inter, sans-serif" font-size="15" font-weight="600">THE CATCH: TOKEN OUTPUT</text>
    <line x1="840" y1="218" x2="1300" y2="218" stroke="#7f1d1d" stroke-width="1"/>

    <!-- Bar comparison -->
    <text x="850" y="262" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">Class median output</text>
    <rect x="850" y="278" width="200" height="40" rx="6" fill="url(#cyanGrad)"/>
    <text x="950" y="304" text-anchor="middle" fill="#0a0f1a" font-family="Inter, sans-serif" font-size="16" font-weight="700">62M tokens</text>

    <text x="850" y="352" fill="#fca5a5" font-family="Inter, sans-serif" font-size="14" font-weight="600">DeepSeek V4 Flash</text>
    <rect x="850" y="368" width="482" height="40" rx="6" fill="url(#redGrad)"/>
    <text x="1091" y="394" text-anchor="middle" fill="#0a0f1a" font-family="Inter, sans-serif" font-size="16" font-weight="700">210M tokens</text>

    <text x="1070" y="438" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="13">to complete the same Intelligence Index evaluation</text>
    <text x="1070" y="460" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="16" font-weight="700">ranked 58th of 162 on output efficiency</text>
  </g>

  <!-- Footer note -->
  <rect x="100" y="520" width="1240" height="50" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="720" y="552" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="15">Total eval cost still won: <tspan fill="#6ee7b7" font-weight="700">$72.02</tspan> vs higher-priced frontier alternatives — but measure <tspan fill="#fbbf24" font-weight="600">cost-per-task</tspan>, not cost-per-token.</text>
</svg>
