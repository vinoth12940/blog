<svg width="1440" height="720" viewBox="0 0 1440 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="720" fill="url(#bg3)"/>

  <text x="720" y="56" text-anchor="middle" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="30" font-weight="800">The Caching Play: How 98% Off Actually Works</text>
  <text x="720" y="90" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="17">Your stable prompt prefix is billed once. Variable content is the only thing you pay full price for.</text>

  <!-- Request 1: No cache (cold) -->
  <text x="80" y="145" fill="#fca5a5" font-family="Inter, sans-serif" font-size="16" font-weight="700">REQUEST 1 — Cold (no cache)</text>

  <!-- System prompt block -->
  <rect x="80" y="165" width="600" height="70" rx="8" fill="#451a03"/>
  <text x="100" y="190" fill="#fcd34d" font-family="JetBrains Mono, monospace" font-size="13">system: STYLE_GUIDE + schema + instructions</text>
  <text x="100" y="212" fill="#fbbf24" font-family="Inter, sans-serif" font-size="14" font-weight="600">~4,000 tokens</text>
  <text x="500" y="200" fill="#fca5a5" font-family="Inter, sans-serif" font-size="14" font-weight="600">billed $0.56</text>

  <!-- Variable block -->
  <rect x="80" y="245" width="600" height="50" rx="8" fill="#1e1b4b"/>
  <text x="100" y="276" fill="#c4b5fd" font-family="JetBrains Mono, monospace" font-size="13">user: [200 content records]</text>

  <!-- Total 1 -->
  <rect x="80" y="310" width="600" height="56" rx="8" fill="#450a0a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="380" y="345" text-anchor="middle" fill="#fca5a5" font-family="Inter, sans-serif" font-size="17" font-weight="700">~$0.84 per request</text>

  <!-- Divider -->
  <line x1="720" y1="140" x2="720" y2="560" stroke="#1e293b" stroke-width="1"/>

  <!-- Request N: Cache hit -->
  <text x="760" y="145" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="16" font-weight="700">REQUEST N — Cache hit</text>

  <rect x="760" y="165" width="600" height="70" rx="8" fill="#064e3b"/>
  <text x="780" y="190" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="13">system: STYLE_GUIDE + schema + instructions</text>
  <text x="780" y="212" fill="#34d399" font-family="Inter, sans-serif" font-size="14" font-weight="600">~4,000 tokens · CACHED</text>
  <text x="1160" y="200" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="14" font-weight="600">billed $0.0118</text>

  <rect x="760" y="245" width="600" height="50" rx="8" fill="#1e1b4b"/>
  <text x="780" y="276" fill="#c4b5fd" font-family="JetBrains Mono, monospace" font-size="13">user: [200 content records]</text>

  <rect x="760" y="310" width="600" height="56" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1040" y="345" text-anchor="middle" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="17" font-weight="700">~$0.29 per request</text>

  <!-- Savings callout -->
  <rect x="80" y="400" width="1280" height="70" rx="14" fill="#0f172a" stroke="#064e3b" stroke-width="1.5"/>
  <text x="720" y="435" text-anchor="middle" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="20" font-weight="700">At 10,000 requests/day: <tspan fill="#fca5a5">$8,400/day</tspan> cold  →  <tspan fill="#6ee7b7">$2,900/day</tspan> warm</text>
  <text x="720" y="460" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">That's the delta caching alone buys you on a high-volume pipeline — before you even count verbosity.</text>

  <!-- The discipline -->
  <rect x="80" y="500" width="1280" height="180" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="720" y="534" text-anchor="middle" fill="#22d3ee" font-family="Inter, sans-serif" font-size="17" font-weight="700">The discipline that makes this real</text>
  <line x1="140" y1="550" x2="1300" y2="550" stroke="#334155" stroke-width="1"/>

  <text x="120" y="582" fill="#22d3ee" font-family="Inter, sans-serif" font-size="22" font-weight="800">1</text>
  <text x="160" y="582" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="16">Keep the system prompt <tspan fill="#f1f5f9" font-weight="600">byte-identical</tspan> across runs — any change breaks the cache prefix.</text>

  <text x="120" y="618" fill="#22d3ee" font-family="Inter, sans-serif" font-size="22" font-weight="800">2</text>
  <text x="160" y="618" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="16">Put all variable content in the <tspan fill="#f1f5f9" font-weight="600">user message</tspan>, never the system message.</text>

  <text x="120" y="654" fill="#22d3ee" font-family="Inter, sans-serif" font-size="22" font-weight="800">3</text>
  <text x="160" y="654" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="16">Measure <tspan fill="#fbbf24" font-weight="600">cost-per-completed-task</tspan>, not cost-per-million-tokens. Verbosity multiplies the latter.</text>
</svg>
