<svg width="1440" height="860" viewBox="0 0 1440 860" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="860" fill="url(#bg4)"/>

  <text x="720" y="56" text-anchor="middle" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="30" font-weight="800">Should You Switch? A Decision Matrix</text>
  <text x="720" y="90" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="17">Four workload archetypes mapped against V4 Flash's actual strengths and gaps.</text>

  <!-- Column headers -->
  <rect x="60" y="130" width="340" height="60" rx="10" fill="#1e293b"/>
  <text x="230" y="167" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="16" font-weight="600">Workload</text>
  <rect x="420" y="130" width="320" height="60" rx="10" fill="#064e3b"/>
  <text x="580" y="167" text-anchor="middle" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="16" font-weight="700">Good Fit</text>
  <rect x="760" y="130" width="320" height="60" rx="10" fill="#450a0a"/>
  <text x="920" y="167" text-anchor="middle" fill="#fca5a5" font-family="Inter, sans-serif" font-size="16" font-weight="700">Look Elsewhere</text>
  <rect x="1100" y="130" width="280" height="60" rx="10" fill="#1e1b4b"/>
  <text x="1240" y="167" text-anchor="middle" fill="#c4b5fd" font-family="Inter, sans-serif" font-size="16" font-weight="700">Why</text>

  <!-- Row 1: Background content ops -->
  <rect x="60" y="200" width="340" height="140" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="230" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="17" font-weight="700">Background content ops</text>
  <text x="80" y="256" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Bulk SEO generation, localization,</text>
  <text x="80" y="274" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">schema-bound enrichment across</text>
  <text x="80" y="292" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">thousands of records</text>

  <rect x="420" y="200" width="320" height="140" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
  <text x="580" y="275" text-anchor="middle" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="28" font-weight="800">✓ YES</text>
  <text x="580" y="305" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="13">per-task cost dominates</text>

  <rect x="760" y="200" width="320" height="140" rx="10" fill="#1c1117" stroke="#334155" stroke-width="1" opacity="0.4"/>
  <text x="920" y="275" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="16">—</text>

  <rect x="1100" y="200" width="280" height="140" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="1120" y="232" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">Stable prefix → cache wins.</text>
  <text x="1120" y="254" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">Broad-shallow context fits 1M</text>
  <text x="1120" y="276" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">window. Verbosity acceptable</text>
  <text x="1120" y="298" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">when not latency-bound.</text>

  <!-- Row 2: Terminal / coding agents -->
  <rect x="60" y="350" width="340" height="140" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="380" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="17" font-weight="700">Terminal &amp; coding agents</text>
  <text x="80" y="406" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Multi-step engineering, tool calling,</text>
  <text x="80" y="424" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">repo traversal, command execution</text>

  <rect x="420" y="350" width="320" height="140" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
  <text x="580" y="425" text-anchor="middle" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="28" font-weight="800">✓ STRONG</text>
  <text x="580" y="455" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="13">benchmarks peak here</text>

  <rect x="760" y="350" width="320" height="140" rx="10" fill="#1c1117" stroke="#334155" stroke-width="1" opacity="0.4"/>
  <text x="920" y="425" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="16">—</text>

  <rect x="1100" y="350" width="280" height="140" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="1120" y="382" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">TerminalBench 82.7, Toolathlon</text>
  <text x="1120" y="404" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">70.3, Cybergym 76.7 — these are</text>
  <text x="1120" y="426" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">the model's strongest domains.</text>
  <text x="1120" y="448" fill="#fbbf24" font-family="Inter, sans-serif" font-size="13" font-weight="600">Native Codex / Responses API.</text>

  <!-- Row 3: Multimodal -->
  <rect x="60" y="500" width="340" height="140" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="530" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="17" font-weight="700">Multimodal pipelines</text>
  <text x="80" y="556" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Screenshots, PDFs, diagrams,</text>
  <text x="80" y="574" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">vision-based document processing</text>

  <rect x="420" y="500" width="320" height="140" rx="10" fill="#1c1117" stroke="#334155" stroke-width="1" opacity="0.4"/>
  <text x="580" y="575" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="16">—</text>

  <rect x="760" y="500" width="320" height="140" rx="10" fill="#450a0a" stroke="#b91c1c" stroke-width="1.5" opacity="0.95"/>
  <text x="920" y="575" text-anchor="middle" fill="#fca5a5" font-family="Inter, sans-serif" font-size="28" font-weight="800">✗ NO</text>
  <text x="920" y="605" text-anchor="middle" fill="#f87171" font-family="Inter, sans-serif" font-size="13">text-in / text-out only</text>

  <rect x="1100" y="500" width="280" height="140" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="1120" y="532" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">Zero image, audio, or video</text>
  <text x="1120" y="554" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">input support. Cannot process</text>
  <text x="1120" y="576" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">visual content at all. Use</text>
  <text x="1120" y="598" fill="#22d3ee" font-family="Inter, sans-serif" font-size="13" font-weight="600">Gemini / GPT-5.6 / Claude instead.</text>

  <!-- Row 4: Latency-critical -->
  <rect x="60" y="650" width="340" height="140" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="680" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="17" font-weight="700">Latency-critical UX</text>
  <text x="80" y="706" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Chat assistants, real-time tools,</text>
  <text x="80" y="724" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">user-facing interactive features</text>

  <rect x="420" y="650" width="320" height="140" rx="10" fill="#1c1117" stroke="#334155" stroke-width="1" opacity="0.4"/>
  <text x="580" y="725" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="16">—</text>

  <rect x="760" y="650" width="320" height="140" rx="10" fill="#451a03" stroke="#d97706" stroke-width="1.5" opacity="0.95"/>
  <text x="920" y="725" text-anchor="middle" fill="#fcd34d" font-family="Inter, sans-serif" font-size="28" font-weight="800">⚠ CAUTION</text>
  <text x="920" y="755" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="13">verbosity = slow time-to-last-token</text>

  <rect x="1100" y="650" width="280" height="140" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="1120" y="682" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">210M output tokens vs 62M</text>
  <text x="1120" y="704" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">median = ~3.4× more decoding</text>
  <text x="1120" y="726" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">work. A cheap-token model that</text>
  <text x="1120" y="748" fill="#fbbf24" font-family="Inter, sans-serif" font-size="13" font-weight="600">takes 3× longer to finish.</text>

  <text x="720" y="830" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="13" font-style="italic">All four rows share one caveat: V4 Flash is a public beta API with closed weights. Don't bet the farm yet.</text>
</svg>
