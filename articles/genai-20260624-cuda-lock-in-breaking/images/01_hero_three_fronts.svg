<svg width="1440" height="760" viewBox="0 0 1440 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="760" fill="#0f172a"/>

  <!-- Title -->
  <text x="720" y="50" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="36" font-weight="700">The CUDA Empire Under Siege</text>
  <text x="720" y="82" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="20">Three coordinated moves in one week of June 2026</text>

  <!-- Central NVIDIA CUDA block -->
  <rect x="480" y="300" width="480" height="160" rx="16" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <rect x="480" y="300" width="480" height="6" rx="3" fill="#f87171"/>
  <text x="720" y="345" text-anchor="middle" fill="#f87171" font-family="-apple-system, sans-serif" font-size="30" font-weight="700">NVIDIA + CUDA</text>
  <text x="720" y="380" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="18">80–90% AI accelerator market share</text>
  <text x="720" y="408" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="18">$100B+ annual data center GPU revenue</text>
  <text x="720" y="436" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="16">4M+ developers · 40,000+ companies · 20 years of momentum</text>

  <!-- Front 1: OpenAI Jalapeño (left) -->
  <rect x="60" y="120" width="380" height="150" rx="16" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <rect x="60" y="120" width="380" height="6" rx="3" fill="#22d3ee"/>
  <text x="250" y="160" text-anchor="middle" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">OpenAI "Jalapeño"</text>
  <text x="250" y="192" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18">First custom inference chip</text>
  <text x="250" y="218" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16">9-month tapeout with Broadcom</text>
  <text x="250" y="244" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16">Gigawatt-scale deployment: late 2026</text>
  <!-- Arrow to center -->
  <line x1="440" y1="220" x2="475" y2="340" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <text x="440" y="300" fill="#22d3ee" font-family="-apple-system, sans-serif" font-size="15" font-style="italic">Vertical integration</text>

  <!-- Front 2: Qualcomm + Modular (right) -->
  <rect x="1000" y="120" width="380" height="150" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <rect x="1000" y="120" width="380" height="6" rx="3" fill="#a78bfa"/>
  <text x="1190" y="160" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Qualcomm acquires Modular</text>
  <text x="1190" y="192" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18">$3.9B for Mojo + MAX compiler</text>
  <text x="1190" y="218" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16">AI workloads become hardware-portable</text>
  <text x="1190" y="244" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16">Attacks the software moat, not the silicon</text>
  <!-- Arrow to center -->
  <line x1="1000" y1="220" x2="965" y2="340" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="920" y="300" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="15" font-style="italic">Software portability</text>

  <!-- Front 3: AWS Trainium (bottom) -->
  <rect x="420" y="530" width="600" height="150" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <rect x="420" y="530" width="600" height="6" rx="3" fill="#34d399"/>
  <text x="720" y="570" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">AWS sells Trainium externally</text>
  <text x="720" y="602" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="18">$50B standalone run rate · Trainium4 sold out 1+ year ahead</text>
  <text x="720" y="628" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16">Direct-to-data-center chip sales — undercut NVIDIA 20–30%</text>
  <text x="720" y="654" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16">First hyperscaler offering custom silicon to third parties</text>
  <!-- Arrow to center -->
  <line x1="720" y1="530" x2="720" y2="465" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="740" y="500" fill="#34d399" font-family="-apple-system, sans-serif" font-size="15" font-style="italic">Cloud independence</text>
</svg>
