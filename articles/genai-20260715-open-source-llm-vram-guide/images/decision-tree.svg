<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="th" x="340" y="36" text-anchor="middle" style="font-size:18px; font-weight:600; fill:#f1f5f9;">Decision Tree: Which Open-Source LLM?</text>
  <text class="ts" x="340" y="58" text-anchor="middle" style="fill:#94a3b8;">Start at top, follow your constraints</text>

  <!-- Root: What hardware? -->
  <g style="fill:#1e293b; stroke:#888780; stroke-width:0.5;">
    <rect x="230" y="80" width="220" height="56" rx="8"/>
  </g>
  <text class="th" x="340" y="102" text-anchor="middle" dominant-baseline="central" style="font-size:14px; fill:#f1f5f9;">What hardware do you have?</text>
  <text class="ts" x="340" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#94a3b8;">GPU VRAM is the primary constraint</text>

  <!-- Left branch: Single GPU (≤24 GB) -->
  <line x1="280" y1="136" x2="140" y2="180" style="stroke:#5DCAA5; stroke-width:1.5; fill:none;" marker-end="url(#arrow)"/>
  <text class="ts" x="170" y="160" text-anchor="middle" style="fill:#5DCAA5;">≤24 GB (1 GPU)</text>

  <!-- Right branch: Multi-GPU / Server -->
  <line x1="400" y1="136" x2="540" y2="180" style="stroke:#7F77DD; stroke-width:1.5; fill:none;" marker-end="url(#arrow)"/>
  <text class="ts" x="510" y="160" text-anchor="middle" style="fill:#AFA9EC;">Multi-GPU</text>

  <!-- Single GPU: Need multimodal? -->
  <g style="fill:#1e293b; stroke:#5DCAA5; stroke-width:0.5;">
    <rect x="40" y="186" width="200" height="56" rx="8"/>
  </g>
  <text class="th" x="140" y="208" text-anchor="middle" dominant-baseline="central" style="font-size:14px; fill:#5DCAA5;">Need image input?</text>
  <text class="ts" x="140" y="226" text-anchor="middle" dominant-baseline="central" style="fill:#94a3b8;">Vision / multimodal tasks</text>

  <!-- Single GPU results -->
  <line x1="90" y1="242" x2="90" y2="286" style="stroke:#5DCAA5; stroke-width:1.5; fill:none;" marker-end="url(#arrow)"/>
  <text class="ts" x="55" y="266" style="fill:#94a3b8;">Yes</text>

  <g style="fill:#1e293b; stroke:#5DCAA5; stroke-width:0.5;">
    <rect x="20" y="286" width="180" height="56" rx="8"/>
  </g>
  <text class="th" x="110" y="308" text-anchor="middle" dominant-baseline="central" style="font-size:14px; fill:#5DCAA5;">Gemma 3 27B</text>
  <text class="ts" x="110" y="326" text-anchor="middle" dominant-baseline="central" style="fill:#94a3b8;">16 GB · multimodal · 140+ lang</text>

  <line x1="190" y1="242" x2="190" y2="286" style="stroke:#EF9F27; stroke-width:1.5; fill:none;" marker-end="url(#arrow)"/>
  <text class="ts" x="210" y="266" style="fill:#94a3b8;">No</text>

  <g style="fill:#1e293b; stroke:#EF9F27; stroke-width:0.5;">
    <rect x="100" y="286" width="180" height="56" rx="8"/>
  </g>
  <text class="th" x="190" y="308" text-anchor="middle" dominant-baseline="central" style="font-size:14px; fill:#EF9F27;">Phi-4 Reasoning</text>
  <text class="ts" x="190" y="326" text-anchor="middle" dominant-baseline="central" style="fill:#94a3b8;">8 GB · MIT · edge-ready</text>

  <!-- Multi-GPU: What's your use case? -->
  <g style="fill:#1e293b; stroke:#7F77DD; stroke-width:0.5;">
    <rect x="420" y="186" width="220" height="56" rx="8"/>
  </g>
  <text class="th" x="530" y="208" text-anchor="middle" dominant-baseline="central" style="font-size:14px; fill:#AFA9EC;">What's your primary use case?</text>
  <text class="ts" x="530" y="226" text-anchor="middle" dominant-baseline="central" style="fill:#94a3b8;">Pick the best-fit category</text>

  <!-- Multi-GPU branches -->
  <line x1="460" y1="242" x2="340" y2="286" style="stroke:#7F77DD; stroke-width:1.5; fill:none;" marker-end="url(#arrow)"/>
  <text class="ts" x="370" y="266" text-anchor="middle" style="fill:#94a3b8;">Reasoning</text>

  <g style="fill:#1e293b; stroke:#7F77DD; stroke-width:0.5;">
    <rect x="280" y="286" width="140" height="56" rx="8"/>
  </g>
  <text class="th" x="350" y="308" text-anchor="middle" dominant-baseline="central" style="font-size:14px; fill:#AFA9EC;">Qwen 3 235B</text>
  <text class="ts" x="350" y="326" text-anchor="middle" dominant-baseline="central" style="fill:#94a3b8;">Best overall · Apache 2.0</text>

  <line x1="540" y1="242" x2="490" y2="286" style="stroke:#7F77DD; stroke-width:1.5; fill:none;" marker-end="url(#arrow)"/>
  <text class="ts" x="530" y="266" text-anchor="middle" style="fill:#94a3b8;">Deep math</text>

  <g style="fill:#1e293b; stroke:#7F77DD; stroke-width:0.5;">
    <rect x="430" y="286" width="140" height="56" rx="8"/>
  </g>
  <text class="th" x="500" y="308" text-anchor="middle" dominant-baseline="central" style="font-size:14px; fill:#AFA9EC;">DeepSeek R1</text>
  <text class="ts" x="500" y="326" text-anchor="middle" dominant-baseline="central" style="fill:#94a3b8;">87.5% AIME · self-correcting</text>

  <!-- Long context branch -->
  <line x1="580" y1="242" x2="600" y2="286" style="stroke:#5DCAA5; stroke-width:1.5; fill:none;" marker-end="url(#arrow)"/>
  <text class="ts" x="620" y="266" text-anchor="middle" style="fill:#94a3b8;">Long ctx</text>

  <g style="fill:#1e293b; stroke:#5DCAA5; stroke-width:0.5;">
    <rect x="580" y="286" width="80" height="56" rx="8"/>
  </g>
  <text class="th" x="620" y="308" text-anchor="middle" dominant-baseline="central" style="font-size:12px; fill:#5DCAA5;">Llama 4</text>
  <text class="ts" x="620" y="326" text-anchor="middle" dominant-baseline="central" style="fill:#94a3b8;">10M tokens</text>

  <!-- Multi-GPU row 2: Coding & Enterprise -->
  <line x1="480" y1="342" x2="380" y2="386" style="stroke:#7F77DD; stroke-width:1.5; fill:none;" marker-end="url(#arrow)"/>
  <text class="ts" x="400" y="366" text-anchor="middle" style="fill:#94a3b8;">Coding agents</text>

  <g style="fill:#1e293b; stroke:#7F77DD; stroke-width:0.5;">
    <rect x="320" y="386" width="140" height="56" rx="8"/>
  </g>
  <text class="th" x="390" y="408" text-anchor="middle" dominant-baseline="central" style="font-size:14px; fill:#AFA9EC;">GLM-4.7</text>
  <text class="ts" x="390" y="426" text-anchor="middle" dominant-baseline="central" style="fill:#94a3b8;">94.2% HumanEval</text>

  <line x1="560" y1="342" x2="530" y2="386" style="stroke:#7F77DD; stroke-width:1.5; fill:none;" marker-end="url(#arrow)"/>
  <text class="ts" x="565" y="366" text-anchor="middle" style="fill:#94a3b8;">Enterprise</text>

  <g style="fill:#1e293b; stroke:#7F77DD; stroke-width:0.5;">
    <rect x="470" y="386" width="140" height="56" rx="8"/>
  </g>
  <text class="th" x="540" y="408" text-anchor="middle" dominant-baseline="central" style="font-size:14px; fill:#AFA9EC;">Mistral Large 3</text>
  <text class="ts" x="540" y="426" text-anchor="middle" dominant-baseline="central" style="fill:#94a3b8;">Multilingual · Apache 2.0</text>

  <!-- Default note -->
  <g style="fill:#1e293b; stroke:#EF9F27; stroke-width:0.5; stroke-dasharray:4 4;">
    <rect x="180" y="386" width="140" height="56" rx="8"/>
  </g>
  <text class="th" x="250" y="408" text-anchor="middle" dominant-baseline="central" style="font-size:14px; fill:#EF9F27;">Default pick</text>
  <text class="ts" x="250" y="426" text-anchor="middle" dominant-baseline="central" style="fill:#94a3b8;">DeepSeek V3 — balanced</text>

  <!-- Bottom note -->
  <text class="ts" x="340" y="480" text-anchor="middle" style="fill:#64748b;">All VRAM figures assume Q4 quantization</text>
  <text class="ts" x="340" y="500" text-anchor="middle" style="fill:#64748b;">Full precision (BF16) requires 2–4× more VRAM</text>
</svg>
