<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="th" x="340" y="36" text-anchor="middle" style="font-size:18px; font-weight:600; fill:#f1f5f9;">MoE vs Dense: Why a 235B Model Uses Only 22B</text>
  <text class="ts" x="340" y="58" text-anchor="middle" style="fill:#94a3b8;">Mixture-of-Experts saves compute, not memory</text>

  <!-- Dense model (left) -->
  <text class="th" x="140" y="96" text-anchor="middle" style="font-size:14px; fill:#EF9F27;">Dense model</text>
  <text class="ts" x="140" y="114" text-anchor="middle" style="fill:#94a3b8;">e.g. Gemma 3 27B, Phi-4 14B</text>

  <!-- Dense: single big block -->
  <g style="fill:#1e293b; stroke:#EF9F27; stroke-width:0.5;">
    <rect x="50" y="130" width="180" height="200" rx="12"/>
  </g>
  <text class="th" x="140" y="160" text-anchor="middle" style="font-size:14px; fill:#EF9F27;">All 27B params</text>
  <text class="ts" x="140" y="180" text-anchor="middle" style="fill:#94a3b8;">Every token activates</text>
  <text class="ts" x="140" y="196" text-anchor="middle" style="fill:#94a3b8;">the entire model</text>

  <!-- Dense: internal blocks -->
  <g style="fill:#EF9F27; opacity:0.3; stroke:#EF9F27; stroke-width:0.5;">
    <rect x="70" y="220" width="140" height="24" rx="4"/>
    <rect x="70" y="250" width="140" height="24" rx="4"/>
    <rect x="70" y="280" width="140" height="24" rx="4"/>
  </g>
  <text class="ts" x="140" y="235" text-anchor="middle" dominant-baseline="central" style="fill:#EF9F27;">Layer 1 (active)</text>
  <text class="ts" x="140" y="265" text-anchor="middle" dominant-baseline="central" style="fill:#EF9F27;">Layer 2 (active)</text>
  <text class="ts" x="140" y="295" text-anchor="middle" dominant-baseline="central" style="fill:#EF9F27;">Layer 3 (active)</text>

  <!-- Dense: stats -->
  <text class="ts" x="140" y="360" text-anchor="middle" style="fill:#64748b;">VRAM: proportional to params</text>
  <text class="ts" x="140" y="378" text-anchor="middle" style="fill:#64748b;">Compute: proportional to params</text>
  <text class="ts" x="140" y="396" text-anchor="middle" style="fill:#64748b;">Simpler, faster for small models</text>

  <!-- MoE model (right) -->
  <text class="th" x="500" y="96" text-anchor="middle" style="font-size:14px; fill:#AFA9EC;">MoE model</text>
  <text class="ts" x="500" y="114" text-anchor="middle" style="fill:#94a3b8;">e.g. Qwen 3 235B, DeepSeek V3</text>

  <!-- MoE: large container -->
  <g style="fill:#1e293b; stroke:#7F77DD; stroke-width:0.5;">
    <rect x="390" y="130" width="220" height="200" rx="12"/>
  </g>
  <text class="th" x="500" y="160" text-anchor="middle" style="font-size:14px; fill:#AFA9EC;">235B total params</text>
  <text class="ts" x="500" y="180" text-anchor="middle" style="fill:#94a3b8;">Router selects 2 of 8 experts</text>

  <!-- MoE: expert blocks -->
  <g style="fill:#7F77DD; opacity:0.6; stroke:#7F77DD; stroke-width:0.5;">
    <rect x="410" y="200" width="44" height="24" rx="4"/>
    <rect x="460" y="200" width="44" height="24" rx="4"/>
    <rect x="510" y="200" width="44" height="24" rx="4"/>
    <rect x="560" y="200" width="44" height="24" rx="4"/>
    <rect x="410" y="232" width="44" height="24" rx="4"/>
    <rect x="460" y="232" width="44" height="24" rx="4"/>
    <rect x="510" y="232" width="44" height="24" rx="4"/>
    <rect x="560" y="232" width="44" height="24" rx="4"/>
  </g>
  <!-- Highlight active experts -->
  <g style="fill:#5DCAA5; stroke:#5DCAA5; stroke-width:1;">
    <rect x="410" y="200" width="44" height="24" rx="4"/>
    <rect x="510" y="200" width="44" height="24" rx="4"/>
  </g>
  <text class="ts" x="432" y="212" text-anchor="middle" dominant-baseline="central" style="fill:#0f172a; font-size:10px;">E1 ✓</text>
  <text class="ts" x="532" y="212" text-anchor="middle" dominant-baseline="central" style="fill:#0f172a; font-size:10px;">E3 ✓</text>
  <text class="ts" x="432" y="244" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC; font-size:10px;">E2</text>
  <text class="ts" x="532" y="244" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC; font-size:10px;">E4</text>
  <text class="ts" x="482" y="244" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC; font-size:10px;">E5</text>
  <text class="ts" x="582" y="244" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC; fontSize:10px; fill:#AFA9EC;">E6</text>

  <!-- Router -->
  <g style="fill:#5DCAA5; opacity:0.2; stroke:#5DCAA5; stroke-width:0.5;">
    <rect x="430" y="270" width="140" height="30" rx="4"/>
  </g>
  <text class="ts" x="500" y="285" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5; font-weight:500;">Router → picks top-k experts</text>

  <!-- MoE stats -->
  <text class="ts" x="500" y="360" text-anchor="middle" style="fill:#64748b;">VRAM: ALL params must be loaded</text>
  <text class="ts" x="500" y="378" text-anchor="middle" style="fill:#64748b;">Compute: only k experts run (~10%)</text>
  <text class="ts" x="500" y="396" text-anchor="middle" style="fill:#64748b;">Faster inference, same memory cost</text>

  <!-- Arrow between -->
  <text class="ts" x="310" y="226" text-anchor="middle" style="fill:#888780; font-size:18px;">→</text>
  <text class="ts" x="310" y="250" text-anchor="middle" style="fill:#64748b;">Key insight</text>
  <text class="ts" x="310" y="268" text-anchor="middle" style="fill:#94a3b8;">MoE saves</text>
  <text class="ts" x="310" y="286" text-anchor="middle" style="fill:#94a3b8;">compute,</text>
  <text class="ts" x="310" y="304" text-anchor="middle" style="fill:#94a3b8;">not VRAM</text>

  <!-- Bottom takeaway -->
  <text class="ts" x="340" y="424" text-anchor="middle" style="fill:#EF9F27;">A 235B MoE still needs 235B worth of VRAM — even though only 22B compute per token</text>
</svg>
