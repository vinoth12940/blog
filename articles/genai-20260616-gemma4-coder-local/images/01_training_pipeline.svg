<rect x="390" y="305" width="660" height="95" rx="12" fill="#3a2a08" stroke="#BA7517" stroke-width="1"/>
<text x="720" y="337.3" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#fbbf24">Execution gate</text>
<text x="720" y="367.3" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#FAC775">every trace is run against the task's tests —</text>
<text x="720" y="389.3" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#FAC775">only passing code enters training</text>
