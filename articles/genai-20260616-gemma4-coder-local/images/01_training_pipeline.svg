<rect width="1440" height="780" fill="#0a0a0a"/>
<text x="720" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#e5e5e5">How Gemma4-12B-Coder was trained</text>
<text x="720" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#9ca3af">Two execution-gated chain-of-thought sources, distilled into Gemma 4 12B</text>
<rect x="150" y="120" width="470" height="120" rx="12" fill="#0f2a22" stroke="#1d9e75" stroke-width="1"/>
<text x="385" y="160.8" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#34d399">Composer 2.5  (main teacher)</text>
<text x="385" y="190.8" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#9FE1CB">real, model-authored chain-of-thought</text>
<text x="385" y="212.8" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#9FE1CB">kept only when the code passed its tests</text>
