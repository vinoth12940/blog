<text x="1055" y="160.8" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#a78bfa">Fable 5  (auxiliary teacher)</text>
<text x="1055" y="190.8" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#CECBF6">re-derives a fresh CoT for the problems</text>
<text x="1055" y="212.8" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="15" fill="#CECBF6">where Composer 2.5 got it wrong</text>
