<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800">
  <defs>
    <linearGradient id="eGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#16243d"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="800" fill="url(#eGrad)"/>

  <text x="720" y="70" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#22d3ee" letter-spacing="4">THE RECEIPTS</text>
  <text x="720" y="124" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">More Code Is Not More Software</text>

  <g font-family="Inter, Arial, sans-serif">
    <!-- Frontier case -->
    <rect x="70" y="180" width="600" height="440" rx="16" fill="#0c1a2e" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="95" y="228" font-size="22" font-weight="700" fill="#22d3ee">THE FRONTIER CASE — ANTHROPIC</text>
    <text x="95" y="256" font-size="14" fill="#94a3b8">one lab at the absolute ceiling, October 2026</text>

    <text x="95" y="315" font-size="16.5" fill="#cbd5e1">Daily merge volume</text>
    <text x="645" y="315" text-anchor="end" font-size="19" font-weight="700" fill="#34d399">12x</text>
    <line x1="95" y1="332" x2="645" y2="332" stroke="#1f2937" stroke-width="1"/>

    <text x="95" y="375" font-size="16.5" fill="#cbd5e1">SCM CPU + memory (Scion vs mirrors)</text>
    <text x="645" y="375" text-anchor="end" font-size="19" font-weight="700" fill="#34d399">200x less</text>
    <line x1="95" y1="392" x2="645" y2="392" stroke="#1f2937" stroke-width="1"/>

    <text x="95" y="435" font-size="16.5" fill="#cbd5e1">Checkout time for CI jobs</text>
    <text x="645" y="435" text-anchor="end" font-size="19" font-weight="700" fill="#34d399">100x faster</text>
    <line x1="95" y1="452" x2="645" y2="452" stroke="#1f2937" stroke-width="1"/>

    <text x="95" y="495" font-size="16.5" fill="#cbd5e1">Code written by Claude</text>
    <text x="645" y="495" text-anchor="end" font-size="19" font-weight="700" fill="#34d399">80%+</text>
    <line x1="95" y1="512" x2="645" y2="512" stroke="#1f2937" stroke-width="1"/>

    <text x="95" y="570" font-size="15" font-style="italic" fill="#94a3b8">"The latent demand for merging code is</text>
    <text x="95" y="594" font-size="15" font-style="italic" fill="#94a3b8">practically infinite." — Anthropic</text>

    <!-- Average case -->
    <rect x="770" y="180" width="600" height="440" rx="16" fill="#2a2110" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="795" y="228" font-size="22" font-weight="700" fill="#fbbf24">THE AVERAGE CASE — HARVARD × JELLYFISH</text>
    <text x="795" y="256" font-size="14" fill="#94a3b8">700+ firms · 300M work events · 2021 – March 2026</text>

    <text x="795" y="315" font-size="16.5" fill="#cbd5e1">Lines of code generated</text>
    <text x="1345" y="315" text-anchor="end" font-size="19" font-weight="700" fill="#34d399">+30%</text>
    <line x1="795" y1="332" x2="1345" y2="332" stroke="#1f2937" stroke-width="1"/>

    <text x="795" y="375" font-size="16.5" fill="#cbd5e1">Commits and pull requests</text>
    <text x="1345" y="375" text-anchor="end" font-size="19" font-weight="700" fill="#34d399">+20% / +23%</text>
    <line x1="795" y1="392" x2="1345" y2="392" stroke="#1f2937" stroke-width="1"/>

    <text x="795" y="435" font-size="16.5" fill="#cbd5e1">Time spent in review</text>
    <text x="1345" y="435" text-anchor="end" font-size="19" font-weight="700" fill="#f87171">+49%</text>
    <line x1="795" y1="452" x2="1345" y2="452" stroke="#1f2937" stroke-width="1"/>

    <text x="795" y="495" font-size="16.5" fill="#cbd5e1">Issues and epics actually shipped</text>
    <text x="1345" y="495" text-anchor="end" font-size="19" font-weight="700" fill="#f87171">no change</text>
    <line x1="795" y1="512" x2="1345" y2="512" stroke="#1f2937" stroke-width="1"/>

    <text x="795" y="570" font-size="15" font-style="italic" fill="#94a3b8">Gains from coding were "absorbed by downstream</text>
    <text x="795" y="594" font-size="15" font-style="italic" fill="#94a3b8">constraints in the production process." — Chen &amp; Stratton</text>

    <!-- takeaway -->
    <rect x="70" y="665" width="1300" height="90" rx="14" fill="#111418" stroke="#1f2937" stroke-width="1.5"/>
    <text x="720" y="705" text-anchor="middle" font-size="18" font-weight="600" fill="#e2e8f0">Writing code stopped being the constraint. Review, source control,</text>
    <text x="720" y="733" text-anchor="middle" font-size="18" font-weight="600" fill="#e2e8f0">and continuous integration are the new bottleneck — at every scale.</text>
  </g>
</svg>
