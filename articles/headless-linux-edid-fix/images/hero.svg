<svg width="1440" height="600" viewBox="0 0 1440 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1a"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="plugGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="serverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="600" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g opacity="0.05" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="150" x2="1440" y2="150"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="360" y1="0" x2="360" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>
    <line x1="1080" y1="0" x2="1080" y2="600"/>
  </g>

  <!-- LEFT stat: BEFORE -->
  <g transform="translate(150,210)">
    <text x="170" y="0" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#f87171" font-weight="600" letter-spacing="3">BEFORE</text>
    <text x="170" y="78" text-anchor="middle" font-family="'Inter',sans-serif" font-size="78" fill="#f87171" font-weight="700">75%</text>
    <text x="170" y="112" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#94a3b8">CPU on software rendering</text>
    <!-- flame chip -->
    <rect x="120" y="140" width="100" height="34" rx="8" fill="#1c1414" stroke="#7f1d1d"/>
    <text x="170" y="162" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14" fill="#fca5a5">llvmpipe</text>
  </g>

  <!-- RIGHT stat: AFTER -->
  <g transform="translate(970,210)">
    <text x="170" y="0" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#34d399" font-weight="600" letter-spacing="3">AFTER</text>
    <text x="170" y="78" text-anchor="middle" font-family="'Inter',sans-serif" font-size="78" fill="#34d399" font-weight="700">3%</text>
    <text x="170" y="112" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#94a3b8">CPU on hardware rendering</text>
    <rect x="120" y="140" width="100" height="34" rx="8" fill="#0d1f17" stroke="#14532d"/>
    <text x="170" y="162" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14" fill="#6ee7b7">radeonsi</text>
  </g>

  <!-- center vertical divider -->
  <line x1="720" y1="120" x2="720" y2="400" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- arrow from left to plug -->
  <path d="M 470 300 Q 560 300 640 300" stroke="#f87171" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
  <!-- arrow from plug to right -->
  <path d="M 800 300 Q 880 300 970 300" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrG)"/>

  <!-- SERVER box centered -->
  <g transform="translate(625,235)">
    <rect x="0" y="0" width="190" height="130" rx="14" fill="url(#serverGrad)" stroke="#334155" stroke-width="2"/>
    <!-- vent lines -->
    <line x1="18" y1="26" x2="80" y2="26" stroke="#475569" stroke-width="2"/>
    <line x1="18" y1="36" x2="80" y2="36" stroke="#475569" stroke-width="2"/>
    <!-- power LED -->
    <circle cx="160" cy="30" r="4" fill="#34d399"/>
    <!-- label -->
    <text x="95" y="78" text-anchor="middle" font-family="'Inter',sans-serif" font-size="15" fill="#cbd5e1" font-weight="600">Headless</text>
    <text x="95" y="98" text-anchor="middle" font-family="'Inter',sans-serif" font-size="15" fill="#cbd5e1" font-weight="600">Linux Server</text>
    <text x="95" y="116" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#64748b">UM760 · amdgpu</text>

    <!-- HDMI port on the right edge -->
    <rect x="190" y="95" width="26" height="16" rx="2" fill="#0a0a0a" stroke="#475569"/>
    <rect x="194" y="99" width="18" height="8" rx="1" fill="#1e293b"/>

    <!-- dummy plug sticking out, glowing -->
    <circle cx="232" cy="103" r="26" fill="url(#plugGlow)"/>
    <rect x="216" y="96" width="22" height="14" rx="2" fill="#334155" stroke="#475569"/>
    <rect x="236" y="98" width="14" height="10" rx="1" fill="#22d3ee" opacity="0.9"/>
    <line x1="250" y1="103" x2="268" y2="103" stroke="#22d3ee" stroke-width="2"/>
  </g>

  <!-- plug label -->
  <g transform="translate(720,470)">
    <rect x="-150" y="0" width="300" height="38" rx="19" fill="#0f1729" stroke="#1f2937"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Inter',sans-serif" font-size="15" fill="#22d3ee" font-weight="600">$6 HDMI EDID emulator</text>
  </g>

  <!-- top eyebrow -->
  <text x="720" y="92" text-anchor="middle" font-family="'Inter',sans-serif" font-size="20" fill="#64748b" letter-spacing="4">THE FIX</text>

  <!-- marker defs at end -->
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>
</svg>
