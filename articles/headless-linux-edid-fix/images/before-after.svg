<svg width="1440" height="780" viewBox="0 0 1440 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aR2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
    <marker id="aG2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1440" height="780" fill="#0a0f1a"/>

  <text x="720" y="56" text-anchor="middle" font-family="'Inter',sans-serif" font-size="26" fill="#f1f5f9" font-weight="700">Same Hardware, Two Renderers</text>
  <text x="720" y="86" text-anchor="middle" font-family="'Inter',sans-serif" font-size="16" fill="#64748b">The only difference: whether the GPU has a display context to render into</text>

  <!-- ====== LEFT PANEL: BEFORE ====== -->
  <g transform="translate(60,120)">
    <rect x="0" y="0" width="620" height="620" rx="16" fill="#140d0d" stroke="#7f1d1d" stroke-width="2"/>
    <rect x="0" y="0" width="620" height="56" rx="16" fill="#1c1414"/>
    <rect x="0" y="40" width="620" height="16" fill="#1c1414"/>
    <text x="310" y="36" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#f87171" font-weight="700" letter-spacing="2">BEFORE — dummy driver, no monitor</text>

    <!-- step 1 -->
    <rect x="40" y="86" width="540" height="56" rx="10" fill="#0f0a0a" stroke="#3f1414"/>
    <text x="60" y="112" font-family="'JetBrains Mono',monospace" font-size="14" fill="#fca5a5">10-headless.conf</text>
    <text x="60" y="132" font-family="'Inter',sans-serif" font-size="13" fill="#94a3b8">Xorg forced onto the "dummy" framebuffer driver</text>

    <path d="M 310 156 L 310 186" stroke="#f87171" stroke-width="2" marker-end="url(#aR2)"/>

    <!-- step 2 -->
    <rect x="40" y="196" width="540" height="56" rx="10" fill="#0f0a0a" stroke="#3f1414"/>
    <text x="60" y="222" font-family="'JetBrains Mono',monospace" font-size="14" fill="#fca5a5">DRISWRAST · llvmpipe</text>
    <text x="60" y="242" font-family="'Inter',sans-serif" font-size="13" fill="#94a3b8">No GPU context → software rasterizer on CPU</text>

    <path d="M 310 266 L 310 296" stroke="#f87171" stroke-width="2" marker-end="url(#aR2)"/>

    <!-- step 3: symptoms -->
    <rect x="40" y="306" width="540" height="138" rx="10" fill="#0f0a0a" stroke="#3f1414"/>
    <text x="60" y="332" font-family="'Inter',sans-serif" font-size="15" fill="#fca5a5" font-weight="600">Symptoms</text>
    <text x="60" y="358" font-family="'Inter',sans-serif" font-size="14" fill="#e5e5e5">• cinnamon creeps to <tspan fill="#f87171" font-weight="700">40–75% CPU</tspan> over ~15 min</text>
    <text x="60" y="382" font-family="'Inter',sans-serif" font-size="14" fill="#e5e5e5">• cinnamon-screensaver alone <tspan fill="#f87171" font-weight="700">38% CPU</tspan></text>
    <text x="60" y="406" font-family="'Inter',sans-serif" font-size="14" fill="#e5e5e5">• desktop freezes, panel won't render</text>
    <text x="60" y="430" font-family="'Inter',sans-serif" font-size="14" fill="#e5e5e5">• VNC becomes unusable</text>

    <!-- bandaid -->
    <rect x="40" y="466" width="540" height="56" rx="10" fill="#1a1208" stroke="#78350f" stroke-dasharray="5 5"/>
    <text x="60" y="490" font-family="'Inter',sans-serif" font-size="14" fill="#fbbf24" font-weight="600">Band-aid only:</text>
    <text x="60" y="510" font-family="'JetBrains Mono',monospace" font-size="13" fill="#fcd34d">dconf write .../compositing-manager false</text>

    <!-- cpu bar -->
    <text x="60" y="568" font-family="'Inter',sans-serif" font-size="13" fill="#94a3b8">cinnamon CPU</text>
    <rect x="60" y="578" width="500" height="18" rx="9" fill="#1c1414"/>
    <rect x="60" y="578" width="425" height="18" rx="9" fill="#ef4444"/>
    <text x="495" y="592" font-family="'Inter',sans-serif" font-size="12" fill="#fecaca" font-weight="600">~75%</text>
  </g>

  <!-- ====== RIGHT PANEL: AFTER ====== -->
  <g transform="translate(760,120)">
    <rect x="0" y="0" width="620" height="620" rx="16" fill="#0b1410" stroke="#14532d" stroke-width="2"/>
    <rect x="0" y="0" width="620" height="56" rx="16" fill="#0d1f17"/>
    <rect x="0" y="40" width="620" height="16" fill="#0d1f17"/>
    <text x="310" y="36" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#34d399" font-weight="700" letter-spacing="2">AFTER — EDID emulator plugged in</text>

    <rect x="40" y="86" width="540" height="56" rx="10" fill="#081410" stroke="#143f2a"/>
    <text x="60" y="112" font-family="'JetBrains Mono',monospace" font-size="14" fill="#6ee7b7">card1-HDMI-A-1: connected</text>
    <text x="60" y="132" font-family="'Inter',sans-serif" font-size="13" fill="#94a3b8">amdgpu detects a real display (reads EDID)</text>

    <path d="M 310 156 L 310 186" stroke="#34d399" stroke-width="2" marker-end="url(#aG2)"/>

    <rect x="40" y="196" width="540" height="56" rx="10" fill="#081410" stroke="#143f2a"/>
    <text x="60" y="222" font-family="'JetBrains Mono',monospace" font-size="14" fill="#6ee7b7">amdgpu · radeonsi (DRI3)</text>
    <text x="60" y="242" font-family="'Inter',sans-serif" font-size="13" fill="#94a3b8">GPU hardware acceleration engaged</text>

    <path d="M 310 266 L 310 296" stroke="#34d399" stroke-width="2" marker-end="url(#aG2)"/>

    <rect x="40" y="306" width="540" height="138" rx="10" fill="#081410" stroke="#143f2a"/>
    <text x="60" y="332" font-family="'Inter',sans-serif" font-size="15" fill="#6ee7b7" font-weight="600">Result</text>
    <text x="60" y="358" font-family="'Inter',sans-serif" font-size="14" fill="#e5e5e5">• cinnamon flat at <tspan fill="#34d399" font-weight="700">~3% CPU</tspan></text>
    <text x="60" y="382" font-family="'Inter',sans-serif" font-size="14" fill="#e5e5e5">• screensaver <tspan fill="#34d399" font-weight="700">0.8%</tspan>, Xorg ~4.7%</text>
    <text x="60" y="406" font-family="'Inter',sans-serif" font-size="14" fill="#e5e5e5">• desktop responsive, panel stable</text>
    <text x="60" y="430" font-family="'Inter',sans-serif" font-size="14" fill="#e5e5e5">• whole server <tspan fill="#34d399" font-weight="700">98.5% idle</tspan></text>

    <rect x="40" y="466" width="540" height="56" rx="10" fill="#0d1f17" stroke="#14532d"/>
    <text x="60" y="490" font-family="'Inter',sans-serif" font-size="14" fill="#34d399" font-weight="600">Permanent fix:</text>
    <text x="60" y="510" font-family="'JetBrains Mono',monospace" font-size="13" fill="#6ee7b7">mv 10-headless.conf .disabled &amp;&amp; systemctl restart lightdm</text>

    <text x="60" y="568" font-family="'Inter',sans-serif" font-size="13" fill="#94a3b8">cinnamon CPU</text>
    <rect x="60" y="578" width="500" height="18" rx="9" fill="#0d1f17"/>
    <rect x="60" y="578" width="20" height="18" rx="9" fill="#22c55e"/>
    <text x="90" y="592" font-family="'Inter',sans-serif" font-size="12" fill="#bbf7d0" font-weight="600">~3%</text>
  </g>
</svg>
